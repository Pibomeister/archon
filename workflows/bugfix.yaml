            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/parse-critique.py \
              "$RD/critique.json" --round "$N"

        - id: rca-revise
          depends_on: [rca-critic-gate]
          model: sonnet
          maxBudgetUsd: 3
          timeout: 900000
          prompt: |
            You are the fix-plan REVISER. A critic in a separate session challenged
            the plan; your job is to answer it in the planning artifacts themselves.
            Ask no questions.

            Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
            The round number is the contents of rca-round.txt there; call it N.
            The repository under analysis is named in repo.txt in that same
            directory. There is NO worktree yet: read the main checkouts READ-ONLY
            The checkouts may sit on a stale feature branch: read code as it is at origin/main (`git -C <repo> show origin/main:<path>`, `git -C <repo> ls-tree -r --name-only origin/main`), and cite repo-relative paths as they exist at origin/main; the gate resolves citations there when the checkout lacks the file.
            at /Users/eduardopicazo/Documents/Workspace/Goodword/api and
            /Users/eduardopicazo/Documents/Workspace/Goodword/web-app (you are NOT
            cwd'd there — cd into the right one for every command). Modify no
            repository file, and create no branch, worktree or commit.

            FIRST, before reading anything else, read the "verdict" field of
            rca-round-N/critique.json.

            If the verdict is REJECT, you are a NO-OP. Write
            rca-round-N/revision.json containing exactly
              {"applied": [], "declined": [], "skipped": "REJECT"}
            change no other file at all, and end. A REJECT means the critic thinks
            the plan needs a different diagnosis under it, and the human at the RCA
            gate has to see that objection against the un-mutated plan rather than
            against your attempt to patch around it.

            If the verdict is ACCEPT, make no changes. Write
            rca-round-N/revision.json containing exactly
              {"applied": [], "declined": []}
            and end.

            Otherwise the verdict is REVISE.

            You may edit EXACTLY these four files and nothing else:
              fix-plan.json, files-allowlist.json, verify.json, failing-test.json
            These six are IMMUTABLE, and a gate cmps every one of them right after
            you and stops the run on any change:
              rca.md, causal-chain.json, hypotheses.json, residuals.json,
              probe.json, repo.json
            A blind chain-verify node already re-derived the chain, probe.json was
            already executed against production, and repo.json binds the worktree
            after the gate. A finding that can only be answered by changing one of
            those six is DECLINED, with exactly that as its justification (for
            example: answering this requires changing causal-chain.json, which this
            loop may not touch), and the human settles it at the gate. Editing an
            immutable file does not answer the finding; it removes the check.

            Read the bug report, rca.md, causal-chain.json, fix-plan.json,
