            human settles it at the gate.

            Do not modify any artifact or repository file.

            Rubric, in priority order.

            1. SCOPE CREEP (primary). For each entry in fix-plan.json "files" and
               each part of "approach", trace it to a link in causal-chain.json
               (quote the link's cause or its evidence), to failing-test.json (the
               spec file the RED test creates), or to a code-derived necessity of
               one of those (name the traced item and say why the code requires
