        (
          set -e
          test -f .env.e2e || cp "$ROOT/api/.env.e2e" .env.e2e
          docker compose -f local-env-compose.e2e.yaml up -d --wait
          set -a; . ./.env.e2e; set +a
          export DYNAMODB_ENDPOINT="http://localhost:8001"
          bun run migration:run
