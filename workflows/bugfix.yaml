               chosen "approach" is the WIDEST option on the table and the plan never
               says why the narrower one was rejected, that is kind "scope".
            4. VERIFIABILITY. A failing-test.json whose
               predicted_failure_signature would match output the defect does not
               produce (a generic word, or a string the test's own setup emits) is
               kind "verifiability". So is a test that cannot fail for the reason the
               chain gives, and a verify.json pattern that selects zero spec files:
