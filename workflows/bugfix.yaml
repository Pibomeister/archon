               slightly for exactly those reviewer-predictable files, so a
               controller or module entry carrying that reason IS a valid necessity
               trace, not creep. Raise kind "scope" only when NEITHER trace exists;
               evidence is the plan item plus the nearest chain link it fails to
               match. Categories: edits beyond the infection point, "while we're
               here" refactors and renames, config or extensibility with no
               consumer, a second defect fixed in passing that residuals.json
