      # an empty pattern file makes the loop below iterate zero times, and this gate
      # would print EXIT_GATE=PASS having run no suite at all.
      python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1], encoding='utf-8'))['test_patterns']]" "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
        || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
      test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
      while IFS= read -r PAT; do
        test -n "$PAT" || continue
        if [ "$REPO" = web-app ]; then
          mise x node@20 -- pnpm test --run "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
        else
          bun run test -- "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
        fi
      done < "$ARTIFACTS_DIR/exit-patterns.txt"
      # The repro must pass on the final tree...
      RC=0
      bash "$SETUP/run-repro.sh" "$WT" "$ARTIFACTS_DIR" "$ARTIFACTS_DIR/exit-repro-out.txt" >/dev/null 2>&1 || RC=$?
      test "$RC" = 0 || { echo "EXIT_GATE=FAIL repro failing on final tree rc=$RC"; exit 1; }
