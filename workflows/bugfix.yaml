                echo "ARCHITECTURE_SUSPECT attempts=3 (systematic-debugging circuit breaker: three failed fixes means the RCA is likely wrong or the fix needs architecture work - engineer, re-open the RCA)"
                exit 1
              fi
              PREVHASH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['failure_hash'])" "$ARTIFACTS_DIR/attempt-$((N-1))/green.json" 2>/dev/null || echo unset)
              if [ "$HASH" != none ] && [ "$HASH" = "$PREVHASH" ]; then
                echo "FIX_STALLED attempt=$N (identical failure twice - the fix is not moving the needle; engineer review)"
                exit 1
              fi
              echo "FIX_ATTEMPT_FAILED attempt=$N reason=[$REASON] (next attempt reads attempt-$N/repro-out.txt)"
            fi

