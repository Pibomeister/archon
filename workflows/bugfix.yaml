        - id: converge
          depends_on: [commit-fixer]
          timeout: 300000
          bash: |
            set -uo pipefail
            N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
            exec > >(tee "$RD/converge.txt") 2>&1
            SETUP=/Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup
            eval "$(bash "$SETUP/params-env.sh" "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
