            # gate that silently runs zero tests reports PASS for the wrong reason.
            python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1], encoding='utf-8'))['test_patterns']]" \
              "$ARTIFACTS_DIR/verify.json" > "$RD/patterns.txt" \
              || { echo "DESLOP_GATE=FAIL verify.json unreadable round=$N"; exit 1; }
            test -s "$RD/patterns.txt" || { echo "DESLOP_GATE=FAIL verify.json has no test_patterns round=$N"; exit 1; }
            UT=0
            while IFS= read -r PAT; do
              test -n "$PAT" || continue
              if [ "$REPO" = web-app ]; then
                mise x node@20 -- pnpm test --run "$PAT" >> "$RD/test.txt" 2>&1 || UT=$?
              else
                bun run test -- "$PAT" >> "$RD/test.txt" 2>&1 || UT=$?
              fi
            done < "$RD/patterns.txt"
            # --exclude pnpm-lock.yaml exactly as every other bugfix scope gate:
            # the web bootstrap deliberately leaves the lockfile modified.
            SC=0
            python3 "$SETUP/check-scope.py" \
              "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$RED" --exclude pnpm-lock.yaml > "$RD/scope.txt" 2>&1 || SC=$?
            # Delta-only: check-slop compares the RED tree to the WORKING tree
            # (untracked included). The repro test file is excluded — it is frozen
            # by the guard above, so its assertions are not this gate's business.
            SL=0
            python3 "$SETUP/check-slop.py" \
              "$WT" "$RED" --max-complexity 10 --exclude pnpm-lock.yaml --exclude "$TESTF" > "$RD/slop.txt" 2>&1 || SL=$?
            python3 - "$RD/recheck.json" "$RP" "$TC" "$LT" "$UT" "$SC" "$SL" <<'PY'
            import json, sys
            path, rp, tc, lt, ut, sc, sl = sys.argv[1:8]
            json.dump({"repro": int(rp), "typecheck": int(tc), "lint": int(lt),
                       "tests": int(ut), "scope": int(sc), "slop": int(sl)},
                      open(path, "w"), indent=2)
            PY
            cat "$RD/slop.txt" || true
            # run-repro.sh reserves 97 for its own infra failures (missing
            # failing-test.json, missing worktree) — that is a broken harness, not
            # a fix that regressed, and it is typed separately so the operator does
            # not go looking at the diff.
            if [ "$RP" = 97 ]; then
              echo "DESLOP_GATE=FAIL repro harness error rc=97 round=$N"
              tail -40 "$RD/repro-out.txt" 2>/dev/null || true
              exit 1
            fi
            test "$RP" = 0 || { echo "DESLOP_GATE=FAIL repro no longer green round=$N rc=$RP"; tail -40 "$RD/repro-out.txt" 2>/dev/null || true; exit 1; }
            test "$TC" = 0 || { echo "DESLOP_GATE=FAIL typecheck round=$N"; tail -40 "$RD/typecheck.txt"; exit 1; }
            test "$LT" = 0 || { echo "DESLOP_GATE=FAIL lint round=$N"; tail -40 "$RD/lint.txt"; exit 1; }
            test "$UT" = 0 || { echo "DESLOP_GATE=FAIL unit round=$N"; tail -40 "$RD/test.txt"; exit 1; }
            test "$SC" = 0 || { echo "DESLOP_GATE=FAIL scope round=$N"; cat "$RD/scope.txt"; exit 1; }
            test "$SL" = 0 || { echo "DESLOP_GATE=FAIL slop round=$N"; exit 1; }
            # The writer's own "verification" block is historical (a hand fix on
            # resume would leave it stale), so this is a shape check only —
            # recheck.json above is what the reviewer is told to trust.
            RJ="$ARTIFACTS_DIR/deslop-result.json"
            test -s "$RJ" || { echo "DESLOP_GATE=FAIL no deslop-result.json round=$N"; exit 1; }
            python3 -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert isinstance(d, dict); assert isinstance(d.get('changed_files'), list); assert isinstance(d.get('passes'), list)" \
              "$RJ" || { echo "DESLOP_GATE=FAIL deslop-result.json unparseable round=$N"; exit 1; }
            # Restorable checkpoint, not just a fingerprint. A throwaway index
            # turns the whole worktree — untracked files included — into a real
            # tree object in this repo's object DB, so a reviewer that edits or
            # deletes files is not only DETECTED but UNDOABLE. HEAD sha and the
            # live index tree go in too: a reviewer that commits or stages
            # without changing content leaves `git status --porcelain` identical,
            # so porcelain alone is not enough.
            rm -f "$RD/index"
            GIT_INDEX_FILE="$RD/index" git add -A || { echo "DESLOP_GATE=FAIL checkpoint add round=$N"; exit 1; }
            # The lockfile is pinned to its HEAD content in the checkpoint: on
            # web the bootstrap deliberately leaves it modified, and a drifting
            # lockfile must not read as a tampered tree.
            GIT_INDEX_FILE="$RD/index" git restore --staged pnpm-lock.yaml 2>/dev/null || true
            CKTREE=$(GIT_INDEX_FILE="$RD/index" git write-tree) \
              || { echo "DESLOP_GATE=FAIL checkpoint write-tree round=$N"; exit 1; }
            test -n "$CKTREE" || { echo "DESLOP_GATE=FAIL checkpoint empty tree sha round=$N"; exit 1; }
            echo "$CKTREE" > "$RD/checkpoint-tree.txt"
            # Belt: the bytes survive even a worktree wipe that takes the object DB.
            git archive "$CKTREE" > "$RD/checkpoint.tar" \
              || { echo "DESLOP_GATE=FAIL checkpoint archive round=$N"; exit 1; }
            CKHEAD=$(git rev-parse HEAD) || { echo "DESLOP_GATE=FAIL checkpoint rev-parse round=$N"; exit 1; }
            # The LIVE index, untouched: fix-converge left it equal to HEAD (it
            # unstages the lockfile before committing), so this is stable across
            # the review window and moves only if the reviewer stages something.
            CKINDEX=$(git write-tree) || { echo "DESLOP_GATE=FAIL checkpoint live-index tree round=$N"; exit 1; }
            {
              echo "head=$CKHEAD"
              echo "index=$CKINDEX"
              echo "checkpoint=$CKTREE"
            } > "$ARTIFACTS_DIR/deslop-tree.txt"
            FILES=$(sed -n 's/^SLOP=OK files=\([0-9]*\)$/\1/p' "$RD/slop.txt" | tail -1)
            test -n "$FILES" || FILES=0
            echo "DESLOP_GATE=PASS files=$FILES round=$N checkpoint=$CKTREE"

        - id: deslop-review
          depends_on: [deslop-recheck]
          model: sonnet
          maxBudgetUsd: 2
          timeout: 600000
          prompt: |
            You are the deslop REVIEWER node. You are a reviewer ONLY: the writer
            that cleaned this fix was a different session, and you must not become
            its author. Ask no questions.

            YOU MUST NOT EDIT ANYTHING. Do not modify, create or delete any file in
            the repository. Do not stage anything, do not commit, do not run any
            command that writes to the worktree. The next node fingerprints the
            worktree (HEAD sha, index tree, and a full-tree checkpoint taken before
            you started) and fails the run if a single byte moved. The ONLY file you
            write is deslop-review.json in the artifacts directory.

            Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"

            The working tree is the "worktree" field of params.json in that
            directory (you are NOT cwd'd there — cd into it for every git command).

            READ, in this order:
            - the current round number in deslop-round.txt in the artifacts directory
              (call it N), then deslop-round-N/recheck.json there. That file is the
              AUTHORITATIVE verification record: {"repro","typecheck","lint","tests",
              "scope","slop"} exit codes, all zero.
            - deslop-result.json in the artifacts directory — the writer's own log of
              what it changed. Its "verification" block is HISTORICAL and may be stale
              (a human may have hand-fixed and resumed); recheck.json overrides it.
            - the change itself, in the worktree:
                git diff "$(cat <that directory>/red-sha.txt)"
                git status --porcelain
              and read any untracked files directly. The red sha is the base: it is
              the commit holding the repro test, so this diff is exactly the fix
              plus the deslop pass.
            - files-allowlist.json in the artifacts directory: the in-scope paths.
            - failing-test.json in the artifacts directory: its "test_file" is the
              repro test, which is FROZEN. It is not in scope for any guard, and a
              finding against it is invalid.

            This is a BUGFIX lane and it is causal-minimal. The writer was allowed
            to fix exactly the five guards below and nothing else; anything else it
            found belongs in "reported_not_fixed" in deslop-result.json. Do not file
            a finding demanding a refactor, a rename, deduplication outside the diff,
            or any other cleanup beyond these five.

            You are also the ONLY check on the writer's restraint — nothing
            mechanical detects a writer that cleaned something it was told to
            report. Read its diff against what deslop-result.json claims: an edit
            that is not one of the five guards, and is not declared in "passes",
            is a finding with guard "beyond_five_guards". It blocks at 75 or 100
            like any other. A cleanup the writer correctly listed under
            "reported_not_fixed" and did NOT make is not a finding.

            Judge the change against exactly these five guards:
            1. complexity — a new function above cyclomatic complexity 10, or a
               changed function whose complexity this change raised above 10. A
               pre-existing function already above 10 that this change did not
               worsen is NOT a finding.
            2. tautological_tests — a test asserting a value against itself, whose
               only matchers are toBeDefined / toBeTruthy / not.toThrow, that asserts
               on a mock's return value, or that has no assertion. The repro test
               file is EXCLUDED from this guard.
            3. yagni — parameters, options, branches, exports, types or config added
               by this change with no caller in the diff or in the repo.
            4. open_closed — the change special-cases an existing dispatch (switch,
               if-chain, registry) where an extension point already exists; or it
               introduces an extension point for a single consumer. This guard is
               NOT mechanically checkable — it is yours to own.
            5. comments — added comments that restate the code, narrate the change,
               or preserve task history; banners; JSDoc repeating the signature;
               added TODOs. A comment explaining *why*, or recording an invariant or
               a constraint, is correct and is NOT a finding.

            Two rules override all five: never call for simplifying away a safety
            check, and LOC removed is not the metric.

            Confidence is a contract, not a mood. 100 = you read the code and the
            defect is present as described. 75 = present, with one assumption you
            could not check. 50 = suspicion worth recording that you could not
            confirm. 75 and 100 BLOCK the pipeline for a human; 50 does not. There
            is no other allowed value.

            Write deslop-review.json to the artifacts directory with EXACTLY this
            schema — every key required, no extra top-level keys:
              {"verdict": "CLEAN|DIRTY",
               "coverage": {
                 "complexity":         {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "tautological_tests": {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "yagni":              {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "open_closed":        {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "comments":           {"status": "assessed|not_applicable", "evidence": "<non-empty>"}
               },
               "findings": [
                 {"guard": "complexity|tautological_tests|yagni|open_closed|comments|beyond_five_guards",
                  "file": "<repo-relative>", "line": <int>,
                  "confidence": 50|75|100, "evidence": "<non-empty>"}
               ]}
            "coverage" has exactly those five keys — "beyond_five_guards" is a
            findings-only value and must NOT appear there. "evidence" under coverage
            says what you looked at for that guard and why you concluded what you
            concluded; "not_applicable" needs evidence too
            (for example: the only test file in the change is the frozen repro).
            "findings" is [] when clean. Declare "verdict": "DIRTY" if and only if
            you filed at least one finding at confidence 75 or 100 — the next node
            re-derives the verdict from the findings and FAILS the run if your
            declaration disagrees with them.

            Writing deslop-review.json is MANDATORY and comes BEFORE your final line —
            ending without it aborts the pipeline. Then end with the single line:
            DESLOP_REVIEW_DONE

        - id: deslop-review-gate
          depends_on: [deslop-review]
          timeout: 300000
          bash: |
            set -euo pipefail
            ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
            eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            N=$(cat "$ARTIFACTS_DIR/deslop-round.txt" 2>/dev/null || echo "")
            test -n "$N" || { echo "DESLOP_REVIEW=FAIL no deslop-round.txt (deslop-recheck did not run)"; exit 1; }
            case "$N" in *[!0-9]*) echo "DESLOP_REVIEW=FAIL deslop-round.txt is not an integer: [$N]"; exit 1 ;; esac
            RD="$ARTIFACTS_DIR/deslop-round-$N"
            test -s "$RD/checkpoint-tree.txt" || { echo "DESLOP_REVIEW=FAIL no checkpoint for round=$N"; exit 1; }
            R="$ARTIFACTS_DIR/deslop-review.json"
            test -s "$R" || { echo "DESLOP_REVIEW=FAIL no deslop-review.json round=$N"; exit 1; }
            # The reviewer session may leave .omc in the worktree exactly as the
            # writer does. That is runtime-state leakage, not an edit — clearing it
            # here keeps it from reading as tampering below.
            rm -rf .omc
            # Tamper check comes FIRST: a reviewer that edited the code is not a
            # reviewer, and nothing it wrote can be trusted. Recompute the same three
            # facts the checkpoint recorded — with the same lockfile pinning — and
            # compare byte-for-byte.
            CK=$(cat "$RD/checkpoint-tree.txt")
            rm -f "$RD/index-verify"
            GIT_INDEX_FILE="$RD/index-verify" git add -A || { echo "DESLOP_REVIEW=FAIL recompute add round=$N"; exit 1; }
            GIT_INDEX_FILE="$RD/index-verify" git restore --staged pnpm-lock.yaml 2>/dev/null || true
            NOWCK=$(GIT_INDEX_FILE="$RD/index-verify" git write-tree) \
              || { echo "DESLOP_REVIEW=FAIL recompute write-tree round=$N"; exit 1; }
            NOWHEAD=$(git rev-parse HEAD) || { echo "DESLOP_REVIEW=FAIL recompute rev-parse round=$N"; exit 1; }
            NOWINDEX=$(git write-tree) || { echo "DESLOP_REVIEW=FAIL recompute live-index tree round=$N"; exit 1; }
            {
              echo "head=$NOWHEAD"
              echo "index=$NOWINDEX"
              echo "checkpoint=$NOWCK"
            } > "$RD/deslop-tree-now.txt"
            if ! cmp -s "$ARTIFACTS_DIR/deslop-tree.txt" "$RD/deslop-tree-now.txt"; then
              echo "DESLOP_REVIEW=FAIL reviewer modified tree round=$N"
              diff "$ARTIFACTS_DIR/deslop-tree.txt" "$RD/deslop-tree-now.txt" || true
              echo "--- what the reviewer changed (checkpoint tree -> now) ---"
              git diff --stat "$CK" "$NOWCK" || true
              git diff "$CK" "$NOWCK" || true
              # Literal tree-vs-worktree diff as well. It reports every file that was
              # UNTRACKED at checkpoint time as a deletion (git diff <tree> only walks
              # tracked paths), so the tree-to-tree diff above is the accurate one.
              git diff "$CK" || true
              # The saved HEAD is the one the checkpoint recorded, not the current one:
              # if the reviewer committed, $NOWHEAD is already the wrong target.
              SAVEDHEAD=$(sed -n 's/^head=//p' "$ARTIFACTS_DIR/deslop-tree.txt")
              echo "RESTORE the pre-review state — run these three, in this order:"
              echo "  git -C $WT reset --soft $SAVEDHEAD"
              echo "  git -C $WT read-tree $CK && git -C $WT checkout-index -af"
              echo "  git -C $WT clean -fd"
              echo "  (1) undoes any commit the reviewer made; (2) restores every"
              echo "  checkpointed file's bytes, untracked ones included; (3) removes files"
              echo "  the reviewer ADDED. clean -fd leaves ignored paths (node_modules) alone."
              echo "  The index is left holding the checkpoint tree; deslop-recheck re-takes"
              echo "  the whole checkpoint on resume, so that is the new baseline, not drift."
              echo "  pnpm-lock.yaml is checkpointed at its HEAD content, so (2) reverts the"
              echo "  web bootstrap's deliberate lockfile drift; re-run the install to restore it."
              echo "Content-only alternative — restores bytes but does NOT undo a commit or"
              echo "remove reviewer-added files:"
              echo "  tar -xf $RD/checkpoint.tar -C $WT"
              echo "  git -C $WT archive $CK | tar -x -C $WT"
              echo "Then: archon workflow resume."
              exit 1
            fi
            # Fail-closed validation + gate-DERIVED verdict. The reviewer's declared
            # verdict is never trusted on its own: blocking = findings at confidence
            # >= 75, and a declaration that disagrees with the findings is a failure,
            # not a tie-break.
            set +e
            python3 - "$R" "$N" <<'PY'
            import json, sys

            GUARDS = ["complexity", "tautological_tests", "yagni", "open_closed", "comments"]
            # Bugfix-only sixth value: the reviewer is the only check on a writer
            # that fixed something it was told to report. Findings-only — it is
            # not a coverage key, so GUARDS above still drives the coverage loop.
            FINDING_GUARDS = GUARDS + ["beyond_five_guards"]
            STATUSES = ("assessed", "not_applicable")
            path, rnd = sys.argv[1], sys.argv[2]


            def malformed(msg):
                print(f"DESLOP_REVIEW=FAIL malformed finding round={rnd} {msg}")
                sys.exit(3)


            def incomplete(msg):
                print(f"DESLOP_REVIEW=FAIL coverage incomplete round={rnd} {msg}")
                sys.exit(4)


            try:
                doc = json.load(open(path, encoding="utf-8"))
            except Exception as exc:
                malformed(f"unparseable json: {exc}")
            if not isinstance(doc, dict):
                malformed("top level is not an object")
            extra = sorted(set(doc) - {"verdict", "coverage", "findings"})
            if extra:
                malformed(f"extra top-level keys={extra}")
            verdict = doc.get("verdict")
            if verdict not in ("CLEAN", "DIRTY"):
                malformed(f"verdict={verdict!r}")
            coverage = doc.get("coverage")
            if not isinstance(coverage, dict):
                incomplete("coverage is not an object")
            for guard in GUARDS:
                entry = coverage.get(guard)
                if not isinstance(entry, dict):
                    incomplete(f"missing={guard}")
                if entry.get("status") not in STATUSES:
                    incomplete(f"guard={guard} status={entry.get('status')!r}")
                ev = entry.get("evidence")
                if not isinstance(ev, str) or not ev.strip():
                    incomplete(f"guard={guard} empty evidence")
            findings = doc.get("findings")
            if not isinstance(findings, list):
                malformed("findings is not an array")
            blocking = 0
            for i, f in enumerate(findings):
                if not isinstance(f, dict):
                    malformed(f"index={i} finding is not an object")
                if f.get("guard") not in FINDING_GUARDS:
                    malformed(f"index={i} guard={f.get('guard')!r}")
                for key in ("file", "evidence"):
                    val = f.get(key)
                    if not isinstance(val, str) or not val.strip():
                        malformed(f"index={i} {key}={val!r}")
                line = f.get("line")
                if isinstance(line, bool) or not isinstance(line, int):
                    malformed(f"index={i} line={line!r}")
                conf = f.get("confidence")
                if isinstance(conf, bool) or conf not in (50, 75, 100):
                    malformed(f"index={i} confidence={conf!r}")
                if conf >= 75:
                    blocking += 1
                    print(f"DESLOP_FINDING guard={f['guard']} file={f['file']}:{line} confidence={conf}")
            print(f"DESLOP_REVIEW_PARSE round={rnd} declared={verdict} findings={len(findings)} blocking={blocking}")
            if blocking > 0:
                print(f"DESLOP=DIRTY round={rnd} blocking={blocking}")
                sys.exit(2)
            if verdict == "DIRTY":
                print(f"DESLOP_REVIEW=FAIL verdict inconsistent round={rnd} declared DIRTY with 0 blocking findings")
                sys.exit(5)
            print(f"DESLOP=CLEAN round={rnd}")
            print("<promise>DESLOP_CLEAN</promise>")
            sys.exit(0)
            PY
            RC=$?
            set -e
            case "$RC" in
              0) exit 0 ;;
              2)
                # Durable DIRTY counter: rounds also advance on a mechanical recheck
                # failure, which never reaches a verdict, so the cap counts verdicts.
                # deslop-dirty.txt is hand-editable, so it is untrusted input.
                # $((D+1)) on a non-integer aborts the arithmetic (and under set -e
                # the node), and `[ x -ge 2 ]` on junk returns 2 which `if` reads as
                # "not taken" — the cap would silently switch off. Coerce to 0 so a
                # corrupt counter costs one extra round, never the cap itself.
                D=$(cat "$ARTIFACTS_DIR/deslop-dirty.txt" 2>/dev/null || echo 0)
                case "$D" in ''|*[!0-9]*) D=0 ;; esac
                D=$((D+1))
                echo "$D" > "$ARTIFACTS_DIR/deslop-dirty.txt"
                if [ "$D" -ge 2 ]; then echo "DESLOP_ROUND_CAP round=$N dirty_rounds=$D"; fi
                exit 1
                ;;
              3|4|5) exit 1 ;;
              *) echo "DESLOP_REVIEW=FAIL validator error rc=$RC round=$N"; exit 1 ;;
            esac

  - id: deslop-commit
    depends_on: [deslop-verify]
    timeout: 300000
    bash: |
      set -euo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
      RED=$(cat "$ARTIFACTS_DIR/red-sha.txt")
      TESTF=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['test_file'])" "$ARTIFACTS_DIR/failing-test.json")
      cd "$WT"
      # Repro-untouched guard BEFORE anything is staged: a modified repro test
      # must never land as a commit at all, so this runs ahead of git add -A.
      test -z "$(git diff "$RED" -- "$TESTF")" || { echo "DESLOP=FAIL repro test modified"; exit 1; }
      git add -A
      # The web bootstrap deliberately leaves pnpm-lock.yaml modified; it is never
      # part of a fix commit, and a tree dirty ONLY by that drift must produce no
      # commit at all rather than an empty one.
      git restore --staged pnpm-lock.yaml 2>/dev/null || true
      COMMITTED=no
      if git diff --cached --quiet; then :; else
        git commit -m "fix(deslop): remove ai slop from $SLUG"
        COMMITTED=yes
      fi
      # Belt: the same guard again after the commit. Cheap, and it closes the
      # window where something between the two staged a change to the repro.
      test -z "$(git diff "$RED" -- "$TESTF")" || { echo "DESLOP=FAIL repro test modified"; exit 1; }
      test -z "$(git status --porcelain | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$')" || { echo "DESLOP_COMMIT=FAIL dirty after commit"; exit 1; }
      if [ "$COMMITTED" = no ]; then
        echo "DESLOP_COMMIT=SKIP nothing to commit sha=$(git rev-parse HEAD)"
      else
        echo "DESLOP_COMMIT=OK sha=$(git rev-parse HEAD)"
      fi

  - id: negcontrol
    depends_on: [deslop-commit]
    timeout: 1200000
    bash: |
      set -euo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
      bash "$ROOT/.archon/setup/negcontrol.sh" "$WT" "$(cat "$ARTIFACTS_DIR/red-sha.txt")" "$ARTIFACTS_DIR" postgreen

  - id: review-loop
    depends_on: [negcontrol]
    loop_group:
      max_iterations: 3
      until: REVIEW_CONVERGED
      nodes:
        - id: round-pre
          timeout: 120000
          bash: |
            set -euo pipefail
            C="$ARTIFACTS_DIR/round.txt"
            N=$(cat "$C" 2>/dev/null || echo 0)
            # Hand-editable counter: reject junk before it is incremented or used as a path.
            case "$N" in '') N=0 ;; *[!0-9]*) echo "ROUND_PRE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            N=$((N+1)); echo "$N" > "$C"
            RD="$ARTIFACTS_DIR/round-$N"; mkdir -p "$RD"
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            git rev-parse HEAD > "$RD/pre-head.txt"
            ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$RD/prerun-dirs.txt" || true
            touch "$RD/prerun-dirs.txt"
            echo "ROUND=$N head=$(cat "$RD/pre-head.txt")"

        - id: review
          depends_on: [round-pre]
          model: sonnet
          maxBudgetUsd: 10
          timeout: 1800000
          skills: [ce-code-review]
          prompt: |
            The repository checkout to review is the "worktree" field of
            params.json in the directory named by the ARTIFACTS_DIR environment
            variable (you are NOT cwd'd there — cd into it for every git
            command). It is already on the branch to be reviewed. The diff is a
            BUG FIX: a red repro test plus a minimal fix; rca.md in the
            artifacts directory plays the plan's role.

            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

            Persona selection happens in this session, so three instructions
            BEFORE you invoke the skill:
            - Measure the diff first: in the worktree, run
              git diff --stat "$(cat <that directory>/bootstrap-head.txt)"..HEAD
              Under roughly 150 changed lines, cap the conditional personas at
              3 beyond the always-on set, and record the decision (diff size,
              cap applied or not, personas chosen) in the envelope's Coverage
              section so the choice is observable.
            - Task one reviewer lens with exactly this: "verify the fix targets
              the root cause named in rca.md's Best Explanation — not the
              symptom site — and verify the test would catch a regression of
              exactly that cause; report mismatches as findings." Feed its
              findings through the skill's normal merge pipeline.
