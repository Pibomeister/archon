        - id: converge
          depends_on: [commit-fixer]
          timeout: 300000
          bash: |
            set -uo pipefail
            N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
            case "$N" in ''|*[!0-9]*) echo "CONVERGE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            exec > >(tee "$RD/converge.txt") 2>&1
