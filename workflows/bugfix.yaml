      FILE 3 — smoke-seed.sql (optional): when a row needs scenario data the
      stock fixture lacks, write idempotent INSERT/UPDATE statements for the
      LOCAL throwaway e2e DB only (it is dropped and reseeded routinely);
      reference fixture rows by their seeded natural keys, never by guessed
      ids. Omit the file when the fixture suffices.
      End with the single line: SMOKE_MATRIX_DESIGN_DONE

  - id: smoke-stack
    # Waits on the boot smoke too: both bind 4124, and the boot smoke's trap
    # frees the port when its node ends.
    depends_on: [smoke-matrix-design, smoke]
    timeout: 1800000
    bash: |
      set -euo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      AD="$ARTIFACTS_DIR"
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$AD/params.json")"
      REPO=$(cat "$AD/repo.txt")
      SM="$AD/smoke-stack"; mkdir -p "$SM"
      # Matrix shape gate before booting anything.
      python3 - "$AD/smoke-matrix.json" <<'PY' || { echo "SMOKE_STACK=FAIL smoke-matrix.json shape"; exit 1; }
      import json, sys
      m = json.load(open(sys.argv[1], encoding="utf-8"))
      rows = m.get("rows")
      assert isinstance(rows, list) and 1 <= len(rows) <= 6, "rows must be a list of 1-6"
      for r in rows:
          assert r.get("id") and r.get("kind") in ("auto", "judgment"), "row missing id/kind"
          assert r.get("steps") and r.get("expected"), "row missing steps/expected"
          if r["kind"] == "auto":
              assert r.get("spec_title"), "auto row missing spec_title"
      PY
      # This stack owns 4124/3124 plus the machine-global 54322/8001 e2e
      # mutex — never run alongside an integration-kind repro. The servers
      # deliberately OUTLIVE this node (nohup, PID files, no EXIT traps):
      # the human walks the live app at the approval pause; smoke-teardown
      # kills by PID after approval.
      if [ "$REPO" = api ]; then API_DIR="$WT"; else API_DIR="$ROOT/api"; fi
      if [ "$REPO" = web-app ]; then WEB_DIR="$WT"; else WEB_DIR="$ROOT/web-app/.worktrees/bugfix-smoke"; fi
      printf '%s\n' "$API_DIR" > "$SM/api-dir.txt"
      printf '%s\n' "$WEB_DIR" > "$SM/web-dir.txt"
      # --- e2e DB + dynamo + migrations + fixture (search-corpus README recipe; idempotent).
      cd "$API_DIR"
      # .env.e2e is gitignored: fresh worktrees lack it. Copy from the main checkout.
      test -f .env.e2e || cp "$ROOT/api/.env.e2e" .env.e2e
      docker compose -f local-env-compose.e2e.yaml up -d --wait > "$SM/compose.log" 2>&1 || { tail -5 "$SM/compose.log"; echo "SMOKE_STACK=FAIL e2e compose"; exit 1; }
      set -a; . ./.env.e2e; set +a
      export DYNAMODB_ENDPOINT="http://localhost:8001"  # e2e compose maps 8001:8000; .env.e2e's 8000 is the dev container
      bun run migration:run > "$SM/migrate.log" 2>&1 || { tail -5 "$SM/migrate.log"; echo "SMOKE_STACK=FAIL migrations"; exit 1; }
      node scripts/init-dynamodb-local.js > "$SM/dynamo.log" 2>&1 || { tail -5 "$SM/dynamo.log"; echo "SMOKE_STACK=FAIL dynamodb init"; exit 1; }
      bun scripts/seed-search-eval.ts > "$SM/seed.log" 2>&1 || { tail -5 "$SM/seed.log"; echo "SMOKE_STACK=FAIL fixture seed"; exit 1; }
      # FTUE bypass for the fixture login user: the app's onboarding gate keys
      # on linkedin_integrated_at AND ftue_network_completed_at (BE
      # deriveOnboardingStatus); without both, every /chat navigation bounces
      # to the FTUE modal on /home. Local throwaway DB — direct SQL is the
      # deterministic fix.
      PGPASSWORD="$DBPASSWORD" psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSERNAME" -d "$DBNAME" -v ON_ERROR_STOP=1         -c "UPDATE users SET linkedin_integrated_at = COALESCE(linkedin_integrated_at, now()), ftue_network_completed_at = COALESCE(ftue_network_completed_at, now()) WHERE email = 'search-eval@goodword.internal';"         > "$SM/ftue-bypass.log" 2>&1 || { tail -3 "$SM/ftue-bypass.log"; echo "SMOKE_STACK=FAIL ftue bypass"; exit 1; }
      if [ -s "$AD/smoke-seed.sql" ]; then
        PGPASSWORD="$DBPASSWORD" psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSERNAME" -d "$DBNAME" \
          -v ON_ERROR_STOP=1 -f "$AD/smoke-seed.sql" > "$SM/smoke-seed.log" 2>&1 \
          || { tail -5 "$SM/smoke-seed.log"; echo "SMOKE_STACK=FAIL smoke-seed.sql"; exit 1; }
      fi
      # --- API on 4124 against the e2e DB. Exported env outranks --env-file
      # .env, so overrides ride the environment; no checkout file is edited.
      export PORT=4124
      # .env.e2e carries placeholder third-party keys (e.g. ANTHROPIC_API_KEY
      # "some-value") that would override the REAL keys in .env (exported env
      # beats --env-file): unset them so the worktree .env supplies the valid
      # ones — chat turns 401 mid-flow otherwise.
      unset ANTHROPIC_API_KEY
      # testergoodword2@gmail.com: the base the repo's own generateWhitelistedEmail
      # mints throwaway users from (tests/fixtures.ts) — global-setup dies without it.
      export OTP_TEST_WHITELIST_EMAILS="edy@goodword.com,tester@goodword.com,testergoodword2@gmail.com,search-eval@goodword.internal"
      nohup bun start > "$SM/api-boot.log" 2>&1 &
      echo $! > "$SM/api.pid"
      CODE=000
      for i in $(seq 1 80); do
        sleep 3
        CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/api-docs-json || echo 000)
        if [ "$CODE" = "200" ]; then break; fi
      done
      test "$CODE" = "200" || { tail -15 "$SM/api-boot.log"; echo "SMOKE_STACK=FAIL api boot code=$CODE"; exit 1; }
      # --- Web on 3124: the fix worktree when repo=web-app, else a
      # disposable detached worktree off origin/main.
      if [ "$REPO" = api ]; then
        git -C "$ROOT/web-app" fetch origin main --quiet
        if [ ! -d "$WEB_DIR" ]; then
          git -C "$ROOT/web-app" worktree add --detach "$WEB_DIR" origin/main > "$SM/web-worktree.log" 2>&1 || { tail -5 "$SM/web-worktree.log"; echo "SMOKE_STACK=FAIL web worktree"; exit 1; }
        fi
        cp "$ROOT/web-app/.env" "$WEB_DIR/.env"
        cd "$WEB_DIR"
        mise x node@20 -- pnpm install --no-frozen-lockfile > "$SM/web-install.log" 2>&1 || { tail -5 "$SM/web-install.log"; echo "SMOKE_STACK=FAIL web install"; exit 1; }
      fi
      if [ -s "$AD/smoke-matrix.spec.ts" ]; then
        mkdir -p "$WEB_DIR/tests/smoke-matrix"
        cp "$AD/smoke-matrix.spec.ts" "$WEB_DIR/tests/smoke-matrix/matrix.spec.ts"
      fi
      cd "$WEB_DIR"
      export VITE_PUBLIC_API_URL="http://localhost:4124"
      # Production build + serve, NOT `pnpm dev`: dev-mode hydration on a fresh
      # worktree can break (duplicate React context via the Vite dep prebundle,
      # a useContext-null Application Error that still returns HTTP 200) while
      # the built serve — what staging actually runs — is fine. The build embeds
      # VITE_PUBLIC_API_URL into the client bundle, so it is exported BEFORE
      # building, and the serve reads PORT.
      mise x node@20 -- pnpm build > "$SM/web-build.log" 2>&1 || { tail -10 "$SM/web-build.log"; echo "SMOKE_STACK=FAIL web build"; exit 1; }
      # server.js reads process.env only (SESSION_SECRET etc.) — source the
      # copied .env for the serve, then re-assert the API override on top.
      set -a; . ./.env; set +a
      export VITE_PUBLIC_API_URL="http://localhost:4124"
      PORT=3124 nohup mise x node@20 -- pnpm start > "$SM/web-boot.log" 2>&1 &
      echo $! > "$SM/web.pid"
      CODE=000
      for i in $(seq 1 100); do
        sleep 3
        CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3124/ || echo 000)
        if [ "$CODE" = "200" ]; then break; fi
      done
      test "$CODE" = "200" || { tail -15 "$SM/web-boot.log"; echo "SMOKE_STACK=FAIL web boot code=$CODE"; exit 1; }
      echo "SMOKE_STACK=UP api=4124($API_DIR) web=3124($WEB_DIR) pids in $SM (stack stays up through the matrix approval)"

  - id: smoke-auto
    depends_on: [smoke-stack]
    timeout: 1800000
    bash: |
      set -uo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      AD="$ARTIFACTS_DIR"
      WEB_DIR=$(cat "$AD/smoke-stack/web-dir.txt")
      NAUTO=$(python3 -c "import json,sys;print(sum(1 for r in json.load(open(sys.argv[1], encoding='utf-8'))['rows'] if r['kind']=='auto'))" "$AD/smoke-matrix.json")
      if [ "$NAUTO" = 0 ] || [ ! -f "$WEB_DIR/tests/smoke-matrix/matrix.spec.ts" ]; then
        python3 - "$AD/smoke-matrix.json" <<'PY'
      import json, sys
      m = json.load(open(sys.argv[1], encoding="utf-8"))
      for r in m["rows"]:
          if r["kind"] == "auto":
              r["result"] = "not-run"
      json.dump(m, open(sys.argv[1], "w", encoding="utf-8"), indent=2)
      PY
        cp "$AD/smoke-matrix.json" "$AD/smoke-matrix.pre.json"
        echo "SMOKE_AUTO=SKIP no auto rows or no generated spec"
        exit 0
      fi
      cd "$WEB_DIR"
      export PLAYWRIGHT_BASE_URL="http://localhost:3124"
      export TEST_API_URL="http://localhost:4124"
      export VITE_PUBLIC_API_URL="http://localhost:4124"
      export WHITELISTED_OTP="${WHITELISTED_OTP:-123456}"
      export WHITELISTED_PHONE="${WHITELISTED_PHONE:-15184884416}"
      RC=0
      mise x node@20 -- pnpm exec playwright test tests/smoke-matrix --project=chromium --reporter=json \
        > "$AD/smoke-auto-report.json" 2> "$AD/smoke-auto-err.txt" || RC=$?
      python3 - "$AD" <<'PY'
      import json, os, sys
      ad = sys.argv[1]
      m = json.load(open(os.path.join(ad, "smoke-matrix.json"), encoding="utf-8"))
      outcomes = {}
      try:
          rep = json.load(open(os.path.join(ad, "smoke-auto-report.json"), encoding="utf-8"))
          def walk(suite):
              for spec in suite.get("specs", []):
                  outcomes[spec.get("title", "")] = bool(spec.get("ok"))
              for sub in suite.get("suites", []):
                  walk(sub)
          for s in rep.get("suites", []):
              walk(s)
      except Exception:
          pass  # report unparseable: rows fall through to not-run
      for r in m["rows"]:
          if r["kind"] != "auto":
              continue
          t = r.get("spec_title")
          if t in outcomes:
              r["result"] = "pass" if outcomes[t] else "fail"
          else:
              r["result"] = "not-run"
      json.dump(m, open(os.path.join(ad, "smoke-matrix.json"), "w", encoding="utf-8"), indent=2)
      counts = {}
      for r in m["rows"]:
          if r["kind"] == "auto":
              counts[r.get("result", "not-run")] = counts.get(r.get("result", "not-run"), 0) + 1
      print("SMOKE_AUTO rows:", counts)
      PY
      cp "$AD/smoke-matrix.json" "$AD/smoke-matrix.pre.json"
      echo "SMOKE_AUTO=DONE rc=$RC (per-row results written into smoke-matrix.json; a fail is surfaced at the matrix gate, not judged here)"
      exit 0

  - id: smoke-matrix-render
    depends_on: [smoke-auto]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 900000
    prompt: |
      You are the smoke-matrix presentation node. This page is the run's
      SECOND human gate: the stack is live, and the human walks the judgment
      rows in the real app before the draft PR ships. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: smoke-matrix.json, rca.md (one-line context only), repo.txt,
      and smoke-stack/web-dir.txt. Do NOT modify smoke-matrix.json or any
      other artifact; write ONLY smoke-matrix.html to that directory. No
      external resources in the HTML.

      Sections, in order, each wrapped in an HTML comment marker:
      <!-- GIST --> Two sentences in the bro register: what the fix was, and
      what walking this matrix proves. Exact paths and numbers.
      <!-- AUTO --> The auto rows as a table: id, steps, expected, and the
      recorded result (pass / fail / not-run) as a labeled chip. A fail or
      not-run row gets one plain sentence saying the human should treat it as
      unverified and check it by hand in the app.
      <!-- JUDGMENT --> The judgment rows as a checklist the human works
      through in the LIVE app at http://localhost:3124: each row shows its
      exact numbered click path and its expected observation. Say the login:
      search-eval@goodword.internal with any 6-digit code (whitelisted
      locally).
      <!-- DECIDE --> The decision box: approving records the matrix as
      walked, tears the stack down, and ships the draft PR. Rejecting
      preserves everything for a human.
      Then, in the same box, the standard decision block that every gate
      packet carries. Resolve this run's id by running: basename "$ARTIFACTS_DIR"
      and use that literal id in every command below. Never print the
      placeholder <run-id>. Lead with one sentence saying the run is paused
      because it finished this stage and is now waiting on a person, which is
      how the stage is supposed to end and not a failure. Then the three
      commands, each in its own code chip with a short label saying when to
      pick it:
        DISABLE_OMC=1 archon workflow approve <id> </dev/null >/tmp/archon-approve.log 2>&1 &
        DISABLE_OMC=1 archon workflow reject <id> "why you are stopping it"
        DISABLE_OMC=1 archon workflow abandon <id>
      Say that approve runs the rest of the workflow inside the terminal it is
      typed in and holds that terminal until the run ends, which is why it is
      backgrounded, and that a failed resume still leaves the approval
      recorded so archon workflow resume <id> picks it up. Say that reject
      ends the run and records the reason typed after it, that abandon ends
      the run without recording one, and that NEITHER sends the work back for
      a rewrite: this lane declares no on_reject handler, so a different plan
      means a fresh run from a corrected spec. Files already written stay on
      disk either way. Close with one line: these three verbs do not appear in
      archon --help, but they are real.
      Simple inline CSS, one accent color, readable in BOTH light and dark
      (custom properties on :root, overridden under
      @media (prefers-color-scheme: dark)). Identity by label, never color
      alone. Plain sentences; no em dashes; no vocabulary like "crucial",
      "leverage", "robust", "seamless", "comprehensive"; no emoji.
      End with the single line: SMOKE_MATRIX_RENDER_DONE

  - id: smoke-matrix-render-gate
    depends_on: [smoke-matrix-render]
    timeout: 120000
    bash: |
      set -euo pipefail
      H="$ARTIFACTS_DIR/smoke-matrix.html"
      test -s "$H" || { echo "MATRIX_RENDER_GATE=FAIL no smoke-matrix.html"; exit 1; }
      for m in GIST AUTO JUDGMENT DECIDE; do
        grep -q "<!-- $m -->" "$H" || { echo "MATRIX_RENDER_GATE=FAIL missing section $m"; exit 1; }
      done
      RID="$(basename "$ARTIFACTS_DIR")"
      grep -qF "$RID" "$H" || { echo "MATRIX_RENDER_GATE=FAIL DECIDE box does not carry this run's id verbatim"; exit 1; }
      for v in approve reject abandon; do
        grep -qF "archon workflow $v" "$H" || { echo "MATRIX_RENDER_GATE=FAIL DECIDE box missing the $v command"; exit 1; }
      done
      cmp -s "$ARTIFACTS_DIR/smoke-matrix.json" "$ARTIFACTS_DIR/smoke-matrix.pre.json" || { echo "MATRIX_RENDER_GATE=FAIL renderer modified smoke-matrix.json"; exit 1; }
      OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
      OPENED=no
      if [ -n "$OPENER" ] && "$OPENER" "$H" >/dev/null 2>&1; then OPENED=yes; fi
      if [ "$OPENED" = yes ]; then
        echo "MATRIX_RENDER_GATE=PASS packet=file://$H (opened in browser; app live at http://localhost:3124)"
      else
        echo "MATRIX_RENDER_GATE=PASS packet=file://$H (no browser opener - open that path yourself; app live at http://localhost:3124)"
      fi

  - id: smoke-approval
    depends_on: [smoke-matrix-render-gate]
    approval:
      message: "In-app smoke matrix ready (gate 2 of 2): open <this run's ARTIFACTS_DIR>/smoke-matrix.html. The stack is LIVE - walk the judgment rows in the app at http://localhost:3124 (login search-eval@goodword.internal, any 6-digit code). Auto rows are pre-filled from Playwright; treat fail/not-run rows as unverified. Approving tears the stack down and ships the draft PR. The run is paused, which is how this stage is meant to end, not a failure; nothing degrades while it waits. The packet's DECIDE box has the three commands with this run's id filled in: approve continues (background it, it holds the terminal), reject ends the run and records your reason, abandon ends it without one. Neither sends the work back for a rewrite - this lane has no on_reject handler, so a different plan means a fresh run from a corrected spec. None of the three appear in archon --help; they are real."

  - id: smoke-teardown
    depends_on: [smoke-approval]
    timeout: 300000
    bash: |
      set -uo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      AD="$ARTIFACTS_DIR"; SM="$AD/smoke-stack"
      REPO=$(cat "$AD/repo.txt")
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$AD/params.json")"
      port_pids() { # $1 = port
        local out=""
        if command -v lsof >/dev/null 2>&1; then
          out="$(lsof -ti "tcp:$1" -sTCP:LISTEN 2>/dev/null || true)"
        elif command -v ss >/dev/null 2>&1; then
          out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
        elif command -v fuser >/dev/null 2>&1; then
          out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
        else
          return 1
        fi
        [ -n "$out" ] && printf '%s\n' "$out"
        return 0
      }
      for PF in "$SM/web.pid" "$SM/api.pid"; do
        test -f "$PF" && kill "$(cat "$PF")" 2>/dev/null
      done
      sleep 2
      # Children outlive the parents (bun start, vite dev): sweep ONLY the
      # lane's own ports by PID.
      for P in 3124 4124; do
        PIDS=$(port_pids "$P" || true)
        test -n "$PIDS" && kill $PIDS 2>/dev/null
      done
      # The e2e compose (54322/8001) stays up: the fixture volume is shared
      # dev infrastructure, torn down by the integration suites' own lifecycle.
      if [ "$REPO" = api ]; then
        WEB_WT="$ROOT/web-app/.worktrees/bugfix-smoke"
        if [ -d "$WEB_WT" ]; then
          # A just-killed dev/serve process can hold the cwd for a beat; the
          # git removal then deregisters but leaves the directory. Belt: rm+prune.
          git -C "$ROOT/web-app" worktree remove --force "$WEB_WT" 2>/dev/null
          rm -rf "$WEB_WT"
          git -C "$ROOT/web-app" worktree prune 2>/dev/null
        fi
      else
        rm -rf "$WT/tests/smoke-matrix"
      fi
      python3 - "$AD/smoke-matrix.json" > "$AD/smoke-matrix-result.txt" <<'PY'
      import json, sys
      m = json.load(open(sys.argv[1], encoding="utf-8"))
      auto = [r for r in m["rows"] if r["kind"] == "auto"]
      judg = [r for r in m["rows"] if r["kind"] == "judgment"]
      npass = sum(1 for r in auto if r.get("result") == "pass")
      print(f"SMOKE_MATRIX auto={npass}/{len(auto)} pass, judgment={len(judg)} rows human-walked (approval recorded)")
      for r in m["rows"]:
          print(f"- [{r['kind']}] {r['id']}: {r.get('result', 'human-approved')} :: {r['expected']}")
      PY
      cat "$AD/smoke-matrix-result.txt"
      echo "SMOKE_TEARDOWN=OK"

  - id: prbody
    depends_on: [smoke, sibling-sweep, smoke-teardown]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the PR-body composition node. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: rca.md, causal-chain.json, failing-test.json,
      smoke-result.txt, smoke-matrix-result.txt, smoke-matrix.json,
      residuals.json, eval-result.txt, sibling-sweep.json,
      negcontrol-postgreen.txt, negcontrol-exit.txt, round.txt (final round
      N), then round-<N>/review-summary.json and round-<N>/fixer-result.json.
      Also read, when present: accept-residuals.txt and
      experiment-verdict.txt.
      Write a pull-request body in markdown to pr-body.md in that directory
      with exactly these sections:
        ## Summary
        ## Root Cause
        ## Verification
        ## Known Residuals
        ## Post-Deploy Monitoring & Validation
      Root Cause presents the causal chain verbatim from causal-chain.json —
      every link, each with its citation — ending at the fix site.
      Verification tells the red-green-refail story with real values: the
      predicted failure signature (verbatim, in backticks), the RED result,
      the GREEN result, and BOTH negative-control lines exactly as recorded in
      negcontrol-postgreen.txt and negcontrol-exit.txt (their final
      NEGCONTROL=PASS lines), plus the smoke result exactly as recorded in
      smoke-result.txt (including SMOKE=SKIP repo=web-app when that is what it
      says), plus the in-app smoke matrix verbatim from
      smoke-matrix-result.txt (every row line — the human-walked judgment
      rows are the strongest in-app evidence this PR carries), plus the
      EVAL_GATE line from eval-result.txt when it says anything other than
      SKIP.
      Known Residuals has three sources, all mandatory when non-empty:
      every residuals.json entry with disposition separate-bug (quote the
      symptom, repo, and ticket_stub — these are split tickets, and the
      reader must see the symptom was scoped out deliberately, not lost) or
      by-design (symptom + citation); every entry from fixer-result.json
      "advisory" (verbatim finding + rationale); AND every sibling-sweep
      finding with verdict shares-defect or needs-human (file, line, note).
      If none of the three, say "None."
      When accept-residuals.txt exists, Known Residuals OPENS with a line
      quoting it: Residuals human-accepted: <its contents> — then lists the
      final round's "advisory" AND "incomplete" entries verbatim.
      When probe-results.txt holds census numbers (affected rows/users), the
      Summary states the measured blast radius with those exact figures.
      Post-Deploy Monitoring names the concrete signal that should go quiet
      after deploy: the log line, Sentry issue, or error string from the
      evidence — with its identifier. If the bug produced no production
      signal, say exactly: "No additional operational monitoring required."
      No co-author or attribution lines. End with the single line: PRBODY_WRITTEN

  - id: ship
    depends_on: [prbody]
    timeout: 900000
    bash: |
      set -euo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
      REPO=$(cat "$ARTIFACTS_DIR/repo.txt")
      test "$(git -C "$WT" rev-parse --abbrev-ref HEAD)" = "$BR"
      test -s "$ARTIFACTS_DIR/pr-body.md"
      grep -q '^## Root Cause' "$ARTIFACTS_DIR/pr-body.md"
      grep -q '^## Known Residuals' "$ARTIFACTS_DIR/pr-body.md"
      grep -q '^## Post-Deploy Monitoring & Validation' "$ARTIFACTS_DIR/pr-body.md"
      TITLE=$(head -1 "$ARTIFACTS_DIR/commit-msg.txt" 2>/dev/null || true)
      test -n "$TITLE" || TITLE="fix($REPO): $SLUG"
      # exit-gate already ran typecheck/suites/repro; hook re-run skipped by explicit choice.
      git -C "$WT" push -u origin "$BR" --no-verify
      cd "$WT"
      EXISTING=$(gh pr list --head "$BR" --state open --json url --jq '.[0].url' 2>/dev/null || true)
      if [ -n "$EXISTING" ]; then
        printf '%s\n' "$EXISTING" > "$ARTIFACTS_DIR/pr-url.txt"
        echo "SHIP=ADOPTED existing PR"
      else
        gh pr create --draft --base main --head "$BR" \
          --title "$TITLE [archon]" \
          --body-file "$ARTIFACTS_DIR/pr-body.md" > "$ARTIFACTS_DIR/pr-url.txt"
      fi
      echo "PR_URL=$(cat "$ARTIFACTS_DIR/pr-url.txt")"
      echo "SHIP=OK"

  - id: run-report
    depends_on: [ship]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the final-report node: the last thing a human sees from this run,
      so show, do not tell. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: pr-url.txt, rca.md, causal-chain.json, failing-test.json,
      worktrees.json, fix-attempt.txt, round.txt, smoke-result.txt,
      negcontrol-postgreen.txt, negcontrol-exit.txt, sibling-sweep.json, and
      each round-<N>/review-summary.json and round-<N>/fixer-result.json.
      Write a single self-contained run-report.html to that directory with
      these marker-wrapped sections:
      <!-- GIST --> Open in the bro register: what the bug was, what the fix
      was, and how we know it is really fixed, told like you would tell a
      smart friend over a beer. Simpler, not necessarily shorter; the bar is
      impossible to misunderstand. Every path, command, number, and URL stays
      exactly as it is. Flat prose, four sentences max.
      <!-- SHIPPED --> The PR link as the headline, branch, repo, and a
      two-sentence plain-language summary of the fix.
      <!-- STORY --> The red-green-refail story as labeled chips in order:
      RED (the test failed with the predicted signature — show it), GREEN
      (fix landed on attempt N, suites green), REFAIL (both negative controls:
      revert the fix, the test fails again with the same signature, restore).
      One short sentence beside each chip saying why that step proves
      something.
      <!-- CHAIN --> The causal chain as a compact vertical list, one line per
      link, fix site marked on the last.
      <!-- RESIDUALS --> Waivers, advisory findings, and sibling-sweep
      findings in plain words; "None" if empty.
      <!-- NEXT --> What the human does now: review the PR, run kb:compound to
      curate the capture, merge when satisfied. Concrete commands or links.
      Show-me rules: smallest view that makes each point; real names, paths,
      and numbers only; no invented data; light and dark via :root custom
      properties plus a prefers-color-scheme override. Plain sentences, no em
      dashes, no AI-tell vocabulary. End with the single line: RUN_REPORT_DONE

  - id: kb-capture
    depends_on: [run-report]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the knowledge-capture node: compound what this bug taught us so
      the next investigation starts smarter. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: rca.md, causal-chain.json, kb-context.md (if present),
      pr-url.txt, sibling-sweep.json, residuals.json, fix-attempt.txt,
      round.txt, and each round-<N>/fixer-result.json.

      Write EXACTLY ONE new markdown file into
      /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb/wiki/change-history/
      named <YYYY-MM-DD>-archon-bugfix-<slug>.md (get the date with the date
      command; the slug is the "slug" field of params.json in the artifacts
      directory).
      That one new file is your ENTIRE write surface: never edit or delete any
      existing knowledge-base file. Curation into concepts, patterns, glossary,
      or ADRs belongs to a human-attended kb:compound session, not to you.

      Frontmatter: title, date, source (archon bugfix, run id = the artifacts
      directory basename), pr (the URL), status: captured.
      Body sections, exactly these headings:
        ## Symptom
        ## Root cause
        ## Why the tests missed it
        ## Detection improvement
        ## Promotion candidates
      Symptom: what was reported, two sentences. Root cause: the chain's final
      link plus the fix site. Why the tests missed it: what gap let this
      defect ship — the honest answer, from the RCA. Detection improvement:
      what would catch this class earlier next time (a test pattern, a lint, a
      monitor), drawn from the run. Promotion candidates: bullets in the form
      "glossary: <term>", "ADR: <decision>", "pattern: <name>" for the
      curator — include sibling-sweep findings worth tickets, and one
      "ticket: <ticket_stub> (<repo>)" bullet per residuals.json entry with
      disposition separate-bug, verbatim from that file.
      Everything from run artifacts; nothing invented; facts verbatim.
      End with the single line: KB_CAPTURE_DONE

  - id: kb-capture-gate
    depends_on: [kb-capture]
    timeout: 120000
    bash: |
      set -euo pipefail
      KB=/Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb
      git -C "$KB" status --porcelain | sort > "$ARTIFACTS_DIR/kb-post-capture.txt"
      NEW=$(comm -13 "$ARTIFACTS_DIR/kb-pre-porcelain.txt" "$ARTIFACTS_DIR/kb-post-capture.txt" || true)
      COUNT=$(printf '%s\n' "$NEW" | grep -c "^?? wiki/change-history/" || true)
      TOTAL=$(printf '%s\n' "$NEW" | grep -c . || true)
      test "$COUNT" = "1" || { echo "KB_CAPTURE_GATE=FAIL expected exactly one new capture file, delta: [$NEW]"; exit 1; }
      test "$TOTAL" = "$COUNT" || { echo "KB_CAPTURE_GATE=FAIL KB changes outside change-history: [$NEW]"; exit 1; }
      F="$KB/$(printf '%s\n' "$NEW" | sed -n 's/^?? //p')"
      grep -q "status: captured" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing frontmatter"; exit 1; }
      grep -qi "Why the tests missed it" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing why-tests-missed section"; exit 1; }
      grep -qi "Promotion candidates" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing promotion candidates"; exit 1; }
      echo "KB_CAPTURE_GATE=PASS file=$F"

  - id: report
    depends_on: [kb-capture-gate]
    trigger_rule: all_done
    always_run: true
    timeout: 120000
    bash: |
      set -uo pipefail
      echo "=== BUGFIX REPORT ==="
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      cat "$ARTIFACTS_DIR/worktrees.json" 2>/dev/null || echo "no worktrees.json (run stopped before bind)"
      cat "$ARTIFACTS_DIR/pr-url.txt" 2>/dev/null || echo "PR=NOT_CREATED"
      cat "$ARTIFACTS_DIR/smoke-result.txt" 2>/dev/null || true
      cat "$ARTIFACTS_DIR/smoke-matrix-result.txt" 2>/dev/null || true
      tail -1 "$ARTIFACTS_DIR/negcontrol-exit.txt" 2>/dev/null || true
      N=$(cat "$ARTIFACTS_DIR/round.txt" 2>/dev/null)
      case "$N" in *[!0-9]*) echo "REPORT=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
      test -n "$N" && cat "$ARTIFACTS_DIR/round-$N/review-summary.json" 2>/dev/null
      if [ -s "$ARTIFACTS_DIR/run-report.html" ]; then
        echo "REPORT=file://$ARTIFACTS_DIR/run-report.html"
        OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
        [ -n "$OPENER" ] && "$OPENER" "$ARTIFACTS_DIR/run-report.html" >/dev/null 2>&1 || true
      fi
      echo "REPORT_DONE"
