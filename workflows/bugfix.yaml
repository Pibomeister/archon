            test "$G1" = PASS && test "$G2" = PASS && test "$G3" = PASS || { echo "REVIEW_GATE=FAIL round=$N"; exit 1; }
            echo "REVIEW_GATE=PASS round=$N"

        - id: commit-fixes
          depends_on: [review-gate]
          timeout: 300000
          bash: |
            set -euo pipefail
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            git add -A
