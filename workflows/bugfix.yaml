        - id: green-check
          depends_on: [fix]
          timeout: 1800000
          bash: |
            set -uo pipefail
            # Always exits 0: fix-converge owns the verdict. This node only
            # measures and writes attempt-N/green.json.
            ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
            SETUP="$ROOT/.archon/setup"
            N=$(cat "$ARTIFACTS_DIR/fix-attempt.txt"); ADN="$ARTIFACTS_DIR/attempt-$N"
            eval "$(bash "$SETUP/params-env.sh" "$ARTIFACTS_DIR/params.json")"
            REPO=$(cat "$ARTIFACTS_DIR/repo.txt")
            RED=$(cat "$ARTIFACTS_DIR/red-sha.txt")
            TESTF=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['test_file'])" "$ARTIFACTS_DIR/failing-test.json")
            cd "$WT"
            GREEN=true; REASON=ok; RC=0
            # Repro-untouched guard: committed AND working-tree drift vs RED.
            if [ -n "$(git diff "$RED" -- "$TESTF")" ]; then GREEN=false; REASON="repro test modified"; fi
            if [ "$GREEN" = true ]; then
              bash "$SETUP/run-repro.sh" "$WT" "$ARTIFACTS_DIR" "$ADN/repro-out.txt" >/dev/null 2>&1 || RC=$?
              test "$RC" = 0 || { GREEN=false; REASON="repro still failing rc=$RC"; }
            fi
            if [ "$GREEN" = true ]; then
              if [ "$REPO" = web-app ]; then
                mise x node@20 -- pnpm typecheck > "$ADN/typecheck.log" 2>&1 || { GREEN=false; REASON="typecheck failed"; }
                test "$GREEN" = false || mise x node@20 -- pnpm lint > "$ADN/lint.log" 2>&1 || { GREEN=false; REASON="lint failed"; }
              else
                bun run typecheck > "$ADN/typecheck.log" 2>&1 || { GREEN=false; REASON="typecheck failed"; }
                test "$GREEN" = false || bun run lint > "$ADN/lint.log" 2>&1 || { GREEN=false; REASON="lint failed"; }
              fi
            fi
            if [ "$GREEN" = true ]; then
              python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1], encoding='utf-8'))['test_patterns']]" "$ARTIFACTS_DIR/verify.json" > "$ADN/patterns.txt"
              while IFS= read -r PAT; do
                test -n "$PAT" || continue
                if [ "$REPO" = web-app ]; then
                  mise x node@20 -- pnpm test --run "$PAT" >> "$ADN/suite.log" 2>&1 || { GREEN=false; REASON="suite pattern=$PAT"; break; }
                else
                  bun run test -- "$PAT" >> "$ADN/suite.log" 2>&1 || { GREEN=false; REASON="suite pattern=$PAT"; break; }
                fi
              done < "$ADN/patterns.txt"
            fi
            if [ "$GREEN" = true ]; then
              python3 "$SETUP/check-scope.py" "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$RED" --exclude pnpm-lock.yaml || { GREEN=false; REASON="scope breach"; }
            fi
            HASH=none
            if [ "$RC" != 0 ] && [ -s "$ADN/repro-out.txt" ]; then
              HASH=$(python3 -c "import hashlib,re,sys;print(hashlib.md5(re.sub(rb'[0-9]+',b'',open(sys.argv[1],'rb').read())).hexdigest())" "$ADN/repro-out.txt" 2>/dev/null || echo none)
            fi
            python3 -c "import json,sys;json.dump({'green':sys.argv[2]=='true','reason':sys.argv[3],'failure_hash':sys.argv[4]},open(sys.argv[1],'w',encoding='utf-8'))" \
              "$ADN/green.json" "$GREEN" "$REASON" "$HASH"
            echo "GREEN_CHECK attempt=$N green=$GREEN reason=[$REASON]"
            exit 0

        - id: fix-converge
          depends_on: [green-check]
          timeout: 300000
          bash: |
            set -uo pipefail
            ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
            N=$(cat "$ARTIFACTS_DIR/fix-attempt.txt"); ADN="$ARTIFACTS_DIR/attempt-$N"
            exec > >(tee "$ADN/converge.txt") 2>&1
            G="$ADN/green.json"
            test -s "$G" || { echo "FIX_CONVERGE=FAIL no green.json"; exit 1; }
            GREEN=$(python3 -c "import json,sys;print('true' if json.load(open(sys.argv[1], encoding='utf-8'))['green'] else 'false')" "$G")
            REASON=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['reason'])" "$G")
            HASH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['failure_hash'])" "$G")
            case "$REASON" in
