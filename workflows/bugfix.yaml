                elif [ "$N" -ge "$CAP" ]; then
                  if [ "$ACCEPT" = YES ]; then
                    echo "CONVERGED round=$N (human accepted residuals)"
                    echo "<promise>REVIEW_CONVERGED</promise>"
                  else
