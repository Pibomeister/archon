            2. REGRESSION POTENTIAL. For each impact.json symbol that has d1
               callers, every d1 caller must appear in fix-plan.json "files", in a
               verify.json test pattern, or in "risks" with an explicit "unaffected
               because…" line; otherwise kind "regression". A d1 caller OUTSIDE the
               causal chain whose behavior this fix changes and which "risks" does
               not name is kind "regression" even when its file is listed — the
               chain explains the reported symptom, not everything the fix site
               feeds. A HIGH or CRITICAL risk symbol with no mitigation (a flag, an
               additive-only change, a caller test) is kind "regression".
               If impact.json's "status" is UNAVAILABLE or SKIPPED, the caller half
