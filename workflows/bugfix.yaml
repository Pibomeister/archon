        V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
        case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
        python3 "$SETUP/check-fixer-result.py" "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
      fi
      test -z "$(git status --porcelain | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
      python3 "$SETUP/check-scope.py" "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" --exclude pnpm-lock.yaml \
        || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
      TESTF=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['test_file'])" "$ARTIFACTS_DIR/failing-test.json")
      test -z "$(git diff "$RED" -- "$TESTF")" || { echo "EXIT_GATE=FAIL REVIEW_SCOPE repro test drifted"; exit 1; }
