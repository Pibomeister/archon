            - Touch only paths in files-allowlist.json. No commits, no
              branches — a later node commits.
            - Run the repro command yourself to check your work; the gate
              re-runs it authoritatively either way.

            <repo-conventions repo="api">
            bun@1.3.10. Unit tests: bun run test -- "<pattern>" (never bare
            bun test). Typecheck: bun run typecheck. Lint: bun run lint.
            TypeScript strict; no `any`.
            </repo-conventions>
            <repo-conventions repo="web-app">
            pnpm via mise x node@20 --. Typecheck: pnpm typecheck. Lint:
