            echo "ROUND=$N verdict=[$V] fixer_ok=$FIXOK clean=$CLEAN head_moved=$MOVED incomplete=$INC"
            # Scope guard vs the RED anchor: any change outside the allowlist is a human stop.
            python3 "$SETUP/check-scope.py" \
              "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$RED" --round "$N" --exclude pnpm-lock.yaml || exit 1
