      while IFS= read -r PAT; do
        test -n "$PAT" || continue
        if [ "$REPO" = web-app ]; then
          mise x node@20 -- pnpm test --run "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
        else
          bun run test -- "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
        fi
      done < "$ARTIFACTS_DIR/exit-patterns.txt"
      # The repro must pass on the final tree...
      RC=0
      bash "$SETUP/run-repro.sh" "$WT" "$ARTIFACTS_DIR" "$ARTIFACTS_DIR/exit-repro-out.txt" >/dev/null 2>&1 || RC=$?
      test "$RC" = 0 || { echo "EXIT_GATE=FAIL repro failing on final tree rc=$RC"; exit 1; }
      # ...and the SECOND negative control re-proves causality after review moved HEAD.
      bash "$SETUP/negcontrol.sh" "$WT" "$RED" "$ARTIFACTS_DIR" exit || { echo "EXIT_GATE=FAIL negcontrol"; exit 1; }
      # Search-eval regression gate (conditional): a fix that touches search
      # behavior also replays the offline eval lanes. Zero model calls (replay
      # against the committed cassette), but the jest lanes need the e2e DB —
      # boot the compose + fixture first (idempotent; owns the machine-global
      # 54322/8001 mutex). Divergence is a TYPED human stop, never
      # auto-accepted: a ranking-behavior fix can legitimately shift cassette
      # outcomes, and the human decides re-record vs revisit.
      if [ "$REPO" = api ] && git diff --name-only "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"..HEAD | grep -Eq 'search-v4|search-plan|facet-resolver|retrieval'; then
        echo "EVAL_GATE=RUNNING fix touches search paths (offline replay, zero model calls)"
        (
          set -e
          test -f .env.e2e || cp "$ROOT/api/.env.e2e" .env.e2e
          docker compose -f local-env-compose.e2e.yaml up -d --wait
          set -a; . ./.env.e2e; set +a
          export DYNAMODB_ENDPOINT="http://localhost:8001"
          bun run migration:run
          node scripts/init-dynamodb-local.js
          bun scripts/seed-search-eval.ts
        ) > "$ARTIFACTS_DIR/eval-stack.log" 2>&1 || { tail -10 "$ARTIFACTS_DIR/eval-stack.log"; echo "EXIT_GATE=FAIL eval stack boot (see eval-stack.log)"; exit 1; }
        TEST_GROUP=evals bun run test:integration > "$ARTIFACTS_DIR/eval-int.log" 2>&1 \
          || { tail -25 "$ARTIFACTS_DIR/eval-int.log"; echo "EVAL_DIVERGED lane=correctness+contract (cassette outcomes shifted; the human decides: re-record with --subset and additive pin merge, or revisit the fix - see eval-int.log)"; exit 1; }
        bunx jest --config jest.ai.config.js apps/api-e2e/src/eval/search-corpus/search-eval.ai.spec.ts > "$ARTIFACTS_DIR/eval-ai.log" 2>&1 \
          || { tail -25 "$ARTIFACTS_DIR/eval-ai.log"; echo "EVAL_DIVERGED lane=quality (baseline regression; the human decides re-record vs revisit - see eval-ai.log)"; exit 1; }
        echo "EVAL_GATE=PASS both replay lanes green" | tee "$ARTIFACTS_DIR/eval-result.txt"
      else
        echo "EVAL_GATE=SKIP fix outside search paths" | tee "$ARTIFACTS_DIR/eval-result.txt"
      fi
      echo "EXIT_GATE=PASS"

  - id: smoke
    depends_on: [exit-gate]
    timeout: 1200000
    bash: |
      set -uo pipefail
      ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
      eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
      REPO=$(cat "$ARTIFACTS_DIR/repo.txt")
      if [ "$REPO" = web-app ]; then
        # Typed, visible in the PR body: web boot smoke is deferred (port 3124 reserved).
        echo "SMOKE=SKIP repo=web-app" | tee "$ARTIFACTS_DIR/smoke-result.txt"
        exit 0
      fi
      cd "$WT"
      port_pids() { # $1 = port
        local out=""
        if command -v lsof >/dev/null 2>&1; then
          out="$(lsof -ti "tcp:$1" -sTCP:LISTEN 2>/dev/null || true)"
        elif command -v ss >/dev/null 2>&1; then
          out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
        elif command -v fuser >/dev/null 2>&1; then
          out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
        else
          return 1
        fi
        [ -n "$out" ] && printf '%s\n' "$out"
        return 0
      }
      PORT=4124 bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
      SRV=$!
      # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
      trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids 4124); test -n "$P" && kill $P 2>/dev/null; true' EXIT
      CODE=000
      for i in $(seq 1 60); do
        sleep 3
        CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/api-docs-json || echo 000)
        test "$CODE" = "200" && break
      done
      test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
      CTRL=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/info || echo 000)
      test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
      echo "SMOKE=PASS api-docs-json=200 guarded-control=401" | tee "$ARTIFACTS_DIR/smoke-result.txt"

