        belong to the user search-eval@goodword.internal — the test MUST log
        in as that user (env override SMOKE_MATRIX_USER, defaulting to it):
        use test.use({ storageState: { cookies: [], origins: [] } }). That
        user ALREADY OWNS an account, so NEVER use TestApiClient's
        authenticateBrowser (its signup-then-swap flow 409s on existing
        emails). Instead: mint a token directly (POST {api}/auth/otp/initiate
        then /auth/otp/signup/verify with the user's email + the whitelisted
        code — the endpoint signs an existing user in), build the typed
        client via TestApiClient.fromToken(token) (import from ../test-api;
        the file will live at tests/smoke-matrix/matrix.spec.ts), then sign
        the BROWSER in through the app's own actions: page.request.post
        {web}/auth/signin (form intent auth-signin-email, Origin header) and
        {web}/auth/otp (form intent auth-otp-verify, code). After
        authenticating, PUT /user with onboardingIntentCategories
        ['networking', 'mentorship'] exactly as tests/global-setup.ts does,
        AND make one POST {api}/connection/linkedin/bulk call with a single
