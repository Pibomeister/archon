            3. DEPTH. "alternatives" is mandatory thinking, not padding. When a root
               or class fix plausibly exists — the change that removes the defect
               class rather than the reported instance, a schema or constraint
               change included — an alternatives array holding only a
               {"label": "none"} boilerplate entry is kind "gap": name the class fix
