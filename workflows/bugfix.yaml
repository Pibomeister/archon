            # exit codes.
            RP=0; bash "$SETUP/run-repro.sh" "$WT" "$ARTIFACTS_DIR" "$RD/repro-out.txt" >/dev/null 2>&1 || RP=$?
            TC=0; LT=0
            if [ "$REPO" = web-app ]; then
