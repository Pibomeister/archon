  - id: deslop
    depends_on: [fix-loop]
    model: sonnet
    maxBudgetUsd: 4
    timeout: 1200000
    prompt: |
      You are the deslop WRITER node in an unattended bugfix pipeline: you clean
      the AI slop out of the fix BEFORE the negative control and the code review
      loop see it. Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"

      The working tree is the "worktree" field of params.json in that directory
      (you are NOT cwd'd there — cd into it for every git command). It is
      already on the branch to be cleaned.

      SCOPE — the files you may touch are exactly the intersection of:
        (a) files changed or untracked since the red sha in red-sha.txt
            (in the worktree:
               git diff --name-only "$(cat <that directory>/red-sha.txt)"
             — anchored at the red sha and compared against the WORKING TREE,
             which covers both the committed fix and any uncommitted edit —
             plus git status --porcelain for untracked files),
        (b) the paths listed in files-allowlist.json in the artifacts directory.
      Nothing else.

      THE REPRO TEST FILE IS READ-ONLY. It is the "test_file" field of
      failing-test.json in the artifacts directory. You are FORBIDDEN from
      editing, deleting or reformatting it — a later gate compares it byte-for-
      byte against the red sha and hard-stops the run if it moved. The
      tautological-test guard below does NOT apply to it.

      POSTURE (from ai-slop-cleaner):
      - Preserve behavior. This is a cleanup pass, not a redesign.
      - Plan before you edit: read the whole changed surface first, list the
        smells you intend to remove, then edit.
      - One smell-pass at a time. Do not interleave unrelated cleanups.
      - Re-run targeted verification after each pass (see VERIFICATION).
      - Never expand scope. A smell outside the scope above is REPORTED, not fixed.

      THIS IS A BUGFIX LANE AND IT IS CAUSAL-MINIMAL. The fix node was told "no
      refactoring, no renames, no optimization, no cleanup, no drive-by
      improvements", and that rule binds you too, with exactly five exceptions.

      The ONLY things you may FIX are these FIVE GUARDS:

      1. CYCLOMATIC COMPLEXITY — a *new* function above 10, or a changed
         function whose complexity the fix *raised* above 10: flatten it
         (early returns, table dispatch). A pre-existing function already above
         10 that the fix did not worsen: leave it, report it.
      2. TAUTOLOGICAL TESTS — a test that asserts a value against itself, or
         whose only matchers are toBeDefined / toBeTruthy / not.toThrow, or that
         asserts on a mock's return value, or that has no assertion at all. Fix
         it by asserting the observable value; if no observable value exists,
         DELETE the test and say so. This guard SKIPS the repro test file.
      3. YAGNI — parameters, options, branches, exports, types and config added
         by the fix with no caller in the diff or anywhere in the repo: delete them.
      4. OPEN/CLOSED — where the fix special-cases an existing dispatch
         (a switch, an if-chain, a registry) and an extension point already
         exists, use the extension point. Do NOT *introduce* an extension point
         for a single consumer.
      5. NARRATING COMMENTS — comments that restate the code, narrate the change,
         or preserve task history; banner comments; JSDoc that repeats the
         signature; any added TODO. Delete them. KEEP comments that explain
         *why*, or record an invariant or a constraint.

      REPORT-ONLY, NEVER FIXED — the rest of the ai-slop-cleaner taxonomy
      (duplication outside the diff, dead code the fix did not add, needless
      abstraction the fix did not add, boundary violations that would need
      restructuring). Every one of these goes in "reported_not_fixed" with the
      guard it comes closest to and a reason. Fixing one is FORBIDDEN. No
      mechanical check catches it — the reviewer that follows you is asked to
      read your diff for edits outside the five guards and to file them as
      blocking findings, so an unreported cleanup stops the run for a human.

      GATING RULES (verbatim from ce-simplify-code, and they override the guards
      wherever they conflict):
      - Never simplify away a safety check.
      - LOC removed is not the metric.

      MUST NOT:
      - Edit the repro test file (see above).
      - Change public API shapes (exported signatures, DTOs, route contracts,
        response bodies). If a guard would require that, report it instead.
      - Touch any file outside the scope intersection above.
      - Touch commit-msg.txt.
      - Create commits, branches or worktrees. A later node commits.

      VERIFICATION — after your passes, in the worktree, the repro test must
      still PASS and these must exit 0. Read repo.txt in the artifacts
      directory for which repo this is.

      The repro test is the "command" field of failing-test.json in the
      artifacts directory — run that command in the worktree to check your
      work. The gate re-runs it authoritatively either way, through
      /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/run-repro.sh
      <worktree> <artifacts-dir> <outfile>, which is the single repro-execution
      point for this lane; you may run that script instead if you prefer the
      exact form the gate uses.
      <repo-conventions repo="api">
      bun@1.3.10. Unit tests: bun run test -- "<pattern>" (never bare
      bun test — `test` is a bun builtin, so the bare form runs bun's own
      runner instead of jest and silently breaks the suite's mocks).
      Typecheck: bun run typecheck. Lint: bun run lint.
      </repo-conventions>
      <repo-conventions repo="web-app">
      pnpm via mise x node@20 --. Typecheck: mise x node@20 -- pnpm typecheck.
      Lint: mise x node@20 -- pnpm lint. Tests: mise x node@20 -- pnpm test
      --run "<pattern>".
      </repo-conventions>
      Run one command per pattern in test_patterns in verify.json in the
      artifacts directory. Do not run integration tests in this node.

      Write deslop-result.json to the artifacts directory, with exactly this shape:
        {"changed_files": ["<repo-relative>", ...],
         "passes": [{"guard": "complexity|tautological_tests|yagni|open_closed|comments",
                     "file": "<repo-relative>", "line": <int>,
                     "action": "deleted|rewrote|kept", "reason": "<one line>"}],
         "reported_not_fixed": [{"guard": "<one of the five, or the taxonomy item>",
                                 "file": "<repo-relative>", "line": <int>,
                                 "reason": "<why it was not fixed>"}],
         "verification": {"typecheck": <int exit code>, "lint": <int exit code>,
                          "tests": <int exit code>}}
      Writing this file is MANDATORY and comes BEFORE your final line — ending
      without it aborts the pipeline. Write it even when every array is empty.
      Then end with the single line: DESLOP_DONE

  - id: deslop-verify
    depends_on: [deslop]
    loop_group:
      max_iterations: 2
      until: DESLOP_CLEAN
      nodes:
        - id: deslop-recheck
