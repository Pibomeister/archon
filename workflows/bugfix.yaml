      bash "$SETUP/negcontrol.sh" "$WT" "$RED" "$ARTIFACTS_DIR" exit || { echo "EXIT_GATE=FAIL negcontrol"; exit 1; }
      # Search-eval regression gate (conditional): a fix that touches search
      # behavior also replays the offline eval lanes. Zero model calls (replay
      # against the committed cassette), but the jest lanes need the e2e DB —
      # boot the compose + fixture first (idempotent; owns the machine-global
      # 54322/8001 mutex). Divergence is a TYPED human stop, never
      # auto-accepted: a ranking-behavior fix can legitimately shift cassette
      # outcomes, and the human decides re-record vs revisit.
      if [ "$REPO" = api ] && git diff --name-only "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"..HEAD | grep -Eq 'search-v4|search-plan|facet-resolver|retrieval'; then
