            5. PRE-MORTEM. Write three concrete scenarios in which this fix is
               implemented exactly as planned and the bug is still there, or a new
               one is. Each names the step that fails and what breaks. Findings that
               fall out of these go in under whichever kind fits.

            Write rca-round-N/critique.json:
              {"verdict": "ACCEPT|REVISE|REJECT",
               "summary": "<two or three sentences>",
               "findings": [
                 {"kind": "scope|regression|gap|verifiability",
                  "severity": "P0|P1|P2",
                  "confidence": 50|75|100,
                  "section": "<the artifact or field the finding is about>",
