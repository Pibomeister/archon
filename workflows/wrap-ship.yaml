name: wrap-ship
description: W9 ship lane (ce-commit-push-pr Tier-3 replacement per effects-table 8b) — PR-body prompt node + mechanical bash. Smoke pushes to a local bare remote; gh pr create is deferred to M3.1 (needs a real GitHub remote).
provider: claude
nodes:
  - id: prbody
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the PR-body composition node in an unattended workflow. Ask no questions.
      Write a pull-request body in markdown to the file pr-body.md inside the directory
      named by the ARTIFACTS_DIR environment variable (resolve via: echo "$ARTIFACTS_DIR").

      Inputs for this run:
      - Change summary: fixture change — slugify helper added to lib.sh with a test.
      - Residual waivers (verbatim, must appear under "## Known Residuals"):
        - [P3][waived] run-tests.sh failure message could include the expected value — cosmetic, deferred.

      Required sections, exactly these headings:
        ## Summary
        ## Known Residuals
        ## Post-Deploy Monitoring & Validation
      If there is no runtime impact, the monitoring section must say exactly:
      "No additional operational monitoring required."
      Do not add co-author or attribution lines anywhere.
      End your reply with the single line: PRBODY_WRITTEN

  - id: ship
    depends_on: [prbody]
    timeout: 900000
    bash: |
      set -euo pipefail
      REPO=/private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
      BRANCH=feature
      BODY_FILE="$ARTIFACTS_DIR/pr-body.md"
      GH_SMOKE=1   # smoke: local bare remote only; production template runs gh pr create

      # 0. Assert we are where we think we are — never infer the repo from cwd.
      test "$(git -C "$REPO" rev-parse --abbrev-ref HEAD)" = "$BRANCH"

      # PR body must exist and carry the residual sink before anything ships.
      test -s "$BODY_FILE"
      grep -q '^## Known Residuals' "$BODY_FILE"
      grep -q '^## Post-Deploy Monitoring & Validation' "$BODY_FILE"

      # 4. Push (staging/commit is W7's job; ship only pushes what is committed).
      git -C "$REPO" push -u origin "$BRANCH"

      # 5. PR against the repo's real default branch — resolved, not hard-coded.
      BASE=$(git -C "$REPO" symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@') || true
      BASE="${BASE:-main}"
      if [ "$GH_SMOKE" = "1" ]; then
        echo "GH_DEFERRED=M3.1 base=$BASE head=$BRANCH"
      else
        gh -R "$(gh repo view --json nameWithOwner -q .nameWithOwner)" pr create \
          --base "$BASE" --head "$BRANCH" --title "fix(fixture): m1 smoke" --body-file "$BODY_FILE"
      fi
      echo "W9_GATE=PASS"
