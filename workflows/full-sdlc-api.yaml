              PM=NO
              cmp -s "$ARTIFACTS_DIR/plan.md" "$RD/plan.pre.md" || PM=YES
              AM=""
              for f in joint-plan.json verify.json files-allowlist.json web-files-allowlist.json reader-audit.json premises.json web-reader-audit.json web-premises.json browser-evidence.json browser-evidence.sha256 smoke-probe.json; do
                CUR="$ARTIFACTS_DIR/$f"; PRE="$RD/pre-$f"
                if [ -f "$CUR" ] && [ -f "$PRE" ]; then
                  cmp -s "$CUR" "$PRE" || AM="$AM,$f"
                elif [ -f "$CUR" ] || [ -f "$PRE" ]; then
                  # Appeared or disappeared: a contract file's existence is part of it.
                  AM="$AM,$f"
