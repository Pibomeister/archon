            verbatim spec quote, or a code-derived-necessity citation naming the
            traced plan item and the repository line that forces the item to exist.
            A scope finding resolves in exactly two ways — remove the item from the
            plan, or supply the trace the critic could not find. "It is useful" is
            not a trace.

            When you change the plan, keep every contract consistent with it in the
            same pass: files-allowlist.json lists every API path and
            web-files-allowlist.json lists every web-app path the revised plan
