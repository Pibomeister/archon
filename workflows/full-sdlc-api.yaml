  - id: premise-verify
    depends_on: [premise-strip]
    model: sonnet
    maxBudgetUsd: 3
    timeout: 1200000
    prompt: |
      You are the premise-verification node: a blind re-derivation check. The
      planner answered the spec's premise questions; your value is an answer
      derived from CODE with no exposure to the planner's reasoning, so the two
      can be compared. Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read ONLY premises-questions.json there, plus params.json for the
      "worktree" field — the repository checkout to read (you are NOT cwd'd
      there). When params.json also has "worktrees_by_repo" (a joint run), a
      question may concern any of those checkouts; read the one it names.
      You are FORBIDDEN from opening premises.json or plan.md until
      step 2 below.

      If premises-questions.json is an empty array, write an empty array []
      to premise-verify.json in that directory and end with the single line:
      PREMISE_VERIFY_DONE

      Step 1: answer each question independently by reading the worktree code.
      Every answer cites file:line evidence from files you actually opened.
      Write premise-verify.json to that directory FIRST, before step 2:
        [{"id": <n>, "answer": "<your independent answer>",
          "evidence": ["<repo-relative file>:<lines>", ...]}]

      Step 2: only after that file is written, read premises.json in that
      directory and compare per id. Rewrite premise-verify.json adding to each
      entry:
        "verdict": "agree" | "conflict" | "cannot_determine"
        "note": "<one line on why>"
      "conflict" means the code contradicts the planner's answer.
      "cannot_determine" means the code alone cannot settle the question.
      End with the single line: PREMISE_VERIFY_DONE

  - id: premise-gate
    depends_on: [premise-verify]
    timeout: 120000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-premise-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-premise-gate.out" >&2); fi
      Q="$ARTIFACTS_DIR/premises-questions.json"
      V="$ARTIFACTS_DIR/premise-verify.json"
      NQ=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$Q")
      if [ "$NQ" = 0 ]; then echo "PREMISE_GATE=PASS (no premises declared)"; exit 0; fi
      test -s "$V" || { echo "PREMISE_GATE=FAIL no premise-verify.json"; exit 1; }
      python3 - "$Q" "$V" <<'PY'
      import json, sys
      qs = {q["id"] for q in json.load(open(sys.argv[1]))}
      byid = {v.get("id"): v for v in json.load(open(sys.argv[2]))}
      missing = qs - set(byid)
      assert not missing, f"ids not covered: {sorted(missing)}"
      allowed = {"agree", "conflict", "cannot_determine"}
      bad = sorted(i for i in qs if byid[i].get("verdict") not in allowed)
      assert not bad, f"verdict missing or out of enum for ids: {bad}"
      conflicts = sorted(i for i in qs if byid[i].get("verdict") == "conflict")
      if conflicts:
          for i in conflicts:
              print(f"PREMISE_CONFLICT id={i}")
          sys.exit(1)
      PY
      echo "PREMISE_GATE=PASS"

  - id: docreview
    depends_on: [plan-post-snapshot]
    model: sonnet
    maxBudgetUsd: 12
    timeout: 1800000
    skills: [ce-doc-review]
    prompt: |
      Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"
      Then invoke the ce-doc-review skill with arguments exactly:
        mode:headless <that directory>/plan.md
      This is an unattended pipeline invocation; ask no questions.
      Relay the skill's full output verbatim as your own output.

  - id: docreview-gate
    depends_on: [docreview]
    timeout: 120000
    bash: |
      set -uo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-docreview-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-docreview-gate.out" >&2); fi
      OUT=$docreview.output
      printf '%s\n' "$OUT" > "$ARTIFACTS_DIR/docreview-envelope.txt"
      printf '%s' "$OUT" | grep -q 'Review complete' || { echo "DOCREVIEW_GATE=FAIL no terminal signal"; exit 1; }
      printf '%s' "$OUT" | grep -q 'Review failed: headless mode requires a document path' && { echo "DOCREVIEW_GATE=FAIL refusal"; exit 1; }
