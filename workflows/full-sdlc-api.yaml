            DESLOP_REVIEW_DONE

        - id: deslop-review-gate
          depends_on: [deslop-review]
          timeout: 300000
          bash: |
            set -euo pipefail
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            N=$(cat "$ARTIFACTS_DIR/deslop-round.txt" 2>/dev/null || echo "")
