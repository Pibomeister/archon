            the unit has the wrong shape, and the human at the plan gate has to see
            that objection against the un-mutated plan rather than against your
            attempt to patch around it.

            If the verdict is ACCEPT, make no changes. Write
            plan-round-N/revision.json containing exactly
              {"applied": [], "declined": []}
            and end.

            For repository-list REVISE rounds, keep joint-plan.json synchronized
            with all plan edits, including files, exports, dependency contracts,
            and integration argv. Before finishing, run
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/validate-joint-plan.py
            "$ARTIFACTS_DIR" and repair every diagnostic. Execution uses literal
            artifact paths, optional export.argv, and integration {repo, argv};
            prose commands do not add hooks. Trace error normalization in clients
            before claiming distinct consumer handling.
            If feature-chain-request.json names operator_guidance, a revision
            must keep honoring operator-guidance.md (below the spec for scope, above your judgment
            for approach); a finding that asks you to undo it without citing the
            spec is declined, citing a verbatim quote from operator-guidance.md.

