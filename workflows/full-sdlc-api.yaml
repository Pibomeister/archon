      cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-docreview.md"
      echo "DOCREVIEW_GATE=PASS"

  - id: plan-render
    depends_on: [docreview-gate, premise-gate]
    model: sonnet
    maxBudgetUsd: 5
    timeout: 900000
    prompt: |
      You are the plan-presentation node. The human plan review is the single
      highest-leverage moment in this pipeline: one wrong plan line becomes a
      thousand wrong code lines, and the review is only real if the reviewer can
      actually absorb the plan in two minutes. Your job is to make that possible.
      Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read plan.md, docreview.diff, docreview-envelope.txt, plan-round.txt with
      the plan-round-N/ directories it implies, and (when present and non-empty)
      premise-verify.json there.
      Write a single self-contained plan-review.html to that directory.
      Do NOT modify plan.md or any other file. No external resources in the HTML.

      The page has exactly these sections, in order, each wrapped in an HTML
      comment marker so a gate can verify them:
      <!-- GIST --> The gist, bro register: explain the plan like you would to a
      smart friend over a beer. Simpler, not necessarily shorter; the bar is
      impossible to misunderstand, five sentences maximum. What gets built, what
      it touches, what the riskiest assumption is. Casual connective language is
      fine ("basically", "the point is"), memes are not. Every path, command,
      and number stays exactly as written in the plan. Flat prose, no nesting.
      <!-- KB --> What the knowledge base said: the prior decisions that
      constrain this plan and whether the plan honors them, the domain terms it
      leans on, and any recorded footguns nearby, drawn from kb-context.md in
      the same directory. If the scout found nothing, one sentence saying so.
      <!-- MAP --> A visual map, show-me style: pick the smallest views that make
      the plan's shape obvious and place each beside one short supporting sentence.
      Use a shallow file tree of the files to be touched (with one-line
      responsibility comments), a diff-shaped sketch of the key code change (the
      target shape, not full code), and the implementation units as ordered pills.
      Simple inline CSS, one accent color, readable in BOTH light and dark (custom
      properties on :root, overridden under @media (prefers-color-scheme: dark)).
      Identity by label, never color alone. Real names and paths only.
      <!-- PLAN --> The full plan, restyled for reading: keep every path,
      command, number, and decision VERBATIM, but present the prose cleanly.
      If feature-chain-request.json names operator_guidance, OPEN this
      section with an element carrying data-operator-guidance="<sha256>" (the
      lowercase SHA-256 of that file's bytes, as operator_guidance.sha256 in
      feature-chain-request.json records it)
      that quotes the file verbatim under the heading "Operator guidance for
      this replan", so the human approves the plan knowing what steered it.
      <!-- REVIEW --> What doc-review changed or flagged, in plain words: applied
      edits summarized from docreview.diff; unapplied findings from the envelope
      with their severity, one line each. If nothing, say so.
      When premise-verify.json exists and is non-empty, add a short "Premise
      check" block here: one line per premise (its id, the question's gist, the
      verdict agree/conflict/cannot_determine, and the verifier's note), so the
      human sees where the blind re-derivation agreed with the planner and
      where it could not settle the question. Skip the block entirely when
      there are no premises.
      <!-- CRITIC --> What the plan critic found, before doc-review ever saw the
      plan. Read plan-round.txt for the number of rounds the critic loop ran,
      then for each round R from 1 to that number read plan-round-R/critique.json,
      plan-round-R/revision.json and plan-round-R/impact.json. Open with one
      table, a row per round: the round number, the critic's verdict, and the
      count of findings still open at P0 or P1 broken out by kind (scope,
      regression, gap, verifiability). Then quote the FINAL round's declined
      findings in full: for each one, the critic's evidence quote and the
      reviser's justification quote, both verbatim, so the human is judging the
      actual disagreement rather than a summary of it. If nothing was declined,
      one sentence saying so. Close with an impact table built from the final
      round's impact.json: each symbol, its d1 callers, and where the plan covers
      each caller (a ## Files entry, a test scenario, or an explicit "unaffected
      because" line). If that file's "status" is UNAVAILABLE or SKIPPED, say that
      in one sentence and skip the table, because a reader must never mistake an
      unprobed plan for a plan with no callers. If plan-round.txt does not exist,
      one sentence saying the critic loop did not run.
      If plan-cap-unverified.json exists, the loop hit its round cap and was
      routed here with its last round's blocking findings applied but never
      re-critiqued. OPEN the CRITIC section, before the table, with an element
      carrying the attribute data-cap-unverified that says so in one sentence
      and lists every entry of its "unverified_applied" (severity, kind, section,
      what_changed verbatim): the human is the only reviewer of those edits.
      <!-- DECIDE --> The decision box: approving starts unattended
      implementation, and rejecting ends the run.
      Then, in the same box, the standard decision block that every gate
      packet carries. Resolve this run's id by running: basename "$ARTIFACTS_DIR"
      and use that literal id in every command below. Never print the
      placeholder <run-id>. Lead with one sentence saying the run is paused
      because it finished this stage and is now waiting on a person, which is
      how the stage is supposed to end and not a failure. Then the three
      commands, each in its own code chip with a short label saying when to
      pick it:
        DISABLE_OMC=1 archon workflow approve <id> </dev/null >/tmp/archon-approve.log 2>&1 &
        DISABLE_OMC=1 archon workflow reject <id> "why you are stopping it"
        DISABLE_OMC=1 archon workflow abandon <id>
      Say that approve runs the rest of the workflow inside the terminal it is
      typed in and holds that terminal until the run ends, which is why it is
      backgrounded, and that a failed resume still leaves the approval
      recorded so archon workflow resume <id> picks it up. Say that reject
      records the reason typed after it and sends the plan back for one
      revision pass: the run reworks it against that reason and pauses here
      again, so reject holds the terminal exactly the way approve does and
      wants the same backgrounding. Say the third rejection cancels the run
      instead of reworking, and that abandon ends the run outright with no
      rework. Files already written stay on disk either way. Close with one
      line: these three verbs do not appear in archon --help, but they are
      real.

      Writing rules for every section: plain sentences with varied length; no
      em dashes; no vocabulary like "crucial", "leverage", "robust", "seamless",
      "comprehensive"; no emoji; no bullet fragments crammed with figures; every
      number gets a consequence or comparison in the same sentence.
      End your reply with the single line: PLAN_RENDER_DONE

  - id: plan-render-gate
    depends_on: [plan-render]
    timeout: 120000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-plan-render-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-plan-render-gate.out" >&2); fi
      H="$ARTIFACTS_DIR/plan-review.html"
      test -s "$H" || { echo "RENDER_GATE=FAIL no plan-review.html"; exit 1; }
      for m in GIST KB MAP PLAN REVIEW CRITIC DECIDE; do
        grep -q "<!-- $m -->" "$H" || { echo "RENDER_GATE=FAIL missing section $m"; exit 1; }
      done
      RID="$(basename "$ARTIFACTS_DIR")"
      grep -qF "$RID" "$H" || { echo "RENDER_GATE=FAIL DECIDE box does not carry this run's id verbatim"; exit 1; }
      for v in approve reject abandon; do
        grep -qF "archon workflow $v" "$H" || { echo "RENDER_GATE=FAIL DECIDE box missing the $v command"; exit 1; }
      done
      cmp -s "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-docreview.md" || { echo "RENDER_GATE=FAIL renderer modified plan.md"; exit 1; }
      # Operator guidance is bound to the hash the controller recorded in the
      # planning request, never to the file merely existing: a planning session
      # can write, edit or delete a file in its own artifacts directory.
      GREQ=$(python3 -c "import json,os,sys; p=sys.argv[1]; print(((json.load(open(p)).get('operator_guidance') or {}).get('sha256') or '') if os.path.exists(p) else '')" "$ARTIFACTS_DIR/feature-chain-request.json")
      G="$ARTIFACTS_DIR/operator-guidance.md"
      if [ -z "$GREQ" ]; then
        test ! -e "$G" || { echo "RENDER_GATE=FAIL operator-guidance.md present but feature-chain-request.json records no operator_guidance"; exit 1; }
      else
        test -f "$G" || { echo "RENDER_GATE=FAIL operator guidance $GREQ recorded but operator-guidance.md is missing"; exit 1; }
        GSHA=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$G")
        test "$GSHA" = "$GREQ" || { echo "RENDER_GATE=FAIL operator-guidance.md sha256 $GSHA does not match the recorded $GREQ"; exit 1; }
        grep -qF "data-operator-guidance=\"$GREQ\"" "$H" || { echo "RENDER_GATE=FAIL operator guidance $GREQ is not shown in the PLAN section"; exit 1; }
      fi
      if [ -f "$ARTIFACTS_DIR/plan-cap-unverified.json" ]; then
        grep -q 'data-cap-unverified' "$H" || { echo "RENDER_GATE=FAIL plan-cap-unverified.json present but the CRITIC section does not flag the un-recritiqued revision"; exit 1; }
      fi
      # show-me: put the packet in front of the human exactly when the gate pauses.
      # xdg-open first: on some Linux distros /usr/bin/open is util-linux's link to
      # openvt(1) — a different program, not a missing one. The file:// path is
      # printed unconditionally; "opened in browser" is claimed only when true.
      OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
      OPENED=no
      if [ -n "$OPENER" ] && "$OPENER" "$H" >/dev/null 2>&1; then OPENED=yes; fi
      if [ "$OPENED" = yes ]; then
        echo "RENDER_GATE=PASS packet=file://$H (opened in browser)"
      else
        echo "RENDER_GATE=PASS packet=file://$H (no browser opener — open that path yourself)"
      fi

  - id: plan-gate
    depends_on: [plan-render-gate]
    approval:
      message: "Plan review packet ready: open <this run's ARTIFACTS_DIR>/plan-review.html in a browser (raw plan.md + docreview.diff alongside). The run is paused, which is how this stage is meant to end, not a failure; nothing degrades while it waits. The packet's DECIDE box has the three commands with this run's id filled in: approve continues (background it, it holds the terminal), reject records your reason and sends the work back for one revision pass, then pauses here again (it holds the terminal the way approve does, so background it too; the third rejection cancels the run instead of reworking), abandon ends the run outright. None of the three appear in archon --help; they are real."
      on_reject:
        max_attempts: 3
        prompt: |
          The human rejected this plan at the gate. Their reason, verbatim:

          $REJECTION_REASON

          Revise the plan so it answers that. You are the ONLY node that runs
          before the gate pauses again. No upstream node re-runs, so anything
          you do not update yourself stays stale, and no gate re-checks your
          output.

          Work in $ARTIFACTS_DIR.
          1. Read plan.md, files-allowlist.json, web-files-allowlist.json,
             reader-audit.json, premises.json, docreview-envelope.txt, and
             plan-review.html.
          2. Rewrite plan.md to address the rejection and nothing else. Change
             only what the feedback requires. If the feedback asks a question
             rather than giving an instruction, answer it inside the plan.
          3. Keep the contracts consistent with the revised plan: every path
             the plan now touches must appear in files-allowlist.json for API
             paths or web-files-allowlist.json for web-app paths,
             reader-audit.json must list any column whose interpretation or
             presentation semantics the revision changes, and any premise
             answer you alter keeps at least one citation whose quote appears
             VERBATIM in the file it names. Verify each quote by reading the
             file; an uncited answer is the exact failure this contract exists
             to prevent.
          4. Re-render plan-review.html yourself: same sections, same order,
             each still wrapped in its HTML comment marker
             (<!-- GIST --> <!-- KB --> <!-- MAP --> <!-- PLAN --> <!-- REVIEW -->
             <!-- CRITIC --> <!-- DECIDE -->). Carry the DECIDE box over unchanged, including
             this run's id and all three commands. The render gate does not
             run again, so a marker you drop is a marker nobody restores.
          5. Open REVIEW with a "Revision" block: the rejection reason
             verbatim, what you changed in response, and one plain line saying
             the blind premise-verify node does not re-run on a revision, so
             any premise answer you touched carries your citation but not an
             independent re-derivation.
          6. Append one line to the CRITIC section, keeping the rest of it
             unchanged: "Revision N — human-directed; not re-critiqued", where N
             is one more than the number of lines already starting with
             "Revision" in that section. The plan critic does not re-run on a
             human rejection: a human-requested revision is a trusted exception,
             the same way premise answers are not re-derived blind after a
             revision. Do not restate the critic's earlier findings as though
             they were re-checked against your new text, because they were not.

          Do not touch the worktree or any repository file. Plans only.
          End your reply with the single line: PLAN_REVISED

  - id: implementation-ready
    depends_on: [bootstrap]
    when: "$feature-phase.phase == 'implement'"
    timeout: 120000
    bash: |
