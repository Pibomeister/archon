      "rule" is the COMPLETE bullet text from the spec, copied verbatim, not a
      paraphrase and not the part of it you judge relevant. A guard compares
      every pinned bullet against these entries and fails the plan when a bullet
      has no entry whose rule equals it, whitespace aside. Summarising is what
      broke the v1 run: a spec bullet reading "No other change to
      POST /group/share" was recorded as its managed-group sentence alone, the
      rest of the constraint stopped existing, and four review rounds were spent
      on code the pin had already forbidden.
      "allowed_change" is "none" unless the spec states an exception in that same
      bullet, in which case it is that exception in the spec's words. It is not
      your judgement about what would be reasonable to change: a pin is
      renegotiated at this gate and nowhere else, and "none" is the default
      precisely because an unstated exception is not an exception.
      Downstream review treats a pin as settled: a finding that can
      only be resolved by changing a pinned symbol is filed as advisory, so this
