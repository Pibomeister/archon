      {"symbol": "<exact symbol name>", "file": "<repo-relative path>",
       "rule": "<the constraint, in the spec's own words, one line>",
       "spec_line": <the 1-based line number of that bullet in the spec>,
       "allowed_change": "<none, or the exception the spec itself states>"},
      one entry
      per pinned symbol in the order the spec lists them, and [] when the spec
