            The feature spec is the "spec" field of that same params.json.

            FIRST, before reading anything else, read the "verdict" field of
            plan-round-N/critique.json.

            If the verdict is REJECT, you are a NO-OP. Write
            plan-round-N/revision.json containing exactly
              {"applied": [], "declined": [], "skipped": "REJECT"}
