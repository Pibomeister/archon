               "summary": "<two or three sentences>",
               "findings": [
                 {"kind": "scope|regression|gap|verifiability",
                  "severity": "P0|P1|P2",
                  "confidence": 50|75|100,
                  "section": "<the plan heading or file the finding is about>",
                  "evidence": [{"source": "spec|plan|impact|repo",
                                "quote": "<verbatim quote>"}],
