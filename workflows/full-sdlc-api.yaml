            - deslop-result.json in the artifacts directory — the writer's own log of
              what it changed. Its "verification" block is HISTORICAL and may be stale
              (a human may have hand-fixed and resumed); recheck.json overrides it.
            - deslop-round-N/fix-result.json, present only on a round after an automatic
              fix: the fixer's "fixed"/"not_fixed" entries for the previous round's
              blocking findings. deslop-result.json is frozen after the writer, so this
              file is the only declaration of the fixer's edits.
            - the change itself, in the worktree:
                git diff "$(cat <that directory>/bootstrap-head.txt)"
                git status --porcelain
              and read the untracked files directly — the implementation is NOT
              committed yet, so the working tree is the subject.
            - files-allowlist.json in the artifacts directory: the in-scope paths.

            Judge the change against exactly these five guards:
            1. complexity — a new function above cyclomatic complexity 10, or a
               changed function whose complexity this change raised above 10. A
               pre-existing function already above 10 that this change did not
               worsen is NOT a finding.
            2. tautological_tests — a test asserting a value against itself, whose
               only matchers are toBeDefined / toBeTruthy / not.toThrow, that asserts
               on a mock's return value, or that has no assertion.
            3. yagni — parameters, options, branches, exports, types or config added
               by this change with no caller in the diff or in the repo.
               APPROVED CONTRACTS: when contract-symbols.json exists in the artifacts
               directory, a symbol it lists for that file is declared by the approved
               plan's contract and is referenced by the plan: it is NOT a yagni
               finding, even with no caller yet. The gate downgrades such a finding
               to 50 (DESLOP_CONTRACT_DOWNGRADE).
            4. open_closed — the change special-cases an existing dispatch (switch,
               if-chain, registry) where an extension point already exists; or it
               introduces an extension point for a single consumer. This guard is
               NOT mechanically checkable — it is yours to own.
            5. comments — added comments that restate the code, narrate the change,
               or preserve task history; banners; JSDoc repeating the signature;
               added TODOs. A comment explaining *why*, or recording an invariant or
               a constraint, is correct and is NOT a finding.

            Two rules override all five: never call for simplifying away a safety
            check, and LOC removed is not the metric.

            Confidence is a contract, not a mood. 100 = you read the code and the
            defect is present as described. 75 = present, with one assumption you
            could not check. 50 = suspicion worth recording that you could not
            confirm. 75 and 100 are blocking: the first blocking round gets one
            automatic fixer pass, the second stops the pipeline for a human;
            50 never blocks. There
            is no other allowed value.

            Write deslop-review.json to the artifacts directory with EXACTLY this
            schema — every key required, no extra top-level keys:
              {"verdict": "CLEAN|DIRTY",
               "coverage": {
                 "complexity":         {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "tautological_tests": {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "yagni":              {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "open_closed":        {"status": "assessed|not_applicable", "evidence": "<non-empty>"},
                 "comments":           {"status": "assessed|not_applicable", "evidence": "<non-empty>"}
               },
               "findings": [
                 {"guard": "complexity|tautological_tests|yagni|open_closed|comments",
                  "file": "<repo-relative>", "line": <int>,
                  "confidence": 50|75|100, "evidence": "<non-empty>"}
               ]}
            "evidence" under coverage says what you looked at for that guard and why
            you concluded what you concluded; "not_applicable" needs evidence too
            (for example: no test files in the change). "findings" is [] when clean.
            Declare "verdict": "DIRTY" if and only if you filed at least one finding
            at confidence 75 or 100 — the next node re-derives the verdict from the
            findings and FAILS the run if your declaration disagrees with them.

            Writing deslop-review.json is MANDATORY and comes BEFORE your final line —
            ending without it aborts the pipeline. Then end with the single line:
            DESLOP_REVIEW_DONE

        - id: deslop-review-gate
          depends_on: [deslop-review]
          timeout: 300000
          bash: |
            set -euo pipefail
            if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-deslop-review-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-deslop-review-gate.out" >&2); fi
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            N=$(cat "$ARTIFACTS_DIR/deslop-round.txt" 2>/dev/null || echo "")
            test -n "$N" || { echo "DESLOP_REVIEW=FAIL no deslop-round.txt (deslop-recheck did not run)"; exit 1; }
            case "$N" in *[!0-9]*) echo "DESLOP_REVIEW=FAIL deslop-round.txt is not an integer: [$N]"; exit 1 ;; esac
            RD="$ARTIFACTS_DIR/deslop-round-$N"
            test -s "$RD/checkpoint-tree.txt" || { echo "DESLOP_REVIEW=FAIL no checkpoint for round=$N"; exit 1; }
            R="$ARTIFACTS_DIR/deslop-review.json"
            test -s "$R" || { echo "DESLOP_REVIEW=FAIL no deslop-review.json round=$N"; exit 1; }
            # The reviewer session may leave .omc in the worktree exactly as the
            # writer does. That is runtime-state leakage, not an edit — clearing it
            # here keeps it from reading as tampering below.
            rm -rf .omc
            # Tamper check comes FIRST: a reviewer that edited the code is not a
            # reviewer, and nothing it wrote can be trusted. Recompute the same three
            # facts the checkpoint recorded and compare byte-for-byte.
            CK=$(cat "$RD/checkpoint-tree.txt")
            rm -f "$RD/index-verify"
            GIT_INDEX_FILE="$RD/index-verify" git add -A || { echo "DESLOP_REVIEW=FAIL recompute add round=$N"; exit 1; }
            NOWCK=$(GIT_INDEX_FILE="$RD/index-verify" git write-tree) \
              || { echo "DESLOP_REVIEW=FAIL recompute write-tree round=$N"; exit 1; }
            NOWHEAD=$(git rev-parse HEAD) || { echo "DESLOP_REVIEW=FAIL recompute rev-parse round=$N"; exit 1; }
            NOWINDEX=$(git write-tree) || { echo "DESLOP_REVIEW=FAIL recompute live-index tree round=$N"; exit 1; }
            {
              echo "head=$NOWHEAD"
              echo "index=$NOWINDEX"
              echo "checkpoint=$NOWCK"
            } > "$RD/deslop-tree-now.txt"
            if ! cmp -s "$ARTIFACTS_DIR/deslop-tree.txt" "$RD/deslop-tree-now.txt"; then
              echo "DESLOP_REVIEW=FAIL reviewer modified tree round=$N"
              diff "$ARTIFACTS_DIR/deslop-tree.txt" "$RD/deslop-tree-now.txt" || true
              echo "--- what the reviewer changed (checkpoint tree -> now) ---"
              git diff --stat "$CK" "$NOWCK" || true
              git diff "$CK" "$NOWCK" || true
              # Literal tree-vs-worktree diff as well. It reports every file that was
              # UNTRACKED at checkpoint time as a deletion (git diff <tree> only walks
              # tracked paths), so the tree-to-tree diff above is the accurate one.
              git diff "$CK" || true
              # The saved HEAD is the one the checkpoint recorded, not the current one:
              # if the reviewer committed, $NOWHEAD is already the wrong target.
              SAVEDHEAD=$(sed -n 's/^head=//p' "$ARTIFACTS_DIR/deslop-tree.txt")
              echo "RESTORE the pre-review state — run these three, in this order:"
              echo "  git -C $WT reset --soft $SAVEDHEAD"
              echo "  git -C $WT read-tree $CK && git -C $WT checkout-index -af"
              echo "  git -C $WT clean -fd"
              echo "  (1) undoes any commit the reviewer made; (2) restores every"
              echo "  checkpointed file's bytes, untracked ones included; (3) removes files"
              echo "  the reviewer ADDED. clean -fd leaves ignored paths (node_modules) alone."
              echo "  The index is left holding the checkpoint tree; deslop-recheck re-takes"
              echo "  the whole checkpoint on resume, so that is the new baseline, not drift."
              echo "Content-only alternative — restores bytes but does NOT undo a commit or"
              echo "remove reviewer-added files:"
              echo "  tar -xf $RD/checkpoint.tar -C $WT"
              echo "  git -C $WT archive $CK | tar -x -C $WT"
              echo "Then: archon workflow resume."
              exit 1
            fi
            # Fail-closed validation + gate-DERIVED verdict. The reviewer's declared
            # verdict is never trusted on its own: blocking = findings at confidence
            # >= 75, and a declaration that disagrees with the findings is a failure,
            # not a tie-break.
            set +e
            python3 - "$R" "$N" "$RD/slop.txt" "$RD/blocking-findings.json" "$ARTIFACTS_DIR/contract-symbols.json" "$ARTIFACTS_DIR/params.json" <<'PY'
            import hashlib, json, re, sys

            GUARDS = ["complexity", "tautological_tests", "yagni", "open_closed", "comments"]
            STATUSES = ("assessed", "not_applicable")
            path, rnd = sys.argv[1], sys.argv[2]
            blocking_path = sys.argv[4]

            # check-slop.py, not the reviewer, decides complexity. It already
            # separates a function this change made or worsened past the
            # threshold (SLOP=FAIL) from one that was already over it and was not
            # worsened (SLOP=REPORT, non-blocking by design). A reviewer reading
            # the same file sees only the absolute number, so it files the
            # pre-existing case at blocking confidence and stops the run for work
            # the guard itself declined to demand. Such a finding is kept and
            # reported, at confidence 50.
            def _slop_index(kind):
                """{repo-relative file: fn} for each `SLOP=<kind> complexity` line."""
                out = {}
                try:
                    text = open(sys.argv[3], encoding="utf-8").read()
                except (IndexError, OSError):
                    return out
                for line in text.splitlines():
                    if not line.startswith("SLOP=%s complexity" % kind):
                        continue
                    fields = dict(p.split("=", 1) for p in line.split() if "=" in p)
                    if "file" in fields:
                        out.setdefault(fields["file"], fields.get("fn", "?"))
                return out

            SLOP_BLOCKING = _slop_index("FAIL")
            SLOP_REPORTED = _slop_index("REPORT")
            downgraded = 0

            # The approved plan's contract symbols (contract-symbols.json, derived at
            # dispatch from the approval-bound joint plan) are referenced by the plan
            # even before any caller exists: chain 42b42a13 capped on a reserved
            # optional DTO field the fixer rightly refused to delete. A yagni finding
            # on such a symbol is kept and downgraded to 50.
            def _contracts():
                # The controller binds the file's sha256 in params.json; a fixer or
                # reviewer that widened the list must not buy a downgrade with it.
                try:
                    expected = json.load(open(sys.argv[6], encoding="utf-8")).get("feature_contract_symbols_sha256")
                except (IndexError, OSError, ValueError, AttributeError):
                    expected = None
                if expected:
                    try:
                        actual = hashlib.sha256(open(sys.argv[5], "rb").read()).hexdigest()
                    except OSError:
                        actual = None
                    if actual != expected:
                        print(f"DESLOP_REVIEW=FAIL contract-symbols.json altered round={rnd}")
                        sys.exit(6)
                try:
                    doc = json.load(open(sys.argv[5], encoding="utf-8"))
                except (IndexError, OSError, ValueError):
                    return {}
                out = {}
                for c in (doc.get("contracts") if isinstance(doc, dict) else None) or []:
                    if isinstance(c, dict) and isinstance(c.get("artifact"), str):
                        out.setdefault(c["artifact"], set()).update(
                            s for s in c.get("symbols") or [] if isinstance(s, str))
                return out

            CONTRACTS = _contracts()
            EXPORT_DECL = re.compile(r"^\s*export\s+(?:default\s+)?(?:abstract\s+|declare\s+|async\s+)*"
                                     r"(?:class|interface|type|const|let|function|enum)\s+([A-Za-z_$][\w$]*)")
            MEMBER_DECL = re.compile(r"^\s*(?:(?:public|private|protected|readonly|static|declare)\s+)*"
                                     r"([A-Za-z_$][\w$]*)\s*[?!]?\s*[:(=]")

            def _declared(text, symbols):
                m = EXPORT_DECL.match(text) or MEMBER_DECL.match(text)
                return m.group(1) if m and m.group(1) in symbols else None

            def contract_symbol(file, line):
                """The listed symbol a finding's line declares. A closing-brace line
                resolves to the declaration that brace closes; a decorator line to the
                declaration it decorates. Any other line (a statement in a body, a
                later export) resolves to nothing, so it still blocks."""
                symbols = CONTRACTS.get(file)
                try:
                    lines = open(file, encoding="utf-8", errors="replace").read().splitlines() if symbols else []
                except OSError:
                    return None
                if not 1 <= line <= len(lines):
                    return None
                text = lines[line - 1].strip()
                if text in ("}", "};"):
                    depth = 0
                    for i in range(line - 1, -1, -1):
                        depth += lines[i].count("}") - lines[i].count("{")
                        if depth <= 0:
                            return _declared(lines[i], symbols)
                    return None
                if text.startswith("@"):
                    depth = 0
                    for i in range(line - 1, len(lines)):
                        if depth == 0 and i > line - 1 and not lines[i].strip().startswith("@"):
                            return _declared(lines[i], symbols)
                        depth += lines[i].count("(") - lines[i].count(")")
                    return None
                return _declared(lines[line - 1], symbols)


            def malformed(msg):
                print(f"DESLOP_REVIEW=FAIL malformed finding round={rnd} {msg}")
                sys.exit(3)


            def incomplete(msg):
                print(f"DESLOP_REVIEW=FAIL coverage incomplete round={rnd} {msg}")
                sys.exit(4)


            try:
                doc = json.load(open(path, encoding="utf-8"))
            except Exception as exc:
                malformed(f"unparseable json: {exc}")
            if not isinstance(doc, dict):
                malformed("top level is not an object")
            extra = sorted(set(doc) - {"verdict", "coverage", "findings"})
            if extra:
                malformed(f"extra top-level keys={extra}")
            verdict = doc.get("verdict")
            if verdict not in ("CLEAN", "DIRTY"):
                malformed(f"verdict={verdict!r}")
            coverage = doc.get("coverage")
            if not isinstance(coverage, dict):
                incomplete("coverage is not an object")
            for guard in GUARDS:
                entry = coverage.get(guard)
                if not isinstance(entry, dict):
                    incomplete(f"missing={guard}")
                if entry.get("status") not in STATUSES:
                    incomplete(f"guard={guard} status={entry.get('status')!r}")
                ev = entry.get("evidence")
                if not isinstance(ev, str) or not ev.strip():
                    incomplete(f"guard={guard} empty evidence")
            findings = doc.get("findings")
            if not isinstance(findings, list):
                malformed("findings is not an array")
            blocking = 0
            blocking_findings = []
            for i, f in enumerate(findings):
                if not isinstance(f, dict):
                    malformed(f"index={i} finding is not an object")
                if f.get("guard") not in GUARDS:
                    malformed(f"index={i} guard={f.get('guard')!r}")
                for key in ("file", "evidence"):
                    val = f.get(key)
                    if not isinstance(val, str) or not val.strip():
                        malformed(f"index={i} {key}={val!r}")
                # This gate exits 0 on a DIRTY retry, and archon ends the loop on a
                # completion signal anywhere in that stdout (<tag>SIGNAL</tag>, or a line
                # holding only SIGNAL). The file path is printed below, so it must not be
                # able to carry either shape.
                if not f["file"].isprintable() or "<" in f["file"] or ">" in f["file"]:
                    malformed(f"index={i} file holds a line break, control character or angle bracket")
                line = f.get("line")
                if isinstance(line, bool) or not isinstance(line, int):
                    malformed(f"index={i} line={line!r}")
                conf = f.get("confidence")
                if isinstance(conf, bool) or conf not in (50, 75, 100):
                    malformed(f"index={i} confidence={conf!r}")
                if f["guard"] == "complexity" and conf >= 75 and f["file"] not in SLOP_BLOCKING:
                    fn = SLOP_REPORTED.get(f["file"], "?")
                    fn = fn if fn.isprintable() and "<" not in fn and ">" not in fn else "?"
                    print(f"DESLOP_COMPLEXITY_DOWNGRADED fn={fn} file={f['file']}:{line} confidence={conf}->50")
                    conf = 50
                    downgraded += 1
                symbol = contract_symbol(f["file"], line) if f["guard"] == "yagni" and conf >= 75 else None
                if symbol:
                    print(f"DESLOP_CONTRACT_DOWNGRADE symbol={symbol} file={f['file']}:{line} confidence={conf}->50")
                    conf = 50
                    downgraded += 1
                if conf >= 75:
                    blocking += 1
                    blocking_findings.append(dict(f, confidence=conf))
                    print(f"DESLOP_FINDING guard={f['guard']} file={f['file']}:{line} confidence={conf}")
            print(f"DESLOP_REVIEW_PARSE round={rnd} declared={verdict} findings={len(findings)} blocking={blocking} downgraded={downgraded}")
            if blocking > 0:
                # The fixer's input: exactly what this gate counted as blocking.
                with open(blocking_path, "w", encoding="utf-8") as fh:
                    json.dump({"round": int(rnd), "findings": blocking_findings}, fh, indent=2)
                print(f"DESLOP=DIRTY round={rnd} blocking={blocking}")
                sys.exit(2)
            if verdict == "DIRTY" and downgraded == 0:
                print(f"DESLOP_REVIEW=FAIL verdict inconsistent round={rnd} declared DIRTY with 0 blocking findings")
                sys.exit(5)
            print(f"DESLOP=CLEAN round={rnd}")
            print("<promise>DESLOP_CLEAN</promise>")
            sys.exit(0)
            PY
            RC=$?
            set -e
            case "$RC" in
              0) exit 0 ;;
              2)
                # Durable DIRTY counter: rounds also advance on a mechanical recheck
                # failure, which never reaches a verdict, so the cap counts verdicts.
                # deslop-dirty.txt is hand-editable, so it is untrusted input.
                # $((D+1)) on a non-integer aborts the arithmetic (and under set -e
                # the node), and `[ x -ge 2 ]` on junk returns 2 which `if` reads as
                # "not taken" — the cap would silently switch off. Coerce to 0 so a
                # corrupt counter costs one extra round, never the cap itself.
                D=$(cat "$ARTIFACTS_DIR/deslop-dirty.txt" 2>/dev/null || echo 0)
                case "$D" in ''|*[!0-9]*) D=0 ;; esac
                # The fixer runs between two verdicts and could rewind this file to buy a
                # pass past the cap, so it may not fall below the per-round record.
                REC=$(cat "$ARTIFACTS_DIR"/deslop-round-*/dirty-count.txt 2>/dev/null | sort -n | tail -1 || true)
                case "$REC" in ''|*[!0-9]*) REC=0 ;; esac
                if [ "$D" -lt "$REC" ]; then echo "DESLOP_REVIEW=FAIL deslop-dirty.txt rewound: file=$D recorded=$REC round=$N"; exit 1; fi
                D=$((D+1))
                echo "$D" > "$ARTIFACTS_DIR/deslop-dirty.txt"
                echo "$D" > "$RD/dirty-count.txt"
                if [ "$D" -ge 2 ]; then echo "DESLOP_ROUND_CAP round=$N dirty_rounds=$D"; exit 1; fi
                # Below the cap DIRTY is a retry, not a failure: archon fails the whole
                # loop_group on any failed body node, so exiting non-zero here would
                # end the loop before its next iteration. Exit 0 with no promise, and
                # leave the marker deslop-fix-pre reads to run the fixer next iteration.
                echo "$N" > "$ARTIFACTS_DIR/deslop-fix-pending.txt"
                echo "DESLOP_RETRY=PASS round=$N dirty_rounds=$D"
                exit 0
                ;;
              3|4|5|6) exit 1 ;;
              *) echo "DESLOP_REVIEW=FAIL validator error rc=$RC round=$N"; exit 1 ;;
            esac

  - id: reader-audit
    depends_on: [deslop-verify]
    model: sonnet
    maxBudgetUsd: 8
    timeout: 1200000
    prompt: |
      You are the reader-audit node: when a diff changes what a DB column's
      value MEANS, every reader of that column is a suspect, and the change is
      only safe when every reader has been looked at. Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read reader-audit.json there. If its "columns" array is empty and it has
      no "derive" key, write exactly {"columns": []} to reader-audit-result.json
      in that directory and end with the single line: READER_AUDIT_DONE

      The repository checkout is the "worktree" field of params.json in that
      same directory (you are NOT cwd'd there).

      STAGE-DERIVED AUDIT: when reader-audit.json carries "derive": "stage-diff",
      the approved joint plan
      declared no reader audit for this repository and the planning file
      belongs to another one. Declare the columns yourself from THIS
      repository's change: read `git -C <worktree> diff <bootstrap-head.txt sha>`
      (bootstrap-head.txt is in the artifacts directory) and list every DB
      column or enum value whose INTERPRETATION or PRESENTATION the diff changes
      here, not merely writes. Audit each one as below, and write the result with
      a top-level "derived": true — {"derived": true, "columns": []} when the
      diff changes none. Every derived column carries its "readers" array.

      For each declared column: enumerate EVERY reader of it in the repository
      — grep the repository layer, query builders, and raw SQL for the column
      name and its enum value tokens; follow the call sites; do not stop at
      the first hits. Classify each reader:
        "unaffected" — its behavior is unchanged by the new semantics
        "affected"   — it must change and this plan does not change it
        "residual"   — semantics shift but the behavior is acceptable; worth
                       recording in the PR body
      Write reader-audit-result.json to that directory:
        {"columns": [{"table": "<table>", "column": "<column>",
          "readers": [{"file": "<repo-relative>:<line>",
                       "class": "unaffected|affected|residual",
                       "why": "<one line>"}]}]}
      End with the single line: READER_AUDIT_DONE

  - id: reader-audit-gate
    depends_on: [reader-audit]
    timeout: 120000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-reader-audit-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-reader-audit-gate.out" >&2); fi
      D="$ARTIFACTS_DIR/reader-audit.json"
      R="$ARTIFACTS_DIR/reader-audit-result.json"
      # "derive": "stage-diff" (feature_chain.write_stage_reader_audit): this
      # repository-list stage has no approved audit of its own, so the node
      # declared columns from its diff. Zero declared columns is then no proof
      # of anything; the result file must exist and say it was derived.
      DERIVE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('derive',''))" "$D")
      NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$D")
      if [ "$NC" = 0 ] && [ "$DERIVE" != stage-diff ]; then echo "READER_AUDIT_GATE=PASS (no columns declared)"; exit 0; fi
      test -s "$R" || { echo "READER_AUDIT_FAIL no reader-audit-result.json"; exit 1; }
      python3 - "$D" "$R" <<'PY'
      import json, sys
      decl_doc = json.load(open(sys.argv[1]))
      result = json.load(open(sys.argv[2]))
      res = result["columns"]
      got = {(c["table"], c["column"]) for c in res}
      if decl_doc.get("derive") == "stage-diff":
          if result.get("derived") is not True:
              print("READER_AUDIT_FAIL stage-diff audit result is not marked derived")
              sys.exit(1)
          decl = got
      else:
          decl = {(c["table"], c["column"]) for c in decl_doc["columns"]}
      missing = decl - got
      assert not missing, f"declared columns not covered: {sorted(missing)}"
      affected = [(c["table"], c["column"], r.get("file", "?"))
                  for c in res for r in c.get("readers", [])
                  if r.get("class") == "affected"]
      if affected:
          for t, col, f in affected:
              print(f"READER_AUDIT_FAIL affected reader {t}.{col} at {f}")
          sys.exit(1)
      PY
      echo "READER_AUDIT_GATE=PASS"

  - id: commit-impl
    depends_on: [deslop-verify]
    timeout: 300000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-commit-impl.out") 2> >(tee -a "$ARTIFACTS_DIR/node-commit-impl.out" >&2); fi
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      cd "$WT"
      MSG=$(head -1 "$ARTIFACTS_DIR/commit-msg.txt" 2>/dev/null || true)
      test -n "$MSG" || MSG="feat(api): $SLUG"
      BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
      # No lockfile is noise here: every repo this lane serves (repo-profile.sh) installs
      # frozen, so lockfile-only drift is content, and check-scope.py calls it a breach.
      CONTENT_STATUS=$(git status --porcelain --untracked-files=all | grep -vE '^\?\? \.env$' || true)
      if [ -z "$CONTENT_STATUS" ] && git diff --quiet "$BASE" -- .; then
        printf '{"outcome":"NO_CHANGE","repo":"%s","basis":"baseline-to-candidate content","baseline":"%s","head":"%s","pr_url":null}\n' "$REPO" "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
        echo "COMMIT_IMPL=SKIP outcome=NO_CHANGE"
        exit 0
      fi
