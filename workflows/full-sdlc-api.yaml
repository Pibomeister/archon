      scenario's expected_tests count. The integration scenarios must run
      locally against the selected candidate revisions in disposable worktrees
      or fixtures; do not make PRs, deploy, publish, or rely on an upstream
      merge.
      A joint plan also records what the spec already decided. If the spec has a
      section titled "## Interface (pinned)", every symbol named there is frozen
      by the spec itself and is not the implementation's to redesign. Add to
