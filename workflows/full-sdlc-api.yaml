      observable assertion per criterion it covers.
      COUNTING RULE for expected_tests, which the runner enforces mechanically:
      each entry is one TEST CASE — one `it` or `test` block in the named file —
      never one assertion. Several assertions inside a single case are still one
      entry; group them. ARCHON_INTEGRATION_TESTS is a test-case count (jest's
      numPassedTests), and run-joint-integration.py fails the scenario when the
      summed count is below len(expected_tests). Four assertion-shaped entries
      backed by two `it` blocks therefore fail the integration while every test
      passes, which is how chain 6a3a3b06 failed. Write one entry per case you
      will actually add, so the count equals the number of cases the command
      reports.
      The controller computes dependency_order from the stage depends_on lists
      and freezes it into the approval snapshot using repository-name ordering
