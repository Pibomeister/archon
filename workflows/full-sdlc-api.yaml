        - id: plan-converge
          depends_on: [plan-revise]
          timeout: 300000
          bash: |
            set -euo pipefail
            N=$(cat "$ARTIFACTS_DIR/plan-round.txt" 2>/dev/null) || { echo "PLAN_CONVERGE=FAIL no plan-round.txt"; exit 1; }
            # Same coercion as plan-round-pre: a non-integer operand makes `[ -ge ]`
            # return 2, which `if` reads as "not taken", switching the cap off silently.
