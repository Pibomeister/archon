            "severity": "P0|P1|P2|P3". An omitted severity reads as P0, which
            keeps the loop running.
            An "applied" entry also carries "design_expanded": true when that
            repair added a method, an exported symbol, or a call into a pinned
            symbol, and the flag is omitted or false otherwise.
            "pin_conflict" entries are {"finding", "action", "symbol",
            "severity"} — see the pinned-decisions rule above. Write the key even
            when it is empty, exactly as you do for the others.
            "cross_repo" is for a finding whose defect lives in a DIFFERENT
            repository of this chain: entries are {"finding", "action",
            "producer_repo", "severity"}. Such a finding is neither advisory nor
            failed — it is not waivable and not fixable here, and it stops the
            run so the chain can route it to the repository that owns it.
              If cross-repo-filed.json exists in the artifacts directory, a human has
              filed some cross-repo findings; when you raise one of those same defects
              again, copy its "finding" and "producer_repo" VERBATIM from
              cross-repo-findings.json or the earlier round's fixer-result.json so its
              acknowledgement still matches. Never create or edit cross-repo-filed.json.
            Writing the JSON result file is MANDATORY and comes BEFORE your final line —
            ending without it aborts the pipeline. Write it even when all arrays are
            empty. Then end with the single line: FIXER_DONE

        - id: commit-fixer
          depends_on: [fixer]
          # `fixer` is `when:`-gated; a reused repair still has to be attested and,
          # if it was never committed, committed.
          trigger_rule: all_done
          timeout: 300000
          bash: |
            set -uo pipefail
            if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-commit-fixer.out") 2> >(tee -a "$ARTIFACTS_DIR/node-commit-fixer.out" >&2); fi
            # In order, each step idempotent so a kill anywhere is recovered by
            # re-running this node or by round-pre's pending-commit reconciliation:
            # validate the fixer's durable completion record, merge its result into
            # the ledger, run the pin guard ON THE STAGED INDEX (what will actually
            # be committed, not what happens to be in the worktree), then either
            # attest a no-change result without an empty commit or commit and
            # attest the new HEAD.
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            # Staging comes FIRST and stays in the node: check-scope.py is what
            # decides which paths may be staged at all, and the pin guard inside
            # the helper reads the staged index. A pin guard run before staging
            # would be reading the wrong tree.
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py "$ARTIFACTS_DIR/files-allowlist.json" "$PWD" HEAD --stage --quarantine "$ARTIFACTS_DIR" --exclude pnpm-lock.yaml || exit 1
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/round-state.py commit-fixer "$ARTIFACTS_DIR"

        - id: converge
          depends_on: [commit-fixer]
          # The group's LAST node, and the only one that may emit the completion
          # promise: probe 4 measured that a promise emitted from the FIRST node
          # of a loop_group is not honoured and the group ran to max_iterations.
          # That is also why the terminal replay of an already-converged round
          # lives here and nowhere else.
          trigger_rule: all_done
          timeout: 300000
          bash: |
            set -uo pipefail
            N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
            case "$N" in ''|*[!0-9]*) echo "CONVERGE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            # converge.txt stays a diagnostic tee and is never read back as state
            # -- decision.json is the state, and it is written last and bound to
            # HEAD, the review identity, the authorizing envelope generation and
            # the tree, so a decision that no longer describes the candidate is
            # ignored rather than replayed.
            exec > >(tee "$RD/converge.txt") 2>&1
            # Authorization (review.ok for this envelope generation) and the
            # fixer's attestation on a clean candidate come first; then the
            # closure table, first match wins; then decision.json and, on a
            # converged decision, the promise.
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/round-state.py converge "$ARTIFACTS_DIR"

  - id: exit-gate
    depends_on: [review-loop, reader-audit-gate]
    timeout: 600000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-exit-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-exit-gate.out" >&2); fi
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      cd "$WT"
      N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
      case "$N" in ''|*[!0-9]*) echo "EXIT_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
      # Cross-repo belt: converge's stop is bypassable by a resume, and the
      # accept-residuals branch below skips the fixer re-check entirely.
      # Only a human acknowledgement in cross-repo-filed.json resolves an entry.
      CROSS=$(python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/cross-repo-keys.py "$ARTIFACTS_DIR" --gate "$RD/fixer-result.json") \
        || { printf '%s\n' "$CROSS" | sed '$d'; echo "EXIT_GATE=FAIL CROSS_REPO_FINDING round=$N $(printf '%s\n' "$CROSS" | tail -n 1)"; exit 1; }
      [ -z "$CROSS" ] || printf '%s\n' "$CROSS"
      # AUTHORIZATION, and it comes before everything the operator can waive.
      # review-summary.json is written BEFORE review-gate's final checks and
      # stays readable with a Ready verdict, so reading the verdict alone lets a
      # resume that walked past converge's stop reach ship on a round no gate
      # ever passed. review.ok for the current identity and fixer.ok at HEAD are
      # the only things that say otherwise, and accept-residuals waives the
      # VERDICT, never this.
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/round-state.py exit-check "$ARTIFACTS_DIR" || exit 1
      # A human accepting residuals waives the verdict and fixer checks — never
      # the clean-tree, scope, or unit-test checks (accepted findings, not a broken tree).
      if [ -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then
        echo "EXIT_GATE accept-residuals present: verdict and fixer checks skipped ($(head -1 "$ARTIFACTS_DIR/accept-residuals.txt"))"
      else
        V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
        case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
      fi
      test -z "$(git status --porcelain | grep -v '^?? \.env')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
      # Scope guard belt (resume ordering can bypass converge's check).
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
        "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
        || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
      # Browser exemption belt: the fixer and a widened allowlist can both move
      # the diff onto a browser surface after gate-tests derived the exemption.
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/browser-exemption.py diff \
        "$ARTIFACTS_DIR" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
        || { echo "EXIT_GATE=FAIL browser exemption void"; exit 1; }
      # Reader-audit belt: declared columns must have a passing result on disk.
      NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$ARTIFACTS_DIR/reader-audit.json" 2>/dev/null || echo 0)
      DERIVE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('derive',''))" "$ARTIFACTS_DIR/reader-audit.json" 2>/dev/null || echo "")
      if [ "$NC" != 0 ] || [ "$DERIVE" = stage-diff ]; then
        test -s "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL missing reader-audit-result.json"; exit 1; }
        if [ "$DERIVE" = stage-diff ]; then
          python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('derived') is True else 1)" "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL stage-diff audit result is not marked derived"; exit 1; }
        fi
        python3 -c "import json,sys; cols=json.load(open(sys.argv[1]))['columns']; aff=[r for c in cols for r in c.get('readers',[]) if r.get('class')=='affected']; sys.exit('affected readers: %s' % aff) if aff else None" "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL affected reader"; exit 1; }
      fi
      # Materialize-then-`test -s`, same as gate-tests and deslop-recheck: a process
      # substitution hides the extractor's exit code, so a broken or empty
      # verify.json would run the loop zero times and this gate would print
      # EXIT_GATE=PASS having verified nothing.
      python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
        "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
        || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
      test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
      while IFS= read -r PAT; do
        test -n "$PAT" || continue
        "${CMD_TEST[@]}" "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix unit tests pattern=$PAT"; exit 1; }
      done < "$ARTIFACTS_DIR/exit-patterns.txt"
      echo "EXIT_GATE=PASS"

  - id: smoke
    depends_on: [exit-gate]
    timeout: 1200000
    bash: |
      set -uo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-smoke.out") 2> >(tee -a "$ARTIFACTS_DIR/node-smoke.out" >&2); fi
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      case "$REPO" in goodword-mcp) exec bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/mcp-smoke.sh "$WT" "$ARTIFACTS_DIR" "$APIPORT" ;; esac
      # Gated on the repo's DECLARED capability, never on an empty $APIPORT: a
      # port that failed to allocate for a smoke-bearing repo must stay a hard
      # failure at preflight, not become a silent skip here. prbody reads this
      # file verbatim, so the typed line is what reaches the PR.
      if [ -z "$HAS_SMOKE" ]; then
        echo "SMOKE=NOT_APPLICABLE ($REPO declares no boot smoke)" | tee "$ARTIFACTS_DIR/smoke-result.txt"
        exit 0
      fi
      cd "$WT"
      # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux). rc 1 only
      # when no backend exists at all.
      port_pids() { # $1 = port
        local out=""
        if command -v lsof >/dev/null 2>&1; then
          out="$(lsof -ti ":$1" 2>/dev/null || true)"
        elif command -v ss >/dev/null 2>&1; then
          out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
        elif command -v fuser >/dev/null 2>&1; then
          out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
        else
          return 1
        fi
        [ -n "$out" ] && printf '%s\n' "$out"
        return 0
      }
      PORT="$APIPORT" bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
      SRV=$!
      # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
      trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids "$APIPORT"); test -n "$P" && kill $P 2>/dev/null; true' EXIT
      # Boot liveness: /api-docs-json 200 also proves swagger builds with the new DTOs.
      CODE=000
      for i in $(seq 1 60); do
        sleep 3
        CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT/api-docs-json" || echo 000)
        test "$CODE" = "200" && break
      done
      test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
      CTRL=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT/info" || echo 000)
      test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
      RESULT="SMOKE=PASS api-docs-json=200 guarded-control=401"
      # Optional feature probe: only when the plan declared an unauthenticated GET.
      if [ -s "$ARTIFACTS_DIR/smoke-probe.json" ]; then
        PPATH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['path'])" "$ARTIFACTS_DIR/smoke-probe.json")
        PEXP=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('expect','200'))" "$ARTIFACTS_DIR/smoke-probe.json")
        PCODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT$PPATH" || echo 000)
        test "$PCODE" = "$PEXP" || { echo "SMOKE=FAIL probe $PPATH code=$PCODE expected=$PEXP"; exit 1; }
        RESULT="$RESULT probe:$PPATH=$PCODE"
      fi
      echo "$RESULT" | tee "$ARTIFACTS_DIR/smoke-result.txt"

  - id: local-candidate
    depends_on: [smoke]
    when: "$feature-phase.phase == 'implement'"
    timeout: 1200000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-local-candidate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-local-candidate.out" >&2); fi
      bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/trusted-local-candidate.sh "$ARTIFACTS_DIR"

  - id: prbody
    depends_on: [smoke]
    when: "$feature-phase.phase == 'legacy'"
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the PR-body composition node. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read plan.md there; then read round.txt for the final round number N and read
      round-<N>/review-summary.json and round-<N>/fixer-result.json there.
      Also read deslop-round.txt for the final deslop round number and, from
