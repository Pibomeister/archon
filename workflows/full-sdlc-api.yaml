            # plan-snapshot enforced: the revisions of earlier rounds must not have
            # left plan.md or its contract files broken.
            if [ "$V" = ACCEPT ]; then
              SHAPE=0
              OUT=$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/plan-shape.sh \
                "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
              if [ "$SHAPE" != 0 ]; then
                printf '%s\n' "$OUT"
                echo "PLAN_CONVERGE=FAIL shape round=$N"
                exit 1
              fi
              echo "PLAN_CONVERGED round=$N"
              echo "<promise>PLAN_CONVERGED</promise>"
              exit 0
