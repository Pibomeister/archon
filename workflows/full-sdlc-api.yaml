            # is told to copy unchanged; a count alone lets a duplicated row stand
            # in for a finding nobody answered.
            unmatched = list(applied)
            for finding in raised:
                key = (finding.get("kind"), finding.get("section"), finding.get("severity"))
                hit = next((row for row in unmatched if (row.get("kind"), row.get("section"), row.get("severity")) == key), None)
                if hit is None:
                    print("no"); sys.exit(0)
                unmatched.remove(hit)
            json.dump({"round": int(n), "cap": int(cap), "unverified_applied": applied}, open(out, "w", encoding="utf-8"), indent=2)
            print(len(applied))
            PY
              )
              if [ "$ROUTE" != no ]; then
                SHAPE=0
                OUT=$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/plan-shape.sh \
                  "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
                if [ "$SHAPE" != 0 ]; then printf '%s\n' "$OUT"; rm -f "$ARTIFACTS_DIR/plan-cap-unverified.json"; echo "PLAN_CONVERGE=FAIL shape round=$N (cap route)"; exit 1; fi
                echo "PLAN_CONVERGED round=$N (cap reached: $ROUTE applied blocking findings not re-critiqued; routed to the human gate, see plan-cap-unverified.json)"
                echo "<promise>PLAN_CONVERGED</promise>"
                exit 0
              fi
              echo "PLAN_ROUND_CAP round=$N cap=$CAP"; exit 1
            fi
            echo "PLAN_ROUND_PROGRESSED round=$N"

  - id: plan-post-snapshot
    depends_on: [plan-loop]
    timeout: 120000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-plan-post-snapshot.out") 2> >(tee -a "$ARTIFACTS_DIR/node-plan-post-snapshot.out" >&2); fi
      test -s "$ARTIFACTS_DIR/plan.md" || { echo "PLAN_POST_SNAPSHOT=FAIL no plan.md"; exit 1; }
      # The critic loop's output is the pre-image for doc-review, so docreview.diff
      # attributes only ce-doc-review's edits and not the critic rounds' revisions.
      cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-critic.md"
      echo "PLAN_POST_SNAPSHOT=OK rounds=$(cat "$ARTIFACTS_DIR/plan-round.txt" 2>/dev/null || echo 0)"

  - id: premise-strip
