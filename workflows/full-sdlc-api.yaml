            case "$N" in '') N=0 ;; *[!0-9]*) echo "DESLOP_RECHECK=FAIL deslop-round.txt is not an integer: [$N]"; exit 1 ;; esac
            N=$((N+1)); echo "$N" > "$C"
            RD="$ARTIFACTS_DIR/deslop-round-$N"; mkdir -p "$RD"
            # Every recheck writes recheck.json into the round it opens, so finding one
            # means deslop-round.txt was rewound (the fixer runs between two rounds).
            test ! -e "$RD/recheck.json" || { echo "DESLOP_RECHECK=FAIL deslop-round.txt rewound: round=$N was already checked"; exit 1; }
            # Pending automatic fix (deslop-review-gate recorded DIRTY last round):
            # the fixer must have recorded its result for THAT round before the
            # marker is consumed. Left in place on failure, so a resume re-runs the
            # fixer rather than rechecking a tree nobody fixed.
            PENDING="$ARTIFACTS_DIR/deslop-fix-pending.txt"
            if [ -f "$PENDING" ]; then
              PR=$(cat "$PENDING")
              case "$PR" in ''|*[!0-9]*) echo "DESLOP_FIX=FAIL deslop-fix-pending.txt is not an integer: [$PR]"; exit 1 ;; esac
              FR="$ARTIFACTS_DIR/deslop-fix-result.json"
              test -s "$FR" || { echo "DESLOP_GATE=FAIL no deslop-fix-result.json round=$N"; exit 1; }
              # An integer round, and every blocking finding answered exactly once: a
              # finding the fixer skipped must not reach the reviewer looking handled.
              FRC=0
              python3 - "$FR" "$PR" "$ARTIFACTS_DIR/deslop-round-$PR/blocking-findings.json" 2>/dev/null <<'PY' || FRC=$?
            import json, sys
            from collections import Counter
            doc = json.load(open(sys.argv[1], encoding="utf-8"))
            assert isinstance(doc, dict)
            assert type(doc.get("round")) is int and doc["round"] == int(sys.argv[2])
            assert isinstance(doc.get("fixed"), list) and isinstance(doc.get("not_fixed"), list)
            entries = doc["fixed"] + doc["not_fixed"]
            assert all(isinstance(e, dict) for e in entries)
            def key(x):
                return (x.get("guard"), x.get("file"), x.get("line"))
            want = Counter(key(f) for f in json.load(open(sys.argv[3], encoding="utf-8"))["findings"])
            sys.exit(0 if Counter(key(e) for e in entries) == want else 3)
            PY
              case "$FRC" in
                0) ;;
                3) echo "DESLOP_GATE=FAIL deslop-fix-result.json does not answer each blocking finding exactly once round=$N"; exit 1 ;;
                *) echo "DESLOP_GATE=FAIL deslop-fix-result.json unparseable round=$N"; exit 1 ;;
              esac
              # The reviewed checkpoint recorded HEAD. A fixer commit would take its
              # edits out of every working-tree diff below, so HEAD must not move.
              SAVEDHEAD=$(sed -n 's/^head=//p' "$ARTIFACTS_DIR/deslop-tree.txt" 2>/dev/null || true)
              test -n "$SAVEDHEAD" && test "$(git rev-parse HEAD)" = "$SAVEDHEAD" \
                || { echo "DESLOP_GATE=FAIL fixer moved HEAD round=$N expected=[$SAVEDHEAD]"; exit 1; }
              cp "$FR" "$RD/fix-result.json"
              rm -f "$PENDING"
              echo "DESLOP_FIX_CONSUMED round=$N fixed_round=$PR"
            fi
            BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
            # Every check runs even after one fails: recheck.json is the reviewer's
            # authoritative verification record and must carry all five exit codes.
            TC=0; "${CMD_TYPECHECK[@]}" > "$RD/typecheck.txt" 2>&1 || TC=$?
            LT=0
            if [ "${#CMD_LINT[@]}" -gt 0 ]; then
              "${CMD_LINT[@]}" > "$RD/lint.txt" 2>&1 || LT=$?
              LINT_APPLICABLE=true
            else
              # LT stays 0 so the doctrine-locked integer keeps its shape, but the
              # applicability travels in recheck.json itself -- the record the
              # reviewer and the PR body actually read. A marker file no consumer
              # opens is not evidence.
              echo "LINT=NOT_APPLICABLE ($REPO declares no lint command)" > "$RD/lint.txt"
              LINT_APPLICABLE=false
            fi
            # Materialize the patterns first. Piping the extractor straight into the
            # loop would let a verify.json parse failure feed the loop nothing, and a
            # gate that silently runs zero tests reports PASS for the wrong reason.
            python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
              "$ARTIFACTS_DIR/verify.json" > "$RD/patterns.txt" \
              || { echo "DESLOP_GATE=FAIL verify.json unreadable round=$N"; exit 1; }
            test -s "$RD/patterns.txt" || { echo "DESLOP_GATE=FAIL verify.json has no test_patterns round=$N"; exit 1; }
            UT=0
            while IFS= read -r PAT; do
              test -n "$PAT" || continue
              "${CMD_TEST[@]}" "$PAT" >> "$RD/test.txt" 2>&1 || UT=$?
            done < "$RD/patterns.txt"
            SC=0
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
              "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$BASE" > "$RD/scope.txt" 2>&1 || SC=$?
            # Delta-only: check-slop compares the base tree to the WORKING tree
            # (untracked included), never base..HEAD — the implementation is not
            # committed until commit-impl, so a HEAD-anchored diff would be empty.
            SL=0
            # Repository-chain stages carry contract-symbols.json (the approved plan's
            # declared contract symbols); an export named there is not yagni.
            CONTRACT_ARGS=()
            if [ -s "$ARTIFACTS_DIR/contract-symbols.json" ]; then
              # Bound by the controller in params.json: an altered list is refused, never used.
              python3 -c "import hashlib,json,sys; e=json.load(open(sys.argv[1])).get('feature_contract_symbols_sha256'); sys.exit(0 if not e or e == hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest() else 1)" \
                "$ARTIFACTS_DIR/params.json" "$ARTIFACTS_DIR/contract-symbols.json" \
                || { echo "DESLOP_GATE=FAIL contract-symbols.json altered round=$N"; exit 1; }
              CONTRACT_ARGS=(--contract-symbols "$ARTIFACTS_DIR/contract-symbols.json")
            fi
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-slop.py \
              "$WT" "$BASE" --max-complexity 10 --repo "$REPO" ${CONTRACT_ARGS[@]+"${CONTRACT_ARGS[@]}"} > "$RD/slop.txt" 2>&1 || SL=$?
            python3 - "$RD/recheck.json" "$TC" "$LT" "$UT" "$SC" "$SL" "$LINT_APPLICABLE" <<'PY'
            import json, sys
            path, tc, lt, ut, sc, sl, lint_applicable = sys.argv[1:8]
            # lint_applicable is ADDITIVE: the five integers keep their exact
            # shape and meaning. It exists because lint=0 alone cannot distinguish
            # "lint passed" from "there is no lint", and this file is the record
            # the reviewer and the PR body are told to trust.
            json.dump({"typecheck": int(tc), "lint": int(lt), "tests": int(ut),
                       "scope": int(sc), "slop": int(sl),
                       "lint_applicable": lint_applicable == "true"},
                      open(path, "w"), indent=2)
            PY
            cat "$RD/slop.txt" || true
            test "$TC" = 0 || { echo "DESLOP_GATE=FAIL typecheck round=$N"; tail -40 "$RD/typecheck.txt"; exit 1; }
            test "$LT" = 0 || { echo "DESLOP_GATE=FAIL lint round=$N"; tail -40 "$RD/lint.txt"; exit 1; }
            test "$UT" = 0 || { echo "DESLOP_GATE=FAIL unit round=$N"; tail -40 "$RD/test.txt"; exit 1; }
            test "$SC" = 0 || { echo "DESLOP_GATE=FAIL scope round=$N"; cat "$RD/scope.txt"; exit 1; }
            test "$SL" = 0 || { echo "DESLOP_GATE=FAIL slop round=$N"; exit 1; }
            # The writer's own "verification" block is historical (a hand fix on
            # resume would leave it stale), so this is a shape check only —
            # recheck.json above is what the reviewer is told to trust.
            RJ="$ARTIFACTS_DIR/deslop-result.json"
            test -s "$RJ" || { echo "DESLOP_GATE=FAIL no deslop-result.json round=$N"; exit 1; }
            python3 -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert isinstance(d, dict); assert isinstance(d.get('changed_files'), list); assert isinstance(d.get('passes'), list)" \
              "$RJ" || { echo "DESLOP_GATE=FAIL deslop-result.json unparseable round=$N"; exit 1; }
            # deslop-result.json is the writer's declaration, the one the reviewer may
            # excuse an edit against. It is frozen at the first recheck that gets here
            # before any fixer ran; the fixer declares in deslop-fix-result.json.
            FROZEN="$ARTIFACTS_DIR/deslop-result.sha256"
            NOWSHA=$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$RJ")
            if [ ! -f "$FROZEN" ] && ! ls "$ARTIFACTS_DIR"/deslop-round-*/fix-result.json >/dev/null 2>&1; then
              echo "$NOWSHA" > "$FROZEN"
            elif [ "$(cat "$FROZEN" 2>/dev/null || true)" != "$NOWSHA" ]; then
              echo "DESLOP_GATE=FAIL deslop-result.json changed after the writer round=$N"; exit 1
            fi
            # Restorable checkpoint, not just a fingerprint. A throwaway index
            # turns the whole worktree — untracked implementation files included —
            # into a real tree object in this repo's object DB, so a reviewer that
            # edits or deletes files is not only DETECTED but UNDOABLE. HEAD sha
            # and the live index tree go in too: a reviewer that commits or stages
            # without changing content leaves `git status --porcelain` identical,
            # so porcelain alone is not enough.
            rm -f "$RD/index"
            GIT_INDEX_FILE="$RD/index" git add -A || { echo "DESLOP_GATE=FAIL checkpoint add round=$N"; exit 1; }
            CKTREE=$(GIT_INDEX_FILE="$RD/index" git write-tree) \
              || { echo "DESLOP_GATE=FAIL checkpoint write-tree round=$N"; exit 1; }
            test -n "$CKTREE" || { echo "DESLOP_GATE=FAIL checkpoint empty tree sha round=$N"; exit 1; }
            echo "$CKTREE" > "$RD/checkpoint-tree.txt"
            # Belt: the bytes survive even a worktree wipe that takes the object DB.
            git archive "$CKTREE" > "$RD/checkpoint.tar" \
              || { echo "DESLOP_GATE=FAIL checkpoint archive round=$N"; exit 1; }
            CKHEAD=$(git rev-parse HEAD) || { echo "DESLOP_GATE=FAIL checkpoint rev-parse round=$N"; exit 1; }
            CKINDEX=$(git write-tree) || { echo "DESLOP_GATE=FAIL checkpoint live-index tree round=$N"; exit 1; }
            {
              echo "head=$CKHEAD"
              echo "index=$CKINDEX"
              echo "checkpoint=$CKTREE"
            } > "$ARTIFACTS_DIR/deslop-tree.txt"
            # The reviewer writes deslop-review.json fresh each round; the previous
            # round's file must not stand in for a reviewer that wrote nothing.
            rm -f "$ARTIFACTS_DIR/deslop-review.json"
            FILES=$(sed -n 's/^SLOP=OK files=\([0-9]*\)$/\1/p' "$RD/slop.txt" | tail -1)
            test -n "$FILES" || FILES=0
            echo "DESLOP_GATE=PASS files=$FILES round=$N checkpoint=$CKTREE"

        - id: deslop-review
          depends_on: [deslop-recheck]
          context: fresh
          model: sonnet
          maxBudgetUsd: 2
          timeout: 600000
          prompt: |
            You are the deslop REVIEWER node. You are a reviewer ONLY: the writer
            that cleaned this code was a different session, and you must not become
            its author. Ask no questions.

            YOU MUST NOT EDIT ANYTHING. Do not modify, create or delete any file in
            the repository. Do not stage anything, do not commit, do not run any
            command that writes to the worktree. The next node fingerprints the
            worktree (HEAD sha, index tree, and a full-tree checkpoint taken before
            you started) and fails the run if a single byte moved. The ONLY file you
            write is deslop-review.json in the artifacts directory.

            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

            The repository checkout is the "worktree" field of params.json in that
            same directory (you are NOT cwd'd there — cd into it for every git
            command).

            READ, in this order:
            - the current round number in deslop-round.txt in the artifacts directory
              (call it N), then deslop-round-N/recheck.json there. That file is the
              AUTHORITATIVE verification record: {"typecheck","lint","tests","scope",
              "slop"} exit codes, all zero. It also carries "lint_applicable": when
              that is false the repository has no lint command, its "lint": 0 means
              "not run" rather than "passed", and you must not treat it as lint
