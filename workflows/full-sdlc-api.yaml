  - id: review-loop
    depends_on: [commit-impl]
    loop_group:
      max_iterations: 4
      until: REVIEW_CONVERGED
      nodes:
        - id: round-pre
          timeout: 120000
          bash: |
            set -euo pipefail
            C="$ARTIFACTS_DIR/round.txt"
            N=$(cat "$C" 2>/dev/null || echo 0)
            # Hand-editable counter: reject junk before it is incremented or used as a path.
            case "$N" in '') N=0 ;; *[!0-9]*) echo "ROUND_PRE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            # Durable cap, checked BEFORE the round is spent (same doctrine as plan-round-pre,
            # full-sdlc-api.yaml: a cap enforced only in converge is walked past by resuming
            # after every group failure). accept-residuals.txt is the human bypass.
            CAP=$(cat "$ARTIFACTS_DIR/round-cap.txt" 2>/dev/null || echo 4)
            case "$CAP" in ''|*[!0-9]*) CAP=4 ;; esac
            if [ "$N" -ge "$CAP" ] && [ ! -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then echo "ROUND_CAP_REACHED round=$N cap=$CAP (pre-round: a resume does not buy another review; write accept-residuals.txt or raise round-cap.txt)"; exit 1; fi
            N=$((N+1)); echo "$N" > "$C"
            RD="$ARTIFACTS_DIR/round-$N"; mkdir -p "$RD"
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            git rev-parse HEAD > "$RD/pre-head.txt"
            ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$RD/prerun-dirs.txt" || true
            touch "$RD/prerun-dirs.txt"
            echo "ROUND=$N head=$(cat "$RD/pre-head.txt")"

        - id: review
          depends_on: [round-pre]
          model: sonnet
          maxBudgetUsd: 15
          timeout: 1800000
          skills: [ce-code-review]
          prompt: |
            The repository checkout to review is the "worktree" field of
            params.json in the directory named by the ARTIFACTS_DIR environment
            variable (you are NOT cwd'd there — cd into it for every git
            command). It is already on the branch to be reviewed.

            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

            Persona selection happens in this session, so three instructions
            BEFORE you invoke the skill:
            - Measure the diff first: in the worktree, run
              git diff --stat "$(cat <that directory>/bootstrap-head.txt)"..HEAD
              Under roughly 150 changed lines, cap the conditional personas at
              3 beyond the always-on set, and record the decision (diff size,
              cap applied or not, personas chosen) in the envelope's Coverage
              section so the choice is observable.
            - Task one reviewer lens with exactly this: "extract the
              assumptions this diff encodes — in-diff comments are the primary
              source — and verify each against out-of-diff code; report
              mismatches as findings." Feed its findings through the skill's
              normal merge pipeline like any other reviewer's.
            - If waivers.md exists in the artifacts directory, read it first.
              A finding that materially matches a waived entry goes under a
              "Previously waived" heading in the envelope — NOT as a new
              actionable finding — unless the reviewer states specific new
              evidence that was absent when the waiver was recorded.

            Then invoke the ce-code-review skill with arguments exactly:
              mode:headless base:origin/main plan:<that directory>/plan.md
            Do not expand scope beyond the diff against that base.
            The staged ce-code-review may be either contract generation: CE 3.2.0's
            markdown headless envelope, or the newer agent-JSON contract (there
            mode:headless aliases mode:agent and the skill returns ONE raw JSON
            object with status and verdict fields). Invoke with the same
            arguments either way and relay the skill's full return VERBATIM
            (envelope or raw JSON) as part of your output. External/cross-model
            review is PROHIBITED in this unattended pipeline: never send the
            diff to any external peer, regardless of what the skill's own
            references permit.

        - id: review-gate
          depends_on: [review]
          timeout: 300000
          bash: |
            set -uo pipefail
            N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
            case "$N" in ''|*[!0-9]*) echo "REVIEW_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            OUT=$review.output
            # Resume resilience: node outputs may not survive a resume; the envelope file does.
            if [ "${#OUT}" -lt 100 ] && [ -s "$RD/review-envelope.txt" ]; then
              OUT=$(cat "$RD/review-envelope.txt")
            fi
            printf '%s\n' "$OUT" > "$RD/review-envelope.txt"
            # Dual-contract parse: CE 3.2.0's markdown headless envelope OR the
            # newer skills' single raw JSON object (status/verdict fields).
            eval "$(python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/parse-review-envelope.py "$RD/review-envelope.txt" | sed 's/^/ENV_/')"
            G1="$ENV_G1"; G2="$ENV_G2"
            echo "GATE_1_review_complete_present=$G1 (contract=$ENV_VSRC)"
            echo "GATE_2_degraded_absent=$G2"
            # Run-scoped, not /tmp: a same-named file owned by another user on a
            # shared host makes the redirect fail, `|| true` swallows it, and comm
            # then diffs against a foreign list — silently picking the wrong
            # ce-code-review run directory to read the verdict from.
            ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$RD/post-dirs.txt" || true
            NEW=$(comm -13 "$RD/prerun-dirs.txt" "$RD/post-dirs.txt")
            PREHEAD=$(cat "$RD/pre-head.txt")
            VERDICT=""; RUNDIR=""
            for d in $NEW; do
              M="$d/metadata.json"; test -f "$M" || continue
              SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('head_sha',''))" "$M" 2>/dev/null)
              # metadata.json is model-written: head_sha may be SHORT. Prefix-match, min 7 chars.
              if [ "${#SHA}" -ge 7 ]; then
                case "$PREHEAD" in
                  "$SHA"*)
                    RUNDIR="$d"
                    VERDICT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('verdict',''))" "$M" 2>/dev/null)
                    ;;
                esac
              fi
            done
            VSRC=metadata
            if [ -z "$VERDICT" ]; then
              # Fallback: metadata.json omission is a known model-side contract slip; the
              # envelope is the skill's PRIMARY handoff. Strict-match its Verdict line.
              test -n "$ENV_VERDICT" && { VERDICT="$ENV_VERDICT"; VSRC="$ENV_VSRC"; }
            fi
            G3=FAIL
            case "$VERDICT" in "Ready to merge"|"Ready with fixes"|"Not ready") G3=PASS ;; esac
            echo "GATE_3_verdict_in_enum=$G3 verdict=[$VERDICT] source=$VSRC rundir=[$RUNDIR]"
            DEGRADED=true; test "$G2" = PASS && DEGRADED=false
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/write-review-summary.py \
              "$RD/review-summary.json" "$VERDICT" "$DEGRADED"
            test "$G1" = PASS && test "$G2" = PASS && test "$G3" = PASS || { echo "REVIEW_GATE=FAIL round=$N"; exit 1; }
            echo "REVIEW_GATE=PASS round=$N"

        - id: commit-fixes
          depends_on: [review-gate]
          timeout: 300000
          bash: |
            set -euo pipefail
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            git add -A
            if git diff --cached --quiet; then echo "COMMITTED=NO"; else
              git commit -m "fix(review): apply autofix feedback"; echo "COMMITTED=YES sha=$(git rev-parse HEAD)"
            fi
            echo "COMMIT_FIXES=OK"

        - id: fixer
          depends_on: [commit-fixes]
          model: sonnet
          maxBudgetUsd: 5
          timeout: 1200000
          prompt: |
            You are the fixer node in an unattended review-fix pipeline. Ask no questions.
            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"
            Read the current round number from round.txt in that directory, then read
            the review envelope at round-<N>/review-envelope.txt there.
            The envelope is either CE 3.2.0's markdown headless envelope or the
            newer contract's single JSON object; in JSON, actionable findings
            live in "actionable_findings" (fields: severity Pn, owner,
            autofix_class gated_auto|manual, file, line, title,
            suggested_fix) — treat them exactly like the envelope's findings.

            The repository under review is the "worktree" field of params.json
            in that same artifacts directory (you are NOT cwd'd there).

            Rules:
            - If the envelope contains no unresolved P0-P2 findings of class gated_auto or
              manual, write the JSON result with all arrays empty (advisory may list P3
              waivers) and stop. Do not invent work.
            - Fix unresolved P0-P2 gated_auto/manual findings by editing repository files.
            - P3/advisory: do NOT fix; record each as a waiver with one line of rationale.
            - "failed" means BLOCKED — it halts the whole pipeline for a human. Reserve it
              for a P0-P2 that must be fixed in this diff and that you attempted but could
              not complete (build breaks, code not found, findings contradict each other).
            - Declining is not failing. A finding tagged pre_existing, or whose defect
              predates this diff, or whose fix would expand beyond the diff's stated
              scope, goes in "advisory" with action starting "Waived:" plus one line of
              rationale. Advisory entries surface in the PR body's Known Residuals —
              recorded, not lost.
            - If waivers.md exists in the artifacts directory, a finding that
              materially matches one of its entries is "advisory" by default —
              record it as a waiver again rather than re-fixing or failing on
              it, unless the review states specific new evidence.
            - "incomplete" is for transient incompletions: session budget ran out, an
              edit failed on stale anchors, or a fix/test was attempted but not landed.
              One entry per item, one line of reason. These are retried automatically —
              the next review round re-surfaces them and the loop will not converge
              while any exist. Never silently drop a finding from the result file.
            - No commits, no branches. Touch only files findings name.
            Write JSON to round-<N>/fixer-result.json in the artifacts directory:
              {"applied": [...], "failed": [...], "advisory": [...], "incomplete": [...]}
            each entry {"finding": "<one-line>", "action": "<what/why>"}.
            Writing the JSON result file is MANDATORY and comes BEFORE your final line —
            ending without it aborts the pipeline. Write it even when all arrays are
            empty. Then end with the single line: FIXER_DONE

        - id: commit-fixer
          depends_on: [fixer]
          timeout: 300000
          bash: |
            set -euo pipefail
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            git add -A
            if git diff --cached --quiet; then echo "COMMITTED=NO"; else
              git commit -m "fix(review): apply fixer feedback"; echo "COMMITTED=YES sha=$(git rev-parse HEAD)"
            fi
            echo "COMMIT_FIXER=OK"

        - id: converge
          depends_on: [commit-fixer]
          timeout: 300000
          bash: |
            set -uo pipefail
            N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
            case "$N" in ''|*[!0-9]*) echo "CONVERGE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
            exec > >(tee "$RD/converge.txt") 2>&1
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json" 2>/dev/null || echo UNKNOWN)
            FIXOK=NO
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$RD/fixer-result.json" >/dev/null 2>&1 && FIXOK=YES
            CLEAN=NO; test -z "$(git status --porcelain | grep -v '^?? \.env')" && CLEAN=YES
            MOVED=YES; test "$(git rev-parse HEAD)" = "$(cat "$RD/pre-head.txt")" && MOVED=NO
            INC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('incomplete',[])))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
            echo "ROUND=$N verdict=[$V] fixer_ok=$FIXOK clean=$CLEAN head_moved=$MOVED incomplete=$INC"
            # Scope guard: any change outside the plan's allowlist is a human stop.
            # Legitimate scope growth = a human edits files-allowlist.json and resumes.
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
              "$ARTIFACTS_DIR/files-allowlist.json" "$WT" \
              "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" --round "$N" || exit 1
            if [ "$FIXOK" = NO ]; then echo "FIXER_BLOCKED round=$N"; exit 1; fi
            # Waiver ledger: record this round's advisory declines so later rounds
            # do not re-litigate them without new evidence.
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/update-waivers.py \
              "$RD/fixer-result.json" "$ARTIFACTS_DIR/waivers.md"
            # Durable round cap: counted against round.txt (survives resumes), not
            # loop iterations. accept-residuals.txt is a HUMAN act, never an agent's.
            CAP=$(cat "$ARTIFACTS_DIR/round-cap.txt" 2>/dev/null || echo 4)
            ACCEPT=NO; test -f "$ARTIFACTS_DIR/accept-residuals.txt" && ACCEPT=YES
            case "$V" in
              "Ready to merge"|"Ready with fixes")
                if [ "$MOVED" = NO ] && [ "$CLEAN" = YES ] && [ "$INC" = 0 ]; then
                  echo "CONVERGED round=$N"
                  echo "<promise>REVIEW_CONVERGED</promise>"
                elif [ "$N" -ge "$CAP" ]; then
                  if [ "$ACCEPT" = YES ]; then
                    echo "CONVERGED round=$N (human accepted residuals)"
                    echo "<promise>REVIEW_CONVERGED</promise>"
                  else
                    echo "ROUND_CAP_REACHED round=$N"; exit 1
                  fi
                else
                  echo "ROUND_PROGRESSED round=$N (changes landed or incomplete items; re-review next round)"
                fi
                ;;
              "Not ready")
                if [ "$MOVED" = NO ]; then echo "NO_PROGRESS round=$N (Not ready and nothing changed)"; exit 1; fi
                if [ "$N" -ge "$CAP" ]; then
                  if [ "$ACCEPT" = YES ]; then
                    echo "CONVERGED round=$N (human accepted residuals)"
                    echo "<promise>REVIEW_CONVERGED</promise>"
                  else
                    echo "ROUND_CAP_REACHED round=$N"; exit 1
                  fi
                else
                  echo "ROUND_PROGRESSED round=$N (Not ready; fixes landed; re-review next round)"
                fi
                ;;
              *) echo "CONVERGE=FAIL unknown verdict [$V]"; exit 1 ;;
            esac

  - id: exit-gate
    depends_on: [review-loop, reader-audit-gate]
    timeout: 600000
    bash: |
      set -euo pipefail
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      cd "$WT"
      N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
      case "$N" in ''|*[!0-9]*) echo "EXIT_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
      # A human accepting residuals waives the verdict and fixer checks — never
      # the clean-tree, scope, or unit-test checks (accepted findings, not a broken tree).
      if [ -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then
        echo "EXIT_GATE accept-residuals present: verdict and fixer checks skipped ($(head -1 "$ARTIFACTS_DIR/accept-residuals.txt"))"
      else
        V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
        case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
      fi
      test -z "$(git status --porcelain | grep -v '^?? \.env')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
      # Scope guard belt (resume ordering can bypass converge's check).
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
        "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
        || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
      # Reader-audit belt: declared columns must have a passing result on disk.
      NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$ARTIFACTS_DIR/reader-audit.json" 2>/dev/null || echo 0)
      if [ "$NC" != 0 ]; then
        test -s "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL missing reader-audit-result.json"; exit 1; }
        python3 -c "import json,sys; cols=json.load(open(sys.argv[1]))['columns']; aff=[r for c in cols for r in c.get('readers',[]) if r.get('class')=='affected']; sys.exit('affected readers: %s' % aff) if aff else None" "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL affected reader"; exit 1; }
      fi
      # Materialize-then-`test -s`, same as gate-tests and deslop-recheck: a process
      # substitution hides the extractor's exit code, so a broken or empty
      # verify.json would run the loop zero times and this gate would print
      # EXIT_GATE=PASS having verified nothing.
      python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
        "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
        || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
      test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
      while IFS= read -r PAT; do
        test -n "$PAT" || continue
        bun run test -- "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix unit tests pattern=$PAT"; exit 1; }
      done < "$ARTIFACTS_DIR/exit-patterns.txt"
      echo "EXIT_GATE=PASS"

  - id: smoke
    depends_on: [exit-gate]
    timeout: 1200000
    bash: |
      set -uo pipefail
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      cd "$WT"
      # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux). rc 1 only
      # when no backend exists at all.
      port_pids() { # $1 = port
        local out=""
        if command -v lsof >/dev/null 2>&1; then
          out="$(lsof -ti ":$1" 2>/dev/null || true)"
        elif command -v ss >/dev/null 2>&1; then
          out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
        elif command -v fuser >/dev/null 2>&1; then
          out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
        else
          return 1
        fi
        [ -n "$out" ] && printf '%s\n' "$out"
        return 0
      }
      PORT=4123 bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
      SRV=$!
      # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
      trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids 4123); test -n "$P" && kill $P 2>/dev/null; true' EXIT
      # Boot liveness: /api-docs-json 200 also proves swagger builds with the new DTOs.
      CODE=000
      for i in $(seq 1 60); do
        sleep 3
        CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4123/api-docs-json || echo 000)
        test "$CODE" = "200" && break
      done
      test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
      CTRL=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4123/info || echo 000)
      test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
      RESULT="SMOKE=PASS api-docs-json=200 guarded-control=401"
      # Optional feature probe: only when the plan declared an unauthenticated GET.
      if [ -s "$ARTIFACTS_DIR/smoke-probe.json" ]; then
        PPATH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['path'])" "$ARTIFACTS_DIR/smoke-probe.json")
        PEXP=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('expect','200'))" "$ARTIFACTS_DIR/smoke-probe.json")
        PCODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4123$PPATH" || echo 000)
        test "$PCODE" = "$PEXP" || { echo "SMOKE=FAIL probe $PPATH code=$PCODE expected=$PEXP"; exit 1; }
        RESULT="$RESULT probe:$PPATH=$PCODE"
      fi
      echo "$RESULT" | tee "$ARTIFACTS_DIR/smoke-result.txt"

  - id: prbody
    depends_on: [smoke]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the PR-body composition node. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read plan.md there; then read round.txt for the final round number N and read
      round-<N>/review-summary.json and round-<N>/fixer-result.json there.
      Also read, when present: reader-audit-result.json and accept-residuals.txt.
      Write a pull-request body in markdown to pr-body.md in that directory with
      exactly these sections:
        ## Summary
        ## Known Residuals
        ## Post-Deploy Monitoring & Validation
      Known Residuals lists every entry from fixer-result.json "advisory" (verbatim
      finding + rationale); if none, say "None."
      When reader-audit-result.json exists and declares columns, Known Residuals
      also lists every reader classified "residual" verbatim (file, class, why).
      When accept-residuals.txt exists, Known Residuals OPENS with a line quoting
      it: Residuals human-accepted: <its contents> — and then lists the final
      round's "advisory" AND "incomplete" entries verbatim.
      If there is no runtime impact beyond the new endpoint, the monitoring section
      must say exactly: "No additional operational monitoring required."
      Mention verification evidence: unit gate, typecheck, lint, and the live
      smoke result exactly as recorded in smoke-result.txt in that directory.
      No co-author or attribution lines. End with the single line: PRBODY_WRITTEN

  - id: ship
    depends_on: [prbody]
    timeout: 900000
    bash: |
      set -euo pipefail
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      test "$(git -C "$WT" rev-parse --abbrev-ref HEAD)" = "$BR"
      test -s "$ARTIFACTS_DIR/pr-body.md"
      grep -q '^## Known Residuals' "$ARTIFACTS_DIR/pr-body.md"
      grep -q '^## Post-Deploy Monitoring & Validation' "$ARTIFACTS_DIR/pr-body.md"
      TITLE=$(head -1 "$ARTIFACTS_DIR/commit-msg.txt" 2>/dev/null || true)
      test -n "$TITLE" || TITLE="feat(api): $SLUG"
      # gate-tests + exit-gate already ran typecheck/tests; hook re-run skipped by explicit choice.
      git -C "$WT" push -u origin "$BR" --no-verify
      cd "$WT"
      EXISTING=$(gh pr list --head "$BR" --state open --json url --jq '.[0].url' 2>/dev/null || true)
      if [ -n "$EXISTING" ]; then
        printf '%s\n' "$EXISTING" > "$ARTIFACTS_DIR/pr-url.txt"
        echo "SHIP=ADOPTED existing PR"
      else
        gh pr create --draft --base main --head "$BR" \
          --title "$TITLE [archon]" \
          --body-file "$ARTIFACTS_DIR/pr-body.md" > "$ARTIFACTS_DIR/pr-url.txt"
      fi
      echo "PR_URL=$(cat "$ARTIFACTS_DIR/pr-url.txt")"
      echo "SHIP=OK"

  - id: run-report
    depends_on: [ship]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the final-report node: the last thing a human sees from this run,
      so show, do not tell. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: pr-url.txt, plan.md, worktrees.json, round.txt, and each
      round-<N>/review-summary.json and round-<N>/fixer-result.json.
      Write a single self-contained run-report.html to that directory with these
      marker-wrapped sections:
      <!-- GIST --> Open in the bro register: what just happened, told like you
      would tell a smart friend over a beer. Simpler, not necessarily shorter;
      the bar is impossible to misunderstand. Casual connectives are fine
      ("basically", "so here's the deal"), memes are not. Every path, command,
      number, and URL stays exactly as it is. Flat prose, four sentences max.
      <!-- SHIPPED --> What shipped: the PR link as the headline, branch, and a
      two-sentence plain-language summary of the change.
      <!-- EVIDENCE --> Proof, not claims: the verification chain as small visuals.
      A shallow file tree of what the PR touches; the smoke result (endpoint code
      plus its negative control) as labeled chips.
      <!-- ROUNDS --> The review story: one row per round with its verdict and
      what the fixer applied, as a compact pill timeline. If one round, say the
      review converged immediately and why that is good news.
      <!-- RESIDUALS --> Waivers and advisory findings in plain words; "None" if empty.
      <!-- NEXT --> What the human does now: review the PR, update branch if
      behind, merge when satisfied. Concrete commands or links, no vagueness.
      Show-me rules: pick the smallest view that makes each point; place each
      visual beside one short supporting sentence; real names, paths, and numbers
      only; no invented data; light and dark via :root custom properties plus a
      prefers-color-scheme override. Plain sentences, no em dashes, no AI-tell
      vocabulary. End with the single line: RUN_REPORT_DONE

  - id: kb-capture
    depends_on: [run-report]
    model: sonnet
    maxBudgetUsd: 2
    timeout: 600000
    prompt: |
      You are the knowledge-capture node: compound what this run learned so the
      next feature build starts smarter. Ask no questions.
      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read there: plan.md, kb-context.md (if present), pr-url.txt, round.txt,
      each round-<N>/review-summary.json and round-<N>/fixer-result.json.

      Write EXACTLY ONE new markdown file into
      /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb/wiki/change-history/
      named <YYYY-MM-DD>-archon-api-<feature-slug>.md (get the date with the
      date command; derive the slug from the PR title or branch).
      That one new file is your ENTIRE write surface: never edit or delete any
      existing knowledge-base file. Curation into concepts, patterns, glossary,
      or ADRs belongs to a human-attended kb:compound session, not to you.

      Frontmatter: title, date, source (archon full-sdlc-api, run id = the
      artifacts directory basename), pr (the URL), status: captured.
      Body sections: What shipped (two sentences plus the PR link). Decisions
      made and why (real decisions from the plan, with the KB constraints they
      honored). Gotchas discovered (from review rounds and fixer results:
      recurring findings, environment traps). Process notes (what the pipeline
      itself taught us this run). Promotion candidates (bullets in the form
      "glossary: <term>", "ADR: <decision>", "pattern: <name>" for the curator).
      Everything from run artifacts; nothing invented; facts verbatim.
      End with the single line: KB_CAPTURE_DONE

  - id: kb-capture-gate
    depends_on: [kb-capture]
    timeout: 120000
    bash: |
      set -euo pipefail
      KB=/Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb
      git -C "$KB" status --porcelain | sort > "$ARTIFACTS_DIR/kb-post-capture.txt"
      NEW=$(comm -13 "$ARTIFACTS_DIR/kb-pre-porcelain.txt" "$ARTIFACTS_DIR/kb-post-capture.txt" || true)
      COUNT=$(printf '%s\n' "$NEW" | grep -c "^?? wiki/change-history/" || true)
      TOTAL=$(printf '%s\n' "$NEW" | grep -c . || true)
      test "$COUNT" = "1" || { echo "KB_CAPTURE_GATE=FAIL expected exactly one new capture file, delta: [$NEW]"; exit 1; }
      test "$TOTAL" = "$COUNT" || { echo "KB_CAPTURE_GATE=FAIL KB changes outside change-history: [$NEW]"; exit 1; }
      F="$KB/$(printf '%s\n' "$NEW" | sed -n 's/^?? //p')"
      grep -q "status: captured" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing frontmatter"; exit 1; }
      grep -qi "Promotion candidates" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing promotion candidates"; exit 1; }
      echo "KB_CAPTURE_GATE=PASS file=$F"

  - id: report
    depends_on: [kb-capture-gate]
    trigger_rule: all_done
    always_run: true
    timeout: 120000
    bash: |
      set -uo pipefail
      echo "=== FULL-SDLC-API REPORT ==="
      echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
      cat "$ARTIFACTS_DIR/worktrees.json" 2>/dev/null || echo "no worktrees.json"
      cat "$ARTIFACTS_DIR/pr-url.txt" 2>/dev/null || echo "PR=NOT_CREATED"
      N=$(cat "$ARTIFACTS_DIR/round.txt" 2>/dev/null)
      case "$N" in *[!0-9]*) echo "REPORT=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
      test -n "$N" && cat "$ARTIFACTS_DIR/round-$N/review-summary.json" 2>/dev/null
      # show-me: open the evidence report for the human when it exists. Print the
      # path either way — xdg-open/open may be absent (or be openvt(1) on Linux).
      if [ -s "$ARTIFACTS_DIR/run-report.html" ]; then
        echo "REPORT=file://$ARTIFACTS_DIR/run-report.html"
        OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
        [ -n "$OPENER" ] && "$OPENER" "$ARTIFACTS_DIR/run-report.html" >/dev/null 2>&1 || true
      fi
      echo "REPORT_DONE"
