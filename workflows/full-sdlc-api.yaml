      exact commands you ran and their exit status. This is an unattended
      pipeline invocation; ask no questions.

  - id: gate-tests
    # implementation-ready carries a verify-only reopen past its skipped implement
    # node; with implement alone every verification node was skipped (run e21573ca).
    depends_on: [implement, implementation-ready]
    trigger_rule: none_failed_min_one_success
    timeout: 1200000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-gate-tests.out") 2> >(tee -a "$ARTIFACTS_DIR/node-gate-tests.out" >&2); fi
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      cd "$WT"
      rm -rf .omc   # runtime-state leakage guard: any .omc here is session contamination, never work product
      "${CMD_TYPECHECK[@]}" || { echo "GATE_TESTS=FAIL typecheck"; exit 1; }
      # A repo with no lint script declares an EMPTY CMD_LINT. Saying so out loud
      # is the point: a silently skipped lint is indistinguishable from a passing
      # one, and this gate's PASS would then be claiming evidence it never got.
      if [ "${#CMD_LINT[@]}" -gt 0 ]; then
        "${CMD_LINT[@]}" || { echo "GATE_TESTS=FAIL lint"; exit 1; }
      else
        echo "GATE_TESTS_LINT=NOT_APPLICABLE ($REPO declares no lint command)"
      fi
      # Materialize the patterns first (same reason as deslop-recheck): piping the
      # extractor straight into the loop puts it in a subshell whose exit code the
      # loop never sees, so a verify.json that fails to parse — or that carries an
      # empty test_patterns — feeds the loop nothing and this gate prints PASS
      # having run zero tests. `test -s` is the difference between "all patterns
      # passed" and "there were no patterns".
      python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
        "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/gate-tests-patterns.txt" \
        || { echo "GATE_TESTS=FAIL verify.json unreadable"; exit 1; }
      test -s "$ARTIFACTS_DIR/gate-tests-patterns.txt" \
        || { echo "GATE_TESTS=FAIL verify.json yielded no patterns"; exit 1; }
      while IFS= read -r PAT; do
        test -n "$PAT" || continue
        "${CMD_TEST[@]}" "$PAT" || { echo "GATE_TESTS=FAIL unit pattern=$PAT"; exit 1; }
      done < "$ARTIFACTS_DIR/gate-tests-patterns.txt"
      BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
      # No lockfile is noise here: every repo this lane serves (repo-profile.sh) installs
      # frozen, so lockfile-only drift is content, and check-scope.py calls it a breach.
      CONTENT_STATUS=$(git status --porcelain --untracked-files=all | grep -vE '^\?\? \.env$' || true)
      # A feature-reopen'd stage must change its previous candidate (reopen-gate.py).
      if [ -z "$CONTENT_STATUS" ] && git diff --quiet "$BASE" -- .; then
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/reopen-gate.py "$ARTIFACTS_DIR" NO_CHANGE
        printf '{"outcome":"NO_CHANGE","repo":"%s","basis":"baseline-to-candidate content","baseline":"%s","head":"%s","pr_url":null}\n' "$REPO" "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
        echo "GATE_TESTS=PASS outcome=NO_CHANGE"
        exit 0
      fi
      printf '{"outcome":"CHANGED","repo":"%s","basis":"baseline-to-candidate content","baseline":"%s","head":"%s"}\n' "$REPO" "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
      test -s "$ARTIFACTS_DIR/commit-msg.txt" || {
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/node-no-output.py "$ARTIFACTS_DIR" implement commit-msg.txt
        echo "GATE_TESTS=FAIL no commit-msg.txt from implement"; exit 1; }
      # Before scope: a declared reopen-blocked.txt is the actionable stop, not a breach.
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/reopen-gate.py "$ARTIFACTS_DIR" CHANGED
      # Scope guard: catch implement-node creep before the first review round.
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
        "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
        || { echo "GATE_TESTS=FAIL scope breach"; exit 1; }
      # A not_applicable browser policy was derived at plan time from the
      # allowlist; what ships is the diff, so re-derive it from the diff.
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/browser-exemption.py diff \
        "$ARTIFACTS_DIR" "$WT" "$BASE" || { echo "GATE_TESTS=FAIL browser exemption void"; exit 1; }
