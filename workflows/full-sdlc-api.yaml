name: full-sdlc-api
description: API prong end-to-end (spec -> plan -> doc-review -> approval -> implement -> tests -> review loop -> smoke -> draft PR). Run message = ABSOLUTE path to the feature spec; empty message fails preflight. Branch/worktree derive from the spec filename (archon/<slug>). Invoke with DISABLE_OMC=1.
provider: claude
interactive: true
nodes:
  - id: preflight
    timeout: 300000
    bash: |
      set -euo pipefail
      SK=/Users/eduardopicazo/Documents/Workspace/Goodword/.claude/skills
      test -f "$SK/ce-code-review/SKILL.md" || { echo "PREFLIGHT=FAIL staged ce-code-review missing"; exit 1; }
      test -f "$SK/ce-doc-review/SKILL.md"  || { echo "PREFLIGHT=FAIL staged ce-doc-review missing"; exit 1; }
      # Dual contract: CE 3.2.0 carries the markers in SKILL.md; newer CE moved
      # mode:headless (now an alias for mode:agent) into references/modes-and-output.md
      # and the verdict field into references/finish-review.md. Either satisfies.
      { grep -q 'mode:headless' "$SK/ce-code-review/SKILL.md" && grep -q '"verdict"' "$SK/ce-code-review/SKILL.md"; }         || { grep -q 'mode:headless' "$SK/ce-code-review/references/modes-and-output.md" 2>/dev/null && grep -q '"verdict"' "$SK/ce-code-review/references/finish-review.md" 2>/dev/null; }         || { echo "PREFLIGHT=FAIL ce-code-review carries neither review contract (headless envelope nor agent JSON)"; exit 1; }
      command -v bun >/dev/null || { echo "PREFLIGHT=FAIL bun missing"; exit 1; }
      command -v gh >/dev/null || { echo "PREFLIGHT=FAIL gh missing"; exit 1; }
      gh auth status >/dev/null 2>&1 || { echo "PREFLIGHT=FAIL gh unauthenticated"; exit 1; }
      command -v aws >/dev/null 2>&1 && aws sts get-caller-identity >/dev/null 2>&1 \
        || echo "PREFLIGHT_WARN aws unavailable or expired - AWS evidence/runtime integrations may degrade; workflow control continues"
      # Billing guard: runs MUST bill the Claude subscription (OAuth /login), never the API.
      # Any of these outranks the subscription login in Claude Code's auth precedence.
      for v in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_API_KEY CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_PROFILE; do
        test -z "$(printenv "$v")" || { echo "PREFLIGHT=FAIL $v is set - would bill API, not subscription"; exit 1; }
      done
      grep -q 'apiKeyHelper' "$HOME/.claude/settings.json" 2>/dev/null && { echo "PREFLIGHT=FAIL apiKeyHelper configured - would override subscription"; exit 1; }
      # port_pids: PIDs holding a TCP port. lsof is preinstalled on macOS and
      # frequently absent on Linux, so try lsof -> ss -> fuser. rc 1 means NO
      # backend exists at all; it never means "the port is free". Without this a
      # missing lsof made the busy-port check silently pass and let two runs collide.
      port_pids() { # $1 = port
        local out=""
        if command -v lsof >/dev/null 2>&1; then
          out="$(lsof -ti ":$1" 2>/dev/null || true)"
        elif command -v ss >/dev/null 2>&1; then
          out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
        elif command -v fuser >/dev/null 2>&1; then
          out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
        else
          return 1
        fi
        [ -n "$out" ] && printf '%s\n' "$out"
        return 0
      }
      port_pids 4123 >/dev/null || { echo "PREFLIGHT=FAIL no port-inspection tool (need lsof, ss, or fuser)"; exit 1; }
      test -z "$(port_pids 4123)" || { echo "PREFLIGHT=FAIL port 4123 busy"; exit 1; }
      test -d /Users/eduardopicazo/Documents/Workspace/Goodword/api/.git || { echo "PREFLIGHT=FAIL api repo missing"; exit 1; }
      # Run identity: message = absolute spec path (empty = hard fail). Single derivation point.
      bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/resolve-params.sh \
        /Users/eduardopicazo/Documents/Workspace/Goodword "${ARGUMENTS-}" "$ARTIFACTS_DIR"
      test -d /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb/wiki || { echo "PREFLIGHT=FAIL knowledge base missing"; exit 1; }
      git -C /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb status --porcelain | sort > "$ARTIFACTS_DIR/kb-pre-porcelain.txt"
      echo "PREFLIGHT=PASS"

  - id: kb-recon
    depends_on: [preflight]
    model: sonnet
    maxBudgetUsd: 3
    timeout: 900000
    prompt: |
      You are the knowledge-base scout. Your job is the context a code explorer
      cannot see: why things are the way they are. Ask no questions.

      The knowledge base is at /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb.
      Read ONLY — never edit anything there:
        glossary.md for domain terms; wiki/decisions/ (start at index.md) for
        prior decisions; the routing table in its CLAUDE.md, then the relevant
        wiki/concepts, wiki/patterns, wiki/systems pages for this feature's
        domain; wiki/change-history/ for recent lessons nearby.
      The feature spec: read params.json in the directory named by the
      ARTIFACTS_DIR environment variable (resolve via: echo "$ARTIFACTS_DIR");
      its "spec" field is the absolute path of the spec file. Read that file.

      Write kb-context.md into the directory named by the ARTIFACTS_DIR
      environment variable (resolve via: echo "$ARTIFACTS_DIR") with these
      marker-wrapped sections:
      <!-- TERMS --> domain terms this feature touches, each with the KB's own
      definition quoted, not loosely paraphrased. These are the words agents misread.
      <!-- DECISIONS --> prior decisions and ADRs that CONSTRAIN this feature,
      each with its recorded rationale. Load-bearing: the planner must honor
      these or explicitly justify deviating.
      <!-- DATA-MODEL --> what the KB records about the entities this feature
      reads or writes: ownership, invariants, lifecycle.
      <!-- BIG-PICTURE --> the forest for the trees: how this corner fits the
      whole system, five sentences or fewer.
      <!-- FOOTGUNS --> recorded failure modes and invariants near this area.
      <!-- SOURCES --> the exact KB file paths you actually opened, one absolute
      path per line. List only files you read.
      A section with nothing relevant says exactly: Nothing found in the KB.
      State absence, never pad. Every cited fact must come from a SOURCES file.
      End with the single line: KB_RECON_DONE

  - id: kb-recon-gate
    depends_on: [kb-recon]
    timeout: 120000
    bash: |
      set -euo pipefail
      K="$ARTIFACTS_DIR/kb-context.md"
      test -s "$K" || { echo "KB_GATE=FAIL no kb-context.md"; exit 1; }
      for m in TERMS DECISIONS DATA-MODEL BIG-PICTURE FOOTGUNS SOURCES; do
        grep -q "<!-- $m -->" "$K" || { echo "KB_GATE=FAIL missing section $m"; exit 1; }
      done
      # Provenance is real, not invented: at least one listed source must exist on disk.
      OK=0
      for p in $(grep -oE '/[A-Za-z0-9._/-]+\.md' "$K" | sort -u | head -20); do
        test -f "$p" && OK=1 && break
      done
      test "$OK" = 1 || { echo "KB_GATE=FAIL no verifiable source path"; exit 1; }
      # The scout is read-only: the KB tree must be exactly as preflight saw it.
      git -C /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb status --porcelain | sort > "$ARTIFACTS_DIR/kb-now.txt"
      cmp -s "$ARTIFACTS_DIR/kb-pre-porcelain.txt" "$ARTIFACTS_DIR/kb-now.txt" || { echo "KB_GATE=FAIL scout modified the knowledge base"; exit 1; }
      echo "KB_RECON_GATE=PASS"

  - id: bootstrap
    depends_on: [preflight]
    timeout: 900000
    bash: |
      set -euo pipefail
      API=/Users/eduardopicazo/Documents/Workspace/Goodword/api
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      git -C "$API" fetch origin main
      if [ -d "$WT" ]; then
        test "$(git -C "$WT" branch --show-current)" = "$BR" || { echo "BOOTSTRAP=FAIL existing worktree on wrong branch"; exit 1; }
        echo "BOOTSTRAP=ADOPTED"
      else
        git -C "$API" worktree add "$WT" -b "$BR" origin/main
        echo "BOOTSTRAP=CREATED"
      fi
      cp "$API/.env" "$WT/.env"
      cd "$WT" && bun install --frozen-lockfile >/dev/null
      git -C "$WT" rev-parse HEAD > "$ARTIFACTS_DIR/bootstrap-head.txt"
      printf '{"api_worktree":"%s","branch":"%s"}\n' "$WT" "$BR" > "$ARTIFACTS_DIR/worktrees.json"
      echo "WORKTREE=$WT BRANCH=$BR HEAD=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"

  - id: ralplan
    depends_on: [bootstrap, kb-recon-gate]
    model: sonnet
    maxBudgetUsd: 3
    timeout: 1200000
    prompt: |
      You are the planning node in an unattended workflow. Ask no questions; make
      conservative assumptions and record them in the plan.

      First read params.json in the directory named by the ARTIFACTS_DIR
      environment variable (resolve via: echo "$ARTIFACTS_DIR"). Its "spec"
      field is the feature spec path; its "worktree" field is the working tree
      to implement against (you are NOT cwd'd there).
      Author ONE SHARED CROSS-REPOSITORY implementation plan for the complete
      feature: API responsibilities and web-app responsibilities together. The
      API lane will implement only the API section after approval, but this gate
      is the single approval for the full design; the later web lane must follow
      this exact approved plan and its derived web scope contract.

      Then read kb-context.md in that same directory —
      the knowledge-base scout's report. Its DECISIONS section is binding: the
      plan honors those constraints, or records an explicit one-line
      justification for each deviation. Use its TERMS with their KB meanings and
      respect its FOOTGUNS.

      Then read the spec and the repository files it names, and write the plan
      as markdown to plan.md in that same directory.

      The plan must contain exactly one shared implementation unit with these exact headings:
        ## Goal
        ## Files
        ## Approach
        ## Test scenarios
        ## Verification
      Under ## Files, separate API paths and web-app paths clearly; API paths are
      relative to api/, web paths are relative to web-app/. The web section may
      be empty only when the spec truly has no web-app prong.
      Under Verification list exactly three commands (they are the shell gate):
        bun run typecheck
        bun run lint
        bun run test -- "<pattern>"
      where <pattern> is the jest name pattern that selects every spec file this
      unit touches or creates (existing specs for edited files included).
      Also write verify.json to that directory — the machine-readable mirror the
      shell gate executes: {"test_patterns": ["<pattern>", ...]} with at least
      one pattern, each matching the Verification commands exactly.
      If, and only if, the unit adds or changes an UNAUTHENTICATED GET endpoint,
      also write smoke-probe.json there: {"path": "/<route>", "expect": "200"}.
      Authenticated or non-GET behavior gets NO probe file — tests own it.

      If the spec contains a section titled "## Premises to verify", harvest
      every question from it (plus any "must investigate" / "must resolve"
      phrasing elsewhere in the spec) and write premises.json to that same
      directory: a JSON array
        [{"id": 1, "question": "...", "answer": "...",
          "evidence": [{"file": "<repo-relative path>", "lines": "L380-384",
                        "quote": "<one verbatim line from that file>"}]}]
      Answer each question by READING THE CODE, not by arguing plausibility:
      every entry needs at least one evidence item whose "file" exists in the
      worktree and whose "quote" appears verbatim in it — a mechanical gate
      greps for the quote and fails the run on an uncited answer. Write an
      empty array [] only when the spec has no such section.

      Also write files-allowlist.json to that same directory: a JSON array of
      every api repo-relative path the API lane may create or modify — the
      machine-readable mirror of the API part of the plan's ## Files list. A
      scope gate fails the run on any API change outside this list.

      Also write web-files-allowlist.json to that same directory: a JSON array
      of every web-app repo-relative path the web lane may create or modify —
      the machine-readable mirror of the web-app part of the same approved plan.
      The later web lane copies this artifact verbatim from the API handoff; the
      implementation node is not allowed to invent or broaden its own scope.

      Also write reader-audit.json to that same directory. When the plan
      changes how any DB column or enum value is INTERPRETED or PRESENTED
      (not merely written), declare it:
        {"columns": [{"table": "<table>", "column": "<column>",
                      "reason": "<one line, e.g. presentation semantics change>"}]}
      Otherwise write exactly: {"columns": []}

      Do not modify the repository. Do not create commits or branches.
      End with the single line: PLAN_WRITTEN=<absolute path>

  - id: plan-snapshot
    depends_on: [ralplan]
    timeout: 120000
    bash: |
      set -euo pipefail
      # Shape, contract and premise-citation checks live in setup/plan-shape.sh so
      # plan-converge can re-run exactly the same checks on an ACCEPT round. A
      # second inline copy of the cited() helper would be two contracts drifting
      # apart, and the drift would show up as a plan that passes here and fails
      # after the critic loop, or worse, the reverse.
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      SHAPE=0
      OUT=$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/plan-shape.sh \
        "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
      if [ "$SHAPE" != 0 ]; then
        # This node keeps its own typed token: SNAPSHOT=FAIL <reason> is what the
        # runbook and every existing grep over run logs look for.
        printf '%s\n' "$OUT" | sed 's/^PLAN_SHAPE=FAIL/SNAPSHOT=FAIL/'
        exit 1
      fi
      cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.pre.md"
      echo "SNAPSHOT=OK"

  - id: plan-loop
    depends_on: [plan-snapshot]
    loop_group:
      max_iterations: 3
      until: PLAN_CONVERGED
      nodes:
        - id: plan-round-pre
          timeout: 120000
          bash: |
            set -euo pipefail
            # The cap is checked BEFORE a round is spent. A body node's non-zero exit
            # fails the whole group, and `archon workflow resume` re-enters the group
            # with a fresh iteration, so a cap enforced only in plan-converge could be
            # walked past forever by resuming after every critic-gate failure.
            C="$ARTIFACTS_DIR/plan-round.txt"
            N=$(cat "$C" 2>/dev/null || echo 0)
            CAP=$(cat "$ARTIFACTS_DIR/plan-round-cap.txt" 2>/dev/null || echo 3)
            # Both files are hand-editable, so both are untrusted input. `[ x -ge y ]`
            # with a non-integer operand returns 2, and `if` reads that as "not taken",
            # which would silently switch the cap off — the exact fail-open this guard
            # exists to prevent. A junk cap falls back to the default; a junk counter
            # stops the run instead, because resetting a counter to 0 on garbage is
            # itself a way to run forever.
            case "$CAP" in ''|*[!0-9]*) CAP=3 ;; esac
            case "$N" in
              '') N=0 ;;
              *[!0-9]*) echo "PLAN_ROUND_PRE=FAIL plan-round.txt is not an integer: [$N]"; exit 1 ;;
            esac
            if [ "$N" -ge "$CAP" ] && [ ! -f "$ARTIFACTS_DIR/plan-accept.txt" ]; then echo "PLAN_ROUND_CAP round=$N cap=$CAP" | tee -a "$ARTIFACTS_DIR/plan-loop-exit.txt"; exit 1; fi
            test -s "$ARTIFACTS_DIR/plan.md" || { echo "PLAN_ROUND_PRE=FAIL no plan.md round=$((N+1))"; exit 1; }
            # Durable round counter: survives resumes, unlike the loop's own iteration
            # index. Artifacts are round-scoped so a hand fix plus a resume cannot read
            # the previous round's critique as this round's.
            N=$((N+1)); echo "$N" > "$C"
            RD="$ARTIFACTS_DIR/plan-round-$N"; mkdir -p "$RD"
            # Round-scoped pre-image: plan-converge diffs plan.md against THIS file to
            # tell a revision that changed nothing from one that actually moved, and to
            # check mechanically that a REJECT round really was the no-op its prompt
            # asks for. Every contract plan-revise may rewrite is snapshotted, not just
            # the plan: a reviser that leaves plan.md alone but rewrites the allowlist
            # has still mutated the plan the human is about to judge.
            cp "$ARTIFACTS_DIR/plan.md" "$RD/plan.pre.md"
            # An `if` and not `test … && cp`: premises.json and smoke-probe.json are
            # both optional, so on the last iteration a bare AND-list would leave the
            # loop with status 1 and set -e would kill the node.
            for f in verify.json files-allowlist.json web-files-allowlist.json reader-audit.json premises.json smoke-probe.json; do
              if [ -f "$ARTIFACTS_DIR/$f" ]; then cp "$ARTIFACTS_DIR/$f" "$RD/pre-$f"; fi
            done
            echo "PLAN_ROUND=$N cap=$CAP"

        - id: impact-probe
          depends_on: [plan-round-pre]
          model: sonnet
          maxBudgetUsd: 2
          timeout: 600000
          prompt: |
            You are the code-graph impact node for one round of the planning critic
            loop. You run every round, so what you write reflects the plan as it
            stands right now, not as it stood when the loop started. Ask no
            questions.

            Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
            The round number is the contents of plan-round.txt in that directory;
            call it N. Your output file is plan-round-N/impact.json there, with N
            substituted for the actual number.
            The repository checkout is the "worktree" field of params.json in that
            same directory (you are NOT cwd'd there — cd into it for every command).

            Read plan.md in the artifacts directory and collect every existing
            symbol (function, class, method) that its ## Approach steps and ## Files
            entries propose to MODIFY. Symbols the plan creates from scratch have no
            callers yet and do not belong in the list.

            Self-gating rules, in order — no external gate skips you, so you skip
            yourself explicitly and visibly:
            1. If the plan modifies no existing symbol, write impact.json with
               "status": "SKIPPED" and an empty "symbols" array.
            2. If the gitnexus MCP tools (mcp__gitnexus__impact and friends) are not
               available in your session, write impact.json with
               "status": "UNAVAILABLE" and an empty "symbols" array.
            3. Otherwise call mcp__gitnexus__impact with
               {target: "<symbol>", direction: "upstream"} for each symbol, against
               the indexed repo "mono" (it covers api/ only), and record what comes
               back with "status": "GATHERED".

            impact.json is ALWAYS valid JSON and carries NO token prepended to it —
            the typed status line is this node's stdout only, never part of the file:
              {"status": "GATHERED|UNAVAILABLE|SKIPPED",
               "symbols": [{"name": "<symbol>",
                            "file": "<repo-relative path>",
                            "d1_callers": ["<caller symbol or path:line>", ...],
                            "risk": "LOW|MEDIUM|HIGH|CRITICAL"}]}
            Every d1_caller comes from tool output. Never invent one: a symbol the
            graph does not know gets an empty d1_callers list and risk "LOW", and the
            critic reads that as unprobed rather than as safe.

            Your FIRST output line is exactly one of:
              IMPACT=GATHERED symbols=<count>
              IMPACT=UNAVAILABLE <one-line reason>
              IMPACT=SKIPPED <one-line reason>
            Do not modify the repository or any file other than impact.json.
            End with the single line: IMPACT_DONE

        - id: plan-critic
          depends_on: [impact-probe]
          model: opus
          maxBudgetUsd: 4
          timeout: 900000
          prompt: |
            You are the plan CRITIC. Your only value is that you did not write this
            plan and have nothing to defend in it. Ask no questions. You are a critic
            ONLY: you write exactly one file and change nothing else.

            Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
            The round number is the contents of plan-round.txt there; call it N.
            Your output file is plan-round-N/critique.json in that directory, with N
            substituted for the actual number.
            The repository checkout is the "worktree" field of params.json in that
            same directory (you are NOT cwd'd there — cd into it for every command).
            The feature spec is the "spec" field of that same params.json.

            READ: the spec, plan.md, files-allowlist.json, web-files-allowlist.json,
            reader-audit.json, verify.json, kb-context.md, plan-round-N/impact.json, and the repository
            files the plan names.

            DO NOT READ any earlier round's critique.json or revision.json. You are
            deliberately blind to prior rounds: a critic that reads its own earlier
            findings starts defending them instead of re-deriving them from the plan
            actually in front of it.

            Do not modify the repository, plan.md, or any contract file.

            Rubric, in priority order.

            1. SCOPE CREEP (primary). For each ## Files entry and each ## Approach
               step, trace it to a spec requirement (quote the spec line), or to a
               code-derived necessity of an already-traced item (name the traced item
               and say why the code requires this: module registration, DTO, test
               file, caller). Raise kind "scope" only when NEITHER trace exists;
               evidence is the plan item plus the nearest spec line it fails to
               match. Categories: scope-exceeds-goals, indirect scope,
               framework-ahead-of-need, config or extensibility with no consumer,
               "while we're here" refactors and renames, edits outside the unit.
               The mirror of this check: a spec requirement with no plan item is
               kind "gap".
            2. REGRESSION POTENTIAL. For each impact.json symbol that has d1
               callers, every d1 caller must be named in ## Files or ## Test
               scenarios, or the plan must carry an explicit "unaffected because…"
               line for it; otherwise kind "regression". A shared writer or reader of
               a persisted column whose interpretation the plan changes and which
               reader-audit.json does not list is kind "regression". A HIGH or
               CRITICAL risk symbol with no mitigation (a flag, additive-only
               changes, a caller test) is kind "regression".
               If impact.json's "status" is UNAVAILABLE or SKIPPED, the caller half
               of this rule does not apply for this run — say so in your summary and
               still apply the reader-audit half.
            3. VERIFIABILITY. Test scenarios that cannot fail (they assert what the
               code does rather than what it must do, or they assert on a mock they
               themselves configured) are kind "verifiability". So is a verify.json
               pattern that selects zero spec files: check the patterns against the
               worktree before claiming this.
            4. PRE-MORTEM. Write three concrete scenarios in which this plan is
               executed exactly as written and the result is still wrong. Each names
               the step that fails and what breaks. Findings that fall out of these
               go in under whichever kind fits.

            Write plan-round-N/critique.json:
              {"verdict": "ACCEPT|REVISE|REJECT",
               "summary": "<two or three sentences>",
               "findings": [
                 {"kind": "scope|regression|gap|verifiability",
                  "severity": "P0|P1|P2",
                  "confidence": 50|75|100,
                  "section": "<the plan heading or file the finding is about>",
                  "evidence": [{"source": "spec|plan|impact|repo",
                                "quote": "<verbatim quote>"}],
                  "recommendation": "<what to change, in one or two sentences>"}]}
            Confidence is exactly 50, 75 or 100. Use 100 only when the evidence
            settles it and no reading of the spec rescues the plan item; 75 when you
            are confident but a trace you could not find might exist; 50 for a doubt
            worth recording that must not block.

            Verdict rules, applied mechanically to your own findings:
              REVISE — any P0 or P1 finding at confidence 75 or above.
              REJECT — a P0 scope finding at confidence 100 whose fix needs a
                       different unit shape rather than an edit to this one.
              ACCEPT — neither of the above.

            Writing the file is MANDATORY and comes BEFORE your final line; ending
            without it aborts the pipeline. Write it even when findings is empty.
            End with the single line: CRITIC_DONE

        - id: plan-critic-gate
          depends_on: [plan-critic]
          timeout: 120000
          bash: |
            set -euo pipefail
            N=$(cat "$ARTIFACTS_DIR/plan-round.txt" 2>/dev/null) || { echo "CRITIC_GATE=FAIL no plan-round.txt"; exit 1; }
            case "$N" in ''|*[!0-9]*) echo "CRITIC_GATE=FAIL plan-round.txt is not an integer: [$N]"; exit 1 ;; esac
            RD="$ARTIFACTS_DIR/plan-round-$N"
            test -s "$RD/critique.json" || { echo "CRITIC_GATE=FAIL no critique.json round=$N"; exit 1; }
            # parse-critique.py prints its own CRITIC_GATE=FAIL <reason> and exits 1
            # on a malformed envelope, and prints the CRITIQUE summary line on success.
            # A schema failure stops the group; the resume re-enters with a fresh
            # iteration and re-runs the critic, which is what makes this safe to fail.
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/parse-critique.py \
              "$RD/critique.json" --round "$N"

        - id: plan-revise
          depends_on: [plan-critic-gate]
          model: sonnet
          maxBudgetUsd: 3
          timeout: 900000
          prompt: |
            You are the plan REVISER. A critic in a separate session challenged the
            plan; your job is to answer it in the plan itself. Ask no questions.

            Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
            The round number is the contents of plan-round.txt there; call it N.
            The repository checkout is the "worktree" field of params.json in that
            same directory (you are NOT cwd'd there — cd into it for every command).
            The feature spec is the "spec" field of that same params.json.

            FIRST, before reading anything else, read the "verdict" field of
            plan-round-N/critique.json.

            If the verdict is REJECT, you are a NO-OP. Write
            plan-round-N/revision.json containing exactly
              {"applied": [], "declined": [], "skipped": "REJECT"}
            change no other file at all, and end. A REJECT means the critic thinks
            the unit has the wrong shape, and the human at the plan gate has to see
            that objection against the un-mutated plan rather than against your
            attempt to patch around it.

            If the verdict is ACCEPT, make no changes. Write
            plan-round-N/revision.json containing exactly
              {"applied": [], "declined": []}
            and end.

            Otherwise the verdict is REVISE. Read the spec, plan.md,
            files-allowlist.json, web-files-allowlist.json, verify.json,
            reader-audit.json, premises.json, plan-round-N/impact.json and the repository files involved. Then, for
            every finding at confidence 75 or 100, either apply it or decline it.

            Declining is allowed and sometimes correct, but it costs a citation: a
            verbatim spec quote, or a code-derived-necessity citation naming the
            traced plan item and the repository line that forces the item to exist.
            A scope finding resolves in exactly two ways — remove the item from the
            plan, or supply the trace the critic could not find. "It is useful" is
            not a trace.

            When you change the plan, keep every contract consistent with it in the
            same pass: files-allowlist.json lists every API path and
            web-files-allowlist.json lists every web-app path the revised plan
            touches and nothing more, verify.json's patterns still select every spec
            the revised unit touches and match the ## Verification commands exactly,
            reader-audit.json lists any column whose interpretation or presentation
            the revision changes, and any premise answer you alter keeps at least one
            citation whose quote appears VERBATIM in the file it names (verify that
            by reading the file). Findings at confidence 50 are advisory; act on them
            only if doing so costs nothing.

            Write plan-round-N/revision.json:
              {"applied": [{"kind": "<finding kind>", "severity": "<P0|P1|P2>",
                            "confidence": <50|75|100>, "section": "<finding section>",
                            "what_changed": "<one or two sentences>"}],
               "declined": [{"kind": "<finding kind>", "severity": "<P0|P1|P2>",
                             "confidence": <50|75|100>, "section": "<finding section>",
                             "justification": "<why the finding does not hold>",
                             "citation": {"source": "spec|repo",
                                          "quote": "<verbatim quote>"}}]}
            Copy kind, severity, confidence and section from the finding you are
            answering, unchanged: a downstream gate stops the run on a declined scope
            finding at confidence 100, and it can only see what you copy here.

            Do not touch the worktree or any repository file. Plans only.
            End with the single line: PLAN_REVISED round=N, with N substituted for the
            actual round number.

        - id: plan-converge
          depends_on: [plan-revise]
          timeout: 300000
          bash: |
            set -euo pipefail
            N=$(cat "$ARTIFACTS_DIR/plan-round.txt" 2>/dev/null) || { echo "PLAN_CONVERGE=FAIL no plan-round.txt"; exit 1; }
            # Same coercion as plan-round-pre: a non-integer operand makes `[ -ge ]`
            # return 2, which `if` reads as "not taken", switching the cap off silently.
            case "$N" in ''|*[!0-9]*) echo "PLAN_CONVERGE=FAIL plan-round.txt is not an integer: [$N]"; exit 1 ;; esac
            RD="$ARTIFACTS_DIR/plan-round-$N"
            # archon persists bash stderr but not stdout; tee the discriminator to a
            # file like review converge does (live 2026-08-29: RCA_PLAN_ROUND_CAP was invisible).
            exec > >(tee "$RD/converge.txt") 2>&1
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['verdict'])" "$RD/critique.json" 2>/dev/null || echo UNKNOWN)
            case "$V" in
              ACCEPT|REVISE|REJECT) ;;
              *) echo "PLAN_CONVERGE=FAIL unknown verdict [$V] round=$N"; exit 1 ;;
            esac
            test -s "$RD/revision.json" || { echo "PLAN_CONVERGE=FAIL no revision.json round=$N"; exit 1; }
            # 1. REJECT is a typed human stop. A one-unit plan has no automatic
            # transformation into a differently shaped one, so nothing here can fix it.
            # plan-revise is told to be a no-op on REJECT, but a prompt is a request,
            # not a guarantee, and the whole point of REJECT is that the human reads
            # the critic's objection against the plan the critic actually saw. So the
            # no-op is checked mechanically and reported either way, rather than
            # assumed: an unnoticed mutation here would silently defeat the stop.
            if [ "$V" = REJECT ]; then
              PM=NO
              cmp -s "$ARTIFACTS_DIR/plan.md" "$RD/plan.pre.md" || PM=YES
              AM=""
              for f in verify.json files-allowlist.json web-files-allowlist.json reader-audit.json premises.json smoke-probe.json; do
                CUR="$ARTIFACTS_DIR/$f"; PRE="$RD/pre-$f"
                if [ -f "$CUR" ] && [ -f "$PRE" ]; then
                  cmp -s "$CUR" "$PRE" || AM="$AM,$f"
                elif [ -f "$CUR" ] || [ -f "$PRE" ]; then
                  # Appeared or disappeared: a contract file's existence is part of it.
                  AM="$AM,$f"
                fi
              done
              AM="${AM#,}"; test -n "$AM" || AM=none
              echo "PLAN_REJECTED round=$N plan_mutated=$PM artifacts_mutated=$AM"
              exit 1
            fi
            # 2. The critic states its own verdict, so a critic that contradicts itself
            # would converge the loop on a plan carrying an unaddressed P0. Re-derive
            # the blocking count from the findings and refuse the mismatch; the group
            # fails, and the resume re-runs the critic, which is the fix.
            BLOCKING=$(python3 -c "import json,sys; f=json.load(open(sys.argv[1],encoding='utf-8')).get('findings') or []; print(sum(1 for x in f if isinstance(x,dict) and x.get('severity') in ('P0','P1') and int(str(x.get('confidence')))>=75))" "$RD/critique.json" 2>/dev/null) \
              || { echo "PLAN_CONVERGE=FAIL critique.json findings unreadable round=$N"; exit 1; }
            if [ "$V" = ACCEPT ] && [ "$BLOCKING" != 0 ]; then
              echo "CRITIC_GATE=FAIL verdict inconsistent round=$N declared ACCEPT with $BLOCKING blocking findings"
              exit 1
            fi
            # 3. ACCEPT converges, but only against the same shape contract
            # plan-snapshot enforced: the revisions of earlier rounds must not have
            # left plan.md or its contract files broken.
            if [ "$V" = ACCEPT ]; then
              SHAPE=0
              OUT=$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/plan-shape.sh \
                "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
              if [ "$SHAPE" != 0 ]; then
                printf '%s\n' "$OUT"
                echo "PLAN_CONVERGE=FAIL shape round=$N"
                exit 1
              fi
              echo "PLAN_CONVERGED round=$N"
              echo "<promise>PLAN_CONVERGED</promise>"
              exit 0
            fi
            # 4. A scope finding the critic is certain about, declined anyway, is a
            # disagreement between two sessions about what the spec asked for. That is
            # exactly the question a human is here to settle, so it stops the run.
            # revision.json is unvalidated model output and this stop is the only thing
            # reading it, so every shape error fails closed. Counting 0 on a missing or
            # mistyped field would turn the stop off exactly when it is most needed,
            # and confidence is coerced from its string form because a model that
            # writes "100" means 100.
            DISPUTE=$(python3 - "$RD/revision.json" <<'PY'
            import json, sys
            try:
                doc = json.load(open(sys.argv[1], encoding="utf-8"))
            except (OSError, ValueError) as e:
                sys.exit(f"unreadable: {e}")
            if not isinstance(doc, dict):
                sys.exit("top level is not an object")
            for key in ("applied", "declined"):
                if not isinstance(doc.get(key), list):
                    sys.exit(f"{key} is missing or not a list")
            n = 0
            for i, x in enumerate(doc["declined"]):
                if not isinstance(x, dict):
                    sys.exit(f"declined[{i}] is not an object")
                try:
                    conf = int(str(x.get("confidence")))
                except (TypeError, ValueError):
                    sys.exit(f"declined[{i}] confidence uncoercible: {x.get('confidence')!r}")
                if x.get("kind") == "scope" and conf == 100:
                    n += 1
            print(n)
            PY
            ) || { echo "PLAN_CONVERGE=FAIL revision.json malformed round=$N"; exit 1; }
            if [ "$DISPUTE" != 0 ]; then echo "PLAN_SCOPE_DISPUTE round=$N declined_scope_100=$DISPUTE"; exit 1; fi
            # 5. REVISE plus an untouched plan means another round would be identical.
            # plan.md is the plan here the way fix-plan.json is in the bugfix lane, so
            # an untouched plan.md still stops the loop — but the five snapshotted
            # contract files are reported the same way the bugfix lane reports them.
            # A reviser that answered a verifiability finding by rewriting verify.json
            # alone, or narrowed scope by editing files-allowlist.json alone, DID make
            # progress; without this list the operator reads a bare PLAN_NO_PROGRESS
            # and re-runs the same round instead of accepting the narrowed contract.
            if cmp -s "$ARTIFACTS_DIR/plan.md" "$RD/plan.pre.md"; then
              OTHER=""
              for f in verify.json files-allowlist.json web-files-allowlist.json reader-audit.json premises.json smoke-probe.json; do
                CUR="$ARTIFACTS_DIR/$f"; PRE="$RD/pre-$f"
                if [ -f "$CUR" ] && [ -f "$PRE" ]; then
                  cmp -s "$CUR" "$PRE" || OTHER="$OTHER,$f"
                elif [ -f "$CUR" ] || [ -f "$PRE" ]; then
                  # Appeared or disappeared: a contract file's existence is part of it.
                  OTHER="$OTHER,$f"
                fi
              done
              OTHER="${OTHER#,}"; test -n "$OTHER" || OTHER=none
              echo "PLAN_NO_PROGRESS round=$N other_mutated=$OTHER"
              exit 1
            fi
            # 6. Post-round cap, kept even though plan-round-pre checks it too:
            # max_iterations equals the cap, so without this the third progressing
            # round ends in Archon's native iteration-exhaustion error and the typed
            # token would only appear on the next resume.
            CAP=$(cat "$ARTIFACTS_DIR/plan-round-cap.txt" 2>/dev/null || echo 3)
            case "$CAP" in ''|*[!0-9]*) CAP=3 ;; esac
            if [ "$N" -ge "$CAP" ]; then
              # Accept by hand (RUNBOOK §3a): plan-accept.txt is a HUMAN act, the mirror of
              # rca-plan-accept.txt in the bugfix lane. It waives remaining P1/P2 findings at
              # the cap, never a P0 rated >=75 by the critic.
              if [ -f "$ARTIFACTS_DIR/plan-accept.txt" ]; then
                P0=$(python3 -c "import json,sys; f=json.load(open(sys.argv[1],encoding='utf-8')).get('findings') or []; print(sum(1 for x in f if isinstance(x,dict) and x.get('severity')=='P0' and int(str(x.get('confidence')))>=75))" "$RD/critique.json" 2>/dev/null || echo unreadable)
                if [ "$P0" = 0 ]; then
                  SHAPE=0
                  OUT=$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/plan-shape.sh \
                    "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
                  if [ "$SHAPE" != 0 ]; then printf '%s\n' "$OUT"; echo "PLAN_CONVERGE=FAIL shape round=$N (human accept)"; exit 1; fi
                  echo "PLAN_CONVERGED round=$N (human accepted at cap: $(head -1 "$ARTIFACTS_DIR/plan-accept.txt"))"
                  echo "<promise>PLAN_CONVERGED</promise>"
                  exit 0
                fi
                echo "PLAN_ROUND_CAP round=$N cap=$CAP (plan-accept.txt present but critique has P0=$P0 open at >=75; a P0 is never waivable)"
                exit 1
              fi
              echo "PLAN_ROUND_CAP round=$N cap=$CAP"; exit 1
            fi
            echo "PLAN_ROUND_PROGRESSED round=$N"

  - id: plan-post-snapshot
    depends_on: [plan-loop]
    timeout: 120000
    bash: |
      set -euo pipefail
      test -s "$ARTIFACTS_DIR/plan.md" || { echo "PLAN_POST_SNAPSHOT=FAIL no plan.md"; exit 1; }
      # The critic loop's output is the pre-image for doc-review, so docreview.diff
      # attributes only ce-doc-review's edits and not the critic rounds' revisions.
      cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-critic.md"
      echo "PLAN_POST_SNAPSHOT=OK rounds=$(cat "$ARTIFACTS_DIR/plan-round.txt" 2>/dev/null || echo 0)"

  - id: premise-strip
    depends_on: [plan-post-snapshot]
    timeout: 120000
    bash: |
      set -euo pipefail
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/strip-premise-answers.py \
        "$ARTIFACTS_DIR/premises.json" "$ARTIFACTS_DIR/premises-questions.json"
      echo "PREMISE_STRIP=OK"

  - id: premise-verify
    depends_on: [premise-strip]
    model: sonnet
    maxBudgetUsd: 3
    timeout: 1200000
    prompt: |
      You are the premise-verification node: a blind re-derivation check. The
      planner answered the spec's premise questions; your value is an answer
      derived from CODE with no exposure to the planner's reasoning, so the two
      can be compared. Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read ONLY premises-questions.json there, plus params.json for the
      "worktree" field — the repository checkout to read (you are NOT cwd'd
      there). You are FORBIDDEN from opening premises.json or plan.md until
      step 2 below.

      If premises-questions.json is an empty array, write an empty array []
      to premise-verify.json in that directory and end with the single line:
      PREMISE_VERIFY_DONE

      Step 1: answer each question independently by reading the worktree code.
      Every answer cites file:line evidence from files you actually opened.
      Write premise-verify.json to that directory FIRST, before step 2:
        [{"id": <n>, "answer": "<your independent answer>",
          "evidence": ["<repo-relative file>:<lines>", ...]}]

      Step 2: only after that file is written, read premises.json in that
      directory and compare per id. Rewrite premise-verify.json adding to each
      entry:
        "verdict": "agree" | "conflict" | "cannot_determine"
        "note": "<one line on why>"
      "conflict" means the code contradicts the planner's answer.
      "cannot_determine" means the code alone cannot settle the question.
      End with the single line: PREMISE_VERIFY_DONE

  - id: premise-gate
    depends_on: [premise-verify]
    timeout: 120000
    bash: |
      set -euo pipefail
      Q="$ARTIFACTS_DIR/premises-questions.json"
      V="$ARTIFACTS_DIR/premise-verify.json"
      NQ=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$Q")
      if [ "$NQ" = 0 ]; then echo "PREMISE_GATE=PASS (no premises declared)"; exit 0; fi
      test -s "$V" || { echo "PREMISE_GATE=FAIL no premise-verify.json"; exit 1; }
      python3 - "$Q" "$V" <<'PY'
      import json, sys
      qs = {q["id"] for q in json.load(open(sys.argv[1]))}
      byid = {v.get("id"): v for v in json.load(open(sys.argv[2]))}
      missing = qs - set(byid)
      assert not missing, f"ids not covered: {sorted(missing)}"
      allowed = {"agree", "conflict", "cannot_determine"}
      bad = sorted(i for i in qs if byid[i].get("verdict") not in allowed)
      assert not bad, f"verdict missing or out of enum for ids: {bad}"
      conflicts = sorted(i for i in qs if byid[i].get("verdict") == "conflict")
      if conflicts:
          for i in conflicts:
              print(f"PREMISE_CONFLICT id={i}")
          sys.exit(1)
      PY
      echo "PREMISE_GATE=PASS"

  - id: docreview
    depends_on: [plan-post-snapshot]
    model: sonnet
    maxBudgetUsd: 8
    timeout: 1800000
    skills: [ce-doc-review]
    prompt: |
      Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"
      Then invoke the ce-doc-review skill with arguments exactly:
        mode:headless <that directory>/plan.md
      This is an unattended pipeline invocation; ask no questions.
      Relay the skill's full output verbatim as your own output.

  - id: docreview-gate
    depends_on: [docreview]
    timeout: 120000
    bash: |
      set -uo pipefail
      OUT=$docreview.output
      printf '%s\n' "$OUT" > "$ARTIFACTS_DIR/docreview-envelope.txt"
      printf '%s' "$OUT" | grep -q 'Review complete' || { echo "DOCREVIEW_GATE=FAIL no terminal signal"; exit 1; }
      printf '%s' "$OUT" | grep -q 'Review failed: headless mode requires a document path' && { echo "DOCREVIEW_GATE=FAIL refusal"; exit 1; }
      # Diff against the post-critic snapshot, not plan.pre.md: the critic loop
      # already rewrote the plan, and attributing its revisions to doc-review would
      # put edits in the REVIEW section that ce-doc-review never made.
      diff -u "$ARTIFACTS_DIR/plan.post-critic.md" "$ARTIFACTS_DIR/plan.md" > "$ARTIFACTS_DIR/docreview.diff" && echo "DOC_CHANGED=NO" || echo "DOC_CHANGED=YES"
      cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-docreview.md"
      echo "DOCREVIEW_GATE=PASS"

  - id: plan-render
    depends_on: [docreview-gate, premise-gate]
    model: sonnet
    maxBudgetUsd: 3
    timeout: 900000
    prompt: |
      You are the plan-presentation node. The human plan review is the single
      highest-leverage moment in this pipeline: one wrong plan line becomes a
      thousand wrong code lines, and the review is only real if the reviewer can
      actually absorb the plan in two minutes. Your job is to make that possible.
      Ask no questions.

      Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
      Read plan.md, docreview.diff, docreview-envelope.txt, plan-round.txt with
      the plan-round-N/ directories it implies, and (when present and non-empty)
      premise-verify.json there.
      Write a single self-contained plan-review.html to that directory.
      Do NOT modify plan.md or any other file. No external resources in the HTML.

      The page has exactly these sections, in order, each wrapped in an HTML
      comment marker so a gate can verify them:
      <!-- GIST --> The gist, bro register: explain the plan like you would to a
      smart friend over a beer. Simpler, not necessarily shorter; the bar is
      impossible to misunderstand, five sentences maximum. What gets built, what
      it touches, what the riskiest assumption is. Casual connective language is
      fine ("basically", "the point is"), memes are not. Every path, command,
      and number stays exactly as written in the plan. Flat prose, no nesting.
      <!-- KB --> What the knowledge base said: the prior decisions that
      constrain this plan and whether the plan honors them, the domain terms it
      leans on, and any recorded footguns nearby, drawn from kb-context.md in
      the same directory. If the scout found nothing, one sentence saying so.
      <!-- MAP --> A visual map, show-me style: pick the smallest views that make
      the plan's shape obvious and place each beside one short supporting sentence.
      Use a shallow file tree of the files to be touched (with one-line
      responsibility comments), a diff-shaped sketch of the key code change (the
      target shape, not full code), and the implementation units as ordered pills.
      Simple inline CSS, one accent color, readable in BOTH light and dark (custom
      properties on :root, overridden under @media (prefers-color-scheme: dark)).
      Identity by label, never color alone. Real names and paths only.
      <!-- PLAN --> The full plan, restyled for reading: keep every path,
      command, number, and decision VERBATIM, but present the prose cleanly.
      <!-- REVIEW --> What doc-review changed or flagged, in plain words: applied
      edits summarized from docreview.diff; unapplied findings from the envelope
      with their severity, one line each. If nothing, say so.
      When premise-verify.json exists and is non-empty, add a short "Premise
      check" block here: one line per premise (its id, the question's gist, the
      verdict agree/conflict/cannot_determine, and the verifier's note), so the
      human sees where the blind re-derivation agreed with the planner and
      where it could not settle the question. Skip the block entirely when
      there are no premises.
      <!-- CRITIC --> What the plan critic found, before doc-review ever saw the
      plan. Read plan-round.txt for the number of rounds the critic loop ran,
      then for each round R from 1 to that number read plan-round-R/critique.json,
      plan-round-R/revision.json and plan-round-R/impact.json. Open with one
      table, a row per round: the round number, the critic's verdict, and the
      count of findings still open at P0 or P1 broken out by kind (scope,
      regression, gap, verifiability). Then quote the FINAL round's declined
      findings in full: for each one, the critic's evidence quote and the
      reviser's justification quote, both verbatim, so the human is judging the
      actual disagreement rather than a summary of it. If nothing was declined,
      one sentence saying so. Close with an impact table built from the final
      round's impact.json: each symbol, its d1 callers, and where the plan covers
      each caller (a ## Files entry, a test scenario, or an explicit "unaffected
      because" line). If that file's "status" is UNAVAILABLE or SKIPPED, say that
      in one sentence and skip the table, because a reader must never mistake an
      unprobed plan for a plan with no callers. If plan-round.txt does not exist,
      one sentence saying the critic loop did not run.
      <!-- DECIDE --> The decision box: approving starts unattended
      implementation, and rejecting ends the run.
      Then, in the same box, the standard decision block that every gate
      packet carries. Resolve this run's id by running: basename "$ARTIFACTS_DIR"
      and use that literal id in every command below. Never print the
      placeholder <run-id>. Lead with one sentence saying the run is paused
      because it finished this stage and is now waiting on a person, which is
      how the stage is supposed to end and not a failure. Then the three
      commands, each in its own code chip with a short label saying when to
      pick it:
        DISABLE_OMC=1 archon workflow approve <id> </dev/null >/tmp/archon-approve.log 2>&1 &
        DISABLE_OMC=1 archon workflow reject <id> "why you are stopping it"
        DISABLE_OMC=1 archon workflow abandon <id>
      Say that approve runs the rest of the workflow inside the terminal it is
      typed in and holds that terminal until the run ends, which is why it is
      backgrounded, and that a failed resume still leaves the approval
      recorded so archon workflow resume <id> picks it up. Say that reject
      records the reason typed after it and sends the plan back for one
      revision pass: the run reworks it against that reason and pauses here
      again, so reject holds the terminal exactly the way approve does and
      wants the same backgrounding. Say the third rejection cancels the run
      instead of reworking, and that abandon ends the run outright with no
      rework. Files already written stay on disk either way. Close with one
      line: these three verbs do not appear in archon --help, but they are
      real.

      Writing rules for every section: plain sentences with varied length; no
      em dashes; no vocabulary like "crucial", "leverage", "robust", "seamless",
      "comprehensive"; no emoji; no bullet fragments crammed with figures; every
      number gets a consequence or comparison in the same sentence.
      End your reply with the single line: PLAN_RENDER_DONE

  - id: plan-render-gate
    depends_on: [plan-render]
    timeout: 120000
    bash: |
      set -euo pipefail
      H="$ARTIFACTS_DIR/plan-review.html"
      test -s "$H" || { echo "RENDER_GATE=FAIL no plan-review.html"; exit 1; }
      for m in GIST KB MAP PLAN REVIEW CRITIC DECIDE; do
        grep -q "<!-- $m -->" "$H" || { echo "RENDER_GATE=FAIL missing section $m"; exit 1; }
      done
      RID="$(basename "$ARTIFACTS_DIR")"
      grep -qF "$RID" "$H" || { echo "RENDER_GATE=FAIL DECIDE box does not carry this run's id verbatim"; exit 1; }
      for v in approve reject abandon; do
        grep -qF "archon workflow $v" "$H" || { echo "RENDER_GATE=FAIL DECIDE box missing the $v command"; exit 1; }
      done
      cmp -s "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/plan.post-docreview.md" || { echo "RENDER_GATE=FAIL renderer modified plan.md"; exit 1; }
      # show-me: put the packet in front of the human exactly when the gate pauses.
      # xdg-open first: on some Linux distros /usr/bin/open is util-linux's link to
      # openvt(1) — a different program, not a missing one. The file:// path is
      # printed unconditionally; "opened in browser" is claimed only when true.
      OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
      OPENED=no
      if [ -n "$OPENER" ] && "$OPENER" "$H" >/dev/null 2>&1; then OPENED=yes; fi
      if [ "$OPENED" = yes ]; then
        echo "RENDER_GATE=PASS packet=file://$H (opened in browser)"
      else
        echo "RENDER_GATE=PASS packet=file://$H (no browser opener — open that path yourself)"
      fi

  - id: plan-gate
    depends_on: [plan-render-gate]
    approval:
      message: "Plan review packet ready: open <this run's ARTIFACTS_DIR>/plan-review.html in a browser (raw plan.md + docreview.diff alongside). The run is paused, which is how this stage is meant to end, not a failure; nothing degrades while it waits. The packet's DECIDE box has the three commands with this run's id filled in: approve continues (background it, it holds the terminal), reject records your reason and sends the work back for one revision pass, then pauses here again (it holds the terminal the way approve does, so background it too; the third rejection cancels the run instead of reworking), abandon ends the run outright. None of the three appear in archon --help; they are real."
      on_reject:
        max_attempts: 3
        prompt: |
          The human rejected this plan at the gate. Their reason, verbatim:

          $REJECTION_REASON

          Revise the plan so it answers that. You are the ONLY node that runs
          before the gate pauses again. No upstream node re-runs, so anything
          you do not update yourself stays stale, and no gate re-checks your
          output.

          Work in $ARTIFACTS_DIR.
          1. Read plan.md, files-allowlist.json, web-files-allowlist.json,
             reader-audit.json, premises.json, docreview-envelope.txt, and
             plan-review.html.
          2. Rewrite plan.md to address the rejection and nothing else. Change
             only what the feedback requires. If the feedback asks a question
             rather than giving an instruction, answer it inside the plan.
