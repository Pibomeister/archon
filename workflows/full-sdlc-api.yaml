      echo "JOINT_INTEGRATION=PASS evidence=$ARTIFACTS_DIR/integration-evidence.json"

  - id: implement
    depends_on: [plan-gate, implementation-ready]
    trigger_rule: none_failed_min_one_success
    when: "$feature-phase.implement == 'yes'"
    model: sonnet
    maxBudgetUsd: 8
    timeout: 1800000
    prompt: |
      Implement the API portion of the approved cross-repository plan at plan.md
      inside the directory named by ARTIFACTS_DIR (resolve via: echo
      "$ARTIFACTS_DIR"). Read the whole plan first, including the web section,
      but modify only the API paths allowed by files-allowlist.json.

      The working tree is the "worktree" field of params.json in that same
      directory (you are NOT cwd'd there; cd for every command).

      Scope: change only API files listed in files-allowlist.json. Do not refactor adjacent code or touch web-app.
      JOINT-REPOSITORY RUNS: when candidate-inputs.json exists in ARTIFACTS_DIR,
      read it before editing. It maps approved direct dependencies to exact local
      candidate worktrees, candidate heads, artifact directories, and interface
      artifacts with sha256 hashes. Consume those exact local inputs only; do not
      require or assume an upstream PR, merge, publication, deployment, or newer
      repository state.
      OTHER REPOSITORIES: when params.json's "repo" is not "api", the opening
      "Implement the API portion" sentence and the "Scope:" line are scoped to api
      runs (the JOINT-REPOSITORY RUNS paragraph applies to every repository).
      files-allowlist.json is then the entire scope,
      its paths are relative to that repository's root, and there is no web-app
      prong to avoid. Use that repository's own commands, listed below.
      Do not edit the plan file. Do not create commits — a later node commits.
      Do not create branches or worktrees — you are already on the correct branch.
      If the unit's work already exists and satisfies Verification, say so and stop;
      do not reimplement.
      REOPENED STAGES: when reopen-context.json exists in ARTIFACTS_DIR, this run
      was dispatched by feature-reopen and that file is MANDATORY work, not
      background. The worktree HEAD is the previous candidate ("previous_head"):
      the approved plan is already implemented there, so the "already exists, say
      so and stop" rule above does NOT apply to it. Read "reason" and every file
      under "evidence" (the stopped run's failing output) first, then change the
      candidate so the stated failure cannot recur, with a test that fails
      without your change. gate-tests fails this run with
      "IMPLEMENT=FAIL reopen produced no change" if the worktree is unchanged.
      The fix stays inside files-allowlist.json. If it genuinely needs a file
      outside that list, do not edit that file: write its repo-relative path (one
      per line) to reopen-blocked.txt in ARTIFACTS_DIR and stop; a human decides
      whether to amend scope.

      <repo-conventions repo="api">
      Package manager: bun@1.3.10. Node 22.16.0.
      Unit tests: `bun run test "<pattern>"` — NEVER bare `bun test`: `test` is a bun
      builtin, so bare `bun test` runs bun's own runner instead of jest and silently
      breaks the suite's mocks (api/CLAUDE.md:32 documents the bare form; it is wrong).
      Typecheck: `bun run typecheck` (tsgo) — NOT build:fast (esbuild-only).
      Lint: `bun run lint` (biome).
      Integration tests: do NOT run any in this node, except that a REOPENED stage whose
      reopen-context.json evidence is an integration failure may re-run THAT spec, and
      only through the host e2e mutex (use a long Bash timeout; it may print
      E2E_MUTEX=WAITING while another run holds the stack):
        bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/e2e-mutex.sh run "$ARTIFACTS_DIR" -- bun run test:integration -- <spec>
      Never run `bun run test:integration`, `test:e2e`, or `docker-compose -f
      local-env-compose.e2e.yaml` directly: jest's globalSetup runs `down -v` then
      `up` on ONE machine-global e2e stack (54322/8001) that concurrent runs share.
      Nest Swagger: always explicit request/response DTO classes; never generic Object
      schemas. TypeScript strict; no `any`; unit specs live in `__tests__/` dirs.
      </repo-conventions>

      <repo-conventions repo="goodword-mcp">
      Use this block INSTEAD of the api one when params.json's "repo" is
      "goodword-mcp". params.json is authoritative; do not mix the two.
      Package manager: pnpm@10.12.1 (never bun). Node 20 — the system default is
      newer, so prefix every command with `mise x node@20 --`.
      Typecheck: `mise x node@20 -- pnpm exec tsc --noEmit`. There is NO `typecheck`
      script; `build` is `tsc && copy-static-assets`, so --noEmit IS the typecheck.
      Lint: THERE IS NONE. Do not invent one, and do not list one under Verification.
      Unit tests: `mise x node@20 -- pnpm test:unit` for the whole suite. For a
      pattern, the gate runs the full form with NODE_OPTIONS: jest is configured as
      ts-jest/presets/default-esm, and without
      `NODE_OPTIONS=--experimental-vm-modules` every suite dies with "Cannot use
      import statement outside a module" — a failure that looks like a broken test.
      Test files are `*.unit.test.ts` under `tests/` or `src/**/__tests__/`.
      `*.e2e.test.ts` and `*.smoke.test.ts` need a live API and a token; the gate
      excludes them and this node must not run them.
      Transport is httpStream at /mcp with WorkOS bearer auth. TypeScript strict.
      </repo-conventions>

      Before finishing, write a ONE-LINE conventional commit message for this
      change (feat|fix(scope): description — no body, no attribution) to
      commit-msg.txt in the artifacts directory. A later node commits with it.

      Done when: every item under Verification is satisfied and the three Verification
      commands exit 0 in the working tree, and commit-msg.txt exists.
      "Three" is the api count. For any other repo the count is whatever the plan's
      Verification section lists for that repository — two where there is no lint —
      and the requirement is that EVERY listed command exits 0, not that there are
