      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-implementation-ready.out") 2> >(tee -a "$ARTIFACTS_DIR/node-implementation-ready.out" >&2); fi
      eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
      test "${ARCHON_FEATURE_SCOPE-}" = repositories || { echo "IMPLEMENTATION_READY=FAIL missing repository feature scope"; exit 1; }
      test "${ARCHON_FEATURE_PHASE-}" = implement || { echo "IMPLEMENTATION_READY=FAIL phase is not implement"; exit 1; }
      test -n "${ARCHON_FEATURE_REPO-}" || { echo "IMPLEMENTATION_READY=FAIL missing ARCHON_FEATURE_REPO"; exit 1; }
      test "$REPO" = "$ARCHON_FEATURE_REPO" || { echo "IMPLEMENTATION_READY=FAIL params repo=$REPO env repo=$ARCHON_FEATURE_REPO"; exit 1; }
      test "$WT" = "${ARCHON_FEATURE_WORKTREE-}" || { echo "IMPLEMENTATION_READY=FAIL params worktree is not controller-pinned"; exit 1; }
      git -C "$WT" rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "IMPLEMENTATION_READY=FAIL pinned worktree missing"; exit 1; }
      echo "IMPLEMENTATION_READY=PASS repo=$REPO worktree=$WT"

  - id: joint-integration
    depends_on: [feature-phase]
    when: "$feature-phase.integration == 'yes'"
    # 60 min: the runner may queue up to ARCHON_E2E_WAIT_SECONDS (30 min) for the
    # shared e2e stack before its commands run; at 30 min the node would die
    # before E2E_MUTEX=FAIL timeout could print.
    timeout: 3600000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-joint-integration.out") 2> >(tee -a "$ARTIFACTS_DIR/node-joint-integration.out" >&2); fi
      test "${ARCHON_FEATURE_SCOPE-}" = repositories || { echo "JOINT_INTEGRATION=FAIL missing repository feature scope"; exit 1; }
      test "${ARCHON_FEATURE_PHASE-}" = integration || { echo "JOINT_INTEGRATION=FAIL phase is not integration"; exit 1; }
      test -s "$ARTIFACTS_DIR/joint-plan.json" || { echo "JOINT_INTEGRATION=FAIL no joint-plan.json"; exit 1; }
      test -s "$ARTIFACTS_DIR/candidate-revisions.json" || { echo "JOINT_INTEGRATION=FAIL no candidate-revisions.json"; exit 1; }
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/validate-joint-plan.py "$ARTIFACTS_DIR"
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/run-joint-integration.py --artifacts "$ARTIFACTS_DIR"
      python3 - "$ARTIFACTS_DIR/integration-evidence.json" <<'PY'
      import json, sys
      evidence = json.load(open(sys.argv[1], encoding="utf-8"))
      if evidence.get("status") != "passed" or not evidence.get("tests"):
          raise SystemExit("JOINT_INTEGRATION=FAIL integration evidence is not passing")
