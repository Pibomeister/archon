  - id: deslop
    depends_on: [gate-tests]
    model: sonnet
    maxBudgetUsd: 4
    timeout: 1200000
    prompt: |
      You are the deslop WRITER node in an unattended pipeline: you clean the
      AI slop out of the implementation BEFORE any commit reaches the code
      review loop. Ask no questions.

      Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

      The repository checkout is the "worktree" field of params.json in that
      same directory (you are NOT cwd'd there — cd into it for every git
      command). It is already on the branch to be cleaned.

      SCOPE — the files you may touch are exactly the intersection of:
        (a) files changed or untracked since the base sha in bootstrap-head.txt
            (in the worktree: git status --porcelain, and
             git diff --name-only "$(cat <that directory>/bootstrap-head.txt)"
             — anchored at the base sha, NOT at HEAD: the implementation is not
             committed yet, so a ..HEAD range would always come back empty),
        (b) the paths listed in files-allowlist.json in the artifacts directory.
      Nothing else. The implementation is UNCOMMITTED here, so the working tree
      — untracked files included — is the subject, not a HEAD-anchored diff.

      POSTURE (from ai-slop-cleaner):
      - Preserve behavior. This is a cleanup pass, not a redesign.
      - Plan before you edit: read the whole changed surface first, list the
        smells you intend to remove, then edit.
      - One smell-pass at a time. Do not interleave unrelated cleanups.
      - Re-run targeted verification after each pass (see VERIFICATION).
      - Never expand scope. A smell outside the scope above is REPORTED, not fixed.

      TAXONOMY (from ai-slop-cleaner): duplication; dead code; needless
      abstraction; boundary violations.

      Plus these FIVE GUARDS, which are the point of this node:

      1. CYCLOMATIC COMPLEXITY — a *new* function above 10, or a changed
         function whose complexity the diff *raised* above 10: flatten it
         (early returns, table dispatch). A pre-existing function already above
         10 that the diff did not worsen: leave it, report it.
      2. TAUTOLOGICAL TESTS — a test that asserts a value against itself, or
         whose only matchers are toBeDefined / toBeTruthy / not.toThrow, or that
         asserts on a mock's return value, or that has no assertion at all. Fix
         it by asserting the observable value; if no observable value exists,
         DELETE the test and say so.
      3. YAGNI — parameters, options, branches, exports, types and config with
         no caller in the diff or anywhere in the repo: delete them.
      4. OPEN/CLOSED — where the change special-cases an existing dispatch
         (a switch, an if-chain, a registry) and an extension point already
         exists, use the extension point. Do NOT *introduce* an extension point
         for a single consumer.
      5. NARRATING COMMENTS — comments that restate the code, narrate the change,
         or preserve task history; banner comments; JSDoc that repeats the
         signature; any added TODO. Delete them. KEEP comments that explain
         *why*, or record an invariant or a constraint.

      GATING RULES (verbatim from ce-simplify-code, and they override the guards
      wherever they conflict):
      - Never simplify away a safety check.
      - LOC removed is not the metric.

      MUST NOT:
      - Change public API shapes (exported signatures, DTOs, route contracts,
        response bodies). If a guard would require that, report it instead.
      - Touch any file outside the scope intersection above.
      - Touch commit-msg.txt.
      - Create commits, branches or worktrees. A later node commits.

      VERIFICATION — after your passes, in the worktree, these must exit 0:
        bun run typecheck     (tsgo — NOT build:fast)
        bun run lint          (biome)
        bun run test -- "<pattern>"  for each pattern in test_patterns in
                              verify.json in the artifacts directory.
      NEVER run bare `bun test`: `test` is a bun builtin, so the bare form runs
      bun's own runner instead of jest and silently breaks the suite's mocks.
      Do not run integration tests in this node.

      Write deslop-result.json to the artifacts directory, with exactly this shape:
        {"changed_files": ["<repo-relative>", ...],
         "passes": [{"guard": "complexity|tautological_tests|yagni|open_closed|comments",
                     "file": "<repo-relative>", "line": <int>,
                     "action": "deleted|rewrote|kept", "reason": "<one line>"}],
         "reported_not_fixed": [{"guard": "<one of the five>",
                                 "file": "<repo-relative>", "line": <int>,
                                 "reason": "<why it was not fixed>"}],
         "verification": {"typecheck": <int exit code>, "lint": <int exit code>,
                          "tests": <int exit code>}}
      Writing this file is MANDATORY and comes BEFORE your final line — ending
      without it aborts the pipeline. Write it even when every array is empty.
      Then end with the single line: DESLOP_DONE

  - id: deslop-verify
    depends_on: [deslop]
    loop_group:
      max_iterations: 2
      until: DESLOP_CLEAN
      nodes:
        - id: deslop-recheck
          timeout: 1200000
          bash: |
            set -euo pipefail
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            # The writer ran a full agent session against this worktree; any .omc
            # it left is runtime-state leakage, never work product (same guard as
            # gate-tests). It must go BEFORE the checkpoint or it is snapshotted.
            rm -rf .omc
            # Durable round counter: survives resumes, unlike the loop's own
            # iteration index. Artifacts are round-scoped so a hand fix + resume
            # cannot read the previous round's verification as its own.
            C="$ARTIFACTS_DIR/deslop-round.txt"
            N=$(cat "$C" 2>/dev/null || echo 0)
            # Hand-editable counter: reject junk before it is incremented or used as a path.
            case "$N" in '') N=0 ;; *[!0-9]*) echo "DESLOP_RECHECK=FAIL deslop-round.txt is not an integer: [$N]"; exit 1 ;; esac
            N=$((N+1)); echo "$N" > "$C"
            RD="$ARTIFACTS_DIR/deslop-round-$N"; mkdir -p "$RD"
            BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
            # Every check runs even after one fails: recheck.json is the reviewer's
            # authoritative verification record and must carry all five exit codes.
            TC=0; bun run typecheck > "$RD/typecheck.txt" 2>&1 || TC=$?
            LT=0; bun run lint > "$RD/lint.txt" 2>&1 || LT=$?
            # Materialize the patterns first. Piping the extractor straight into the
            # loop would let a verify.json parse failure feed the loop nothing, and a
            # gate that silently runs zero tests reports PASS for the wrong reason.
            python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
              "$ARTIFACTS_DIR/verify.json" > "$RD/patterns.txt" \
              || { echo "DESLOP_GATE=FAIL verify.json unreadable round=$N"; exit 1; }
            test -s "$RD/patterns.txt" || { echo "DESLOP_GATE=FAIL verify.json has no test_patterns round=$N"; exit 1; }
            UT=0
            while IFS= read -r PAT; do
              test -n "$PAT" || continue
              bun run test -- "$PAT" >> "$RD/test.txt" 2>&1 || UT=$?
            done < "$RD/patterns.txt"
            SC=0
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
              "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$BASE" > "$RD/scope.txt" 2>&1 || SC=$?
            # Delta-only: check-slop compares the base tree to the WORKING tree
            # (untracked included), never base..HEAD — the implementation is not
            # committed until commit-impl, so a HEAD-anchored diff would be empty.
            SL=0
            python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-slop.py \
              "$WT" "$BASE" --max-complexity 10 > "$RD/slop.txt" 2>&1 || SL=$?
            python3 - "$RD/recheck.json" "$TC" "$LT" "$UT" "$SC" "$SL" <<'PY'
            import json, sys
            path, tc, lt, ut, sc, sl = sys.argv[1:7]
            json.dump({"typecheck": int(tc), "lint": int(lt), "tests": int(ut),
                       "scope": int(sc), "slop": int(sl)}, open(path, "w"), indent=2)
            PY
            cat "$RD/slop.txt" || true
            test "$TC" = 0 || { echo "DESLOP_GATE=FAIL typecheck round=$N"; tail -40 "$RD/typecheck.txt"; exit 1; }
            test "$LT" = 0 || { echo "DESLOP_GATE=FAIL lint round=$N"; tail -40 "$RD/lint.txt"; exit 1; }
            test "$UT" = 0 || { echo "DESLOP_GATE=FAIL unit round=$N"; tail -40 "$RD/test.txt"; exit 1; }
            test "$SC" = 0 || { echo "DESLOP_GATE=FAIL scope round=$N"; cat "$RD/scope.txt"; exit 1; }
            test "$SL" = 0 || { echo "DESLOP_GATE=FAIL slop round=$N"; exit 1; }
            # The writer's own "verification" block is historical (a hand fix on
            # resume would leave it stale), so this is a shape check only —
            # recheck.json above is what the reviewer is told to trust.
            RJ="$ARTIFACTS_DIR/deslop-result.json"
            test -s "$RJ" || { echo "DESLOP_GATE=FAIL no deslop-result.json round=$N"; exit 1; }
            python3 -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert isinstance(d, dict); assert isinstance(d.get('changed_files'), list); assert isinstance(d.get('passes'), list)" \
              "$RJ" || { echo "DESLOP_GATE=FAIL deslop-result.json unparseable round=$N"; exit 1; }
            # Restorable checkpoint, not just a fingerprint. A throwaway index
            # turns the whole worktree — untracked implementation files included —
            # into a real tree object in this repo's object DB, so a reviewer that
            # edits or deletes files is not only DETECTED but UNDOABLE. HEAD sha
            # and the live index tree go in too: a reviewer that commits or stages
            # without changing content leaves `git status --porcelain` identical,
            # so porcelain alone is not enough.
            rm -f "$RD/index"
            GIT_INDEX_FILE="$RD/index" git add -A || { echo "DESLOP_GATE=FAIL checkpoint add round=$N"; exit 1; }
            CKTREE=$(GIT_INDEX_FILE="$RD/index" git write-tree) \
              || { echo "DESLOP_GATE=FAIL checkpoint write-tree round=$N"; exit 1; }
            test -n "$CKTREE" || { echo "DESLOP_GATE=FAIL checkpoint empty tree sha round=$N"; exit 1; }
            echo "$CKTREE" > "$RD/checkpoint-tree.txt"
            # Belt: the bytes survive even a worktree wipe that takes the object DB.
            git archive "$CKTREE" > "$RD/checkpoint.tar" \
              || { echo "DESLOP_GATE=FAIL checkpoint archive round=$N"; exit 1; }
            CKHEAD=$(git rev-parse HEAD) || { echo "DESLOP_GATE=FAIL checkpoint rev-parse round=$N"; exit 1; }
            CKINDEX=$(git write-tree) || { echo "DESLOP_GATE=FAIL checkpoint live-index tree round=$N"; exit 1; }
            {
              echo "head=$CKHEAD"
              echo "index=$CKINDEX"
              echo "checkpoint=$CKTREE"
            } > "$ARTIFACTS_DIR/deslop-tree.txt"
            FILES=$(sed -n 's/^SLOP=OK files=\([0-9]*\)$/\1/p' "$RD/slop.txt" | tail -1)
            test -n "$FILES" || FILES=0
            echo "DESLOP_GATE=PASS files=$FILES round=$N checkpoint=$CKTREE"

        - id: deslop-review
          depends_on: [deslop-recheck]
          model: sonnet
          maxBudgetUsd: 2
          timeout: 600000
          prompt: |
            You are the deslop REVIEWER node. You are a reviewer ONLY: the writer
            that cleaned this code was a different session, and you must not become
            its author. Ask no questions.

            YOU MUST NOT EDIT ANYTHING. Do not modify, create or delete any file in
            the repository. Do not stage anything, do not commit, do not run any
            command that writes to the worktree. The next node fingerprints the
            worktree (HEAD sha, index tree, and a full-tree checkpoint taken before
            you started) and fails the run if a single byte moved. The ONLY file you
            write is deslop-review.json in the artifacts directory.

            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

            The repository checkout is the "worktree" field of params.json in that
            same directory (you are NOT cwd'd there — cd into it for every git
            command).

            READ, in this order:
            - the current round number in deslop-round.txt in the artifacts directory
              (call it N), then deslop-round-N/recheck.json there. That file is the
              AUTHORITATIVE verification record: {"typecheck","lint","tests","scope",
              "slop"} exit codes, all zero.
            - deslop-result.json in the artifacts directory — the writer's own log of
              what it changed. Its "verification" block is HISTORICAL and may be stale
              (a human may have hand-fixed and resumed); recheck.json overrides it.
            - the change itself, in the worktree:
                git diff "$(cat <that directory>/bootstrap-head.txt)"
                git status --porcelain
