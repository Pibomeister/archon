            case "$R" in ''|*[!0-9]*) echo "DESLOP_FIX=FAIL deslop-fix-pending.txt is not an integer: [$R]"; exit 1 ;; esac
            test -s "$ARTIFACTS_DIR/deslop-round-$R/blocking-findings.json" \
              || { echo "DESLOP_FIX=FAIL no blocking-findings.json for round=$R"; exit 1; }
            # A result left by an earlier fixer attempt must not satisfy this one.
            rm -f "$ARTIFACTS_DIR/deslop-fix-result.json"
            printf '{"fix":"pending","round":"%s"}\n' "$R"

        - id: deslop-fix
          depends_on: [deslop-fix-pre]
          when: "$deslop-fix-pre.output.fix == 'pending'"
          model: sonnet
          maxBudgetUsd: 4
          timeout: 1200000
          prompt: |
            You are the deslop FIXER node in an unattended pipeline. The independent
            deslop reviewer filed blocking findings against the deslop writer's
            cleanup. You apply exactly those findings and nothing else, then the
            recheck and a fresh reviewer run again. Ask no questions.

            Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

            The working tree is the "worktree" field of params.json in that same
            directory (you are NOT cwd'd there — cd into it for every git command).

            READ:
            - deslop-fix-pending.txt in the artifacts directory: the round number R
              whose review blocked.
            - deslop-round-R/blocking-findings.json there: {"round": R, "findings": [
              {"guard", "file", "line", "confidence", "evidence"}]}. These findings are
              the ONLY things you fix; the gate has already dropped non-blocking ones.
            - deslop-result.json there: the writer's log of what it changed.

            SCOPE — the same as the writer's: the intersection of
              (a) files changed or untracked since the base sha in bootstrap-head.txt
                  (git status --porcelain, and
                   git diff --name-only "$(cat <that directory>/bootstrap-head.txt)"),
              (b) the paths listed in files-allowlist.json in the artifacts directory.
            The implementation is still UNCOMMITTED; the working tree is the subject.

            Apply the matching guard's fix to each finding:
              complexity — flatten the function (early returns, table dispatch).
              tautological_tests — assert the observable value; if none exists,
                delete the test.
              yagni — delete the parameter, option, branch, export, type or config
                that has no caller.
                APPROVED CONTRACTS: a symbol contract-symbols.json lists for that
                file is an approved plan contract: put it under "not_fixed".
              open_closed — use the extension point that already exists.
              comments — delete the comment that restates the code, narrates the
                change or preserves task history. Keep comments that explain *why*.

            RULES — the writer's rules still bind you:
            - Preserve behavior. Never simplify away a safety check. LOC removed is
              not the metric.
            - Do not change public API shapes (exported signatures, DTOs, route
              contracts, response bodies); a finding that would require it goes under
              "not_fixed".
            - Do not touch any file outside the scope above, do not touch
              commit-msg.txt, and do not create commits, branches or worktrees.
            - Do not fix, rewrite or reformat anything the findings do not name. A
              finding outside the scope above goes under "not_fixed".

            VERIFICATION — after your edits, in the worktree, these must exit 0:
              bun run typecheck     (tsgo — NOT build:fast)
              bun run lint          (biome)
              bun run test -- "<pattern>"  for each pattern in test_patterns in
                                    verify.json in the artifacts directory.
            For a run whose params.json "repo" is not "api", use that repository's
            commands, listed under ## Verification in plan.md, and omit any command the
            repository does not have. NEVER run bare `bun test`. Do not run integration
            tests (bare `bun run test:integration` tears down the machine-global e2e
            stack other runs are using). The next node re-runs every check authoritatively either way.

            Do NOT edit deslop-result.json. It is the writer's declaration and is
            frozen after the first recheck: the next node fails the run if it changed
            by a byte. Your edits are declared only in deslop-fix-result.json below,
            which the recheck copies into the next round for the reviewer.

            The gates own their state. Do not create, edit or delete deslop-review.json,
            deslop-round.txt, deslop-dirty.txt, deslop-fix-pending.txt, deslop-tree.txt,
            deslop-result.sha256 or anything under a deslop-round-* directory; a
            rewound counter fails the run.

            Write deslop-fix-result.json to the artifacts directory with exactly this shape:
              {"round": <R as an int>,
               "fixed": [{"guard": "<finding guard>", "file": "<repo-relative>", "line": <int>,
                          "action": "deleted|rewrote"}],
               "not_fixed": [{"guard": "<finding guard>", "file": "<repo-relative>", "line": <int>,
                              "reason": "<one line>"}]}
            Every blocking finding appears in exactly one of the two arrays, with its
            guard, file and line copied unchanged; the next node fails the run otherwise. Writing this
            file is MANDATORY and comes BEFORE your final line — ending without it stops
            the pipeline. Then end with the single line: DESLOP_FIX_DONE

        - id: deslop-recheck
          depends_on: [deslop-fix-pre, deslop-fix]
          # deslop-fix is skipped (when:) on every iteration that has no pending
          # DIRTY verdict; this rule still runs the recheck then, and skips it
          # (failing the iteration) when the fixer itself failed.
          trigger_rule: none_failed_min_one_success
          timeout: 1200000
          bash: |
            set -euo pipefail
            if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-deslop-recheck.out") 2> >(tee -a "$ARTIFACTS_DIR/node-deslop-recheck.out" >&2); fi
            eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
            cd "$WT"
            # The writer ran a full agent session against this worktree; any .omc
            # it left is runtime-state leakage, never work product (same guard as
            # gate-tests). It must go BEFORE the checkpoint or it is snapshotted.
            rm -rf .omc
