            try:
                findings = json.load(open(crit, encoding="utf-8")).get("findings")
                revision = json.load(open(rev, encoding="utf-8"))
            except (OSError, ValueError, AttributeError):
                print("no"); sys.exit(0)
            open_p0 = blocking(findings, ("P0",))
            raised = blocking(findings, ("P0", "P1"))
            declined = blocking(revision.get("declined"), ("P0", "P1"))
            applied = blocking(revision.get("applied"), ("P1",))
            if None in (open_p0, raised, declined, applied) or open_p0 or declined:
                print("no"); sys.exit(0)
