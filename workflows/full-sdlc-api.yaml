                    "$ARTIFACTS_DIR" "$WT" "$SPEC" 2>&1) || SHAPE=$?
                  if [ "$SHAPE" != 0 ]; then printf '%s\n' "$OUT"; echo "PLAN_CONVERGE=FAIL shape round=$N (human accept)"; exit 1; fi
                  echo "PLAN_CONVERGED round=$N (human accepted at cap: $(head -1 "$ARTIFACTS_DIR/plan-accept.txt"))"
                  echo "<promise>PLAN_CONVERGED</promise>"
                  exit 0
                fi
                echo "PLAN_ROUND_CAP round=$N cap=$CAP (plan-accept.txt present but critique has P0=$P0 open at >=75; a P0 is never waivable)"
                exit 1
              fi
              # Route to the human gate when the last round left no disagreement:
              # no P0, no declined P0/P1, and every blocking finding applied. What
              # is missing then is only a critic re-reading the final revision,
              # and the plan gate is a human reading exactly that plan, so the
              # packet must say so (plan-cap-unverified.json; plan-render-gate
              # enforces it). A P0 or a declined blocking finding is a live
              # disagreement and still stops here for plan-accept.txt, as before.
              ROUTE=$(python3 - "$RD/critique.json" "$RD/revision.json" "$ARTIFACTS_DIR/plan-cap-unverified.json" "$N" "$CAP" <<'PY'
            import json, sys
            crit, rev, out, n, cap = sys.argv[1:6]
            def blocking(rows, severities):
                picked = []
                for x in rows or []:
                    try:
                        conf = int(str(x.get("confidence")))
                    except (TypeError, ValueError, AttributeError):
                        return None
                    if x.get("severity") not in ("P0", "P1", "P2"):
                        return None  # fail closed: an unknown severity is never routed
                    if x.get("severity") in severities and conf >= 75:
