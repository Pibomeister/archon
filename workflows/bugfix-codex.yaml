    export TEST_API_URL="http://localhost:4124"
    export VITE_PUBLIC_API_URL="http://localhost:4124"
    export WHITELISTED_OTP="${WHITELISTED_OTP:-123456}"
    export WHITELISTED_PHONE="${WHITELISTED_PHONE:-15184884416}"
    RC=0
    # Matrix rows share one seeded account and chat surface. Serial execution
    # prevents authentication/onboarding mutations from racing each other.
    mise x node@20 -- pnpm exec playwright test tests/smoke-matrix --project=chromium --workers=1 --reporter=json \
      > "$AD/smoke-auto-report.json" 2> "$AD/smoke-auto-err.txt" || RC=$?
    python3 "$ROOT/.archon/setup/smoke-matrix.py" \
      --matrix "$AD/smoke-matrix.json" \
      --report "$AD/smoke-auto-report.json" \
      --error-file "$AD/smoke-auto-err.txt"
    cp "$AD/smoke-matrix.json" "$AD/smoke-matrix.pre.json"
    echo "SMOKE_AUTO=DONE rc=$RC (per-row results written into smoke-matrix.json; a fail is surfaced at the matrix gate, not judged here)"
    exit 0
- id: smoke-matrix-render
  depends_on:
  - smoke-auto
  timeout: 900000
  prompt: |
    You are the smoke-matrix presentation node. This page is the run's
    SECOND human gate: the stack is live, and the human walks the judgment
    rows in the real app before the draft PR ships. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: smoke-matrix.json, rca.md (one-line context only), repo.txt,
    and smoke-stack/web-dir.txt. Do NOT modify smoke-matrix.json or any
    other artifact; write ONLY smoke-matrix.html to that directory. No
    external resources in the HTML.

    Sections, in order, each wrapped in an HTML comment marker:
    <!-- GIST --> Two sentences in the bro register: what the fix was, and
    what walking this matrix proves. Exact paths and numbers.
    <!-- AUTO --> The auto rows as a table: id, steps, expected, and the
    recorded result (pass / fail / not-run), failure_class, and observed
    evidence as labeled fields. A product failure is a reject/reopen signal,
    never "unverified"; the deterministic render gate will block before
    approval if an auto row proves a product failure. Harness drift means
    the human must validate the reported surface through the current
    accessible DOM before approval. Unknown/not-run remains unverified.
    <!-- JUDGMENT --> The judgment rows as a checklist the human works
    through in the LIVE app at http://localhost:3124: each row shows its
    exact numbered click path and its expected observation. Say the login:
    search-eval@goodword.internal with any 6-digit code (whitelisted
    locally).
    <!-- DECIDE --> The decision box: approving records the matrix as
    walked, tears the stack down, and ships the draft PR only when the
    readiness gate has already proven the ticket is resolved or residuals
    were explicitly accepted. Rejecting preserves everything for a human.
    Then, in the same box, the standard decision block that every gate
    packet carries. Resolve this run's id by running: basename "$ARTIFACTS_DIR"
    and use that literal id in every command below. Never print the
    placeholder <run-id>. Lead with one sentence saying the run is paused
    because it finished this stage and is now waiting on a person, which is
    how the stage is supposed to end and not a failure. Then the three
    commands, each in its own code chip with a short label saying when to
    pick it:
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/archon-run.py approve <id> --token CONTROL_TOKEN_FROM_LAST_LAUNCH
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/archon-run.py reject <id> "why you are stopping it" --token CONTROL_TOKEN_FROM_LAST_LAUNCH
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/archon-run.py abandon <id> --token CONTROL_TOKEN_FROM_LAST_LAUNCH
    Say that approve runs the rest of the workflow inside the terminal it is
    typed in and holds that terminal until the run ends, which is why it is
    backgrounded, and that a failed resume still leaves the approval
    recorded so python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/archon-run.py resume <id> --token CONTROL_TOKEN_FROM_LAST_LAUNCH picks it up. Say that reject
    ends the run and records the reason typed after it, that abandon ends
    the run without recording one, and that NEITHER sends the work back for
    a rewrite: this lane declares no on_reject handler, so a different plan
    means a fresh run from a corrected spec. Files already written stay on
    disk either way. Close with one line: these three verbs do not appear in
    archon --help, but they are real.
    Simple inline CSS, one accent color, readable in BOTH light and dark
    (custom properties on :root, overridden under
    @media (prefers-color-scheme: dark)). Identity by label, never color
    alone. Plain sentences; no em dashes; no vocabulary like "crucial",
    "leverage", "robust", "seamless", "comprehensive"; no emoji.
    End with the single line: SMOKE_MATRIX_RENDER_DONE
- id: smoke-matrix-render-gate
  depends_on:
  - smoke-matrix-render
  timeout: 120000
  bash: |
    set -euo pipefail
    H="$ARTIFACTS_DIR/smoke-matrix.html"
    test -s "$H" || { echo "MATRIX_RENDER_GATE=FAIL no smoke-matrix.html"; exit 1; }
    for m in GIST AUTO JUDGMENT DECIDE; do
      grep -q "<!-- $m -->" "$H" || { echo "MATRIX_RENDER_GATE=FAIL missing section $m"; exit 1; }
    done
    RID="$(basename "$ARTIFACTS_DIR")"
    grep -qF "$RID" "$H" || { echo "MATRIX_RENDER_GATE=FAIL DECIDE box does not carry this run's id verbatim"; exit 1; }
    for v in approve reject abandon resume; do
      grep -qF "archon-run.py $v" "$H" || { echo "MATRIX_RENDER_GATE=FAIL DECIDE box missing the $v command"; exit 1; }
    done
    cmp -s "$ARTIFACTS_DIR/smoke-matrix.json" "$ARTIFACTS_DIR/smoke-matrix.pre.json" || { echo "MATRIX_RENDER_GATE=FAIL renderer modified smoke-matrix.json"; exit 1; }
    python3 - "$ARTIFACTS_DIR/smoke-matrix.json" <<'PY' || { echo "MATRIX_RENDER_GATE=FAIL auto failure classification"; exit 1; }
    import json, sys
    rows = json.load(open(sys.argv[1], encoding="utf-8"))["rows"]
    for row in rows:
        if row.get("kind") != "auto":
            continue
        assert row.get("result") in ("pass", "fail", "not-run")
        if row["result"] != "pass":
            assert row.get("failure_class") in ("product", "harness", "infrastructure", "unknown")
            assert str(row.get("observed") or "").strip()
    PY
    python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/bugfix-contract.py \
      validate-smoke-readiness --artifacts "$ARTIFACTS_DIR" \
      || { echo "MATRIX_RENDER_GATE=FAIL smoke readiness"; exit 1; }
    OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
    OPENED=no
    if [ -n "$OPENER" ] && "$OPENER" "$H" >/dev/null 2>&1; then OPENED=yes; fi
    if [ "$OPENED" = yes ]; then
      echo "MATRIX_RENDER_GATE=PASS packet=file://$H (opened in browser; app live at http://localhost:3124)"
    else
      echo "MATRIX_RENDER_GATE=PASS packet=file://$H (no browser opener - open that path yourself; app live at http://localhost:3124)"
    fi
- id: smoke-approval
  depends_on:
  - smoke-matrix-render-gate
  approval:
    message: 'In-app smoke matrix ready (gate 2 of 2): open <this run''s ARTIFACTS_DIR>/smoke-matrix.html. The stack is LIVE - walk the judgment rows in the app at http://localhost:3124 (login search-eval@goodword.internal, any 6-digit code). This gate is reached only after the deterministic smoke-readiness check proves ticket_disposition=RESOLVED or an explicit residual-acceptance artifact exists, and after auto product failures have been blocked. Harness, infrastructure, or unknown auto rows remain unverified unless you validate the reported surface manually. Approving tears the stack down and ships the draft PR. The run is paused, which is how this stage is meant to end, not a failure; nothing degrades while it waits. The packet''s DECIDE box has the three commands with this run''s id filled in: approve continues (background it, it holds the terminal), reject ends the run and records your reason, abandon ends it without one. Neither sends the work back for a rewrite - this lane has no on_reject handler, so a different plan means a fresh run from a corrected spec. None of the three appear in archon --help; they are real. Codex control requirement: use python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/archon-run.py for approve, reject, abandon, and resume with the token printed by the previous STARTED line; raw archon control is rejected by the one-time always-run guard.'
- id: smoke-teardown
  depends_on:
  - smoke-approval
  timeout: 300000
  bash: |
    set -uo pipefail
    ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
    AD="$ARTIFACTS_DIR"; SM="$AD/smoke-stack"
    REPO=$(cat "$AD/repo.txt")
    eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$AD/params.json")"
    python3 "$ROOT/.archon/setup/bugfix-contract.py" validate-smoke-readiness --artifacts "$AD" \
      || { echo "SMOKE_TEARDOWN=FAIL smoke readiness"; exit 1; }
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti "tcp:$1" -sTCP:LISTEN 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    for PF in "$SM/web.pid" "$SM/api.pid"; do
      test -f "$PF" && kill "$(cat "$PF")" 2>/dev/null
    done
    sleep 2
    # Children outlive the parents (bun start, vite dev): sweep ONLY the
    # lane's own ports by PID.
    for P in 3124 4124; do
      PIDS=$(port_pids "$P" || true)
      test -n "$PIDS" && kill $PIDS 2>/dev/null
    done
    # The e2e compose (54322/8001) stays up: the fixture volume is shared
    # dev infrastructure, torn down by the integration suites' own lifecycle.
    if [ "$REPO" = api ]; then
      WEB_WT="$ROOT/web-app/.worktrees/bugfix-smoke"
      if [ -d "$WEB_WT" ]; then
        # A just-killed dev/serve process can hold the cwd for a beat; the
        # git removal then deregisters but leaves the directory. Belt: rm+prune.
        git -C "$ROOT/web-app" worktree remove --force "$WEB_WT" 2>/dev/null
        rm -rf "$WEB_WT"
        git -C "$ROOT/web-app" worktree prune 2>/dev/null
      fi
    else
      rm -rf "$WT/tests/smoke-matrix"
    fi
    python3 - "$AD/smoke-matrix.json" > "$AD/smoke-matrix-result.txt" <<'PY'
    import json, sys
    m = json.load(open(sys.argv[1], encoding="utf-8"))
    auto = [r for r in m["rows"] if r["kind"] == "auto"]
    judg = [r for r in m["rows"] if r["kind"] == "judgment"]
    npass = sum(1 for r in auto if r.get("result") == "pass")
    print(f"SMOKE_MATRIX auto={npass}/{len(auto)} pass, judgment={len(judg)} rows human-walked (approval recorded)")
    for r in m["rows"]:
        print(f"- [{r['kind']}] {r['id']}: {r.get('result', 'human-approved')} :: {r['expected']}")
    PY
    cat "$AD/smoke-matrix-result.txt"
    echo "SMOKE_TEARDOWN=OK"
- id: prbody
  depends_on:
  - smoke
  - sibling-sweep
  - smoke-teardown
  timeout: 600000
  prompt: |
    You are the PR-body composition node. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: fix-classification.json, symptoms.json,
    symptom-dispositions.json, causal-coverage.json, rca.md,
    causal-chain.json, failing-test.json,
    smoke-result.txt, smoke-matrix-result.txt, smoke-matrix.json,
    residuals.json, eval-result.txt, sibling-sweep.json,
    negcontrol-postgreen.txt, negcontrol-exit.txt, round.txt (final round
    N), then round-<N>/review-summary.json and round-<N>/fixer-result.json.
    Also read, when present: accept-residuals.txt and
    experiment-assessment.json.
    Write a pull-request body in markdown to pr-body.md in that directory
    with exactly these sections:
      ## Summary
      ## Root Cause
      ## Verification
      ## Known Residuals
      ## Post-Deploy Monitoring & Validation
    Summary opens with the deterministic classification banner:
    implementation_result=<value> ticket_disposition=<value>
    approval_scope=<value> ticket_closure_allowed=<true|false>. Then name
    the presenting complaint, the covered symptoms, and any open symptoms.
    Root Cause presents the causal chain verbatim from causal-chain.json —
    every link, each with its citation — ending at the fix site.
    Verification tells the red-green-refail story with real values: the
    predicted failure signature (verbatim, in backticks), the RED result,
    the GREEN result, and BOTH negative-control lines exactly as recorded in
    negcontrol-postgreen.txt and negcontrol-exit.txt (their final
    NEGCONTROL=PASS lines), plus the smoke result exactly as recorded in
    smoke-result.txt (including SMOKE=SKIP repo=web-app when that is what it
    says), plus the in-app smoke matrix verbatim from
    smoke-matrix-result.txt (every row line — the human-walked judgment
    rows are the strongest in-app evidence this PR carries), plus the
    EVAL_GATE line from eval-result.txt when it says anything other than
    SKIP.
    Known Residuals has three sources, all mandatory when non-empty:
    first every non-fixed symptom-dispositions.json row, including
    product-semantics, class-hardening-only and unresolved rows, with a
    plain statement that this PR does not close those reported symptoms;
    every residuals.json entry with disposition separate-bug (quote the
    symptom, repo, and ticket_stub — these are split tickets, and the
    reader must see the symptom was scoped out deliberately, not lost) or
    by-design (symptom + citation); every entry from fixer-result.json
    "advisory" (verbatim finding + rationale); AND every sibling-sweep
    finding with verdict shares-defect or needs-human (file, line, note).
    If none of the three, say "None."
    When accept-residuals.txt exists, Known Residuals OPENS with a line
    quoting it: Residuals human-accepted: <its contents> — then lists the
    final round's "advisory" AND "incomplete" entries verbatim.
    When probe-results.txt holds census numbers (affected rows/users), the
    Summary states the measured blast radius with those exact figures.
    Post-Deploy Monitoring names the concrete signal that should go quiet
    after deploy: the log line, Sentry issue, or error string from the
    evidence — with its identifier. If the bug produced no production
    signal, say exactly: "No additional operational monitoring required."
    No co-author or attribution lines. End with the single line: PRBODY_WRITTEN
- id: ship
  depends_on:
  - prbody
  timeout: 900000
  bash: |
    set -euo pipefail
    ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
    eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$ARTIFACTS_DIR/params.json")"
    REPO=$(cat "$ARTIFACTS_DIR/repo.txt")
    test "$(git -C "$WT" rev-parse --abbrev-ref HEAD)" = "$BR"
    test -s "$ARTIFACTS_DIR/pr-body.md"
    grep -q '^## Root Cause' "$ARTIFACTS_DIR/pr-body.md"
    grep -q '^## Known Residuals' "$ARTIFACTS_DIR/pr-body.md"
    grep -q '^## Post-Deploy Monitoring & Validation' "$ARTIFACTS_DIR/pr-body.md"
    TITLE=$(head -1 "$ARTIFACTS_DIR/commit-msg.txt" 2>/dev/null || true)
    test -n "$TITLE" || TITLE="fix($REPO): $SLUG"
    python3 "$ROOT/.archon/setup/bugfix-contract.py" validate-smoke-readiness --artifacts "$ARTIFACTS_DIR" \
      || { echo "SHIP=FAIL smoke readiness"; exit 1; }
    # exit-gate already ran typecheck/suites/repro; hook re-run skipped by explicit choice.
    git -C "$WT" push -u origin "$BR" --no-verify
    cd "$WT"
    EXISTING=$(gh pr list --head "$BR" --state open --json url --jq '.[0].url' 2>/dev/null || true)
    if [ -n "$EXISTING" ]; then
      printf '%s\n' "$EXISTING" > "$ARTIFACTS_DIR/pr-url.txt"
      echo "SHIP=ADOPTED existing PR"
    else
      gh pr create --draft --base main --head "$BR" \
        --title "$TITLE [archon]" \
        --body-file "$ARTIFACTS_DIR/pr-body.md" > "$ARTIFACTS_DIR/pr-url.txt"
    fi
    echo "PR_URL=$(cat "$ARTIFACTS_DIR/pr-url.txt")"
    echo "SHIP=OK"
- id: run-report
  depends_on:
  - ship
  timeout: 600000
  prompt: |
    You are the final-report node: the last thing a human sees from this run,
    so show, do not tell. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: fix-classification.json, symptoms.json,
    symptom-dispositions.json, causal-coverage.json, pr-url.txt, rca.md,
    causal-chain.json, failing-test.json,
    worktrees.json, fix-attempt.txt, round.txt, smoke-result.txt,
    negcontrol-postgreen.txt, negcontrol-exit.txt, sibling-sweep.json, and
    each round-<N>/review-summary.json and round-<N>/fixer-result.json.
    Write a single self-contained run-report.html to that directory with
    these marker-wrapped sections:
    <!-- GIST --> Open with the deterministic classification banner:
    implementation_result=<value> ticket_disposition=<value>
    approval_scope=<value> ticket_closure_allowed=<true|false>. Then, in
    the bro register: what the bug was, what the fix
