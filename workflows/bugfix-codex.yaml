    it marks gathered, probe-results.txt (fresh prod query results; treat a
    DEGRADED/SKIP first line as absence), kb-context.md, and the read-only
    main checkouts at
    /Users/eduardopicazo/Documents/Workspace/Goodword/api and
    /Users/eduardopicazo/Documents/Workspace/Goodword/web-app. Modify nothing.
    The checkouts may sit on a stale feature branch: read bugfix-chain.json and inspect baseline.commits[<repo>] with git show/ls-tree. Cite paths at that immutable SHA; the gate resolves citations against the same pinned baseline.

    Step 1: derive the root cause independently. Write chain-verify.json to
