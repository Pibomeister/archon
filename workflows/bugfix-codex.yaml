- id: rca-plan-loop
  depends_on:
  - proof-manifest-gate
  loop_group:
    max_iterations: 3
    until: RCA_PLAN_CONVERGED
    nodes:
    - id: rca-round-pre
      timeout: 120000
      bash: |
        set -euo pipefail
        # The cap is checked BEFORE a round is spent. A body node's non-zero
        # exit fails the whole group, and `archon workflow resume` re-enters
        # the group with a fresh iteration, so a cap enforced only in
        # rca-converge could be walked past forever by resuming after every
        # critic-gate failure.
        C="$ARTIFACTS_DIR/rca-round.txt"
        N=$(cat "$C" 2>/dev/null || echo 0)
        CAP=$(cat "$ARTIFACTS_DIR/rca-round-cap.txt" 2>/dev/null || echo 3)
        # Both files are hand-editable, so both are untrusted input. `[ x -ge y ]`
        # with a non-integer operand returns 2, and `if` reads that as "not taken",
        # which would silently switch the cap off — the exact fail-open this guard
        # exists to prevent. A junk cap falls back to the default; a junk counter
        # stops the run instead, because resetting a counter to 0 on garbage is
        # itself a way to run forever.
        case "$CAP" in ''|*[!0-9]*) CAP=3 ;; esac
        case "$N" in
          '') N=0 ;;
          *[!0-9]*) echo "RCA_ROUND_PRE=FAIL rca-round.txt is not an integer: [$N]"; exit 1 ;;
        esac
        if [ "$N" -ge "$CAP" ] && [ ! -f "$ARTIFACTS_DIR/rca-plan-accept.txt" ]; then echo "RCA_PLAN_ROUND_CAP round=$N cap=$CAP" | tee -a "$ARTIFACTS_DIR/rca-plan-loop-exit.txt"; exit 1; fi
        test -s "$ARTIFACTS_DIR/fix-plan.json" || { echo "RCA_ROUND_PRE=FAIL no fix-plan.json round=$((N+1))"; exit 1; }
        # Durable round counter: survives resumes, unlike the loop's own iteration
        # index. Artifacts are round-scoped so a hand fix plus a resume cannot read
        # the previous round's critique as this round's.
        N=$((N+1)); echo "$N" > "$C"
        RD="$ARTIFACTS_DIR/rca-round-$N"; mkdir -p "$RD"
        # Round-scoped pre-image of the MUTABLE set — the four pre-RED planning
        # artifacts the reviser may rewrite. rca-converge diffs fix-plan.json
        # against THIS copy to tell a revision that changed nothing from one that
        # actually moved, and checks mechanically that a REJECT round really was
        # the no-op its prompt asks for.
        for f in fix-plan.json files-allowlist.json verify.json failing-test.json; do
          test -f "$ARTIFACTS_DIR/$f" || { echo "RCA_ROUND_PRE=FAIL missing planning artifact $f round=$N"; exit 1; }
          cp "$ARTIFACTS_DIR/$f" "$RD/pre-$f"
        done
        # Round-scoped copy of the IMMUTABLE set — the diagnosis. The critic may
        # argue with it and the reviser may decline a finding because of it, but
        # neither may rewrite it: a blind chain-verify already checked the chain,
        # probe.json was already executed against production, and repo.json drives
        # bind-repo after the gate. A reviser that edits the chain to fit its fix
        # has removed the check rather than passed it.
        # These per-round copies are DIAGNOSTICS ONLY — "what did round N start
        # from" when reading a failed run. They are re-taken every round, so they
        # cannot be the cmp target: a mutation, a failed round and a resume would
        # have the next round re-snapshot the mutated file as its own baseline.
        # rca-converge cmps against $ARTIFACTS_DIR/imm-<f>, written once by
        # rca-gate before the loop. Also verify the durable anchor is present,
        # so a hand-deleted anchor stops the round instead of the run reaching
        # rca-converge with nothing to compare against.
        for f in rca.md causal-chain.json hypotheses.json residuals.json probe.json repo.json; do
          test -f "$ARTIFACTS_DIR/$f" || { echo "RCA_ROUND_PRE=FAIL missing diagnosis artifact $f round=$N"; exit 1; }
          test -f "$ARTIFACTS_DIR/imm-$f" || { echo "RCA_ROUND_PRE=FAIL missing durable anchor imm-$f round=$N"; exit 1; }
          cp "$ARTIFACTS_DIR/$f" "$RD/imm-$f"
        done
        echo "RCA_PLAN_ROUND=$N cap=$CAP"
    - id: impact-probe
      depends_on:
      - rca-round-pre
      timeout: 600000
      prompt: |
        You are the code-graph impact node for one round of the RCA planning
        critic loop. You run every round, so what you write reflects the fix
        plan as it stands right now, not as it stood when the loop started.
        Ask no questions.

        Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
        The round number is the contents of rca-round.txt in that directory;
        call it N. Your output file is rca-round-N/impact.json there, with N
        substituted for the actual number.
        The repository under analysis is named in repo.txt in that same
        directory. There is NO worktree yet: read the main checkouts
        The checkouts may sit on a stale feature branch: read bugfix-chain.json, select baseline.commits[<repo>], and inspect that immutable SHA (`git -C <repo> show <sha>:<path>`, `git -C <repo> ls-tree -r --name-only <sha>`). Cite repo-relative paths as they exist at that SHA; the gate resolves citations against the same pinned baseline.
