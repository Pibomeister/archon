       "disposition":"fixed|class-hardening-only|by-design|separate-ticket|product-semantics|unresolved",
       "authority":"<product/human receipt when required>",
       "repo":"api|web-app","ticket_stub":"<required for separate-ticket>"}]}
    Code behavior alone never establishes by-design. A fixed disposition is
