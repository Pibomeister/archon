    done
    # Chain-citation and hypotheses checks stay inline: they run exactly once,
    # against a chain nothing downstream is allowed to change, so there is no
    # second caller to share them with.
    LINKS=$(python3 - "$ARTIFACTS_DIR" "$ROOT" <<'PY'
    import json, os, re, subprocess, sys
    ad, root = sys.argv[1], sys.argv[2]
    def load(name):
        return json.load(open(os.path.join(ad, name), encoding="utf-8"))
    def cited(q, path):
        if subprocess.run(["grep", "-qF", q, path]).returncode == 0:
            return True
        # Verbatim modulo formatting: Prettier wraps statements across lines,
        # so a quote that is one line in the RCA may be split in the source.
        # Collapse whitespace runs on both sides before the substring check.
        try:
            content = open(path, encoding="utf-8", errors="replace").read()
        except Exception:
            content = ""
        if content and " ".join(q.split()) in " ".join(content.split()):
            return True
        if path.endswith(".json"):
            # JSON evidence files escape inner quotes/backslashes, so a quote that
            # is verbatim in a log MESSAGE is not verbatim in the raw bytes.
            # Search the decoded string scalars too.
            try:
                data = json.load(open(path, encoding="utf-8"))
            except Exception:
                return False
            def scan(x):
                if isinstance(x, str):
                    return q in x
                if isinstance(x, dict):
                    return any(scan(v) for v in x.values())
                if isinstance(x, list):
                    return any(scan(v) for v in x)
                return False
            return scan(data)
        return False
    chain = load("causal-chain.json")["links"]
    assert isinstance(chain, list) and 2 <= len(chain) <= 7, f"chain must have 2-7 links, got {len(chain)}"
    for i, link in enumerate(chain):
        ev = link.get("evidence") or {}
        q, ref = ev.get("quote", ""), ev.get("file", "")
        # A "path:N" / "path:N-M" line suffix is a formatting habit, not a different
        # file: strip it before resolving. The quote still has to be found verbatim.
        ref = re.sub(r":[0-9]+(?:-[0-9]+)?$", "", ref)
        assert q and len(q) >= 10, f"chain link {i+1} quote missing or under 10 chars"
        cands = [ref] if ref.startswith("/") else [os.path.join(root, ref), os.path.join(ad, ref)]
        path = next((c for c in cands if os.path.isfile(c)), None)
        # The main checkouts sit on whatever branch a human left them on, while
        # every worktree this lane cuts comes from the chain-pinned baseline. A citation the RCA
        # read from the chain-pinned baseline must not fail because the checkout is stale or
        # missing the file: materialise that revision into the artifacts dir and
        # cite against it. Git history is an evidence tier too: "<repo>@<sha>"
        # cites a commit (message + diff). Still fail-closed: the pinned baseline or the
        # sha must actually carry the quote.
        def from_git(ref):
            gm = re.fullmatch(r"(api|web-app)@([0-9a-f]{7,40})", ref)
            parts = [gm.group(1), gm.group(2)] if gm else ref.split("/", 1)
            if len(parts) != 2 or parts[0] not in ("api", "web-app"):
                return None
            baseline = load("bugfix-chain.json")["baseline"]["commits"][parts[0]]
            spec = parts[1] if gm else f"{baseline}:{parts[1]}"
            show = subprocess.run(["git", "-C", os.path.join(root, parts[0]), "show", spec],
                                  capture_output=True, encoding="utf-8", errors="replace")
            if show.returncode != 0:
                return None
            out = os.path.join(ad, "cite-cache", ref)
            os.makedirs(os.path.dirname(out), exist_ok=True)
            open(out, "w", encoding="utf-8").write(show.stdout)
            return out
        if path is None or not cited(q, path):
            alt = from_git(ref)
            if alt is not None and (path is None or cited(q, alt)):
                path = alt
        assert path, f"chain link {i+1} cites missing file {ref} (not on disk, not at the pinned baseline, not a known <repo>@<sha>)"
        assert cited(q, path), f"chain link {i+1} uncited: quote not found verbatim in {ref}"
    last = chain[-1]
    assert last.get("fixable") is True and last.get("fix_site"), "final link must be fixable:true with fix_site"
    hyp = load("hypotheses.json")
    assert isinstance(hyp, list) and hyp, "hypotheses.json empty"
    assert all(h.get("status") in ("open", "queued", "killed-by-evidence", "confirmed-by-experiment") for h in hyp), "hypothesis status out of enum"
    print(len(chain))
    PY
    )
    # Everything this gate checks on the MUTABLE planning artifacts (repo enum,
    # failing-test, fix-plan, probe.json, residuals, verify.json,
    # files-allowlist normalization and test_file membership) lives in
    # setup/rca-shape.sh, because the RCA planning critic loop's rca-plan-shape
    # node has to re-run exactly these checks after a revision. A second inline
    # copy would be two contracts drifting apart, and the drift would show up as
    # artifacts that pass here and fail after the loop, or worse, the reverse.
    SHAPE=0
    OUT=$(bash "$ROOT/.archon/setup/rca-shape.sh" "$ARTIFACTS_DIR" 2>&1) || SHAPE=$?
    if [ "$SHAPE" != 0 ]; then
      # This node keeps its own typed token: RCA_GATE=FAIL <reason> is what
      # RUNBOOK.md and every existing grep over run logs look for. rca-shape.sh
      # states the cross-repo stop in one clause, so that one case is reprinted
      # here with the operator guidance it used to carry.
      case "$OUT" in
        *CROSS_REPO_BUG*)
          echo "RCA_GATE=FAIL CROSS_REPO_BUG (v1 is single-repo: split the bug report per repo or escalate; the RCA artifacts are preserved in this run's dir)" ;;
        *RCA_SHAPE=FAIL*)
          printf '%s\n' "$OUT" | sed 's/^RCA_SHAPE=FAIL/RCA_GATE=FAIL/' ;;
        *)
          # A crash rather than a check failure: print it, then type the exit
          # anyway, because an untyped stop is one RUNBOOK.md cannot route.
          printf '%s\n' "$OUT"
          echo "RCA_GATE=FAIL rca-shape.sh exited $SHAPE without a typed line" ;;
      esac
      exit 1
    fi
    python3 "$ROOT/.archon/setup/repo-policy.py" validate-plan --root "$ROOT" --artifacts "$ARTIFACTS_DIR" \
      || { echo "RCA_GATE=FAIL repository policy"; exit 1; }
    python3 "$ROOT/.archon/setup/change-context.py" validate --artifacts "$ARTIFACTS_DIR" \
      || { echo "RCA_GATE=FAIL change-history assessment"; exit 1; }
    # The RCA_NOTE=integration mutex line passes through; the RCA_SHAPE=OK line
    # is this gate's own token to print, with the link count only it knows.
    printf '%s\n' "$OUT" | grep -v '^RCA_SHAPE=OK' || true
    REPO=$(printf '%s\n' "$OUT" | sed -n 's/^RCA_SHAPE=OK repo=\([^ ]*\) .*$/\1/p')
    KIND=$(printf '%s\n' "$OUT" | sed -n 's/^RCA_SHAPE=OK .* kind=\(.*\)$/\1/p')
    { test -n "$REPO" && test -n "$KIND"; } || { echo "RCA_GATE=FAIL rca-shape.sh printed no RCA_SHAPE=OK line"; exit 1; }
    # rca-shape.sh writes repo.txt itself; nine downstream nodes cat it.
    test -s "$ARTIFACTS_DIR/repo.txt" || { echo "RCA_GATE=FAIL rca-shape.sh wrote no repo.txt"; exit 1; }
    echo "RCA_GATE=PASS repo=$REPO links=$LINKS kind=$KIND"
    cp "$ARTIFACTS_DIR/rca.md" "$ARTIFACTS_DIR/rca.pre.md"
    cp "$ARTIFACTS_DIR/causal-chain.json" "$ARTIFACTS_DIR/causal-chain.pre.json"
    # Durable immutable-set anchors, written ONCE here and never rewritten by the
    # planning loop. rca-round-pre also copies these six into the round dir, but
    # those copies are re-taken every round: a reviser that mutates repo.json,
    # a round that then fails, and a resume would have the next round-pre snapshot
    # the MUTATED file as that round's baseline, and the cmp would pass — the
    # failed round launders the mutation. These copies predate the loop entirely,
    # so no resume can move them. Every one of the six is already proven to exist
    # by the checks above (rca.md/causal-chain.json/hypotheses.json inline,
    # repo.json/probe.json/residuals.json in rca-shape.sh), so a plain cp is safe.
    for f in rca.md causal-chain.json hypotheses.json residuals.json probe.json repo.json; do
      cp "$ARTIFACTS_DIR/$f" "$ARTIFACTS_DIR/imm-$f"
    done
- id: probe-run
  depends_on:
  - rca-gate
  timeout: 600000
  bash: |
    set -uo pipefail
    # Runs the RCA's read-only probes against prod RO so the gate packet
    # shows RESULTS, not open questions. Best-effort: expired SSO or a
    # query error degrades with a typed line; the run continues.
    AD="$ARTIFACTS_DIR"
    record_probe() {
      local STATUS="$1" WATERMARK WINDOW PROVIDER KIND QUERY BASELINE REPO
      KIND=$(python3 - "$AD/evidence-plan.json" <<'PY'
    import json,sys
    plan=json.load(open(sys.argv[1], encoding="utf-8")); window=plan.get("time_window")
    ids=[x for x in plan.get("identifiers",[]) if x.get("resolution")=="given" and str(x.get("value","")).strip()]
    print("occurrence" if isinstance(window,dict) and window.get("start") and window.get("end") and ids else "class")
    PY
      )
      PROVIDER=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["provider"])' "$AD/bugfix-chain.json")
      REPO=$(cat "$AD/repo.txt")
      BASELINE=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["baseline"]["commits"][sys.argv[2]])' "$AD/bugfix-chain.json" "$REPO")
      QUERY=$(cat "$AD/probe.json")
      EXTRA=(--evidence-kind class)
      if [ "$KIND" = occurrence ]; then
        WINDOW=$(python3 -c 'import json,sys;print(json.dumps(json.load(open(sys.argv[1]))["time_window"],sort_keys=True))' "$AD/evidence-plan.json")
        WATERMARK=$(python3 - "$AD/evidence-plan.json" "$AD/probe-results.txt" <<'PY'
    import hashlib,json,sys
    plan=json.load(open(sys.argv[1])); ids=[{"kind":x["kind"],"value":x["value"]} for x in plan["identifiers"] if x.get("resolution")=="given"]
    version=hashlib.sha256(open(sys.argv[2],"rb").read()).hexdigest()
    print(hashlib.sha256(json.dumps({"subjects":ids,"version":version},sort_keys=True,separators=(",",":")).encode()).hexdigest())
    PY
        )
        EXTRA=(--evidence-kind occurrence --entity-watermark "$WATERMARK" --occurrence-window "$WINDOW")
      fi
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/evidence-provenance.py record \
        --artifacts "$AD" --source prod-probes --status "$STATUS" \
        --file probe-results.txt --provider "$PROVIDER" --tool psql \
        --query "$QUERY" --baseline "$BASELINE" "${EXTRA[@]}"
    }
    NP=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1], encoding='utf-8')).get('probes',[])))" "$AD/probe.json")
    if [ "$NP" = 0 ]; then
      R=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8')).get('none_reason',''))" "$AD/probe.json")
      echo "PROBE_RUN=SKIP none_reason=$R" | tee "$AD/probe-results.txt"
      record_probe unavailable || { echo "PROBE_RUN=FAIL provenance"; exit 1; }
      exit 0
    fi
    if ! aws sts get-caller-identity >/dev/null 2>&1; then
      echo "PROBE_RUN=DEGRADED sso expired (probes unanswered; gate packet will say so)" | tee "$AD/probe-results.txt"
      record_probe unavailable || { echo "PROBE_RUN=FAIL provenance"; exit 1; }
      exit 0
    fi
    SEC=$(aws secretsmanager get-secret-value --secret-id dev/database/ro-credentials --region us-east-2 --query SecretString --output text 2>/dev/null || true)
    if [ -z "$SEC" ]; then
      echo "PROBE_RUN=DEGRADED no RO credentials" | tee "$AD/probe-results.txt"
      record_probe unavailable || { echo "PROBE_RUN=FAIL provenance"; exit 1; }
      exit 0
    fi
    export SEC
    eval "$(python3 <<'PY'
    import json, os, shlex
    d = json.loads(os.environ["SEC"])
    print(f"export PGHOST={shlex.quote(str(d.get('RODBHOST') or d.get('host','')))}")
    print(f"export PGPORT={shlex.quote(str(d.get('RODBPORT') or d.get('port',5432)))}")
    print(f"export PGUSER={shlex.quote(str(d.get('RODBUSERNAME') or d.get('username') or d.get('user','')))}")
    print(f"export PGPASSWORD={shlex.quote(str(d.get('RODBPASSWORD') or d.get('password','')))}")
    print(f"export PGDATABASE={shlex.quote(str(d.get('RODBNAME') or d.get('dbname') or d.get('database','postgres')))}")
    print(f"export PGSSLMODE=require")
    print(f"export PGCONNECT_TIMEOUT=15")
    # Best-effort probes must degrade instead of consuming the whole 10-minute
    # node timeout on one broad production census.
    print(f"export PGOPTIONS={shlex.quote('-c statement_timeout=120000')}")
    PY
    )"
    : > "$AD/probe-results.txt"
    PROBE_TMP="$AD/.probe-result.tmp"
    trap 'rm -f "$PROBE_TMP"' EXIT
    OK=0
    I=0
    while [ "$I" -lt "$NP" ]; do
      python3 -c "
    import json, sys
    pb = json.load(open(sys.argv[1], encoding='utf-8'))['probes'][int(sys.argv[2])]
    print('== probe:', pb['id'])
    print('question:', pb['question'])
    print('sql:', pb['sql'])
    " "$AD/probe.json" "$I" >> "$AD/probe-results.txt"
      Q=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['probes'][int(sys.argv[2])]['sql'])" "$AD/probe.json" "$I")
      RC=0
      psql -X -v ON_ERROR_STOP=1 -c "$Q" > "$PROBE_TMP" 2>&1 || RC=$?
      PROBE_BYTES=$(wc -c < "$PROBE_TMP" | tr -d ' ')
      if [ "$PROBE_BYTES" -gt 262144 ]; then
        head -c 262144 "$PROBE_TMP" >> "$AD/probe-results.txt"
        echo >> "$AD/probe-results.txt"
        echo "PROBE_RESULT=DEGRADED reason=output-truncated bytes=$PROBE_BYTES max=262144" >> "$AD/probe-results.txt"
      else
        cat "$PROBE_TMP" >> "$AD/probe-results.txt"
        test "$RC" = 0 && OK=$((OK+1))
      fi
      BYTES=$(wc -c < "$AD/probe-results.txt" | tr -d ' ')
      test "$BYTES" -le 1048576 || { echo "PROBE_RUN=FAIL output-bound bytes=$BYTES max=1048576"; exit 1; }
      echo >> "$AD/probe-results.txt"
      I=$((I+1))
    done
    if [ "$OK" = "$NP" ]; then
      record_probe complete || { echo "PROBE_RUN=FAIL provenance"; exit 1; }
    else
      record_probe degraded || { echo "PROBE_RUN=FAIL provenance"; exit 1; }
    fi
    echo "PROBE_RUN=DONE answered=$OK/$NP"
    tail -30 "$AD/probe-results.txt"
