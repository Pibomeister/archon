      # Typed, visible in the PR body: web boot smoke is deferred (port 3124 reserved).
      echo "SMOKE=SKIP repo=web-app" | tee "$ARTIFACTS_DIR/smoke-result.txt"
      exit 0
    fi
    cd "$WT"
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti "tcp:$1" -sTCP:LISTEN 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    PORT=4124 bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
    SRV=$!
    # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
    trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids 4124); test -n "$P" && kill $P 2>/dev/null; true' EXIT
    CODE=000
    for i in $(seq 1 60); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/api-docs-json || echo 000)
      test "$CODE" = "200" && break
    done
    test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
    CTRL=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/info || echo 000)
    test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
    echo "SMOKE=PASS api-docs-json=200 guarded-control=401" | tee "$ARTIFACTS_DIR/smoke-result.txt"
- id: sibling-sweep
  depends_on:
  - exit-gate
  timeout: 900000
  prompt: |
    You are the sibling-sweep node: fix the class, not the instance —
    REPORT-ONLY. Ask no questions. You are FORBIDDEN from editing any file;
    silent scope growth is exactly what the scope gate exists to stop.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read rca.md, causal-chain.json (the final link's fix_site), and
    fix-plan.json there. The repository is the "worktree" field of
    params.json (you are NOT cwd'd there). Look at the fix itself:
    git diff between the sha in bootstrap-head.txt and HEAD, run inside the
    worktree.

    Search the repository for OTHER sites with the same defect pattern: the
    same misused API, the same missing guard, the same wrong assumption the
    chain names. Grep for the pattern; read each candidate enough to say
    whether it shares the defect, is already safe, or needs a human look.

    Write sibling-sweep.json to the artifacts directory:
      {"pattern": "<one line: what the defect class is>",
       "findings": [{"file": "<repo-relative>", "line": <n>,
                     "verdict": "shares-defect|safe|needs-human",
                     "note": "<one line>"}]}
    An empty findings array is a valid, honest result. Findings become PR
