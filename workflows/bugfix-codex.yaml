      {"independent_root_cause": "<one paragraph>",
       "evidence": ["<file:line or evidence-file citation>", ...]}

    Step 2: only after that file is written, read causal-chain.json and
    compare. Rewrite chain-verify.json, keeping your step-1 fields verbatim
