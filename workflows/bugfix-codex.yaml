        REASON=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['reason'])" "$G")
        HASH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['failure_hash'])" "$G")
