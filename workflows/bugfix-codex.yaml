    End with the single line: SIBLING_SWEEP_DONE
- id: smoke-matrix-design
  depends_on:
  - exit-gate
  timeout: 1200000
  prompt: |
    You are the smoke-matrix design node. The boot smoke proves the server
    starts; THIS matrix proves the fix in the running app, in front of a
    human. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: rca.md, fix-plan.json, residuals.json, failing-test.json,
    boundary-trace.json, repo.txt, and params.json. The fix worktree is params.json "worktree".
    Also read, in the web-app main checkout at
    /Users/eduardopicazo/Documents/Workspace/Goodword/web-app:
    tests/smoke/chat.smoke.spec.ts, tests/test-api.ts, and
    tests/global-setup.ts — the locators and auth idioms your spec must
    mirror. Modify NO repository file; both files you produce go in the
    artifacts directory.

    First read boundary-trace.json surface_equivalence. Every row MUST use
    its smoke_entrypoint and reach its runtime_owner. Never substitute a
    convenient Chat/UI/API surface merely because the fixture or an old
    smoke helper exists. Re-open the pinned current implementation and prove
    the route/tool/selector chain before generating the spec.
    Also read reproduction_equivalence and the repository's accepted
    integration/eval bootstrap for this behavior. The smoke stack must
    preserve its authoritative seed/flag/clock/provider profile. If it cannot,
    classify the row as harness rather than changing the product expectation
    or asking production code to accommodate a toy fixture.

    Derive matrix rows from three sources: (1) the fixed behavior itself —
    the user-visible flow the bug broke, now expected to work; (2) each
    fix-plan.json risk — the regression it predicts, as a row; (3) each
    residuals.json entry a reviewer could confuse with the fix (by-design
    or separate-bug) — a row documenting current expected behavior so the
    human is not surprised by it in the app.

    FILE 1 — smoke-matrix.json:
      {"rows": [{"id": "<slug>", "kind": "auto" | "judgment",
        "steps": "<numbered click path, exact and short>",
        "expected": "<observable pass condition>",
        "needs_seed_data": true | false,
        "spec_title": "<exact Playwright test title>" (auto rows; null for judgment),
        "result": "not-run", "failure_class": null, "observed": null}]}
    2 to 6 rows. "auto" = Playwright can assert it mechanically (element
    count, testid text, presence/absence). "judgment" = needs human eyes
    (relevance, ranking quality, tone). At least one row of each kind
    unless the fix genuinely has no judgment surface — then add a top-level
    "note" saying why. needs_seed_data=true marks rows that only work
    against controlled fixture data (the deployed re-run skips those).

    FILE 2 — smoke-matrix.spec.ts (only if any auto rows): a single
    self-contained Playwright spec, one test per auto row, test title ==
    spec_title. The stack it will run against:
    - Web http://localhost:3124 (PLAYWRIGHT_BASE_URL), api
      http://localhost:4124, DB = the search-eval fixture. The fixture rows
      belong to the user search-eval@goodword.internal — the test MUST log
      in as that user (env override SMOKE_MATRIX_USER, defaulting to it):
      use test.use({ storageState: { cookies: [], origins: [] } }). That
      user ALREADY OWNS an account, so NEVER use TestApiClient's
      authenticateBrowser (its signup-then-swap flow 409s on existing
      emails). Instead: mint a token directly (POST {api}/auth/otp/initiate
      then /auth/otp/signup/verify with the user's email + the whitelisted
      code — the endpoint signs an existing user in), build the typed
      client via TestApiClient.fromToken(token) (import from ../test-api;
      the file will live at tests/smoke-matrix/matrix.spec.ts), then sign
      the BROWSER in through the app's own actions: page.request.post
      {web}/auth/signin (form intent auth-signin-email, Origin header) and
      {web}/auth/otp (form intent auth-otp-verify, code). After
      authenticating, PUT /user with onboardingIntentCategories
      ['networking', 'mentorship'] exactly as tests/global-setup.ts does,
      AND make one POST {api}/connection/linkedin/bulk call with a single
      dummy connection — it synchronously stamps linkedinIntegratedAt,
      without which the FTUE gate redirects the user away from /chat (the
      bulk import's contact materialization is async and never lands in
      this stack; the fixture provides the people). Without both, the app
      redirects to onboarding. NEVER tag tests @smoke (the
      smoke project would inject a throwaway user's storage state that
      owns no fixture rows).
    - Do NOT delete or mutate fixture rows; creating groups/notes is fine.
      NEVER create contacts via /connection/linkedin/bulk or the seed
      helpers built on it: imports are processed by async event handlers
      this stack does not run, so such contacts never materialize. Rows
      needing extra people use smoke-seed.sql (direct DB) or lean on the
      fixture's existing personas.
    - Reuse current locator idioms only after confirming they exist in the
      pinned web implementation. Do not assume `chat-group-artifact` or any
      historical testid still exists. Prefer accessible roles/names and
      visible semantic content. Every failed assertion must start with
      `SMOKE_PRODUCT_FAIL` when the rendered behavior is wrong, or
      `SMOKE_HARNESS_DRIFT` when the expected route/selector itself is absent
      but alternative visible content prevents a product verdict. Include
      the observed visible response in the error. Before throwing, add a
      Playwright annotation to `test.info().annotations` with type
      `failure_class` and description `product` or `harness`. This structured
      annotation is authoritative; the text prefix remains for readable
      diagnostics and compatibility. If both classes occur, record both:
      product evidence dominates harness drift. Playwright-idiomatic waits
      only — no waitForTimeout.
    FILE 3 — smoke-seed.sql (optional): when a row needs scenario data the
    stock fixture lacks, write idempotent INSERT/UPDATE statements for the
    LOCAL throwaway e2e DB only (it is dropped and reseeded routinely);
    reference fixture rows by their seeded natural keys, never by guessed
    ids. Omit the file when the fixture suffices.
    End with the single line: SMOKE_MATRIX_DESIGN_DONE
- id: smoke-stack
  depends_on:
  - smoke-matrix-design
  - smoke
  timeout: 1800000
  bash: |
    set -euo pipefail
    ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
    AD="$ARTIFACTS_DIR"
    eval "$(bash "$ROOT/.archon/setup/params-env.sh" "$AD/params.json")"
    REPO=$(cat "$AD/repo.txt")
    SM="$AD/smoke-stack"; mkdir -p "$SM"
    # Matrix shape gate before booting anything.
    python3 - "$AD/smoke-matrix.json" <<'PY' || { echo "SMOKE_STACK=FAIL smoke-matrix.json shape"; exit 1; }
    import json, sys
    m = json.load(open(sys.argv[1], encoding="utf-8"))
    rows = m.get("rows")
    assert isinstance(rows, list) and 1 <= len(rows) <= 6, "rows must be a list of 1-6"
    for r in rows:
        assert r.get("id") and r.get("kind") in ("auto", "judgment"), "row missing id/kind"
        assert r.get("steps") and r.get("expected"), "row missing steps/expected"
        if r["kind"] == "auto":
            assert r.get("spec_title"), "auto row missing spec_title"
            assert r.get("result") == "not-run", "auto row must initialize result=not-run"
            assert r.get("failure_class") is None and r.get("observed") is None, "auto row evidence must initialize null"
    PY
    # This stack owns 4124/3124 plus the machine-global 54322/8001 e2e
    # mutex — never run alongside an integration-kind repro. The servers
    # deliberately OUTLIVE this node (nohup, PID files, no EXIT traps):
    # the human walks the live app at the approval pause; smoke-teardown
    # kills by PID after approval.
    if [ "$REPO" = api ]; then API_DIR="$WT"; else API_DIR="$ROOT/api"; fi
    if [ "$REPO" = web-app ]; then WEB_DIR="$WT"; else WEB_DIR="$ROOT/web-app/.worktrees/bugfix-smoke"; fi
    printf '%s\n' "$API_DIR" > "$SM/api-dir.txt"
    printf '%s\n' "$WEB_DIR" > "$SM/web-dir.txt"
    # --- e2e DB + dynamo + migrations + fixture (search-corpus README recipe; idempotent).
    cd "$API_DIR"
    # .env.e2e is gitignored: fresh worktrees lack it. Copy from the main checkout.
    test -f .env.e2e || cp "$ROOT/api/.env.e2e" .env.e2e
    docker compose -f local-env-compose.e2e.yaml up -d --wait > "$SM/compose.log" 2>&1 || { tail -5 "$SM/compose.log"; echo "SMOKE_STACK=FAIL e2e compose"; exit 1; }
    set -a; . ./.env.e2e; set +a
    export DYNAMODB_ENDPOINT="http://localhost:8001"  # e2e compose maps 8001:8000; .env.e2e's 8000 is the dev container
    bun run migration:run > "$SM/migrate.log" 2>&1 || { tail -5 "$SM/migrate.log"; echo "SMOKE_STACK=FAIL migrations"; exit 1; }
    node scripts/init-dynamodb-local.js > "$SM/dynamo.log" 2>&1 || { tail -5 "$SM/dynamo.log"; echo "SMOKE_STACK=FAIL dynamodb init"; exit 1; }
    bun scripts/seed-search-eval.ts > "$SM/seed.log" 2>&1 || { tail -5 "$SM/seed.log"; echo "SMOKE_STACK=FAIL fixture seed"; exit 1; }
    # FTUE bypass for the fixture login user: the app's onboarding gate keys
    # on linkedin_integrated_at AND ftue_network_completed_at (BE
    # deriveOnboardingStatus); without both, every /chat navigation bounces
    # to the FTUE modal on /home. Local throwaway DB — direct SQL is the
    # deterministic fix.
    PGPASSWORD="$DBPASSWORD" psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSERNAME" -d "$DBNAME" -v ON_ERROR_STOP=1         -c "UPDATE users SET linkedin_integrated_at = COALESCE(linkedin_integrated_at, now()), ftue_network_completed_at = COALESCE(ftue_network_completed_at, now()) WHERE email = 'search-eval@goodword.internal';"         > "$SM/ftue-bypass.log" 2>&1 || { tail -3 "$SM/ftue-bypass.log"; echo "SMOKE_STACK=FAIL ftue bypass"; exit 1; }
    if [ -s "$AD/smoke-seed.sql" ]; then
      PGPASSWORD="$DBPASSWORD" psql -h "$DBHOST" -p "$DBPORT" -U "$DBUSERNAME" -d "$DBNAME" \
        -v ON_ERROR_STOP=1 -f "$AD/smoke-seed.sql" > "$SM/smoke-seed.log" 2>&1 \
        || { tail -5 "$SM/smoke-seed.log"; echo "SMOKE_STACK=FAIL smoke-seed.sql"; exit 1; }
    fi
    # --- API on 4124 against the e2e DB. Exported env outranks --env-file
    # .env, so overrides ride the environment; no checkout file is edited.
    export PORT=4124
    # The stack always uses the repository's compact search-eval fixture.
    # Match that fixture's authoritative runner profile; otherwise valid
    # company facets are dropped solely because the toy corpus is below the
    # production popularity floor and smoke manufactures a product failure.
    export SEARCH_V4_COMPANY_MIN_CORPUS="${SEARCH_V4_COMPANY_MIN_CORPUS:-1}"
    # .env.e2e carries placeholder third-party keys (e.g. ANTHROPIC_API_KEY
    # "some-value") that would override the REAL keys in .env (exported env
    # beats --env-file): unset them so the worktree .env supplies the valid
    # ones — chat turns 401 mid-flow otherwise.
    unset ANTHROPIC_API_KEY
    # testergoodword2@gmail.com: the base the repo's own generateWhitelistedEmail
    # mints throwaway users from (tests/fixtures.ts) — global-setup dies without it.
    export OTP_TEST_WHITELIST_EMAILS="edy@goodword.com,tester@goodword.com,testergoodword2@gmail.com,search-eval@goodword.internal"
    nohup bun start > "$SM/api-boot.log" 2>&1 &
    echo $! > "$SM/api.pid"
    CODE=000
    for i in $(seq 1 80); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4124/api-docs-json || echo 000)
      if [ "$CODE" = "200" ]; then break; fi
    done
    test "$CODE" = "200" || { tail -15 "$SM/api-boot.log"; echo "SMOKE_STACK=FAIL api boot code=$CODE"; exit 1; }
    # --- Web on 3124: the fix worktree when repo=web-app, else a
    # disposable detached worktree off the chain-pinned baseline.
    if [ "$REPO" = api ]; then
      WEB_BASELINE=$(python3 - "$ARTIFACTS_DIR/bugfix-chain.json" <<'PY'
    import json,sys
    print(json.load(open(sys.argv[1], encoding="utf-8"))["baseline"]["commits"]["web-app"])
    PY
      )
      if [ ! -d "$WEB_DIR" ]; then
        git -C "$ROOT/web-app" worktree add --detach "$WEB_DIR" "$WEB_BASELINE" > "$SM/web-worktree.log" 2>&1 || { tail -5 "$SM/web-worktree.log"; echo "SMOKE_STACK=FAIL web worktree"; exit 1; }
      fi
      cp "$ROOT/web-app/.env" "$WEB_DIR/.env"
      cd "$WEB_DIR"
      mise x node@20 -- pnpm install --no-frozen-lockfile > "$SM/web-install.log" 2>&1 || { tail -5 "$SM/web-install.log"; echo "SMOKE_STACK=FAIL web install"; exit 1; }
    fi
    if [ -s "$AD/smoke-matrix.spec.ts" ]; then
      mkdir -p "$WEB_DIR/tests/smoke-matrix"
      cp "$AD/smoke-matrix.spec.ts" "$WEB_DIR/tests/smoke-matrix/matrix.spec.ts"
    fi
    cd "$WEB_DIR"
    export VITE_PUBLIC_API_URL="http://localhost:4124"
    # Production build + serve, NOT `pnpm dev`: dev-mode hydration on a fresh
    # worktree can break (duplicate React context via the Vite dep prebundle,
    # a useContext-null Application Error that still returns HTTP 200) while
    # the built serve — what staging actually runs — is fine. The build embeds
    # VITE_PUBLIC_API_URL into the client bundle, so it is exported BEFORE
    # building, and the serve reads PORT.
    mise x node@20 -- pnpm build > "$SM/web-build.log" 2>&1 || { tail -10 "$SM/web-build.log"; echo "SMOKE_STACK=FAIL web build"; exit 1; }
    # server.js reads process.env only (SESSION_SECRET etc.) — source the
    # copied .env for the serve, then re-assert the API override on top.
    set -a; . ./.env; set +a
    export VITE_PUBLIC_API_URL="http://localhost:4124"
    PORT=3124 nohup mise x node@20 -- pnpm start > "$SM/web-boot.log" 2>&1 &
    echo $! > "$SM/web.pid"
    CODE=000
    for i in $(seq 1 100); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3124/ || echo 000)
      if [ "$CODE" = "200" ]; then break; fi
    done
    test "$CODE" = "200" || { tail -15 "$SM/web-boot.log"; echo "SMOKE_STACK=FAIL web boot code=$CODE"; exit 1; }
    echo "SMOKE_STACK=UP api=4124($API_DIR) web=3124($WEB_DIR) pids in $SM (stack stays up through the matrix approval)"
- id: smoke-auto
  depends_on:
  - smoke-stack
  timeout: 1800000
  bash: |
    set -uo pipefail
    ROOT=/Users/eduardopicazo/Documents/Workspace/Goodword
    AD="$ARTIFACTS_DIR"
    WEB_DIR=$(cat "$AD/smoke-stack/web-dir.txt")
    NAUTO=$(python3 -c "import json,sys;print(sum(1 for r in json.load(open(sys.argv[1], encoding='utf-8'))['rows'] if r['kind']=='auto'))" "$AD/smoke-matrix.json")
    if [ "$NAUTO" = 0 ] || [ ! -f "$WEB_DIR/tests/smoke-matrix/matrix.spec.ts" ]; then
      python3 - "$AD/smoke-matrix.json" <<'PY'
    import json, sys
