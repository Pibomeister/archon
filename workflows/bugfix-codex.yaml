    causal-coverage.json —
      {"schema_version":2,"coverage":[{"symptom_id":"E1",
       "cause_id":"H1","occurrence_attributed":true|false,
       "planned_diff":["<repo-relative path>"],
       "red_test":"<test path/name>",
       "counterfactual_user_visible":true|false}]}
    State what the exact planned diff will and will not change. A class-only
    finding cannot cover the presenting occurrence.

    proof-assessment.json —
      {"schema_version":2,"selected_hypothesis_id":1,
       "mechanism_valid":true|false,"occurrence_attributed":true|false,
       "occurrence_evidence_sources":["report|<evidence-provenance source>",...],
