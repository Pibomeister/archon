name: wrap-review-codex
description: 'W6 ce-code-review mode:headless wrapper — the M0.6c-proven shape. Pre node snapshots run-dir set + HEAD; gate = three-part assertion + set-difference run-dir discovery + head_sha check + typed summary to ARTIFACTS_DIR. Smoke satisfied by the funded M0.6c run; re-exercised at M3.1. [codex twin - GENERATED by setup/derive-codex.py from wrap-review.yaml; never hand-edit; regenerate: python3 setup/derive-codex.py wrap-review]'
provider: codex
nodes:
- id: pre
  timeout: 120000
  bash: |
    set -euo pipefail
    REPO=/private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
    cd "$REPO"
    git rev-parse HEAD > "$ARTIFACTS_DIR/pre-head.txt"
    ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$ARTIFACTS_DIR/prerun-dirs.txt" || true
    touch "$ARTIFACTS_DIR/prerun-dirs.txt"
    echo "PRE_OK head=$(cat "$ARTIFACTS_DIR/pre-head.txt")"
- id: review
  depends_on:
  - pre
  timeout: 1800000
  prompt: |
    Use $ce-code-review explicitly for this node.

    The repository to review is at this absolute path:
      /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
    Your current working directory is NOT that repository — cd into it for every git command.

    Invoke the ce-code-review skill with arguments exactly:
      mode:headless base:main
    Do not expand scope beyond the diff against that base.
    Relay the skill's full headless envelope verbatim as part of your output.
- id: gate
  depends_on:
  - review
  trigger_rule: all_done
  timeout: 300000
  bash: |
    set -uo pipefail
    REPO=/private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
    OUT=$review.output
    printf '%s\n' "$OUT" > "$ARTIFACTS_DIR/review-envelope.txt"

    # Three-part gate (verbatim strings from SKILL.md:71/:674) — fail-closed.
    G1=FAIL; printf '%s' "$OUT" | grep -q 'Review complete' && G1=PASS
    G2=FAIL; printf '%s' "$OUT" | grep -q 'Code review degraded (headless mode)' || G2=PASS
    echo "GATE_1_review_complete_present=$G1"
    echo "GATE_2_degraded_absent=$G2"

    # Run-dir discovery: set difference vs pre snapshot, head_sha as correctness proof.
    ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$ARTIFACTS_DIR/post-dirs.txt" || true
    NEW=$(comm -13 "$ARTIFACTS_DIR/prerun-dirs.txt" "$ARTIFACTS_DIR/post-dirs.txt")
    PREHEAD=$(cat "$ARTIFACTS_DIR/pre-head.txt")
    VERDICT=""; RUNDIR=""
    for d in $NEW; do
      M="$d/metadata.json"
      test -f "$M" || continue
      SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('head_sha',''))" "$M" 2>/dev/null)
      if [ "$SHA" = "$PREHEAD" ]; then
        RUNDIR="$d"
        VERDICT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('verdict',''))" "$M" 2>/dev/null)
      fi
    done
    G3=FAIL
    case "$VERDICT" in
      "Ready to merge"|"Ready with fixes"|"Not ready") G3=PASS ;;
    esac
    echo "GATE_3_verdict_in_enum=$G3 verdict=[$VERDICT] rundir=[$RUNDIR]"

    DEGRADED=true; test "$G2" = PASS && DEGRADED=false
    python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/write-review-summary.py \
      "$ARTIFACTS_DIR/review-summary.json" "$VERDICT" "$DEGRADED"
    test "$G1" = PASS && test "$G2" = PASS && test "$G3" = PASS || { echo "W6_GATE=FAIL"; exit 1; }
    echo "W6_GATE=PASS"
