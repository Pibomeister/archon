name: wrap-fixer
description: W8 fixer node (M2.7 step 3). UNCONDITIONAL — self-exits on empty findings (unparseable when- silently green-skips; never gate this node on when-). Input is the disk envelope, resume-safe. Own cap + timeout.
provider: claude
nodes:
  - id: seed-envelope
    timeout: 120000
    bash: |
      set -euo pipefail
      # Smoke stand-in for W6's gate output: canned envelope with one P1 manual finding.
      cp /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/data/envelope.txt \
         "$ARTIFACTS_DIR/review-envelope.txt"
      echo "ENVELOPE_SEEDED"

  - id: fixer
    depends_on: [seed-envelope]
    model: sonnet
    maxBudgetUsd: 5
    timeout: 1200000
    # No output_format: it maps to claude --json-schema (real JSON Schema required;
    # shorthand crashes at dispatch) and replaces the text output. Typed contract
    # lives in the self-owned fixer-result.json artifact instead — resume-safe.
    prompt: |
      You are the fixer node in an unattended review-fix loop. Ask no questions.

      Read the review envelope at the file review-envelope.txt inside the directory
      named by the ARTIFACTS_DIR environment variable (resolve via: echo "$ARTIFACTS_DIR").

      The repository under review is at this absolute path (you are NOT cwd'd there):
        /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo

      Rules:
      - If the envelope contains no findings, write the JSON result (below) with all
        three arrays empty and stop immediately. Do not invent work.
      - Fix P0-P2 findings of class gated_auto or manual by editing the repository files.
      - P3/advisory findings: do NOT fix; record each as a waiver with one line of rationale.
      - A P0-P2 finding you cannot fix goes in "failed" with the reason — do not guess.
      - Do not create commits, branches, or worktrees. Do not touch files a finding does not name.

      When done, write JSON to fixer-result.json in that same artifacts directory:
        {"applied": [..], "failed": [..], "advisory": [..]}
      each entry: {"finding": "<one-line>", "action": "<what you did or why not>"}.
      End your reply with the single line: FIXER_DONE

  - id: gate
    depends_on: [fixer]
    timeout: 300000
    bash: |
      set -uo pipefail
      R="$ARTIFACTS_DIR/fixer-result.json"
      test -s "$R" || { echo "W8_GATE=FAIL no fixer-result.json"; exit 1; }
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$R" || { echo "W8_GATE=FAIL fixer result invalid"; exit 1; }
      cd /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
      grep -q ':-there' lib.sh || { echo "W8_GATE=FAIL P1 fix not applied to lib.sh"; exit 1; }
      echo "W8_GATE=PASS"
