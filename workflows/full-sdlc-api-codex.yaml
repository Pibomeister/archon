          fi
          if ! printf '%s\n' "$SUBJECTS" | grep -q 'apply fixer feedback'; then
            MOVED=NO
            {
              echo "autofix_commit=$(git rev-parse HEAD)"
              echo "pre_round_head=$PREHEAD"
              echo "files:"
              git diff --name-only "$PREHEAD" HEAD | sed 's/^/  /'
            } > "$ARTIFACTS_DIR/review-autofix-unreviewed.txt"
            echo "REVIEW_AUTOFIX_ONLY round=$N files=$(git diff --name-only "$PREHEAD" HEAD | wc -l | tr -d ' ')"
          fi
        fi
        INC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('incomplete',[])))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
        echo "ROUND=$N verdict=[$V] fixer_ok=$FIXOK clean=$CLEAN head_moved=$MOVED incomplete=$INC"
        # Scope guard: any change outside the plan's allowlist is a human stop.
        # Legitimate scope growth = a human edits files-allowlist.json and resumes.
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
          "$ARTIFACTS_DIR/files-allowlist.json" "$WT" \
          "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" --round "$N" || exit 1
        if [ "$FIXOK" = NO ]; then echo "FIXER_BLOCKED round=$N $FIXMSG"; exit 1; fi
        # Cross-repo stop: a finding owned by another repository of this chain is
        # not waivable here, so it must never reach update-waivers.py.
        CROSSN=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('cross_repo') or []))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
        if [ "$CROSSN" != 0 ]; then
          REPOS=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]))['cross_repo'];json.dump(d,open(sys.argv[2],'w'),indent=1);print(','.join(sorted({str(e.get('producer_repo','?')) for e in d})))" "$RD/fixer-result.json" "$ARTIFACTS_DIR/cross-repo-findings.json")
          echo "CROSS_REPO_FINDING round=$N count=$CROSSN repos=$REPOS"
          exit 1
        fi
        # Waiver ledger: record this round's advisory declines so later rounds
        # do not re-litigate them without new evidence.
        python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/update-waivers.py \
          "$RD/fixer-result.json" "$ARTIFACTS_DIR/waivers.md"
        # Review yield, measured every round and printed for the operator.
        YIELD=$(python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/review-yield.py "$ARTIFACTS_DIR" "$N")
        echo "$YIELD"
        DIM=NO; case "$YIELD" in *"verdict=DIMINISHING"*) DIM=YES ;; esac
        # Re-litigation is the other shape of a loop that has stopped
        # yielding: two rounds that applied nothing, while at least half of
        # what this round handled was a finding the ledger had already
        # waived. That is a reviewer re-raising settled decisions, and
        # another round buys the same argument again. Parsed tolerantly —
        # reraised_advisory is absent on an older review-yield.py and reads
        # as 0 — and it qualifies the SAME opt-in branch as DIMINISHING
        # below, never a branch of its own.
        RR=0; case "$YIELD" in *" reraised="*) RR=${YIELD##* reraised=}; RR=${RR%% *} ;; esac
        RRA=0; case "$YIELD" in *" reraised_advisory="*) RRA=${YIELD##* reraised_advisory=}; RRA=${RRA%% *} ;; esac
        APPLIED=0; case "$YIELD" in *" applied="*) APPLIED=${YIELD##* applied=}; APPLIED=${APPLIED%% *} ;; esac
        for v in RR RRA APPLIED; do eval "case \"\$$v\" in ''|*[!0-9]*) $v=0 ;; esac"; done
        PREV_APPLIED=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['applied']))" "$ARTIFACTS_DIR/round-$((N-1))/fixer-result.json" 2>/dev/null || echo -1)
        HANDLED=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(len(d.get('applied') or [])+len(d.get('advisory') or []))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
        RERAISE=NO
        if [ "$APPLIED" = 0 ] && [ "$PREV_APPLIED" = 0 ] && [ "$HANDLED" -gt 0 ] \
           && [ "$(( (RR + RRA) * 2 ))" -ge "$HANDLED" ]; then
          RERAISE=YES
          echo "REVIEW_RERAISE round=$N reraised=$((RR + RRA))/$HANDLED"
        fi
        # Durable round cap: counted against round.txt (survives resumes), not
        # loop iterations. accept-residuals.txt is a HUMAN act, never an agent's.
        CAP=$(cat "$ARTIFACTS_DIR/round-cap.txt" 2>/dev/null || echo 4)
        ACCEPT=NO; test -f "$ARTIFACTS_DIR/accept-residuals.txt" && ACCEPT=YES
        case "$V" in
          "Ready to merge"|"Ready with fixes")
            if [ "$MOVED" = NO ] && [ "$CLEAN" = YES ] && [ "$INC" = 0 ]; then
              echo "CONVERGED round=$N"
              echo "<promise>REVIEW_CONVERGED</promise>"
            elif [ "${ARCHON_FEATURE_SCOPE-}" = repositories ] && [ -f "$ARTIFACTS_DIR/yield-stop.txt" ] \
                 && [ "$CLEAN" = YES ] && [ "$INC" = 0 ] && [ "$N" -ge 2 ] && [ "$N" -lt "$CAP" ] \
                 && { [ "$DIM" = YES ] || [ "$RERAISE" = YES ]; }; then
              # Opt-in yield convergence, repositories scope only: the fixes below are
              # NOT re-reviewed, and trusted-local-candidate.sh re-runs typecheck, lint
              # and the unit patterns on the candidate. No other lane has that belt.
              # lite-fixes-unreviewed.txt has no reader on this path (post-fix-gate and
              # the lite prbody are lite-only); it is written for the record.
              {
                echo "fixer_commit=$(git rev-parse HEAD)"
                echo "pre_round_head=$(cat "$RD/pre-head.txt")"
                echo "applied_findings=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('applied',[])))" "$RD/fixer-result.json" 2>/dev/null || echo unknown)"
                echo "files:"
                git diff --name-only "$(cat "$RD/pre-head.txt")" HEAD | sed 's/^/  /'
              } > "$ARTIFACTS_DIR/lite-fixes-unreviewed.txt"
              echo "LITE_FIXES_UNREVIEWED round=$N $(git diff --name-only "$(cat "$RD/pre-head.txt")" HEAD | wc -l | tr -d ' ') file(s) landed by the fixer and not re-reviewed (see lite-fixes-unreviewed.txt)"
              echo "CONVERGED round=$N (REVIEW_DIMINISHING $YIELD)"
              echo "<promise>REVIEW_CONVERGED</promise>"
            elif [ "$N" -ge "$CAP" ]; then
              if [ "$ACCEPT" = YES ]; then
                echo "CONVERGED round=$N (human accepted residuals)"
                echo "<promise>REVIEW_CONVERGED</promise>"
              else
                echo "ROUND_CAP_REACHED round=$N"; exit 1
              fi
            else
              echo "ROUND_PROGRESSED round=$N (changes landed or incomplete items; re-review next round)"
            fi
            ;;
          "Not ready")
            if [ "$MOVED" = NO ]; then echo "NO_PROGRESS round=$N (Not ready and nothing changed)"; exit 1; fi
            if [ "$N" -ge "$CAP" ]; then
              if [ "$ACCEPT" = YES ]; then
                echo "CONVERGED round=$N (human accepted residuals)"
                echo "<promise>REVIEW_CONVERGED</promise>"
              else
                echo "ROUND_CAP_REACHED round=$N"; exit 1
              fi
            else
              echo "ROUND_PROGRESSED round=$N (Not ready; fixes landed; re-review next round)"
            fi
            ;;
          *) echo "CONVERGE=FAIL unknown verdict [$V]"; exit 1 ;;
        esac
- id: exit-gate
  depends_on:
  - review-loop
  - reader-audit-gate
  timeout: 600000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-exit-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-exit-gate.out" >&2); fi
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    cd "$WT"
    N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
    case "$N" in ''|*[!0-9]*) echo "EXIT_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
    # Cross-repo belt: converge's stop is bypassable by a resume, and the
    # accept-residuals branch below skips the fixer re-check entirely.
    CROSSN=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('cross_repo') or []))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
    test "$CROSSN" = 0 || { echo "EXIT_GATE=FAIL CROSS_REPO_FINDING round=$N count=$CROSSN"; exit 1; }
    # A human accepting residuals waives the verdict and fixer checks — never
    # the clean-tree, scope, or unit-test checks (accepted findings, not a broken tree).
    if [ -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then
      echo "EXIT_GATE accept-residuals present: verdict and fixer checks skipped ($(head -1 "$ARTIFACTS_DIR/accept-residuals.txt"))"
    else
      V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
      case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
    fi
    test -z "$(git status --porcelain | grep -v '^?? \.env')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
    # Scope guard belt (resume ordering can bypass converge's check).
    python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
      "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
      || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
    # Reader-audit belt: declared columns must have a passing result on disk.
    NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$ARTIFACTS_DIR/reader-audit.json" 2>/dev/null || echo 0)
    if [ "$NC" != 0 ]; then
      test -s "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL missing reader-audit-result.json"; exit 1; }
      python3 -c "import json,sys; cols=json.load(open(sys.argv[1]))['columns']; aff=[r for c in cols for r in c.get('readers',[]) if r.get('class')=='affected']; sys.exit('affected readers: %s' % aff) if aff else None" "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL affected reader"; exit 1; }
    fi
    # Materialize-then-`test -s`, same as gate-tests and deslop-recheck: a process
    # substitution hides the extractor's exit code, so a broken or empty
    # verify.json would run the loop zero times and this gate would print
    # EXIT_GATE=PASS having verified nothing.
    python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
      "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
      || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
    test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
    while IFS= read -r PAT; do
      test -n "$PAT" || continue
      "${CMD_TEST[@]}" "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix unit tests pattern=$PAT"; exit 1; }
    done < "$ARTIFACTS_DIR/exit-patterns.txt"
    echo "EXIT_GATE=PASS"
- id: smoke
  depends_on:
  - exit-gate
  timeout: 1200000
  bash: |
    set -uo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-smoke.out") 2> >(tee -a "$ARTIFACTS_DIR/node-smoke.out" >&2); fi
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    case "$REPO" in goodword-mcp) exec bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/mcp-smoke.sh "$WT" "$ARTIFACTS_DIR" "$APIPORT" ;; esac
    # Gated on the repo's DECLARED capability, never on an empty $APIPORT: a
    # port that failed to allocate for a smoke-bearing repo must stay a hard
    # failure at preflight, not become a silent skip here. prbody reads this
    # file verbatim, so the typed line is what reaches the PR.
    if [ -z "$HAS_SMOKE" ]; then
      echo "SMOKE=NOT_APPLICABLE ($REPO declares no boot smoke)" | tee "$ARTIFACTS_DIR/smoke-result.txt"
      exit 0
    fi
    cd "$WT"
    # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux). rc 1 only
    # when no backend exists at all.
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    PORT="$APIPORT" bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
    SRV=$!
    # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
    trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids "$APIPORT"); test -n "$P" && kill $P 2>/dev/null; true' EXIT
    # Boot liveness: /api-docs-json 200 also proves swagger builds with the new DTOs.
    CODE=000
    for i in $(seq 1 60); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT/api-docs-json" || echo 000)
      test "$CODE" = "200" && break
    done
    test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
    CTRL=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT/info" || echo 000)
    test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
    RESULT="SMOKE=PASS api-docs-json=200 guarded-control=401"
    # Optional feature probe: only when the plan declared an unauthenticated GET.
    if [ -s "$ARTIFACTS_DIR/smoke-probe.json" ]; then
      PPATH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['path'])" "$ARTIFACTS_DIR/smoke-probe.json")
      PEXP=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('expect','200'))" "$ARTIFACTS_DIR/smoke-probe.json")
      PCODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT$PPATH" || echo 000)
      test "$PCODE" = "$PEXP" || { echo "SMOKE=FAIL probe $PPATH code=$PCODE expected=$PEXP"; exit 1; }
      RESULT="$RESULT probe:$PPATH=$PCODE"
    fi
    echo "$RESULT" | tee "$ARTIFACTS_DIR/smoke-result.txt"
