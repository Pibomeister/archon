        else
          # LT stays 0 so the doctrine-locked integer keeps its shape, but the
          # applicability travels in recheck.json itself -- the record the
          # reviewer and the PR body actually read. A marker file no consumer
          # opens is not evidence.
          echo "LINT=NOT_APPLICABLE ($REPO declares no lint command)" > "$RD/lint.txt"
