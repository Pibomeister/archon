          PREHEAD=$(cat "$RD/pre-head.txt")
          SUBJECTS=$(git log --format=%s "$PREHEAD"..HEAD)
          FOREIGN=$(printf '%s\n' "$SUBJECTS" | grep -v 'apply fixer feedback' | grep -v 'apply autofix feedback' | grep -v '^$' || true)
          if [ -n "$FOREIGN" ]; then
            echo "REVIEW_TREE_DRIFT round=$N sha=$(git rev-parse HEAD)"
            printf '%s\n' "$FOREIGN" | sed 's/^/  unexpected subject: /'
