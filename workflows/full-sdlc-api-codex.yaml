name: full-sdlc-api-codex
description: 'UNADMITTED — remote publication is disabled; runs stop at ship until trusted controller admission. API prong end-to-end (spec -> plan -> doc-review -> approval -> implement -> tests -> review loop -> smoke -> PR preparation). Feature handoff v2 records premises_sha256 and reader_audit_sha256 so approved premise and reader declarations cannot disappear before the web lane. Run message = ABSOLUTE path to the feature spec; empty message fails preflight. Branch/worktree derive from the spec filename (archon/<slug>). Invoke with DISABLE_OMC=1. [codex twin - GENERATED by setup/derive-codex.py from full-sdlc-api.yaml; never hand-edit; regenerate: python3 setup/derive-codex.py full-sdlc-api]'
interactive: true
provider: codex
nodes:
- id: codex-control-guard
  always_run: true
  timeout: 60000
  bash: |
    set -euo pipefail
    python3 - "${ARCHON_CODEX_LITE_GUARD_FILE:-}" <<'PY_CONTROL' || exit 1
    import os, pathlib, pwd, re, stat, sys
    p = sys.argv[1]
    try:
        path = pathlib.Path(p)
        expected_dir = pathlib.Path(pwd.getpwuid(os.getuid()).pw_dir) / ".archon" / "control" / "codex-lite"
        if path.parent.resolve() != expected_dir.resolve():
            raise RuntimeError("guard is outside the fixed private control directory")
        match = re.fullmatch(r"guard-([0-9a-f]{64})", path.name)
        if not match:
            raise RuntimeError("guard filename is not a launcher nonce")
        s = os.lstat(p)
        if not stat.S_ISREG(s.st_mode) or s.st_uid != os.getuid() or s.st_mode & 0o077:
            raise RuntimeError("guard must be an owned mode-0600 regular file")
        with open(p, encoding="utf-8") as fh:
            if fh.read() != f"codex-lite-one-time-guard:{match.group(1)}\n":
                raise RuntimeError("guard nonce content mismatch")
        os.unlink(p)
    except Exception as e:
        print("CODEX_CONTROL_GUARD=FAIL use the guarded archon-run.py surface: " + str(e))
        raise SystemExit(1)
    print("CODEX_CONTROL_GUARD=PASS provider=codex one_time=consumed")
    PY_CONTROL
- id: preflight
  timeout: 300000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-preflight.out") 2> >(tee -a "$ARTIFACTS_DIR/node-preflight.out" >&2); fi
    SK="/Users/eduardopicazo/Documents/Workspace/Goodword/.claude/skills"
    test -f "$SK/ce-code-review/SKILL.md" || { echo "PREFLIGHT=FAIL staged ce-code-review missing"; exit 1; }
    test -f "$SK/ce-doc-review/SKILL.md"  || { echo "PREFLIGHT=FAIL staged ce-doc-review missing"; exit 1; }
    # Codex twins: codex discovers skills from <root>/.agents/skills (staged by
    # stage-skills.sh next to the .claude links asserted above).
    ASK="${SK%/.claude/skills}/.agents/skills"
    test -f "$ASK/ce-code-review/SKILL.md" || { echo "PREFLIGHT=FAIL codex-staged ce-code-review missing (run setup/stage-skills.sh)"; exit 1; }
    test -f "$ASK/ce-doc-review/SKILL.md"  || { echo "PREFLIGHT=FAIL codex-staged ce-doc-review missing (run setup/stage-skills.sh)"; exit 1; }
    # Dual contract: CE 3.2.0 carries the markers in SKILL.md; newer CE moved
    # mode:headless (now an alias for mode:agent) into references/modes-and-output.md
    # and the verdict field into references/finish-review.md. Either satisfies.
    { grep -q 'mode:headless' "$SK/ce-code-review/SKILL.md" && grep -q '"verdict"' "$SK/ce-code-review/SKILL.md"; }         || { grep -q 'mode:headless' "$SK/ce-code-review/references/modes-and-output.md" 2>/dev/null && grep -q '"verdict"' "$SK/ce-code-review/references/finish-review.md" 2>/dev/null; }         || { echo "PREFLIGHT=FAIL ce-code-review carries neither review contract (headless envelope nor agent JSON)"; exit 1; }
    command -v bun >/dev/null || { echo "PREFLIGHT=FAIL bun missing"; exit 1; }
    command -v gh >/dev/null || { echo "PREFLIGHT=FAIL gh missing"; exit 1; }
    gh auth status >/dev/null 2>&1 || { echo "PREFLIGHT=FAIL gh unauthenticated"; exit 1; }
    command -v aws >/dev/null 2>&1 && aws sts get-caller-identity >/dev/null 2>&1 \
      || echo "PREFLIGHT_WARN aws unavailable or expired - AWS evidence/runtime integrations may degrade; workflow control continues"
    # Billing guard (codex): runs MUST bill the ChatGPT plan (auth_mode "chatgpt"
    # in the effective CODEX_HOME), never an API key. Fail closed when the auth
    # file is missing, unreadable, keyed to the API, or token-less.
    CODEX_AUTH="${CODEX_HOME:-$HOME/.codex}/auth.json"
    python3 - "$CODEX_AUTH" <<'PY_BILLING' || exit 1
    import json, sys
    p = sys.argv[1]
    try:
        d = json.load(open(p))
    except Exception as e:
        print(f"BILLING_GUARD=FAIL codex auth unreadable at {p}: {e}"); sys.exit(1)
    if d.get("auth_mode") != "chatgpt":
        print(f"BILLING_GUARD=FAIL codex auth_mode={d.get('auth_mode')!r} at {p} - would not bill the ChatGPT plan"); sys.exit(1)
    t = d.get("tokens") or {}
    if not (t.get("access_token") and t.get("refresh_token")):
        print(f"BILLING_GUARD=FAIL codex tokens missing at {p} - run: CODEX_HOME=<home> codex login"); sys.exit(1)
    print("BILLING_GUARD=OK chatgpt")
    PY_BILLING
    # WARN (not FAIL) when the dedicated home's auth is a byte-copy of the personal
    # ~/.codex login: the two homes then share ONE refresh-token pair, and either
    # side's refresh can strand the other. A real `CODEX_HOME=<home> codex login`
    # is the durable setup (install skill §6).
    if [ "$CODEX_AUTH" != "$HOME/.codex/auth.json" ] && cmp -s "$CODEX_AUTH" "$HOME/.codex/auth.json" 2>/dev/null; then
      echo "BILLING_GUARD=WARN codex auth is a byte-copy of ~/.codex/auth.json (shared refresh pair) - prefer a dedicated login"
    fi
    # port_pids: PIDs holding a TCP port. lsof is preinstalled on macOS and
    # frequently absent on Linux, so try lsof -> ss -> fuser. rc 1 means NO
    # backend exists at all; it never means "the port is free". Without this a
    # missing lsof made the busy-port check silently pass and let two runs collide.
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    # Tool presence only. The port itself is ALLOCATED below, not asserted
    # free: port-alloc.sh walks past an occupied slot, which is what lets a
    # second run of this lane start while the first is still up.
    port_pids 4123 >/dev/null || { echo "PREFLIGHT=FAIL no port-inspection tool (need lsof, ss, or fuser)"; exit 1; }
    # Run identity: message = absolute spec path (empty = hard fail). Single derivation point.
    # This is ALSO the single repo-selection point, and it must come BEFORE any
    # repo-dependent check. Resolving the repo here and again below produced a
    # resumed run that checked one repository's checkout and then targeted
    # another's worktree; there is deliberately no second resolution.
    # 4123 is this lane's port BASE and the only place that literal still
    # appears -- derive-lite.py's port map is a plain string substitution, so
    # one literal site per lane is what keeps the lite twin derivable. It is
    # ignored for a repo that declares no smoke stack.
    # --allow is what THIS lane supports; it gates a new selection only, never
    # an already-bound run (see resolve-params.sh).
    bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/resolve-params.sh \
      /Users/eduardopicazo/Documents/Workspace/Goodword "${ARGUMENTS-}" "$ARTIFACTS_DIR" 4123 \
      --allow api,goodword-mcp,web-app
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    test -d "/Users/eduardopicazo/Documents/Workspace/Goodword/$REPO/.git" || { echo "PREFLIGHT=FAIL $REPO repo missing"; exit 1; }
    # An empty APIPORT is legal ONLY because the repo declares no smoke stack.
    # Keying this on the profile rather than on the value is what keeps a real
    # port-allocation failure for a smoke-bearing repo a hard failure.
    if [ -n "$HAS_SMOKE" ]; then
      test -n "$APIPORT" || { echo "PREFLIGHT=FAIL params.json carries no smoke port"; exit 1; }
      echo "PREFLIGHT_PORTS api=$APIPORT (per-run, from base 4123)"
    else
      echo "PREFLIGHT_PORTS none ($REPO declares no smoke stack)"
    fi
    test -d /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb/wiki || { echo "PREFLIGHT=FAIL knowledge base missing"; exit 1; }
    git -C /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb status --porcelain | sort > "$ARTIFACTS_DIR/kb-pre-porcelain.txt"
    # Repository-scope runs are budgeted to converge inside two hours, so they
    # get tighter caps than the legacy defaults baked into the readers
    # (round-pre/converge default 4, plan-round-pre/plan-converge default 3).
    # Written only when absent: an operator who raised a cap and resumed keeps
    # the raise even if this node re-runs. Legacy runs get no file at all.
    if [ "${ARCHON_FEATURE_SCOPE-}" = repositories ]; then
      test -f "$ARTIFACTS_DIR/round-cap.txt" || echo 3 > "$ARTIFACTS_DIR/round-cap.txt"
      test -f "$ARTIFACTS_DIR/plan-round-cap.txt" || echo 2 > "$ARTIFACTS_DIR/plan-round-cap.txt"
      echo "ROUND_CAPS=OK review=$(cat "$ARTIFACTS_DIR/round-cap.txt") plan=$(cat "$ARTIFACTS_DIR/plan-round-cap.txt")"
    fi
    echo "PREFLIGHT=PASS"
  depends_on:
  - codex-control-guard
- id: feature-phase
  depends_on:
  - preflight
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-feature-phase.out") 2> >(tee -a "$ARTIFACTS_DIR/node-feature-phase.out" >&2); fi
    SCOPE="${ARCHON_FEATURE_SCOPE-legacy}"
    PHASE="${ARCHON_FEATURE_PHASE-legacy}"
    # Verify-only reopen: the chain re-runs a stage whose code is already
    # landed, to re-verify it against a repaired upstream. params.json is the
    # carrier because a resume drops the chain env (see local-candidate).
    # Read tolerantly: an absent or unparseable params.json means "not
    # verify-only", the same answer the legacy path gives.
    VERIFY_ONLY=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('feature_verify_only',''))" "$ARTIFACTS_DIR/params.json" 2>/dev/null || echo "")
    if [ "$SCOPE" = repositories ]; then
      case "$PHASE" in
        planning) PLAN=yes; BOOTSTRAP=no; IMPLEMENT=no; INTEGRATION=no ;;
        implement) PLAN=no; BOOTSTRAP=yes; IMPLEMENT=yes; INTEGRATION=no
                   # bootstrap still cuts the worktree so the gates below have
                   # a tree to verify; only the implement node is skipped.
                   if [ "$VERIFY_ONLY" = yes ]; then IMPLEMENT=no; fi ;;
        integration) PLAN=no; BOOTSTRAP=no; IMPLEMENT=no; INTEGRATION=yes ;;
        *) echo "FEATURE_PHASE=FAIL unsupported repository phase $PHASE"; exit 1 ;;
      esac
    else
      PHASE=legacy; PLAN=yes; BOOTSTRAP=yes; IMPLEMENT=yes; INTEGRATION=no
    fi
    printf '{"phase":"%s","scope":"%s","plan":"%s","bootstrap":"%s","implement":"%s","integration":"%s"}\n'         "$PHASE" "$SCOPE" "$PLAN" "$BOOTSTRAP" "$IMPLEMENT" "$INTEGRATION"
- id: kb-recon
  depends_on:
  - feature-phase
  when: $feature-phase.plan == 'yes'
  timeout: 900000
  prompt: |
    You are the knowledge-base scout. Your job is the context a code explorer
    cannot see: why things are the way they are. Ask no questions.

    The knowledge base is at /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb.
    Read ONLY — never edit anything there:
      glossary.md for domain terms; wiki/decisions/ (start at index.md) for
      prior decisions; the routing table in its CLAUDE.md, then the relevant
      wiki/concepts, wiki/patterns, wiki/systems pages for this feature's
      domain; wiki/change-history/ for recent lessons nearby.
    The feature spec: read params.json in the directory named by the
    ARTIFACTS_DIR environment variable (resolve via: echo "$ARTIFACTS_DIR");
    its "spec" field is the absolute path of the spec file. Read that file.

    Write kb-context.md into the directory named by the ARTIFACTS_DIR
    environment variable (resolve via: echo "$ARTIFACTS_DIR") with these
    marker-wrapped sections:
    <!-- TERMS --> domain terms this feature touches, each with the KB's own
    definition quoted, not loosely paraphrased. These are the words agents misread.
    <!-- DECISIONS --> prior decisions and ADRs that CONSTRAIN this feature,
    each with its recorded rationale. Load-bearing: the planner must honor
    these or explicitly justify deviating.
    <!-- DATA-MODEL --> what the KB records about the entities this feature
    reads or writes: ownership, invariants, lifecycle.
    <!-- BIG-PICTURE --> the forest for the trees: how this corner fits the
    whole system, five sentences or fewer.
    <!-- FOOTGUNS --> recorded failure modes and invariants near this area.
    <!-- SOURCES --> the exact KB file paths you actually opened, one absolute
    path per line. List only files you read.
    A section with nothing relevant says exactly: Nothing found in the KB.
    State absence, never pad. Every cited fact must come from a SOURCES file.
    End with the single line: KB_RECON_DONE
- id: kb-recon-gate
  depends_on:
  - kb-recon
  when: $feature-phase.plan == 'yes'
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-kb-recon-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-kb-recon-gate.out" >&2); fi
    K="$ARTIFACTS_DIR/kb-context.md"
    test -s "$K" || { echo "KB_GATE=FAIL no kb-context.md"; exit 1; }
    for m in TERMS DECISIONS DATA-MODEL BIG-PICTURE FOOTGUNS SOURCES; do
      grep -q "<!-- $m -->" "$K" || { echo "KB_GATE=FAIL missing section $m"; exit 1; }
    done
    # Provenance is real, not invented: at least one listed source must exist on disk.
    OK=0
    for p in $(grep -oE '/[A-Za-z0-9._/-]+\.md' "$K" | sort -u | head -20); do
      test -f "$p" && OK=1 && break
    done
    test "$OK" = 1 || { echo "KB_GATE=FAIL no verifiable source path"; exit 1; }
    # The scout is read-only: the KB tree must be exactly as preflight saw it.
    git -C /Users/eduardopicazo/Documents/Workspace/Goodword/goodword-kb status --porcelain | sort > "$ARTIFACTS_DIR/kb-now.txt"
    # The knowledge base is HOST-GLOBAL: a concurrent lane's kb-capture drops
    # an untracked file into wiki/change-history/ and a raw cmp would blame
    # this run's read-only scout for it. Everything else is compared strictly.
    grep -v '^?? wiki/change-history/' "$ARTIFACTS_DIR/kb-pre-porcelain.txt" | sort > "$ARTIFACTS_DIR/kb-pre-scoped.txt"
    grep -v '^?? wiki/change-history/' "$ARTIFACTS_DIR/kb-now.txt" | sort > "$ARTIFACTS_DIR/kb-now-scoped.txt"
    cmp -s "$ARTIFACTS_DIR/kb-pre-scoped.txt" "$ARTIFACTS_DIR/kb-now-scoped.txt" || { echo "KB_GATE=FAIL scout modified the knowledge base"; exit 1; }
    echo "KB_RECON_GATE=PASS"
- id: bootstrap
  depends_on:
  - feature-phase
  when: $feature-phase.bootstrap == 'yes'
  timeout: 900000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-bootstrap.out") 2> >(tee -a "$ARTIFACTS_DIR/node-bootstrap.out" >&2); fi
    # REPO_DIR must come AFTER params-env: $REPO does not exist before it.
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    REPO_DIR="/Users/eduardopicazo/Documents/Workspace/Goodword/$REPO"
    if [ "${ARCHON_FEATURE_SCOPE-}" = repositories ] && [ "${ARCHON_FEATURE_PHASE-}" = implement ]; then
      git -C "$WT" rev-parse --is-inside-work-tree >/dev/null 2>&1 || { echo "BOOTSTRAP=FAIL controller-pinned worktree missing"; exit 1; }
      test "$(git -C "$WT" branch --show-current)" = "$BR" || { echo "BOOTSTRAP=FAIL controller worktree on wrong branch"; exit 1; }
      echo "BOOTSTRAP=ADOPTED_CONTROLLER"
    elif [ -d "$WT" ]; then
      test "$(git -C "$WT" branch --show-current)" = "$BR" || { echo "BOOTSTRAP=FAIL existing worktree on wrong branch"; exit 1; }
      echo "BOOTSTRAP=ADOPTED"
    else
      git -C "$REPO_DIR" fetch origin main
      git -C "$REPO_DIR" worktree add "$WT" -b "$BR" origin/main
      echo "BOOTSTRAP=CREATED"
    fi
    # Seeding the worktree's env is REQUIRED for a repo that declares a source
    # and skipped only for one that declares none. Keyed on the profile, not on
    # whether the file happens to exist: `cp` failing for api must stay fatal.
    if [ -n "$ENV_SRC" ]; then
      cp "$REPO_DIR/$ENV_SRC" "$WT/$ENV_SRC"
    fi
    cd "$WT" && "${CMD_INSTALL[@]}" >/dev/null
    git -C "$WT" rev-parse HEAD > "$ARTIFACTS_DIR/bootstrap-head.txt"
    # api_worktree is the key archon-run.py:2054 and resolve-web-params.sh:75
    # read; it keeps its name. "repo" is additive so the artifact stops
    # implying every run targets api.
    printf '{"api_worktree":"%s","branch":"%s","repo":"%s"}\n' "$WT" "$BR" "$REPO" > "$ARTIFACTS_DIR/worktrees.json"
    echo "WORKTREE=$WT BRANCH=$BR HEAD=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"
- id: ralplan
  depends_on:
  - bootstrap
  - kb-recon-gate
  trigger_rule: none_failed_min_one_success
  when: $feature-phase.plan == 'yes'
  timeout: 1200000
  prompt: |
    You are the planning node in an unattended workflow. Ask no questions; make
    conservative assumptions and record them in the plan.

    First read params.json in the directory named by the ARTIFACTS_DIR
    environment variable (resolve via: echo "$ARTIFACTS_DIR"). Its "spec"
    field is the feature spec path; its "worktree" field is the working tree
    to implement against (you are NOT cwd'd there).
    Its "repo" field names the repository this run targets and is authoritative
    for everything below.
    JOINT-REPOSITORY RUNS: when params.json has "repositories" or
    "repository_scope", those canonical repository names are the entire
    approved scope. Treat the scalar "repo" and "worktree" as the current
    execution context only; read every selected repository worktree named in
    params.json "worktrees_by_repo" when present, or otherwise from the
    standard Goodword root. Produce ONE plan for all selected repositories.
    Any dependency between selected repositories is owned work in this plan,
    never an external prerequisite. Do not add repositories that are absent
    from the selected list.
    If budget-forecast.json exists, read its remaining phase allowances and
    uncertainty before planning. It is controller-owned evidence, not authority
    to omit required scope or tests. Review checkpoints reserve downstream work;
    never edit the forecast or budget to make a plan pass.
    The scalar API/web instructions below apply only when neither repository
    list field exists. For joint runs, group file paths and verification by
    each selected repository; an unselected web-app has empty web artifacts.
    SINGLE-REPO RUNS: when "repo" is anything other than "api", this run has no
    web-app prong at all. Author a SINGLE-REPOSITORY plan, make every path under
    ## Files relative to that repository's root, write web-files-allowlist.json
    as [] and web-reader-audit.json as {"columns": []}, and ignore the
    cross-repository instructions in the paragraph that follows.
    Author ONE SHARED CROSS-REPOSITORY implementation plan for the complete
    feature: API responsibilities and web-app responsibilities together. The
    API lane will implement only the API section after approval, but this gate
    is the single approval for the full design; the later web lane must follow
    this exact approved plan and its derived web scope contract.

    Then read kb-context.md in that same directory —
    the knowledge-base scout's report. Its DECISIONS section is binding: the
    plan honors those constraints, or records an explicit one-line
    justification for each deviation. Use its TERMS with their KB meanings and
    respect its FOOTGUNS.

    Then read the spec and the repository files it names, and write the plan
    as markdown to plan.md in that same directory.

    The plan must contain exactly one shared implementation unit with these exact headings:
      ## Goal
      ## Files
      ## Approach
      ## Test scenarios
      ## Verification
    Under ## Files, separate API paths and web-app paths clearly; API paths are
    relative to api/, web paths are relative to web-app/. The web section may
    be empty only when the spec truly has no web-app prong.
    Under Verification list exactly three commands (they are the shell gate):
      bun run typecheck
      bun run lint
      bun run test -- "<pattern>"
    where <pattern> is the jest name pattern that selects every spec file this
    unit touches or creates (existing specs for edited files included).
    The three commands above are the "api" repository's. For any other "repo",
    list that repository's gate commands instead, in the same order — typecheck,
    then lint ONLY IF the repository has one, then the unit test command — so the
    count follows the repository. For "repo": "goodword-mcp" it is exactly two,
    because that repository has no lint script and listing one would make the
    gate unsatisfiable:
      mise x node@20 -- pnpm exec tsc --noEmit
      mise x node@20 -- env NODE_OPTIONS=--experimental-vm-modules pnpm exec jest --testPathIgnorePatterns '\.(e2e|smoke)\.test\.ts$' --testPathPatterns "<pattern>"
    There, <pattern> is a jest PATH pattern (it matches the spec's file path).
    Also write verify.json to that directory — the machine-readable mirror the
    shell gate executes: {"test_patterns": ["<pattern>", ...]} with at least
    one pattern, each matching the Verification commands exactly.
    JOINT-REPOSITORY RUNS must also write joint-plan.json in that directory:
      {"schema":"archon.joint-feature-plan.v1",
       "repositories":["<canonical repo>", "..."],
       "acceptance_criteria":[{"id":"<id>","text":"<criterion>"}],
       "contracts":[{"producer":"<repo>",
                     "consumer":"<repo>",
                     "artifact":"<producer-relative committed interface file>",
                     "description":"<one line>"}],
       "stages":{"<selected repo>":
         {"depends_on":["<selected upstream repo>", "..."],
          "files_allowlist":["<repo-relative path>", "..."],
          "test_patterns":["<test path or pattern>", "..."],
          "verification":["<exact local command>", "..."]}},
       "integration":{"scenarios":[{"name":"<scenario>",
                                    "uses":["<repo>", "..."],
                                    "covers":["<criterion id>", "..."],
                                    "commands":[{"repo":"<selected repo>",
                                                 "argv":["<executable>", "<candidate-relative script>"]}],
                                    "expected_tests":["<observable assertion>"]}]}}
    Every acceptance criterion the spec states gets one id in
    acceptance_criteria, and every id appears in some scenario's covers. One
    scenario covers several criteria only when its expected_tests name an
    observable assertion per criterion it covers.
    The controller computes dependency_order from the stage depends_on lists
    and freezes it into the approval snapshot using repository-name ordering
    for independent stages. Every depends_on entry and integration uses entry
    must name a selected repository. Each integration command must print
    ARCHON_INTEGRATION_TESTS=<n> with a total at least as large as the
    scenario's expected_tests count. The integration scenarios must run
    locally against the selected candidate revisions in disposable worktrees
    or fixtures; do not make PRs, deploy, publish, or rely on an upstream
    merge.
    Joint execution contracts are executable, not prose placeholders:
    - A contract artifact is a literal relative file path. By default it must
      exist in the final producer candidate. For generated exports, add
      "export":{"argv":["<executable>","<candidate-owned export script>"]}.
      The command runs without shell expansion in the producer worktree after
      verification; its script must write artifact under the environment
      variable ARCHON_INTERFACE_OUTPUT_DIR. It must not change the worktree.
      The harness copies and hashes that output for candidate-inputs.json.
      A command mentioned only in stage verification is NOT an export hook.
    - Use structured integration commands {"repo":"<selected repo>",
      "argv":[...]} for new plans. Their cwd is that repo's disposable candidate
      worktree. Candidate-owned scripts must be included in the owning stage's
      file allowance and tests. The runner creates worktrees; do not create
      nested worktrees or use the main checkouts as execution inputs.
      Arguments may reference ${ARCHON_REPO_API_WORKTREE} and
      ${ARCHON_REPO_API_COMMIT}; replace API with GOODWORD_MCP or WEB_APP for
      those selected repos. Only this vocabulary is supported. These are exact
      candidate inputs, not invented *_CANDIDATE_SHA names. Each command must
      print its actual assertion count; expected_tests names concrete checks.
    - Trace each changed interface end to end: producer status/payload, client
      normalization, generated types, consumer behavior, and observable tests.
      Cite the existing transformation code. If errors are collapsed by a client,
      define a distinguishable contract or own changes to that client in the
