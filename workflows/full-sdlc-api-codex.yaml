    directory. browser-evidence.json is the approved browser acceptance policy
    for the later controller-owned Playwright verifier, with schema:
      {"required":[{"id":"browser-1","criterion":"<human text>",
        "path":"/<same-origin path>",
        "assertions":[{"type":"text|selector|url|title|testid|click|fill",
