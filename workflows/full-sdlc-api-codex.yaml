              cmp -s "$CUR" "$PRE" || AM="$AM,$f"
            elif [ -f "$CUR" ] || [ -f "$PRE" ]; then
              # Appeared or disappeared: a contract file's existence is part of it.
              AM="$AM,$f"
            fi
