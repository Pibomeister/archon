      fi
      if ! bunx jest --config jest.ai.config.js apps/api-e2e/src/eval/search-corpus/search-eval.ai.spec.ts > "$ARTIFACTS_DIR/eval-ai.log" 2>&1; then
        tail -25 "$ARTIFACTS_DIR/eval-ai.log"
        if bash "$SETUP/eval-quality-differential.sh" "$WT" "$RED" "$ARTIFACTS_DIR" "$ARTIFACTS_DIR/eval-ai.log"; then
          echo "EVAL_QUALITY=ADVISORY pre-existing baseline failure reproduced at RED; no incremental quality regression"
        elif grep -q 'no recorded fixture for namespace="search-eval-rerank"' "$ARTIFACTS_DIR/eval-ai.log"; then
          echo "EVAL_DIVERGED lane=quality cause=missing-reranker-fixture (record reranker only with frozen planner/embed inputs, merge additively, then full replay)"
          exit 1
        else
          echo "EVAL_DIVERGED lane=quality cause=behavior-regression (revisit the fix; never lower or rewrite a passing baseline to accept regressions)"
          exit 1
        fi
      fi
      bun run eval:lint-corpus > "$ARTIFACTS_DIR/eval-lint.log" 2>&1 \
        || { tail -25 "$ARTIFACTS_DIR/eval-lint.log"; echo "EVAL_DIVERGED lane=corpus-lint (invalid eval corpus - see eval-lint.log)"; exit 1; }
      echo "EVAL_GATE=PASS replay lanes and corpus lint green" | tee "$ARTIFACTS_DIR/eval-result.txt"
    else
      echo "EVAL_GATE=SKIP fix outside search paths" | tee "$ARTIFACTS_DIR/eval-result.txt"
    fi
    echo "EXIT_GATE=PASS"
