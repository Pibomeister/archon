      if ! bun run test:integration -- \
        "apps/api-e2e/src/eval/search-corpus/search-eval.int.spec.ts" \
        "apps/api-e2e/src/eval/search-corpus/search-eval-contracts.int.spec.ts" \
        "apps/api-e2e/src/eval/search-corpus/search-streaming-contracts.int.spec.ts" \
        > "$ARTIFACTS_DIR/eval-int.log" 2>&1; then
        tail -25 "$ARTIFACTS_DIR/eval-int.log"
        if grep -q 'no recorded fixture for namespace="search-eval-rerank"' "$ARTIFACTS_DIR/eval-int.log"; then
          echo "EVAL_DIVERGED lane=correctness+contract cause=missing-reranker-fixture (freeze planner/embed inputs; use --replay baseline-cassette --record-reranker --subset <ids>; require additive keys, then full replay. If replay has real regressions, revisit the fix instead of changing baseline truth.)"
        else
          echo "EVAL_DIVERGED lane=correctness+contract cause=behavior-regression (revisit the fix; never re-record a failing outcome into baseline truth)"
        fi
