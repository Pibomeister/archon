    N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
    case "$N" in ''|*[!0-9]*) echo "EXIT_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
    python3 "$SETUP/repo-policy.py" validate-diff --root "$ROOT" --artifacts "$ARTIFACTS_DIR" \
      || { echo "EXIT_GATE=FAIL repository policy"; exit 1; }
    # A human accepting residuals waives the verdict and fixer checks — never
    # the clean-tree, scope, repro, or negcontrol checks.
    if [ -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then
      echo "EXIT_GATE accept-residuals present: verdict and fixer checks skipped ($(head -1 "$ARTIFACTS_DIR/accept-residuals.txt"))"
    else
      V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
      case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
      python3 "$SETUP/check-fixer-result.py" "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
    fi
    test -z "$(git status --porcelain | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
    python3 "$SETUP/check-scope.py" "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" --exclude pnpm-lock.yaml \
      || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
    TESTF=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['test_file'])" "$ARTIFACTS_DIR/failing-test.json")
    test -z "$(git diff "$RED" -- "$TESTF")" || { echo "EXIT_GATE=FAIL REVIEW_SCOPE repro test drifted"; exit 1; }
    # Suites stay green. Same materialize-then-`test -s` shape as deslop-recheck:
    # an empty pattern file makes the loop below iterate zero times, and this gate
    # would print EXIT_GATE=PASS having run no suite at all.
    python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1], encoding='utf-8'))['test_patterns']]" "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
      || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
    test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
    while IFS= read -r PAT; do
      test -n "$PAT" || continue
      if [ "$REPO" = web-app ]; then
        mise x node@20 -- pnpm test --run "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
      else
        bun run test -- "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix suite pattern=$PAT"; exit 1; }
      fi
    done < "$ARTIFACTS_DIR/exit-patterns.txt"
    # The repro must pass on the final tree...
    RC=0
    bash "$SETUP/run-repro.sh" "$WT" "$ARTIFACTS_DIR" "$ARTIFACTS_DIR/exit-repro-out.txt" >/dev/null 2>&1 || RC=$?
    test "$RC" = 0 || { echo "EXIT_GATE=FAIL repro failing on final tree rc=$RC"; exit 1; }
