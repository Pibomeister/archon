name: wrap-docreview-codex
description: 'W2 ce-doc-review mode:headless wrapper. Snapshots the doc pre-invocation (headless silently mutates), gates on terminal signal + refusal absence, emits a diff. [codex twin - GENERATED by setup/derive-codex.py from wrap-docreview.yaml; never hand-edit; regenerate: python3 setup/derive-codex.py wrap-docreview]'
provider: codex
nodes:
- id: snapshot
  timeout: 120000
  bash: |
    set -euo pipefail
    DOC=/private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/docs/toy-plan.md
    test -s "$DOC"
    cp "$DOC" "$ARTIFACTS_DIR/plan.pre.md"
    echo "SNAPSHOT_OK"
- id: review
  depends_on:
  - snapshot
  timeout: 1800000
  prompt: |
    Use $ce-doc-review explicitly for this node.

    Invoke the ce-doc-review skill with arguments exactly:
      mode:headless /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/docs/toy-plan.md
    This is an unattended pipeline invocation; ask no questions.
    Relay the skill's full output verbatim as your own output.
- id: gate
  depends_on:
  - review
  timeout: 120000
  bash: |
    set -uo pipefail
    OUT=$review.output
    DOC=/private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/docs/toy-plan.md
    printf '%s\n' "$OUT" > "$ARTIFACTS_DIR/docreview-envelope.txt"
    G1=FAIL; printf '%s' "$OUT" | grep -q 'Review complete' && G1=PASS
    G2=FAIL; printf '%s' "$OUT" | grep -q 'Review failed: headless mode requires a document path' || G2=PASS
    echo "GATE_1_review_complete_present=$G1"
    echo "GATE_2_refusal_absent=$G2"
    test "$G1" = PASS && test "$G2" = PASS || { echo "W2_GATE=FAIL"; exit 1; }
    diff -u "$ARTIFACTS_DIR/plan.pre.md" "$DOC" > "$ARTIFACTS_DIR/docreview.diff" && CHANGED=NO || CHANGED=YES
    echo "DOC_CHANGED=$CHANGED"
    echo "W2_GATE=PASS"
