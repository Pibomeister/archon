    NEW=$(comm -13 "$ARTIFACTS_DIR/kb-pre-porcelain.txt" "$ARTIFACTS_DIR/kb-post-capture.txt" || true)
    COUNT=$(printf '%s\n' "$NEW" | grep -c "^?? wiki/change-history/" || true)
