        # LITE convergence contract (one review round, user-accepted tradeoff):
        # a Ready verdict converges even when the fixer landed changes. Those hunks
        # are NOT re-read by a reviewer; post-fix-gate re-runs typecheck + lint and
        # exit-gate re-runs the plan's tests + scope check, and the PR body lists
        # them under "Reviewer-unverified fixes" from lite-fixes-unreviewed.txt.
        # "Not ready" keeps the parent's semantics: with the cap at 1 it is
        # ROUND_CAP_REACHED unless a human wrote accept-residuals.txt.
        case "$V" in
          "Ready to merge"|"Ready with fixes")
            if [ "$CLEAN" != YES ]; then echo "CONVERGE=FAIL dirty tree after fixer round=$N"; exit 1; fi
            if [ "$INC" != 0 ] && [ "$ACCEPT" != YES ]; then
              echo "ROUND_CAP_REACHED round=$N (fixer left $INC incomplete item(s); lite lane has no second round — write accept-residuals.txt or relaunch on full-sdlc-api)"; exit 1
            fi
            if [ "$MOVED" = YES ]; then
              {
                echo "fixer_commit=$(git rev-parse HEAD)"
                echo "pre_round_head=$(cat "$RD/pre-head.txt")"
                echo "applied_findings=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('applied',[])))" "$RD/fixer-result.json" 2>/dev/null || echo unknown)"
                echo "files:"
                git diff --name-only "$(cat "$RD/pre-head.txt")" HEAD | sed 's/^/  /'
              } > "$ARTIFACTS_DIR/lite-fixes-unreviewed.txt"
              echo "LITE_FIXES_UNREVIEWED round=$N $(git diff --name-only "$(cat "$RD/pre-head.txt")" HEAD | wc -l | tr -d ' ') file(s) landed by the fixer and not re-reviewed (see lite-fixes-unreviewed.txt)"
            fi
            echo "CONVERGED round=$N (lite: single review round)"
            echo "<promise>REVIEW_CONVERGED</promise>"
            ;;
          "Not ready")
            if [ "$MOVED" = NO ]; then echo "NO_PROGRESS round=$N (Not ready and nothing changed)"; exit 1; fi
            if [ "$N" -ge "$CAP" ]; then
              if [ "$ACCEPT" = YES ]; then
                echo "CONVERGED round=$N (human accepted residuals)"
                echo "<promise>REVIEW_CONVERGED</promise>"
              else
                echo "ROUND_CAP_REACHED round=$N"; exit 1
              fi
            else
              echo "ROUND_PROGRESSED round=$N (Not ready; fixes landed; re-review next round)"
            fi
            ;;
          *) echo "CONVERGE=FAIL unknown verdict [$V]"; exit 1 ;;
        esac
- id: post-fix-gate
  depends_on:
  - review-loop
  timeout: 1200000
  bash: |
    set -euo pipefail
    # LITE lane: the single review round's fixer changes are not re-read by a
    # reviewer, so re-run the mechanical gate on the tree as the fixer left it.
    # exit-gate (next) re-runs the plan's unit patterns and the scope check;
    # this node owns typecheck and lint, which exit-gate does not run.
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    cd "$WT"
    rm -rf .omc
    if [ -f "$ARTIFACTS_DIR/lite-fixes-unreviewed.txt" ]; then
      echo "POST_FIX_GATE fixer landed changes; re-gating: $(head -1 "$ARTIFACTS_DIR/lite-fixes-unreviewed.txt")"
    else
      echo "POST_FIX_GATE no fixer changes landed; re-gating anyway"
    fi
    bun run typecheck || { echo "GATE_TESTS=FAIL typecheck (post-fix)"; exit 1; }
    bun run lint || { echo "GATE_TESTS=FAIL lint (post-fix)"; exit 1; }
    echo "POST_FIX_GATE=PASS"
- id: exit-gate
  depends_on:
  - post-fix-gate
  timeout: 600000
  bash: |
    set -euo pipefail
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    cd "$WT"
    N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
    case "$N" in ''|*[!0-9]*) echo "EXIT_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
    # A human accepting residuals waives the verdict and fixer checks — never
    # the clean-tree, scope, or unit-test checks (accepted findings, not a broken tree).
    if [ -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then
      echo "EXIT_GATE accept-residuals present: verdict and fixer checks skipped ($(head -1 "$ARTIFACTS_DIR/accept-residuals.txt"))"
    else
      V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json")
      case "$V" in "Ready to merge"|"Ready with fixes") echo "VERDICT_OK=$V rounds=$N" ;; *) echo "EXIT_GATE=FAIL verdict=$V"; exit 1 ;; esac
      python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-fixer-result.py "$RD/fixer-result.json" || { echo "EXIT_GATE=FAIL FIXER_BLOCKED"; exit 1; }
    fi
    test -z "$(git status --porcelain | grep -v '^?? \.env')" || { echo "EXIT_GATE=FAIL dirty tree"; exit 1; }
    # Scope guard belt (resume ordering can bypass converge's check).
    python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-scope.py \
      "$ARTIFACTS_DIR/files-allowlist.json" "$WT" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" \
      || { echo "EXIT_GATE=FAIL scope breach"; exit 1; }
    # Reader-audit belt: declared columns must have a passing result on disk.
    NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$ARTIFACTS_DIR/reader-audit.json" 2>/dev/null || echo 0)
    if [ "$NC" != 0 ]; then
      test -s "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL missing reader-audit-result.json"; exit 1; }
      python3 -c "import json,sys; cols=json.load(open(sys.argv[1]))['columns']; aff=[r for c in cols for r in c.get('readers',[]) if r.get('class')=='affected']; sys.exit('affected readers: %s' % aff) if aff else None" "$ARTIFACTS_DIR/reader-audit-result.json" || { echo "EXIT_GATE=FAIL READER_AUDIT_FAIL affected reader"; exit 1; }
    fi
    # Materialize-then-`test -s`, same as gate-tests and deslop-recheck: a process
    # substitution hides the extractor's exit code, so a broken or empty
    # verify.json would run the loop zero times and this gate would print
    # EXIT_GATE=PASS having verified nothing.
    python3 -c "import json,sys; [print(p) for p in json.load(open(sys.argv[1]))['test_patterns']]" \
      "$ARTIFACTS_DIR/verify.json" > "$ARTIFACTS_DIR/exit-patterns.txt" \
      || { echo "EXIT_GATE=FAIL verify.json unreadable"; exit 1; }
    test -s "$ARTIFACTS_DIR/exit-patterns.txt" || { echo "EXIT_GATE=FAIL verify.json yielded no patterns"; exit 1; }
    while IFS= read -r PAT; do
      test -n "$PAT" || continue
      bun run test -- "$PAT" >/dev/null || { echo "EXIT_GATE=FAIL post-fix unit tests pattern=$PAT"; exit 1; }
    done < "$ARTIFACTS_DIR/exit-patterns.txt"
    echo "EXIT_GATE=PASS"
- id: lite-envelope-final
  depends_on:
  - exit-gate
  timeout: 120000
  bash: |
    set -uo pipefail
    # The envelope's last word, after EVERY scope widening point (converge and
    # exit-gate both run check-scope.py, and widening files-allowlist.json is a
    # sanctioned human act at either). Re-evaluate on the allowlist as it stands
    # and overwrite envelope-post.txt, which prbody renders. Fail-closed: a widening
    # past a cap stops here; relaunch on full-sdlc-api.
    bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/lite-envelope.sh \
      /Users/eduardopicazo/Documents/Workspace/Goodword "$ARTIFACTS_DIR" api post
- id: smoke
  depends_on:
  - lite-envelope-final
  timeout: 1200000
  bash: |
    set -uo pipefail
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    cd "$WT"
    # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux). rc 1 only
    # when no backend exists at all.
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    PORT=4125 bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
    SRV=$!
    # bun start spawns children that outlive the parent: sweep the PORT on exit, not just $SRV.
    trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids 4125); test -n "$P" && kill $P 2>/dev/null; true' EXIT
    # Boot liveness: /api-docs-json 200 also proves swagger builds with the new DTOs.
    CODE=000
    for i in $(seq 1 60); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4125/api-docs-json || echo 000)
      test "$CODE" = "200" && break
    done
    test "$CODE" = "200" || { echo "SMOKE=FAIL api-docs-json code=$CODE (boot log in artifacts)"; exit 1; }
    CTRL=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4125/info || echo 000)
    test "$CTRL" = "401" || { echo "SMOKE=FAIL negative control /info code=$CTRL"; exit 1; }
    RESULT="SMOKE=PASS api-docs-json=200 guarded-control=401"
    # Optional feature probe: only when the plan declared an unauthenticated GET.
    if [ -s "$ARTIFACTS_DIR/smoke-probe.json" ]; then
      PPATH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['path'])" "$ARTIFACTS_DIR/smoke-probe.json")
      PEXP=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('expect','200'))" "$ARTIFACTS_DIR/smoke-probe.json")
      PCODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4125$PPATH" || echo 000)
      test "$PCODE" = "$PEXP" || { echo "SMOKE=FAIL probe $PPATH code=$PCODE expected=$PEXP"; exit 1; }
      RESULT="$RESULT probe:$PPATH=$PCODE"
    fi
    echo "$RESULT" | tee "$ARTIFACTS_DIR/smoke-result.txt"
- id: prbody
  depends_on:
  - smoke
  model: sonnet
  maxBudgetUsd: 2
  timeout: 600000
  prompt: |
    You are the PR-body composition node on the LITE lane. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read plan.md there; then read round.txt for the final round number N and read
    round-<N>/review-summary.json and round-<N>/fixer-result.json there.
    Also read, when present: accept-residuals.txt, lite-fixes-unreviewed.txt,
    and envelope-post.txt.
    Write a pull-request body in markdown to pr-body.md in that directory with
    exactly these sections:
      ## Summary
      ## Lane
      ## Reviewer-unverified fixes
      ## Known Residuals
      ## Post-Deploy Monitoring & Validation
    Summary opens with the line: Lane: full-sdlc-api-lite
    Lane contains the contents of envelope-post.txt VERBATIM in a fenced block
    (this is the routing evidence: the file counts, hot-path result and caller
    count the run was allowed to proceed on), followed by this exact sentence:
    "Lite omissions: one code-review round; no planning critic, doc review,
    premise verification, deslop pass, or reader audit."
    Reviewer-unverified fixes: when lite-fixes-unreviewed.txt exists, quote it
    verbatim (the fixer commit sha, the files it touched, the count of applied
    findings) and say plainly that these hunks were applied by the fixer after
    the only review round and were re-gated by typecheck, lint, the plan's unit
    tests and the scope check but NOT re-read by a reviewer, so the human
    reviewer should read those hunks first. When the file does not exist, say
    exactly: "None: the review round landed no fixes."
    Known Residuals lists every entry from fixer-result.json "advisory" (verbatim
    finding + rationale); if none, say "None."
    When accept-residuals.txt exists, Known Residuals OPENS with a line quoting
    it: Residuals human-accepted: <its contents>, and then lists the final
    round's "advisory" AND "incomplete" entries verbatim.
    If there is no runtime impact beyond the new endpoint, the monitoring section
    must say exactly: "No additional operational monitoring required."
    Mention verification evidence: unit gate, typecheck, lint, and the live
    smoke result exactly as recorded in smoke-result.txt in that directory.
    No co-author or attribution lines. End with the single line: PRBODY_WRITTEN
- id: prbody-gate
  depends_on:
  - prbody
  timeout: 120000
  bash: |
    set -euo pipefail
    python3 /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/check-lite-prbody.py \
      api "$ARTIFACTS_DIR"
- id: ship
  depends_on:
  - prbody-gate
  timeout: 900000
  bash: |
    set -euo pipefail
    eval "$(bash /Users/eduardopicazo/Documents/Workspace/Goodword/.archon/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    test "$(git -C "$WT" rev-parse --abbrev-ref HEAD)" = "$BR"
    test -s "$ARTIFACTS_DIR/pr-body.md"
    grep -q '^## Known Residuals' "$ARTIFACTS_DIR/pr-body.md"
    grep -q '^## Post-Deploy Monitoring & Validation' "$ARTIFACTS_DIR/pr-body.md"
    TITLE=$(head -1 "$ARTIFACTS_DIR/commit-msg.txt" 2>/dev/null || true)
    test -n "$TITLE" || TITLE="feat(api): $SLUG"
    # gate-tests + exit-gate already ran typecheck/tests; hook re-run skipped by explicit choice.
    git -C "$WT" push -u origin "$BR" --no-verify
    cd "$WT"
    EXISTING=$(gh pr list --head "$BR" --state open --json url --jq '.[0].url' 2>/dev/null || true)
    if [ -n "$EXISTING" ]; then
      printf '%s\n' "$EXISTING" > "$ARTIFACTS_DIR/pr-url.txt"
      echo "SHIP=ADOPTED existing PR"
    else
      gh pr create --draft --base main --head "$BR" \
        --title "$TITLE [archon]" \
        --body-file "$ARTIFACTS_DIR/pr-body.md" > "$ARTIFACTS_DIR/pr-url.txt"
    fi
    echo "PR_URL=$(cat "$ARTIFACTS_DIR/pr-url.txt")"
    echo "SHIP=OK"
- id: run-report
  depends_on:
  - ship
  model: sonnet
  maxBudgetUsd: 2
  timeout: 600000
  prompt: |
    You are the final-report node: the last thing a human sees from this run,
    so show, do not tell. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: pr-url.txt, plan.md, worktrees.json, round.txt, and each
    round-<N>/review-summary.json and round-<N>/fixer-result.json.
    Write a single self-contained run-report.html to that directory with these
    marker-wrapped sections:
    <!-- GIST --> Open in the bro register: what just happened, told like you
    would tell a smart friend over a beer. Simpler, not necessarily shorter;
    the bar is impossible to misunderstand. Casual connectives are fine
    ("basically", "so here's the deal"), memes are not. Every path, command,
    number, and URL stays exactly as it is. Flat prose, four sentences max.
    <!-- SHIPPED --> What shipped: the PR link as the headline, branch, and a
    two-sentence plain-language summary of the change.
    <!-- EVIDENCE --> Proof, not claims: the verification chain as small visuals.
    A shallow file tree of what the PR touches; the smoke result (endpoint code
    plus its negative control) as labeled chips.
    <!-- ROUNDS --> The review story: one row per round with its verdict and
    what the fixer applied, as a compact pill timeline. If one round, say the
    review converged immediately and why that is good news.
    <!-- RESIDUALS --> Waivers and advisory findings in plain words; "None" if empty.
    <!-- NEXT --> What the human does now: review the PR, update branch if
    behind, merge when satisfied. Concrete commands or links, no vagueness.
    Show-me rules: pick the smallest view that makes each point; place each
    visual beside one short supporting sentence; real names, paths, and numbers
