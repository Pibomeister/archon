        echo "REPORT=file://$ARTIFACTS_DIR/run-report.html"
        OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
        [ -n "$OPENER" ] && "$OPENER" "$ARTIFACTS_DIR/run-report.html" >/dev/null 2>&1 || true
      fi
      echo "REPORT_DONE"
