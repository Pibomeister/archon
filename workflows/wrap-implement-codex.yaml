name: wrap-implement-codex
description: 'W3 implementation node (ce-work Tier-3 replacement per effects-table 8a). Smoke instantiation against the m1 fixture; production conventions blocks live in .archon/templates/. [codex twin - GENERATED by setup/derive-codex.py from wrap-implement.yaml; never hand-edit; regenerate: python3 setup/derive-codex.py wrap-implement]'
provider: codex
nodes:
- id: pre
  timeout: 120000
  bash: |
    set -euo pipefail
    cd /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
    git rev-parse HEAD > "$ARTIFACTS_DIR/pre-head.txt"
    git branch --show-current > "$ARTIFACTS_DIR/pre-branch.txt"
    echo "PRE_OK"
- id: implement
  depends_on:
  - pre
  maxBudgetUsd: 5
  timeout: 1800000
  prompt: |
    Implement the following unit in the repository at this absolute path
    (you are NOT cwd'd there; cd for every command):
      /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo

    <unit>
    Goal: add a `slugify` function to lib.sh: lowercase the input, replace runs
    of non-alphanumeric characters with single hyphens, trim leading/trailing
    hyphens. Add one test case for it to run-tests.sh.
    Files: lib.sh, run-tests.sh
    Test scenarios: slugify "Hello, World!" outputs "hello-world"
    Verification: ./run-tests.sh exits 0
    </unit>

    Scope: change only the files listed under Files. Do not refactor adjacent code.
    Do not edit any plan file. Do not create commits — a later node commits.
    Do not create branches or worktrees — you are already on the correct branch.
    If the unit's work already exists and satisfies Verification, say so and stop;
    do not reimplement.

    <repo-conventions repo="m1-fixture">
    Plain bash repo. Tests: ./run-tests.sh (must exit 0). No package manager,
    no typecheck, no lint.
    </repo-conventions>

    Done when: every item under Verification is satisfied and ./run-tests.sh
    exits 0. Report the exact commands you ran and their exit status.
    This is an unattended pipeline invocation; ask no questions.
- id: gate
  depends_on:
  - implement
  timeout: 300000
  bash: |
    set -uo pipefail
    cd /private/tmp/claude-501/-Users-eduardopicazo-Documents-Workspace-Goodword/88bb31f2-0094-41b2-bd3f-8409f1264538/scratchpad/m1-fixture/repo
    ./run-tests.sh || { echo "W3_GATE=FAIL tests"; exit 1; }
    test "$(git rev-parse HEAD)" = "$(cat "$ARTIFACTS_DIR/pre-head.txt")" || { echo "W3_GATE=FAIL node committed"; exit 1; }
    test "$(git branch --show-current)" = "$(cat "$ARTIFACTS_DIR/pre-branch.txt")" || { echo "W3_GATE=FAIL branch changed"; exit 1; }
    test -n "$(git status --porcelain)" || { echo "W3_GATE=FAIL no changes produced"; exit 1; }
    git status --porcelain | grep -vE '^.. (lib\.sh|run-tests\.sh)$' && { echo "W3_GATE=FAIL out-of-scope files touched"; exit 1; }
    echo "W3_GATE=PASS"
