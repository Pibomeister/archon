name: full-sdlc-web-grok
description: 'UNADMITTED — remote publication is disabled; runs stop at ship until trusted controller admission. Parameterized web prong for a feature API handoff produced by archon-run.py feature --scope fullstack, or a standalone web feature launched by archon-run.py feature --scope web with its own web-only plan approval. Run message = ABSOLUTE path to feature-api-handoff.json; validates spec/plan/API lineage, syncs generated API contract, implements web work in a derived worktree, review loop, SSR smoke, agent-browser UAT, PR preparation. Smoke ports are allocated PER RUN by preflight from bases 4127 (api) and 3127 (web) via setup/port-alloc.sh at stride 10. Those bases used to be 4123/3123, the same literals full-sdlc-api binds, so a concurrent api run could answer this lane''s smoke check and fabricate a pass against the wrong build. Invoke through archon-run.py for Codex lanes. [grok twin - GENERATED by setup/derive-grok.py from full-sdlc-web.yaml; never hand-edit; regenerate: python3 setup/derive-grok.py full-sdlc-web]'
interactive: true
provider: grok
nodes:
- id: codex-control-guard
  always_run: true
  timeout: 60000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-codex-control-guard.out") 2> >(tee -a "$ARTIFACTS_DIR/node-codex-control-guard.out" >&2); fi
    # Claude lane is unrestricted here. derive-codex.py replaces this typed
    # no-op with the mandatory guarded-launch assertion in the Codex twin.
    echo "CODEX_CONTROL_GUARD=PASS provider=claude"
- id: preflight
  depends_on:
  - codex-control-guard
  timeout: 300000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-preflight.out") 2> >(tee -a "$ARTIFACTS_DIR/node-preflight.out" >&2); fi
    : "${ARCHON_LAYER:?PREFLIGHT=FAIL ARCHON_LAYER unset}"
    : "${PROJECT_ROOT:?PREFLIGHT=FAIL PROJECT_ROOT unset}"
    test -f "$ARCHON_LAYER/setup/resolve-params.sh" || { echo "PREFLIGHT=FAIL ARCHON_LAYER missing helpers"; exit 1; }
    SK="$PROJECT_ROOT/.claude/skills"
    test -f "$SK/ce-code-review/SKILL.md" || { echo "PREFLIGHT=FAIL staged ce-code-review missing"; exit 1; }
    # Dual contract: CE 3.2.0 carries the markers in SKILL.md; newer CE moved
    # mode:headless (now an alias for mode:agent) into references/modes-and-output.md
    # and the verdict field into references/finish-review.md. Either satisfies.
    { grep -q 'mode:headless' "$SK/ce-code-review/SKILL.md" && grep -q '"verdict"' "$SK/ce-code-review/SKILL.md"; }         || { grep -q 'mode:headless' "$SK/ce-code-review/references/modes-and-output.md" 2>/dev/null && grep -q '"verdict"' "$SK/ce-code-review/references/finish-review.md" 2>/dev/null; }         || { echo "PREFLIGHT=FAIL ce-code-review carries neither review contract (headless envelope nor agent JSON)"; exit 1; }
    # Billing guard (grok): runs MUST bill the xAI subscription (auth_mode "oidc"
    # in the effective GROK_HOME), never an API key. Fail closed when an API-key
    # env var is set, or when the auth file is missing, unreadable, not OIDC, or
    # token-less.
    for v in XAI_API_KEY GROK_CODE_XAI_API_KEY; do
      test -z "$(printenv "$v")" || { echo "BILLING_GUARD=FAIL $v is set - would bill API, not subscription"; exit 1; }
    done
    GROK_AUTH="${GROK_HOME:-$HOME/.grok}/auth.json"
    python3 - "$GROK_AUTH" <<'PY_BILLING' || exit 1
    import json, sys
    p = sys.argv[1]
    try:
        d = json.load(open(p))
    except Exception as e:
        print(f"BILLING_GUARD=FAIL grok auth unreadable at {p}: {e}"); sys.exit(1)
    records = []
    if isinstance(d, dict) and isinstance(d.get("auth_mode"), str):
        records.append(d)
    elif isinstance(d, dict):
        records = [v for v in d.values() if isinstance(v, dict) and "auth_mode" in v]
    if not records:
        print(f"BILLING_GUARD=FAIL grok auth has no account records at {p} - run: grok login"); sys.exit(1)
    ok = False
    for rec in records:
        mode = rec.get("auth_mode")
        if mode != "oidc":
            print(f"BILLING_GUARD=FAIL grok auth_mode={mode!r} at {p} - would not bill the xAI subscription"); sys.exit(1)
        if rec.get("refresh_token") and rec.get("key"):
            ok = True
    if not ok:
        print(f"BILLING_GUARD=FAIL grok tokens missing at {p} - run: grok login"); sys.exit(1)
    print("BILLING_GUARD=OK oidc")
    PY_BILLING
    if [ -n "${GROK_HOME:-}" ] && [ "$GROK_AUTH" != "$HOME/.grok/auth.json" ] && cmp -s "$GROK_AUTH" "$HOME/.grok/auth.json" 2>/dev/null; then
      echo "BILLING_GUARD=WARN grok auth is a byte-copy of ~/.grok/auth.json (shared refresh pair) - prefer a dedicated login"
    fi
    # port_pids: PIDs holding a TCP port. lsof is preinstalled on macOS and
    # frequently absent on Linux, so try lsof -> ss -> fuser. rc 1 means NO
    # backend exists at all; it never means "the port is free".
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    # Tool presence only. The ports are ALLOCATED below, not asserted free:
    # port-alloc.sh walks past an occupied slot, which is what lets a second
    # run of this lane start while the first is still up.
    port_pids 4127 >/dev/null || { echo "PREFLIGHT=FAIL no port-inspection tool (need lsof, ss, or fuser)"; exit 1; }
    # 4127/3127 are this lane's port BASES; they are deliberately not 4123.
    bash $ARCHON_LAYER/setup/profile-preflight.sh 4127 full-sdlc-web.yaml 3127 --web
    echo "PREFLIGHT=PASS"
- id: bootstrap
  depends_on:
  - preflight
  timeout: 1200000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-bootstrap.out") 2> >(tee -a "$ARTIFACTS_DIR/node-bootstrap.out" >&2); fi
    # shellcheck disable=SC1091
    source "$ARTIFACTS_DIR/profile-runtime.sh"
    if [ "$PROFILE_LAYOUT" = single ]; then
      WEB="$PROJECT_ROOT"
    else
      WEB="$PROJECT_ROOT/${WEB_REPO:-web-app}"
    fi
    eval "$(bash $ARCHON_LAYER/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    git -C "$WEB" fetch origin main
    if [ -d "$WT" ]; then
      test "$(git -C "$WT" branch --show-current)" = "$BR" || { echo "BOOTSTRAP=FAIL existing worktree on wrong branch"; exit 1; }
      echo "BOOTSTRAP=ADOPTED"
    else
      git -C "$WEB" worktree add "$WT" -b "$BR" origin/main
      echo "BOOTSTRAP=CREATED"
    fi
    cp "$WEB/.env" "$WT/.env"
    # origin/main pnpm-lock drifts from package.json (known project fact) — frozen refuses.
    # Unfrozen install; the lockfile is excluded from every commit node in this lane.
    cd "$WT" && mise x node@20 -- pnpm install --no-frozen-lockfile > "$ARTIFACTS_DIR/pnpm-install.log" 2>&1 || { tail -5 "$ARTIFACTS_DIR/pnpm-install.log"; echo "BOOTSTRAP=FAIL pnpm install"; exit 1; }
    git -C "$WT" rev-parse HEAD > "$ARTIFACTS_DIR/bootstrap-head.txt"
    # A verify-only reopen verifies previous-candidate..HEAD, not an empty diff.
    python3 $ARCHON_LAYER/setup/verify-only-base.py "$ARTIFACTS_DIR" "$WT"
    printf '{"web_worktree":"%s","branch":"%s"}\n' "$WT" "$BR" > "$ARTIFACTS_DIR/worktrees.json"
    echo "WORKTREE=$WT BRANCH=$BR HEAD=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"
- id: web-scope
  depends_on:
  - preflight
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-web-scope.out") 2> >(tee -a "$ARTIFACTS_DIR/node-web-scope.out" >&2); fi
    SCOPE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('feature_scope','fullstack'))" "$ARTIFACTS_DIR/params.json")
    case "$SCOPE" in
      fullstack|web|repositories) printf '{"scope":"%s"}\n' "$SCOPE" ;;
      *) echo "WEB_SCOPE=FAIL unsupported scope=$SCOPE"; exit 1 ;;
    esac
- id: web-plan
  depends_on:
  - bootstrap
  - web-scope
  when: $web-scope.scope == 'web'
  model: grok-4.6
  timeout: 1200000
  prompt: |
    You are the standalone-web planning node. This run was launched with
    feature --scope web, so there is no API implementation prong and no API
    PR. Ask no questions and do not edit the web worktree.

    Resolve ARTIFACTS_DIR via: echo "$ARTIFACTS_DIR"
    Read params.json and the spec path named by params.json. The web worktree
    is the "worktree" field. The API counterpart is a controller-pinned,
    read-only baseline identified by params.json api_head_sha. If the spec
    requires an API behavior, schema, or data-contract change, write
    feature-result.json with:
      {"outcome":"NEEDS_CLARIFICATION","reason":"<why API scope is required>"}
    and scope-escalation.json with:
      {"status":"SCOPE_ESCALATION","outcome":"NEEDS_CLARIFICATION","from":"web","to":"fullstack","reason":"<same reason>"}
    then end with WEB_PLAN_SCOPE_ESCALATION.

    Otherwise write these approved-candidate planning artifacts under
    ARTIFACTS_DIR:
    - plan.md: a web-only plan with Scope, Files, Verification, Risks, and
      No-change disposition sections.
    - files-allowlist.json: JSON array of repo-relative web-app paths the
      implementation may modify. Empty is allowed only when the plan says the
      pinned baseline already satisfies every acceptance check.
    - web-files-allowlist.json: byte-for-byte same contents as
      files-allowlist.json.
    - verify.json: JSON object with "acceptance" array of concrete checks and
      optional "test_patterns" array.
    - premises.json: JSON array of scoped premise answers, each with id,
      question, answer and at least one cited evidence string, or [] when no
      premise is needed.
    - reader-audit.json: {"columns": []} unless the plan changes presentation
      semantics for API/database fields already present in the pinned API
      baseline.
    - browser-evidence.json: the controller-owned browser verifier policy:
      {"required":[{"id":"browser-1","criterion":"<human text>",
        "path":"/<same-origin path>",
        "assertions":[{"type":"text|selector|url|title|testid|click|fill",
                       "value":"<expected value>","text":"<fill text when type=fill>"}]}]}
      Use stable criterion ids, same-origin paths only, and executable
      assertions.
    - browser-evidence.sha256: lowercase SHA-256 of browser-evidence.json's
      canonical JSON bytes (sort keys, separators ',', ':').

    The plan is not approved by you. It will pause at a human approval gate
    after deterministic schema and hash validation. End with WEB_PLAN_DONE.
- id: web-plan-oracle
  depends_on:
  - web-plan
  when: $web-scope.scope == 'web'
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-web-plan-oracle.out") 2> >(tee -a "$ARTIFACTS_DIR/node-web-plan-oracle.out" >&2); fi
    python3 - "$ARTIFACTS_DIR" <<'PY'
    import hashlib, json, re, subprocess, sys
    from pathlib import Path
    ad = Path(sys.argv[1])
    params = json.loads((ad / "params.json").read_text(encoding="utf-8"))
    if params.get("feature_scope") != "web":
        raise SystemExit("WEB_PLAN_ORACLE=FAIL not standalone web scope")
    escalation = ad / "scope-escalation.json"
    result = ad / "feature-result.json"
    if escalation.exists() or result.exists():
        raise SystemExit("WEB_PLAN_ORACLE=FAIL scope escalation requires renewed fullstack approval")
    required = ["plan.md", "files-allowlist.json", "web-files-allowlist.json", "verify.json", "premises.json", "reader-audit.json", "browser-evidence.json", "browser-evidence.sha256"]
    for name in required:
        if not (ad / name).is_file() or (ad / name).stat().st_size == 0:
            raise SystemExit(f"WEB_PLAN_ORACLE=FAIL missing {name}")
    files = json.loads((ad / "files-allowlist.json").read_text(encoding="utf-8"))
    web_files = json.loads((ad / "web-files-allowlist.json").read_text(encoding="utf-8"))
    if files != web_files:
        raise SystemExit("WEB_PLAN_ORACLE=FAIL web allowlists differ")
    if not isinstance(files, list) or not all(isinstance(p, str) and p.strip() and not p.startswith(("/", "../")) and "/../" not in p for p in files):
        raise SystemExit("WEB_PLAN_ORACLE=FAIL malformed files-allowlist.json")
    verify = json.loads((ad / "verify.json").read_text(encoding="utf-8"))
    if not isinstance(verify, dict) or not isinstance(verify.get("acceptance", []), list):
        raise SystemExit("WEB_PLAN_ORACLE=FAIL malformed verify.json")
    premises = json.loads((ad / "premises.json").read_text(encoding="utf-8"))
    if not isinstance(premises, list):
        raise SystemExit("WEB_PLAN_ORACLE=FAIL malformed premises.json")
    reader = json.loads((ad / "reader-audit.json").read_text(encoding="utf-8"))
    if not isinstance(reader, dict) or not isinstance(reader.get("columns"), list):
        raise SystemExit("WEB_PLAN_ORACLE=FAIL malformed reader-audit.json")
    browser = json.loads((ad / "browser-evidence.json").read_text(encoding="utf-8"))
    required_browser = browser.get("required")
    if not isinstance(required_browser, list) or not required_browser:
        raise SystemExit("WEB_PLAN_ORACLE=FAIL malformed browser-evidence.json")
    seen = set()
    for item in required_browser:
        if not isinstance(item, dict):
            raise SystemExit("WEB_PLAN_ORACLE=FAIL browser criterion must be object")
        cid = item.get("id")
        if not isinstance(cid, str) or not cid or cid in seen:
            raise SystemExit("WEB_PLAN_ORACLE=FAIL browser criterion ids malformed")
        seen.add(cid)
        path = item.get("path")
        assertions = item.get("assertions")
        if not isinstance(item.get("criterion"), str) or not item["criterion"].strip():
            raise SystemExit("WEB_PLAN_ORACLE=FAIL browser criterion text malformed")
        if not isinstance(path, str) or not path.startswith("/") or path.startswith("//"):
            raise SystemExit("WEB_PLAN_ORACLE=FAIL browser criterion path must be same-origin")
        if not isinstance(assertions, list) or not assertions:
            raise SystemExit("WEB_PLAN_ORACLE=FAIL browser criterion assertions missing")
        for assertion in assertions:
            if not isinstance(assertion, dict) or assertion.get("type") not in {"text", "selector", "url", "title", "testid", "click", "fill"}:
                raise SystemExit("WEB_PLAN_ORACLE=FAIL browser assertion type malformed")
            if not isinstance(assertion.get("value"), str) or not assertion["value"]:
                raise SystemExit("WEB_PLAN_ORACLE=FAIL browser assertion value malformed")
            if assertion.get("type") == "fill" and (not isinstance(assertion.get("text"), str) or not assertion["text"]):
                raise SystemExit("WEB_PLAN_ORACLE=FAIL browser fill assertion text missing")
    browser_digest = hashlib.sha256(json.dumps(browser, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
    try:
        approved_browser_digest = (ad / "browser-evidence.sha256").read_text(encoding="utf-8").strip().split()[0].lower()
    except IndexError:
        approved_browser_digest = ""
    if not re.fullmatch(r"[0-9a-f]{64}", approved_browser_digest) or approved_browser_digest != browser_digest:
        raise SystemExit("WEB_PLAN_ORACLE=FAIL browser-evidence.sha256 mismatch")
    api_head = params.get("api_head_sha")
    if not isinstance(api_head, str) or not re.fullmatch(r"[0-9a-f]{40}", api_head):
        raise SystemExit("WEB_PLAN_ORACLE=FAIL missing pinned API baseline")
    current = subprocess.check_output(["git", "-C", str(Path(params["api_worktree"])), "rev-parse", "HEAD"], text=True).strip()
    if current != api_head:
        raise SystemExit("WEB_PLAN_ORACLE=FAIL pinned API baseline moved")
    spec = Path(params["spec"])
    oracle = {
        "scope": "web",
        "api_head_sha": api_head,
        "spec_sha256": hashlib.sha256(spec.read_bytes()).hexdigest(),
        "hashes": {name: hashlib.sha256((ad / name).read_bytes()).hexdigest() for name in required},
    }
    (ad / "web-plan-oracle.json").write_text(json.dumps(oracle, indent=2, sort_keys=True) + "\n", encoding="utf-8")
    print("WEB_PLAN_ORACLE=PASS")
    PY
- id: web-plan-render
  depends_on:
  - web-plan-oracle
  when: $web-scope.scope == 'web'
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-web-plan-render.out") 2> >(tee -a "$ARTIFACTS_DIR/node-web-plan-render.out" >&2); fi
    python3 - "$ARTIFACTS_DIR" <<'PY'
    import html, json, sys
    from pathlib import Path
    ad = Path(sys.argv[1])
    params = json.loads((ad / "params.json").read_text(encoding="utf-8"))
    oracle = json.loads((ad / "web-plan-oracle.json").read_text(encoding="utf-8"))
    plan = (ad / "plan.md").read_text(encoding="utf-8")
    body = f"""<!doctype html>
    <meta charset="utf-8">
    <title>Standalone web plan review</title>
    <style>body{{font:16px system-ui;max-width:960px;margin:2rem auto;line-height:1.5}}pre{{white-space:pre-wrap;background:#f6f8fa;padding:1rem}}</style>
    <h1>Standalone web plan review</h1>
    <!-- SCOPE --><p>Scope: web only. API baseline: <code>{html.escape(str(params.get('api_head_sha')))}</code>. No API PR will be created.</p>
    <!-- ORACLE --><pre>{html.escape(json.dumps(oracle, indent=2, sort_keys=True))}</pre>
    <!-- PLAN --><pre>{html.escape(plan)}</pre>
    <!-- BROWSER POLICY --><pre>{html.escape((ad / 'browser-evidence.json').read_text(encoding='utf-8'))}</pre>
    <!-- DECIDE --><p>Approving freezes these exact artifacts for implementation. Rejecting stops; update inputs and rerun web-only planning for renewed approval.</p>
    """
    (ad / "web-plan-review.html").write_text(body, encoding="utf-8")
    print("WEB_PLAN_RENDER=PASS")
    PY
- id: web-plan-approval
  depends_on:
  - web-plan-render
  when: $web-scope.scope == 'web'
  approval:
    message: 'Standalone web plan ready: open <this run''s ARTIFACTS_DIR>/web-plan-review.html. The rendered packet and the frozen artifact snapshot are the approval authority. Approve only if the web-only plan, files-allowlist.json, verify.json, premises.json, reader-audit.json, browser-evidence.json/.sha256 and pinned API baseline match that frozen oracle. Reject if API work or changed browser checks are required; this guarded run terminates and planning must restart with renewed approval.'
    on_reject:
      max_attempts: 1
      prompt: |
        The human rejected the standalone web plan:

        $REJECTION_REASON

        Do not implement and do not revise or rehash approved-candidate
        artifacts in this run. web-plan-freeze seals the approved oracle;
        same-run mutation would stale that seal. This rejection is terminal
        for the guarded run. Preserve artifacts as evidence and start a fresh
        guarded web or fullstack run with renewed approval. End with
        WEB_PLAN_REJECTION_REQUIRES_FRESH_GUARDED_RUN.
- id: web-plan-freeze
  depends_on:
  - web-plan-approval
  when: $web-scope.scope == 'web'
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-web-plan-freeze.out") 2> >(tee -a "$ARTIFACTS_DIR/node-web-plan-freeze.out" >&2); fi
    test ! -f "$ARTIFACTS_DIR/scope-escalation.json" || { echo "WEB_PLAN_FREEZE=FAIL scope escalation needs fullstack approval"; exit 1; }
    test ! -f "$ARTIFACTS_DIR/feature-result.json" || { echo "WEB_PLAN_FREEZE=FAIL rejected plan needs renewed approval"; exit 1; }
    python3 - "$ARTIFACTS_DIR" <<'PY'
    import hashlib, json, re, subprocess, sys
    from pathlib import Path
    ad = Path(sys.argv[1])
    params = json.loads((ad / "params.json").read_text(encoding="utf-8"))
    required = ["plan.md", "files-allowlist.json", "web-files-allowlist.json", "verify.json", "premises.json", "reader-audit.json", "browser-evidence.json", "browser-evidence.sha256"]
    files = json.loads((ad / "files-allowlist.json").read_text(encoding="utf-8"))
    web_files = json.loads((ad / "web-files-allowlist.json").read_text(encoding="utf-8"))
    if files != web_files or not isinstance(files, list):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL malformed or divergent allowlists")
    verify = json.loads((ad / "verify.json").read_text(encoding="utf-8"))
    premises = json.loads((ad / "premises.json").read_text(encoding="utf-8"))
    reader = json.loads((ad / "reader-audit.json").read_text(encoding="utf-8"))
    if not isinstance(verify, dict) or not isinstance(verify.get("acceptance", []), list):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL malformed verify.json")
    if not isinstance(premises, list):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL malformed premises.json")
    if not isinstance(reader, dict) or not isinstance(reader.get("columns"), list):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL malformed reader-audit.json")
    browser = json.loads((ad / "browser-evidence.json").read_text(encoding="utf-8"))
    required_browser = browser.get("required")
    if not isinstance(required_browser, list) or not required_browser:
        raise SystemExit("WEB_PLAN_FREEZE=FAIL malformed browser-evidence.json")
    seen = set()
    for item in required_browser:
        if not isinstance(item, dict):
            raise SystemExit("WEB_PLAN_FREEZE=FAIL browser criterion must be object")
        cid = item.get("id")
        if not isinstance(cid, str) or not cid or cid in seen:
            raise SystemExit("WEB_PLAN_FREEZE=FAIL browser criterion ids malformed")
        seen.add(cid)
        path = item.get("path")
        assertions = item.get("assertions")
        if not isinstance(item.get("criterion"), str) or not item["criterion"].strip():
            raise SystemExit("WEB_PLAN_FREEZE=FAIL browser criterion text malformed")
        if not isinstance(path, str) or not path.startswith("/") or path.startswith("//"):
            raise SystemExit("WEB_PLAN_FREEZE=FAIL browser criterion path must be same-origin")
        if not isinstance(assertions, list) or not assertions:
            raise SystemExit("WEB_PLAN_FREEZE=FAIL browser criterion assertions missing")
        for assertion in assertions:
            if not isinstance(assertion, dict) or assertion.get("type") not in {"text", "selector", "url", "title", "testid", "click", "fill"}:
                raise SystemExit("WEB_PLAN_FREEZE=FAIL browser assertion type malformed")
            if not isinstance(assertion.get("value"), str) or not assertion["value"]:
                raise SystemExit("WEB_PLAN_FREEZE=FAIL browser assertion value malformed")
            if assertion.get("type") == "fill" and (not isinstance(assertion.get("text"), str) or not assertion["text"]):
                raise SystemExit("WEB_PLAN_FREEZE=FAIL browser fill assertion text missing")
    browser_digest = hashlib.sha256(json.dumps(browser, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
    try:
        approved_browser_digest = (ad / "browser-evidence.sha256").read_text(encoding="utf-8").strip().split()[0].lower()
    except IndexError:
        approved_browser_digest = ""
    if not re.fullmatch(r"[0-9a-f]{64}", approved_browser_digest) or approved_browser_digest != browser_digest:
        raise SystemExit("WEB_PLAN_FREEZE=FAIL browser-evidence.sha256 mismatch")
    api_head = params.get("api_head_sha")
    if not isinstance(api_head, str) or not re.fullmatch(r"[0-9a-f]{40}", api_head):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL missing pinned API baseline")
    current = subprocess.check_output(["git", "-C", str(Path(params["api_worktree"])), "rev-parse", "HEAD"], text=True).strip()
    if current != api_head:
        raise SystemExit("WEB_PLAN_FREEZE=FAIL pinned API baseline moved")
    oracle = json.loads((ad / "web-plan-oracle.json").read_text(encoding="utf-8"))
    if oracle.get("scope") != "web" or oracle.get("api_head_sha") != api_head:
        raise SystemExit("WEB_PLAN_FREEZE=FAIL oracle scope or API baseline mismatch")
    oracle_hashes = oracle.get("hashes")
    if not isinstance(oracle_hashes, dict):
        raise SystemExit("WEB_PLAN_FREEZE=FAIL oracle hashes missing")
    for name in required:
        expected = oracle_hashes.get(name)
        actual = hashlib.sha256((ad / name).read_bytes()).hexdigest()
        if not isinstance(expected, str) or actual != expected:
            raise SystemExit(f"WEB_PLAN_FREEZE=FAIL approved artifact changed since oracle: {name}")
    approved = {
        "scope": "web",
        "api_head_sha": api_head,
        "hashes": {name: hashlib.sha256((ad / name).read_bytes()).hexdigest() for name in [*required, "web-plan-oracle.json"]},
    }
    (ad / "web-plan-approved.json").write_text(json.dumps(approved, indent=2, sort_keys=True) + "\n", encoding="utf-8")
    print("WEB_PLAN_FREEZE=PASS")
    PY
- id: web-plan-lock-gate
  depends_on:
  - web-plan-freeze
  when: $web-scope.scope == 'web'
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-web-plan-lock-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-web-plan-lock-gate.out" >&2); fi
    python3 - "$ARTIFACTS_DIR" <<'PY'
    import hashlib, json, sys
    from pathlib import Path
    ad = Path(sys.argv[1])
    approved = json.loads((ad / "web-plan-approved.json").read_text(encoding="utf-8"))
    for name, digest in approved["hashes"].items():
        if hashlib.sha256((ad / name).read_bytes()).hexdigest() != digest:
            raise SystemExit(f"WEB_PLAN_LOCK=FAIL approved artifact changed: {name}")
    print("WEB_PLAN_LOCK=PASS")
    PY
- id: premise-strip
  depends_on:
  - bootstrap
  - web-plan-freeze
  trigger_rule: none_failed_min_one_success
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-premise-strip.out") 2> >(tee -a "$ARTIFACTS_DIR/node-premise-strip.out" >&2); fi
    SCOPE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('feature_scope','fullstack'))" "$ARTIFACTS_DIR/params.json")
    if [ "$SCOPE" = "fullstack" ]; then
      test -s "$ARTIFACTS_DIR/handoff-integrity.json" || { echo "PREMISE_STRIP=FAIL no handoff-integrity.json"; exit 1; }
      python3 $ARCHON_LAYER/setup/check-feature-handoff-integrity.py         "$ARTIFACTS_DIR/handoff-integrity.json"
    elif [ "$SCOPE" = "web" ]; then
      test -s "$ARTIFACTS_DIR/web-plan-approved.json" || { echo "PREMISE_STRIP=FAIL no approved standalone web plan"; exit 1; }
    elif [ "$SCOPE" = "repositories" ]; then
      test -s "$ARTIFACTS_DIR/joint-plan.json" || { echo "PREMISE_STRIP=FAIL no approved joint-plan.json"; exit 1; }
      test -s "$ARTIFACTS_DIR/plan.md" || { echo "PREMISE_STRIP=FAIL no approved plan.md"; exit 1; }
    else
      echo "PREMISE_STRIP=FAIL unsupported scope=$SCOPE"; exit 1
    fi
    python3 $ARCHON_LAYER/setup/strip-premise-answers.py         "$ARTIFACTS_DIR/premises.json" "$ARTIFACTS_DIR/premises-questions.json"
    echo "PREMISE_STRIP=OK"
- id: premise-verify
  depends_on:
  - premise-strip
  model: grok-4.6
  timeout: 1200000
  prompt: |
    You are the premise-verification node: a blind re-derivation check. The
    planner answered the spec's premise questions; your value is an answer
    derived from CODE with no exposure to the planner's reasoning, so the two
    can be compared. Ask no questions.

    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read ONLY premises-questions.json there. The repository checkout to read
    (you are NOT cwd'd there):
      $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
    You are FORBIDDEN from opening premises.json or any plan file until
    step 2 below.

    If premises-questions.json is an empty array, write an empty array []
    to premise-verify.json in that directory and end with the single line:
    PREMISE_VERIFY_DONE

    Step 1: answer each question independently by reading the worktree code.
    Every answer cites file:line evidence from files you actually opened.
    Write premise-verify.json to that directory FIRST, before step 2:
      [{"id": <n>, "answer": "<your independent answer>",
        "evidence": ["<repo-relative file>:<lines>", ...]}]

    Step 2: only after that file is written, read premises.json in that
    directory and compare per id. Rewrite premise-verify.json adding to each
    entry:
      "verdict": "agree" | "conflict" | "cannot_determine"
      "note": "<one line on why>"
    "conflict" means the code contradicts the planner's answer.
    "cannot_determine" means the code alone cannot settle the question.
    End with the single line: PREMISE_VERIFY_DONE
- id: premise-gate
  depends_on:
  - premise-verify
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-premise-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-premise-gate.out" >&2); fi
    Q="$ARTIFACTS_DIR/premises-questions.json"
    V="$ARTIFACTS_DIR/premise-verify.json"
    NQ=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$Q")
    SCOPE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('feature_scope','fullstack'))" "$ARTIFACTS_DIR/params.json")
    if [ "$SCOPE" = "fullstack" ]; then
      test -s "$ARTIFACTS_DIR/handoff-integrity.json" || { echo "PREMISE_GATE=FAIL no handoff integrity"; exit 1; }
    elif [ "$SCOPE" = "repositories" ]; then
      test -s "$ARTIFACTS_DIR/joint-plan.json" || { echo "PREMISE_GATE=FAIL no joint plan"; exit 1; }
    elif [ "$SCOPE" = "web" ]; then
      test -s "$ARTIFACTS_DIR/web-plan-approved.json" || { echo "PREMISE_GATE=FAIL no approved standalone web plan"; exit 1; }
    else
      echo "PREMISE_GATE=FAIL unsupported scope=$SCOPE"; exit 1
    fi
    if [ "$NQ" = 0 ]; then echo "PREMISE_GATE=PASS (approved scope checked; no extra premises declared)"; exit 0; fi
    test -s "$V" || { echo "PREMISE_GATE=FAIL no premise-verify.json"; exit 1; }
    python3 - "$Q" "$V" <<'PY'
    import json, sys
    qs = {q["id"] for q in json.load(open(sys.argv[1]))}
    byid = {v.get("id"): v for v in json.load(open(sys.argv[2]))}
    missing = qs - set(byid)
    assert not missing, f"ids not covered: {sorted(missing)}"
    allowed = {"agree", "conflict", "cannot_determine"}
    bad = sorted(i for i in qs if byid[i].get("verdict") not in allowed)
    assert not bad, f"verdict missing or out of enum for ids: {bad}"
    conflicts = sorted(i for i in qs if byid[i].get("verdict") == "conflict")
    if conflicts:
        for i in conflicts:
            print(f"PREMISE_CONFLICT id={i}")
        sys.exit(1)
    PY
    echo "PREMISE_GATE=PASS"
- id: gen-api-sync
  depends_on:
  - bootstrap
  - web-plan-freeze
  trigger_rule: none_failed_min_one_success
  timeout: 1200000
  bash: |
    set -uo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-gen-api-sync.out") 2> >(tee -a "$ARTIFACTS_DIR/node-gen-api-sync.out" >&2); fi
    set -x
    echo "AD=[${ARTIFACTS_DIR:-UNSET}] cwd=[$(pwd)]"
    eval "$(bash $ARCHON_LAYER/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    APIWT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['api_worktree'])" "$ARTIFACTS_DIR/params.json")
    WT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
    cd "$APIWT"
    # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux).
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    PORT="$APIPORT" bun start > "$ARTIFACTS_DIR/api-boot.log" 2>&1 &
    SRV=$!
    # bun start spawns children that outlive the parent: sweep the PORT on exit.
    trap 'kill "$SRV" 2>/dev/null; sleep 1; P=$(port_pids "$APIPORT"); test -n "$P" && kill $P 2>/dev/null; true' EXIT
    CODE=000
    for i in $(seq 1 120); do
      sleep 3
      CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APIPORT/api-docs-json" || echo 000)
      test "$CODE" = "200" && break
    done
    test "$CODE" = "200" || { echo "GENAPI=FAIL api-docs-json code=$CODE"; exit 1; }
          cd "$WT"
    FRESH=$ARTIFACTS_DIR/api-client.fresh.d.ts
    mise x node@20 -- npx openapi-typescript "http://localhost:$APIPORT/api-docs-json" -o "$FRESH" || { echo "GENAPI=FAIL openapi-typescript"; exit 1; }
    mise x node@20 -- bunx @biomejs/biome check --write "$FRESH" >/dev/null 2>&1 || true
    cp "$WT/app/services/api-client.d.ts" "$ARTIFACTS_DIR/api-client.before.d.ts"
    cp "$FRESH" "$WT/app/services/api-client.d.ts"
    git -C "$WT" diff -- app/services/api-client.d.ts > "$ARTIFACTS_DIR/genapi.patch"
    git -C "$WT" diff --name-only | grep -vE '^app/services/api-client\.d\.ts$|^pnpm-lock\.yaml$' && { echo "GENAPI=FAIL sync touched other files"; exit 1; }
    echo "GENAPI=PASS"
- id: implement
  depends_on:
  - gen-api-sync
  - premise-gate
  - web-plan-lock-gate
  trigger_rule: none_failed_min_one_success
  model: grok-4.6
  timeout: 1800000
  prompt: |
    Implement the WEB PRONG ONLY of the feature described by params.json in
    ARTIFACTS_DIR. Read params.json, api-handoff.json, the spec, genapi.patch,
    and the web worktree named by params.json. For fullstack scope, the API
    prong is represented by the immutable v2 handoff. For standalone web
    scope, params.json carries a controller-pinned read-only API baseline.
    For repository-chain scope, params.json and api-handoff.json carry the
    exact local upstream candidate worktrees selected by the controller; use
    those local candidates and do not require an upstream PR, merge,
    publication, or deployed API before implementation.
    Do not modify api/. Do not create a dummy API change or an API PR to make
    a web-only run look fullstack.

    The approved web scope is files-allowlist.json in ARTIFACTS_DIR. In
    fullstack mode it is copied byte-for-byte from the API lane's approved web-files-allowlist.json and bound into api-handoff.json together with
    premises_sha256 and reader_audit_sha256. In standalone web mode it must
    come from the web-only approved plan for this lane. In repository-chain
    mode it comes from the controller-approved joint plan. Do not edit or broaden that allowlist. If implementation discovers that an API change is
    required, write feature-result.json with outcome NEEDS_CLARIFICATION and
    a scope-escalation reason, then stop without treating the run as
    successful.

    Change only the web-app files listed in files-allowlist.json plus generated
    app/services/api-client.d.ts when it is present in that allowlist. Do not edit pnpm-lock.yaml except for package
    manager changes required by the spec. Prefer existing Settings/navigation,
    API client, tests, and service-worker patterns.

    Read project-guidance.md in ARTIFACTS_DIR. Follow it. Do not invent stack
    commands that are not in that file.

    REOPENED STAGES: when reopen-context.json exists in ARTIFACTS_DIR, this run
    was dispatched by feature-reopen and that file is MANDATORY work. The
    worktree HEAD is the previous candidate ("previous_head"), which already
    implements the approved plan. Read "reason" and every file under
    "evidence" first, then change the candidate so the stated failure cannot
    recur, with a test that fails without your change. gate-tests fails this
    run with "IMPLEMENT=FAIL reopen produced no change" if the worktree is
    unchanged. If the fix needs a file outside files-allowlist.json, do not
    edit it: write its path (one per line) to reopen-blocked.txt in
    ARTIFACTS_DIR and stop.

    Done when the feature behavior is implemented and those three commands exit
    0 in the working tree. Report exact commands and exit statuses. Unattended
    pipeline invocation; ask no questions.
- id: gate-tests
  depends_on:
  - implement
  timeout: 1200000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-gate-tests.out") 2> >(tee -a "$ARTIFACTS_DIR/node-gate-tests.out" >&2); fi
    cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
    rm -rf .omc
    mise x node@20 -- pnpm typecheck || { echo "GATE_TESTS=FAIL typecheck"; exit 1; }
    mise x node@20 -- pnpm lint || { echo "GATE_TESTS=FAIL lint"; exit 1; }
    mise x node@20 -- pnpm test --run || { echo "GATE_TESTS=FAIL vitest"; exit 1; }
    BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
    CONTENT_STATUS=$(git status --porcelain --untracked-files=all | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$|^\?\? pnpm-lock\.yaml$' || true)
    if [ -z "$CONTENT_STATUS" ] && git diff --quiet "$BASE" -- . ':(exclude)pnpm-lock.yaml'; then
      python3 $ARCHON_LAYER/setup/reopen-gate.py "$ARTIFACTS_DIR" NO_CHANGE
      printf '{"outcome":"NO_CHANGE","repo":"web-app","basis":"baseline-to-candidate content","baseline":"%s","head":"%s","pr_url":null}\n' "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
      echo "GATE_TESTS=PASS outcome=NO_CHANGE"
      exit 0
    fi
    printf '{"outcome":"CHANGED","repo":"web-app","basis":"baseline-to-candidate content","baseline":"%s","head":"%s"}\n' "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
    python3 $ARCHON_LAYER/setup/reopen-gate.py "$ARTIFACTS_DIR" CHANGED
    # Scope guard: implementation must declare its intended web diff; empty would reject all real changes.
    ALLOW_COUNT=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$ARTIFACTS_DIR/files-allowlist.json" 2>/dev/null || echo 0)
    if [ "$ALLOW_COUNT" = 0 ]; then echo "GATE_TESTS=FAIL approved web files-allowlist.json is required"; exit 1; fi
    python3 $ARCHON_LAYER/setup/check-scope.py         "$ARTIFACTS_DIR/files-allowlist.json" "$(pwd)" "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")"         --exclude pnpm-lock.yaml || { echo "GATE_TESTS=FAIL scope breach"; exit 1; }
    echo "GATE_TESTS=PASS"
- id: reader-audit
  depends_on:
  - gate-tests
  model: grok-4.6
  timeout: 1200000
  prompt: |
    You are the reader-audit node: when a diff changes what a DB column's
    value MEANS, every reader of that column is a suspect, and the change is
    only safe when every reader has been looked at. Ask no questions.

    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read reader-audit.json there. If that file is ABSENT or its "columns"
    array is empty, write exactly {"columns": []} to reader-audit-result.json
    in that directory and end with the single line: READER_AUDIT_DONE

    The repository checkout (you are NOT cwd'd there):
      $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")

    For each declared column: enumerate EVERY reader of it in the repository
    — grep data-access code, query hooks, and rendering paths for the column
    name and its enum value tokens; follow the call sites; do not stop at
    the first hits. Classify each reader:
      "unaffected" — its behavior is unchanged by the new semantics
      "affected"   — it must change and this plan does not change it
      "residual"   — semantics shift but the behavior is acceptable; worth
                     recording in the PR body
    Write reader-audit-result.json to that directory:
      {"columns": [{"table": "<table>", "column": "<column>",
        "readers": [{"file": "<repo-relative>:<line>",
                     "class": "unaffected|affected|residual",
                     "why": "<one line>"}]}]}
    End with the single line: READER_AUDIT_DONE
- id: reader-audit-gate
  depends_on:
  - reader-audit
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-reader-audit-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-reader-audit-gate.out" >&2); fi
    D="$ARTIFACTS_DIR/reader-audit.json"
    R="$ARTIFACTS_DIR/reader-audit-result.json"
    # Toy lane: no plan stage declares columns; absence short-circuits explicitly.
    NC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))['columns']))" "$D" 2>/dev/null || echo 0)
    if [ "$NC" = 0 ]; then echo "READER_AUDIT_GATE=PASS (no columns declared)"; exit 0; fi
    test -s "$R" || { echo "READER_AUDIT_FAIL no reader-audit-result.json"; exit 1; }
    python3 - "$D" "$R" <<'PY'
    import json, sys
    decl = {(c["table"], c["column"]) for c in json.load(open(sys.argv[1]))["columns"]}
    res = json.load(open(sys.argv[2]))["columns"]
    got = {(c["table"], c["column"]) for c in res}
    missing = decl - got
    assert not missing, f"declared columns not covered: {sorted(missing)}"
    affected = [(c["table"], c["column"], r.get("file", "?"))
                for c in res for r in c.get("readers", [])
                if r.get("class") == "affected"]
    if affected:
        for t, col, f in affected:
            print(f"READER_AUDIT_FAIL affected reader {t}.{col} at {f}")
        sys.exit(1)
    PY
    echo "READER_AUDIT_GATE=PASS"
- id: commit-impl
  depends_on:
  - gate-tests
  timeout: 300000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-commit-impl.out") 2> >(tee -a "$ARTIFACTS_DIR/node-commit-impl.out" >&2); fi
    cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
    BASE=$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")
    CONTENT_STATUS=$(git status --porcelain --untracked-files=all | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$|^\?\? pnpm-lock\.yaml$' || true)
    if [ -z "$CONTENT_STATUS" ] && git diff --quiet "$BASE" -- . ':(exclude)pnpm-lock.yaml'; then
      printf '{"outcome":"NO_CHANGE","repo":"web-app","basis":"baseline-to-candidate content","baseline":"%s","head":"%s","pr_url":null}\n' "$BASE" "$(git rev-parse HEAD)" > "$ARTIFACTS_DIR/feature-result.json"
      echo "COMMIT_IMPL=SKIP outcome=NO_CHANGE"
      exit 0
    fi
    python3 $ARCHON_LAYER/setup/check-scope.py "$ARTIFACTS_DIR/files-allowlist.json" "$PWD" HEAD --stage --quarantine "$ARTIFACTS_DIR" --exclude pnpm-lock.yaml || exit 1
    if git diff --cached --quiet; then
      # Idempotent re-run: a prior run may have already committed the work.
      git rev-parse HEAD >/dev/null && { echo "COMMIT_IMPL=ALREADY sha=$(git rev-parse HEAD)"; exit 0; }
      echo "COMMIT_IMPL=FAIL nothing staged and no prior work"; exit 1
    fi
    git diff --cached --name-only
    git commit -m "feat(web): implement feature web prong"
    echo "COMMIT_IMPL=OK sha=$(git rev-parse HEAD)"
- id: review-loop
  depends_on:
  - commit-impl
  loop_group:
    max_iterations: 4
    until: REVIEW_CONVERGED
    nodes:
    - id: round-pre
      timeout: 120000
      bash: |
        set -euo pipefail
        if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-round-pre.out") 2> >(tee -a "$ARTIFACTS_DIR/node-round-pre.out" >&2); fi
        C="$ARTIFACTS_DIR/round.txt"
        N=$(cat "$C" 2>/dev/null || echo 0)
        # Hand-editable counter: reject junk before it is incremented or used as a path.
        case "$N" in '') N=0 ;; *[!0-9]*) echo "ROUND_PRE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
        # Durable cap, checked BEFORE the round is spent (same doctrine as the api/bugfix lanes).
        R="$ARCHON_LAYER/setup/round-reclaim.sh"
        N=$(bash "$R" "$ARTIFACTS_DIR" "$N" "round-" "review-summary.json" '"verdict"[[:space:]]*:[[:space:]]*"[^"]')
        CAP=$(cat "$ARTIFACTS_DIR/round-cap.txt" 2>/dev/null || echo 4)
        case "$CAP" in ''|*[!0-9]*) CAP=4 ;; esac
        if [ "$N" -ge "$CAP" ] && [ ! -f "$ARTIFACTS_DIR/accept-residuals.txt" ]; then echo "ROUND_CAP_REACHED round=$N cap=$CAP (pre-round: a resume does not buy another review; write accept-residuals.txt or raise round-cap.txt)"; exit 1; fi
        N=$((N+1)); echo "$N" > "$C"
        RD="$ARTIFACTS_DIR/round-$N"; mkdir -p "$RD"
        cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
        git rev-parse HEAD > "$RD/pre-head.txt"
        ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$RD/prerun-dirs.txt" || true
        touch "$RD/prerun-dirs.txt"
        echo "ROUND=$N head=$(cat "$RD/pre-head.txt")"
    - id: review
      depends_on:
      - round-pre
      context: fresh
      model: grok-4.6
      timeout: 1800000
      prompt: |
        Invoke /ce-code-review as Grok slash-commands for this node.

        The repository checkout to review is at this absolute path (you are NOT cwd'd
        there — cd into it for every git command):
          $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
        It is already on the branch to be reviewed.
        Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"

        Persona selection happens in this session, so three instructions
        BEFORE you invoke the skill:
        - Measure the diff first: in the worktree, run
          git diff --stat "$(cat <that directory>/bootstrap-head.txt)"..HEAD
          Size the review on PRODUCTION churn: count changed lines EXCLUDING
          test/spec files, generated files, and lockfiles — the same basis
          ce-code-review's own catalog sizes a review on. Test volume is proof
          of the change, not production risk surface, so counting it inflates
          the persona fan-out exactly where the tests are most thorough.
          Under roughly 150 production lines, cap the conditional personas at
          3 beyond the always-on set, and record the decision (production
          lines, total lines, cap applied or not, personas chosen) in the
          envelope's Coverage section so the choice is observable.
        - Task one reviewer lens with exactly this: "extract the
          assumptions this diff encodes — in-diff comments are the primary
          source — and verify each against out-of-diff code; report
          mismatches as findings." Feed its findings through the skill's
          normal merge pipeline like any other reviewer's.
        - If waivers.json exists in the artifacts directory, read that ledger first.
          A finding whose normalized key matches a ledger entry goes under a
          "Previously waived" heading in the envelope — NOT as a new actionable
          finding — unless the reviewer states specific new evidence that was
          absent when the waiver was recorded.

        Invoke the ce-code-review skill with arguments exactly:
          mode:headless base:origin/main
        Do not expand scope beyond the diff against that base.
        The staged ce-code-review may be either contract generation: CE 3.2.0's
        markdown headless envelope, or the newer agent-JSON contract (there
        mode:headless aliases mode:agent and the skill returns ONE raw JSON
        object with status and verdict fields). Invoke with the same
        arguments either way and relay the skill's full return VERBATIM
        (envelope or raw JSON) as part of your output.
        Do not return until every persona the skill dispatched has reported.
        A relayed envelope that stops mid-fan-out, or that carries an empty
        verdict, is not a completed review: the round is billed and every
        downstream gate rejects it. If a persona cannot finish, say which one
        and why in the envelope and still emit a verdict. External/cross-model
        review is PROHIBITED in this unattended pipeline: never send the
        diff to any external peer, regardless of what the skill's own
        references permit.
    - id: review-gate
      depends_on:
      - review
      timeout: 300000
      bash: |
        set -uo pipefail
        if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-review-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-review-gate.out" >&2); fi
        N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
        case "$N" in ''|*[!0-9]*) echo "REVIEW_GATE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
        OUT=$review.output
        if [ "${#OUT}" -lt 100 ] && [ -s "$RD/review-envelope.txt" ]; then
          OUT=$(cat "$RD/review-envelope.txt")
        fi
        printf '%s\n' "$OUT" > "$RD/review-envelope.txt"
        # Dual-contract parse: CE 3.2.0's markdown headless envelope OR the
        # newer skills' single raw JSON object (status/verdict fields).
        eval "$(python3 $ARCHON_LAYER/setup/parse-review-envelope.py "$RD/review-envelope.txt" | sed 's/^/ENV_/')"
        G1="$ENV_G1"; G2="$ENV_G2"
        echo "GATE_1_review_complete_present=$G1 (contract=$ENV_VSRC)"
        echo "GATE_2_degraded_absent=$G2"
        # Run-scoped, not /tmp: a same-named file owned by another user on a
        # shared host makes the redirect fail, `|| true` swallows it, and comm
        # then diffs against a foreign list — silently picking the wrong
        # ce-code-review run directory to read the verdict from.
        ls -1d "${CE_REVIEW_ROOT:-/tmp/compound-engineering/ce-code-review}"/*/ 2>/dev/null | LC_ALL=C sort > "$RD/post-dirs.txt" || true
        NEW=$(comm -13 "$RD/prerun-dirs.txt" "$RD/post-dirs.txt")
        PREHEAD=$(cat "$RD/pre-head.txt")
        VERDICT=""; RUNDIR=""
        for d in $NEW; do
          M="$d/metadata.json"; test -f "$M" || continue
          SHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('head_sha',''))" "$M" 2>/dev/null)
          if [ "${#SHA}" -ge 7 ]; then
            case "$PREHEAD" in
              "$SHA"*)
                RUNDIR="$d"
                VERDICT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('verdict',''))" "$M" 2>/dev/null)
                ;;
            esac
          fi
        done
        VSRC=metadata
        if [ -z "$VERDICT" ]; then
          # Fallback: metadata.json omission is a known model-side contract slip; the
          # envelope is the skill's PRIMARY handoff. Strict-match its Verdict line.
          test -n "$ENV_VERDICT" && { VERDICT="$ENV_VERDICT"; VSRC="$ENV_VSRC"; }
        fi
        G3=FAIL
        case "$VERDICT" in "Ready to merge"|"Ready with fixes"|"Not ready") G3=PASS ;; esac
        echo "GATE_3_verdict_in_enum=$G3 verdict=[$VERDICT] source=$VSRC rundir=[$RUNDIR]"
        DEGRADED=true; test "$G2" = PASS && DEGRADED=false
        python3 $ARCHON_LAYER/setup/write-review-summary.py \
          "$RD/review-summary.json" "$VERDICT" "$DEGRADED"
        test "$G1" = PASS && test "$G2" = PASS && test "$G3" = PASS || { echo "REVIEW_GATE=FAIL round=$N"; exit 1; }
        echo "REVIEW_GATE=PASS round=$N"
    - id: commit-fixes
      depends_on:
      - review-gate
      timeout: 300000
      bash: |
        set -euo pipefail
        cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
        python3 $ARCHON_LAYER/setup/check-scope.py "$ARTIFACTS_DIR/files-allowlist.json" "$PWD" HEAD --stage --quarantine "$ARTIFACTS_DIR" --exclude pnpm-lock.yaml || exit 1
        if git diff --cached --quiet; then echo "COMMITTED=NO"; else
          git commit -m "fix(review): apply autofix feedback"; echo "COMMITTED=YES sha=$(git rev-parse HEAD)"
        fi
        echo "COMMIT_FIXES=OK"
    - id: fixer
      depends_on:
      - commit-fixes
      model: grok-4.6
      timeout: 1200000
      prompt: |
        You are the fixer node in an unattended review-fix pipeline. Ask no questions.
        Resolve the artifacts directory by running: echo "$ARTIFACTS_DIR"
        Read the current round number from round.txt there, then read the review
        envelope at round-<N>/review-envelope.txt.
        The envelope is either CE 3.2.0's markdown headless envelope or the
        newer contract's single JSON object; in JSON, actionable findings
        live in "actionable_findings" (fields: severity Pn, owner,
        autofix_class gated_auto|manual, file, line, title,
        suggested_fix) — treat them exactly like the envelope's findings.

        The repository under review (you are NOT cwd'd there):
          $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")

        Rules:
        - No unresolved P0-P2 gated_auto/manual findings: write the JSON result with
          empty arrays (advisory may list P3 waivers) and stop. Do not invent work.
        - Fix unresolved P0-P2 gated_auto/manual findings by editing repository files.
        - P3/advisory: do NOT fix; record each as a waiver with one line of rationale.
        - "failed" means BLOCKED — it halts the whole pipeline for a human. Reserve it
          for a P0-P2 that must be fixed in this diff and that you attempted but could
          not complete (build breaks, code not found, findings contradict each other).
        - Declining is not failing. A finding tagged pre_existing, or whose defect
          predates this diff, or whose fix would expand beyond the diff's stated
          scope, goes in "advisory" with action starting "Waived:" plus one line of
          rationale. Advisory entries surface in the PR body's residuals section —
          recorded, not lost.
        - If waivers.json exists in the artifacts directory, a finding whose
          normalized key matches one of its entries is "advisory" by default —
          record it as a waiver again rather than re-fixing or failing on
          it, unless the review states specific new evidence.
        - "incomplete" is for TRANSIENT incompletions, and transient means a retry
          could plausibly succeed: session budget ran out, an edit failed on stale
          anchors, a fix/test was attempted and not landed for a reason the next
          round can clear. One entry per item, one line of reason. These are retried
          automatically — the next review round re-surfaces them and the loop will
          not converge while any exist.
          If the blocker CANNOT change on a retry, it is a decline and belongs in
          "advisory" with "Waived:" — an environment or lint gate that fails on
          pre-existing violations, a landing that first needs work outside this
          diff's scope, a dependency that does not exist yet. Filing a permanent
          blocker as incomplete deadlocks the loop: no round can clear it and the
          loop cannot converge while it stands, so the run burns its whole cap and
          then demands a human accept residuals for something no round was ever
          able to fix. Never silently drop a finding from the result file.
        - No commits, no branches. Never touch pnpm-lock.yaml.
        - Scratch belongs OUTSIDE the worktree. A probe test, a scratch script,
          a dump you write to check a claim goes under $ARTIFACTS_DIR; anything
          left in the worktree that no finding names is quarantined there anyway
          and never reaches the commit, so writing it in the tree only costs you
          the round's clarity.
        Write JSON to round-<N>/fixer-result.json:
          {"applied": [...], "failed": [...], "advisory": [...], "incomplete": [...], "cross_repo": [...]}
        Every "applied", "advisory" and "incomplete" entry also carries
        "severity": "P0|P1|P2|P3". An omitted severity reads as P0, which
        keeps the loop running.
        "cross_repo" is for a finding whose defect lives in a DIFFERENT
        repository of this chain: entries are {"finding", "action",
        "producer_repo", "severity"}. Such a finding is neither advisory nor
        failed — it is not waivable and not fixable here, and it stops the
        run so the chain can route it to the repository that owns it.
        If cross-repo-filed.json exists in the artifacts directory, a human has
        filed some cross-repo findings; when you raise one of those same defects
        again, copy its "finding" and "producer_repo" VERBATIM from
        cross-repo-findings.json or the earlier round's fixer-result.json so its
        acknowledgement still matches. Never create or edit cross-repo-filed.json.
        Writing the JSON result file is MANDATORY and comes BEFORE your final line —
        ending without it aborts the pipeline. Write it even when all arrays are
        empty. Then end with the single line: FIXER_DONE
    - id: commit-fixer
      depends_on:
      - fixer
      timeout: 300000
      bash: |
        set -euo pipefail
        cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
        python3 $ARCHON_LAYER/setup/check-scope.py "$ARTIFACTS_DIR/files-allowlist.json" "$PWD" HEAD --stage --quarantine "$ARTIFACTS_DIR" --exclude pnpm-lock.yaml || exit 1
        if git diff --cached --quiet; then echo "COMMITTED=NO"; else
          git commit -m "fix(review): apply web feature feedback"; echo "COMMITTED=YES sha=$(git rev-parse HEAD)"
        fi
        echo "COMMIT_FIXER=OK"
    - id: converge
      depends_on:
      - commit-fixer
      timeout: 300000
      bash: |
        set -uo pipefail
        N=$(cat "$ARTIFACTS_DIR/round.txt"); RD="$ARTIFACTS_DIR/round-$N"
        case "$N" in ''|*[!0-9]*) echo "CONVERGE=FAIL round.txt is not an integer: [$N]"; exit 1 ;; esac
        exec > >(tee "$RD/converge.txt") 2>&1
        cd $(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
        V=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['verdict'])" "$RD/review-summary.json" 2>/dev/null || echo UNKNOWN)
        FIXOK=NO
        FIXMSG=$(python3 $ARCHON_LAYER/setup/check-fixer-result.py "$RD/fixer-result.json" 2>&1 | tr '\n' ' ') && FIXOK=YES
        CLEAN=NO; test -z "$(git status --porcelain | grep -vE '^\?\? \.env$|^ M pnpm-lock\.yaml$')" && CLEAN=YES
        MOVED=YES; test "$(git rev-parse HEAD)" = "$(cat "$RD/pre-head.txt")" && MOVED=NO
        INC=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('incomplete',[])))" "$RD/fixer-result.json" 2>/dev/null || echo 0)
        echo "ROUND=$N verdict=[$V] fixer_ok=$FIXOK clean=$CLEAN head_moved=$MOVED incomplete=$INC"
        # Scope guard: implementation must declare its intended web diff; empty would reject all real changes.
        ALLOW_COUNT=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$ARTIFACTS_DIR/files-allowlist.json" 2>/dev/null || echo 0)
        if [ "$ALLOW_COUNT" = 0 ]; then echo "CONVERGE=FAIL approved web files-allowlist.json is required"; exit 1; fi
        python3 $ARCHON_LAYER/setup/check-scope.py               "$ARTIFACTS_DIR/files-allowlist.json" "$(pwd)"               "$(cat "$ARTIFACTS_DIR/bootstrap-head.txt")" --round "$N" --exclude pnpm-lock.yaml || exit 1
        if [ "$FIXOK" = NO ]; then echo "FIXER_BLOCKED round=$N $FIXMSG"; exit 1; fi
        # Cross-repo stop: a finding owned by another repository of this chain is
        # not waivable here, so it must never reach update-waivers.py unresolved. The
        # only resolution is a human recording where it was filed in
        # cross-repo-filed.json (cross-repo-keys.py prints the keys).
        if ! CROSS=$(python3 $ARCHON_LAYER/setup/cross-repo-keys.py "$ARTIFACTS_DIR" --gate "$RD/fixer-result.json"); then
          printf '%s\n' "$CROSS" | sed '$d'
          echo "CROSS_REPO_FINDING round=$N $(printf '%s\n' "$CROSS" | tail -n 1)"
          exit 1
        fi
        [ -z "$CROSS" ] || printf '%s\n' "$CROSS"
        # Waiver ledger: record this round's advisory declines so later rounds
        # do not re-litigate them without new evidence.
        python3 $ARCHON_LAYER/setup/update-waivers.py \
          "$RD/fixer-result.json" "$ARTIFACTS_DIR/waivers.md"
        # Review yield, measured every round and printed for the operator.
        YIELD=$(python3 $ARCHON_LAYER/setup/review-yield.py "$ARTIFACTS_DIR" "$N")
        echo "$YIELD"
        # Durable round cap: counted against round.txt (survives resumes), not
        # loop iterations. accept-residuals.txt is a HUMAN act, never an agent's.
        CAP=$(cat "$ARTIFACTS_DIR/round-cap.txt" 2>/dev/null || echo 4)
        ACCEPT=NO; test -f "$ARTIFACTS_DIR/accept-residuals.txt" && ACCEPT=YES
        case "$V" in
          "Ready to merge"|"Ready with fixes")
            if [ "$MOVED" = NO ] && [ "$CLEAN" = YES ] && [ "$INC" = 0 ]; then
              echo "CONVERGED round=$N"
              echo "<promise>REVIEW_CONVERGED</promise>"
            elif [ "$N" -ge "$CAP" ]; then
              if [ "$ACCEPT" = YES ]; then
                echo "CONVERGED round=$N (human accepted residuals)"
                echo "<promise>REVIEW_CONVERGED</promise>"
              else
                echo "ROUND_CAP_REACHED round=$N"; exit 1
              fi
            else
              echo "ROUND_PROGRESSED round=$N"
            fi
            ;;
          "Not ready")
            if [ "$MOVED" = NO ]; then echo "NO_PROGRESS round=$N"; exit 1; fi
            if [ "$N" -ge "$CAP" ]; then
              if [ "$ACCEPT" = YES ]; then
                echo "CONVERGED round=$N (human accepted residuals)"
                echo "<promise>REVIEW_CONVERGED</promise>"
              else
                echo "ROUND_CAP_REACHED round=$N"; exit 1
              fi
            else
              echo "ROUND_PROGRESSED round=$N"
            fi
            ;;
          *) echo "CONVERGE=FAIL unknown verdict [$V]"; exit 1 ;;
        esac
- id: smoke
  depends_on:
  - review-loop
  - reader-audit-gate
  timeout: 1200000
  bash: |
    set -uo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-smoke.out") 2> >(tee -a "$ARTIFACTS_DIR/node-smoke.out" >&2); fi
    eval "$(bash $ARCHON_LAYER/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    APIWT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['api_worktree'])" "$ARTIFACTS_DIR/params.json")
    WT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['worktree'])" "$ARTIFACTS_DIR/params.json")
    # Detached boots: archon reaps the node's process group at exit, so plain
    # background children die before the UAT node. detach.py double-forks+setsid.
    # mise shell shims do not apply inside detach.py's bare exec: pin node explicitly.
    python3 $ARCHON_LAYER/setup/detach.py \
      "$ARTIFACTS_DIR/smoke-api.log" "$APIWT" env PORT="$APIPORT" mise x node@22 -- bun start | tee "$ARTIFACTS_DIR/api.detach" | cat
    sed -n 's/^DETACHED_PID=//p' "$ARTIFACTS_DIR/api.detach" > "$ARTIFACTS_DIR/api.pid"
    python3 $ARCHON_LAYER/setup/detach.py \
      "$ARTIFACTS_DIR/smoke-web.log" "$WT" env VITE_PUBLIC_API_URL="http://localhost:$APIPORT" mise x node@20 -- pnpm dev --port "$WEBPORT" | tee "$ARTIFACTS_DIR/web.detach" | cat
    sed -n 's/^DETACHED_PID=//p' "$ARTIFACTS_DIR/web.detach" > "$ARTIFACTS_DIR/web.pid"
    # Host spelling: `localhost` FIRST and always — macOS Vite binds ::1 only, so
    # a 127.0.0.1 probe "proves" the server is down when it isn't (RUNBOOK §6).
    # 127.0.0.1 is a purely additive second try for hosts where localhost does
    # not resolve; it can never shadow the localhost result.
    probe_host() { # $1 port, $2 path -> prints the host that answered 200; rc 1 if neither did
      local h
      for h in localhost 127.0.0.1; do
        if [ "$(curl -s -o /dev/null -w '%{http_code}' "http://$h:$1$2" 2>/dev/null)" = 200 ]; then
          printf '%s' "$h"; return 0
        fi
      done
      return 1
    }
    APIOK=NO; WEBOK=NO; WEBHOST=localhost
    for i in $(seq 1 120); do
      sleep 3
      test "$APIOK" = NO && probe_host "$APIPORT" /api-docs-json >/dev/null && APIOK=YES
      if [ "$WEBOK" = NO ]; then H=$(probe_host "$WEBPORT" /health) && { WEBOK=YES; WEBHOST="$H"; }; fi
      test "$APIOK" = YES && test "$WEBOK" = YES && break
    done
    test "$APIOK" = YES || { echo "SMOKE=FAIL api not up"; exit 1; }
    if [ "$WEBOK" != YES ]; then
      echo "SMOKE=FAIL web /health not 200 on localhost or 127.0.0.1 (see smoke-web.log)"
      # Name the cause instead of leaving a six-minute silent timeout behind.
      echo "HOST_RESOLUTION: $(getent hosts localhost 2>/dev/null || echo 'getent unavailable or localhost unresolved')"
      exit 1
    fi
    BODY=$(curl -s "http://$WEBHOST:$WEBPORT/health")
    printf '%s' "$BODY" > "$ARTIFACTS_DIR/web-ssr.html"
    # The UAT prompt cannot interpolate: ports are per-run, so it reads them here.
    printf 'web=http://%s:%s\napi=http://localhost:%s\n' "$WEBHOST" "$WEBPORT" "$APIPORT" > "$ARTIFACTS_DIR/smoke-urls.txt"
    cat "$ARTIFACTS_DIR/smoke-urls.txt"
    echo "SMOKE=PASS (servers left running for UAT; PIDs in artifacts)"
- id: uat
  depends_on:
  - smoke
  timeout: 1200000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-uat.out") 2> >(tee -a "$ARTIFACTS_DIR/node-uat.out" >&2); fi
    ROOT="$PROJECT_ROOT"
    PARAMS="$ARTIFACTS_DIR/params.json"
    test -s "$ARTIFACTS_DIR/smoke-urls.txt" || { echo "UAT=FAIL no smoke-urls.txt"; exit 1; }
    test -s "$ARTIFACTS_DIR/browser-evidence.json" || { echo "UAT=FAIL no browser-evidence.json"; exit 1; }
    test -s "$ARTIFACTS_DIR/browser-evidence.sha256" || { echo "UAT=FAIL no approved browser-evidence.sha256"; exit 1; }
    test -s "$PARAMS" || { echo "UAT=FAIL no params.json"; exit 1; }
    WT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("worktree", ""))' "$PARAMS")
    API_HEAD=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("api_head_sha", ""))' "$PARAMS")
    test -n "$WT" && test -d "$WT" || { echo "UAT=FAIL web worktree missing"; exit 1; }
    CANDIDATE=$(git -C "$WT" rev-parse HEAD)
    TREE=$(git -C "$WT" rev-parse 'HEAD^{tree}')
    python3 $ARCHON_LAYER/setup/browser-verifier.py run \
      --artifacts "$ARTIFACTS_DIR" \
      --web-worktree "$WT" \
      --playwright-root "$ROOT/web-app" \
      --candidate-commit "$CANDIDATE" \
      --candidate-tree "$TREE" \
      --api-commit "$API_HEAD" \
      --approved-digest "$ARTIFACTS_DIR/browser-evidence.sha256"
- id: servers-down
  depends_on:
  - uat
  trigger_rule: all_done
  always_run: true
  timeout: 120000
  bash: |
    set -uo pipefail
    for p in api.pid web.pid; do
      PID=$(cat "$ARTIFACTS_DIR/$p" 2>/dev/null) && test -n "$PID" && kill "$PID" 2>/dev/null && echo "KILLED $p=$PID" || echo "NOKILL $p"
    done
    # Parents spawn children that hold the ports: sweep both ports too.
    # port_pids: lsof -> ss -> fuser (lsof is often absent on Linux).
    port_pids() { # $1 = port
      local out=""
      if command -v lsof >/dev/null 2>&1; then
        out="$(lsof -ti ":$1" 2>/dev/null || true)"
      elif command -v ss >/dev/null 2>&1; then
        out="$(ss -ltnp "sport = :$1" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
      elif command -v fuser >/dev/null 2>&1; then
        out="$(fuser -n tcp "$1" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' || true)"
      else
        return 1
      fi
      [ -n "$out" ] && printf '%s\n' "$out"
      return 0
    }
    eval "$(bash $ARCHON_LAYER/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    port_pids "$APIPORT" >/dev/null || echo "WARN no port-inspection tool (lsof/ss/fuser) — cannot sweep ports"
    sleep 1
    # These ports are THIS run's allocation, so the sweep cannot reach a
    # concurrent run's server -- which is exactly what the lane-global
    # literals 4123/3123 did before.
    for port in "$APIPORT" "$WEBPORT"; do
      test -n "$port" || continue
      P=$(port_pids "$port")
      test -n "$P" && kill $P 2>/dev/null && echo "SWEPT_PORT $port"
    done
    echo "SERVERS_DOWN"
- id: uat-gate
  depends_on:
  - servers-down
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-uat-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-uat-gate.out" >&2); fi
    R="$ARTIFACTS_DIR/uat-result.json"
    test -s "$R" || { echo "UAT_GATE=FAIL no uat-result.json"; exit 1; }
    python3 $ARCHON_LAYER/setup/check-browser-evidence.py         "$ARTIFACTS_DIR/browser-evidence.json" "$R" "$ARTIFACTS_DIR/uat-feature.png"
    echo "UAT_GATE=PASS"
- id: prbody
  depends_on:
  - uat-gate
  model: grok-4.6
  timeout: 600000
  prompt: |
    You are the PR-body composition node. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read round.txt for the final round N, then round-<N>/review-summary.json and
    round-<N>/fixer-result.json, plus browser-verifier-receipt.json and genapi.patch there.
    Also read, when present: reader-audit-result.json and accept-residuals.txt.
    Write a pull-request body in markdown to pr-body.md in that directory with
    exactly these sections:
      ## Summary
      ## Known Residuals
      ## Post-Deploy Monitoring & Validation
    Summary covers the web feature behavior, the generated API client diff from genapi.patch, and the exact API PR dependency from params.json. Note that this PR is truthful only after the API PR deploys.
    Known Residuals lists fixer advisory waivers verbatim; if none, "None."
    When reader-audit-result.json exists and declares columns, Known Residuals
    also lists every reader classified "residual" verbatim (file, class, why).
    When accept-residuals.txt exists, Known Residuals OPENS with a line quoting
    it: Residuals human-accepted: <its contents> — and then lists the final
    round's "advisory" AND "incomplete" entries verbatim.
    Mention verification evidence: typecheck, lint, vitest, SSR curl smoke, and
    controller Playwright browser receipt (screenshot and trace digests in run artifacts).
    If no runtime impact beyond the web feature, the monitoring section must say exactly:
    "No additional operational monitoring required."
    After those sections, run: python3 $ARCHON_LAYER/setup/cross-repo-keys.py "$ARTIFACTS_DIR" --prbody
    When it prints anything, append that output VERBATIM as the last section of
    pr-body.md (the "## Cross-repo findings filed" section: defects in other
    repositories a human filed instead of fixing here).
    No co-author or attribution lines. End with the single line: PRBODY_WRITTEN
- id: ship
  depends_on:
  - prbody
  always_run: true
  timeout: 900000
  bash: |
    set -euo pipefail
    SCOPE=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('feature_scope','fullstack'))" "$ARTIFACTS_DIR/params.json" 2>/dev/null || echo fullstack)
    if [ "$SCOPE" = "repositories" ]; then
      echo "SHIP=HELD repository-chain local candidate only; trusted publication disabled"
      exit 0
    fi
    echo "SHIP=DISABLED trusted controller publication is not admitted; no remote changes made"
    exit 1
- id: run-report
  depends_on:
  - ship
  model: grok-4.6
  timeout: 600000
  prompt: |
    If feature-result.json declares NO_CHANGE, report verified baseline acceptance
    with no PR. Do not fabricate a PR URL, commit, deployment, or shipped change.
    You are the final-report node: the last thing a human sees from this run,
    so show, do not tell. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: pr-url.txt, worktrees.json, genapi.patch, browser-verifier-receipt.json,
    round.txt, and each round-<N>/review-summary.json and
    round-<N>/fixer-result.json.
    Write a single self-contained run-report.html to that directory with these
    marker-wrapped sections:
    <!-- GIST --> Open in the bro register: what just happened, told like you
    would tell a smart friend over a beer. Simpler, not necessarily shorter;
    the bar is impossible to misunderstand. Casual connectives are fine
    ("basically", "so here's the deal"), memes are not. Every path, command,
    number, and URL stays exactly as it is. Flat prose, four sentences max.
    <!-- SHIPPED --> What shipped: the PR link as the headline, its dependency
    on the api PR, and a two-sentence plain-language summary.
    <!-- EVIDENCE --> Proof, not claims: embed the acceptance screenshot with
    <img src="uat-feature.png"> (same directory, relative path) captioned with
    the passed criteria from browser-verifier-receipt.json; beside it, a labeled chip
    for the SSR smoke and one for the selective contract patch (accepted vs
    rejected hunk counts from the patch context if visible, else describe it).
    <!-- ROUNDS --> The review story: one row per round with its verdict and
    what the fixer applied, as a compact pill timeline. Name what grew across
    rounds (files added, tests added) so the rounds read as work, not churn.
    <!-- RESIDUALS --> Waivers and advisory findings in plain words; "None" if empty.
    <!-- NEXT --> What the human does now: review both PRs in dependency order,
    merge api first, then web. Concrete links, no vagueness.
    Show-me rules: pick the smallest view that makes each point; place each
    visual beside one short supporting sentence; real names, paths, and numbers
    only; no invented data; light and dark via :root custom properties plus a
    prefers-color-scheme override. Plain sentences, no em dashes, no AI-tell
    vocabulary. End with the single line: RUN_REPORT_DONE
- id: kb-capture
  depends_on:
  - run-report
  model: grok-4.6
  timeout: 600000
  prompt: |
    If feature-result.json declares NO_CHANGE, report verified baseline acceptance
    with no PR. Do not fabricate a PR URL, commit, deployment, or shipped change.
    You are the knowledge-capture node: compound what this run learned so the
    next feature build starts smarter. Ask no questions.
    Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
    Read there: pr-url.txt, genapi.patch, browser-verifier-receipt.json, round.txt, and each
    round-<N>/review-summary.json and round-<N>/fixer-result.json.

    Write EXACTLY ONE new markdown file into
    $PROJECT_ROOT/goodword-kb/wiki/change-history/
    named <YYYY-MM-DD>-archon-web-<feature-slug>.md (get the date with the
    date command; derive the slug from the PR title or branch).
    That one new file is your ENTIRE write surface: never edit or delete any
    existing knowledge-base file. Curation into concepts, patterns, glossary,
    or ADRs belongs to a human-attended kb:compound session, not to you.

    Frontmatter: title, date, source (archon full-sdlc-web, run id = the
    artifacts directory basename), pr (the URL), status: captured.
    Body sections: What shipped (two sentences plus the PR link and its api PR
    dependency). Decisions made and why. Gotchas discovered (from review
    rounds, fixer results, the contract patch, and the UAT run: recurring
    findings, environment traps). Process notes (what the pipeline itself
    taught us this run). Promotion candidates (bullets in the form
    "glossary: <term>", "ADR: <decision>", "pattern: <name>" for the curator).
    Everything from run artifacts; nothing invented; facts verbatim.
    End with the single line: KB_CAPTURE_DONE
- id: kb-capture-gate
  depends_on:
  - kb-capture
  timeout: 120000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-kb-capture-gate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-kb-capture-gate.out" >&2); fi
    KB="$PROJECT_ROOT/goodword-kb"
    git -C "$KB" status --porcelain | sort > "$ARTIFACTS_DIR/kb-post-capture.txt"
    NEW=$(comm -13 "$ARTIFACTS_DIR/kb-pre-porcelain.txt" "$ARTIFACTS_DIR/kb-post-capture.txt" || true)
    OTHER=$(printf '%s\n' "$NEW" | grep -v "^?? wiki/change-history/" | grep -c . || true)
    test "$OTHER" = "0" || { echo "KB_CAPTURE_GATE=FAIL KB changes outside change-history: [$NEW]"; exit 1; }
    # Counting new files was host-global: a concurrent lane's capture landing
    # in this window made it 2 and failed a run that had done nothing wrong.
    # Identify THIS run's file instead -- the capture prompt already requires
    # the artifacts-dir basename as the run id in the frontmatter.
    RID="$(basename "$ARTIFACTS_DIR")"
    F=""
    for rel in $(printf '%s\n' "$NEW" | sed -n 's/^?? //p'); do
      if grep -q "$RID" "$KB/$rel" 2>/dev/null; then
        test -z "$F" || { echo "KB_CAPTURE_GATE=FAIL more than one new file claims run id $RID: [$NEW]"; exit 1; }
        F="$KB/$rel"
      fi
    done
    test -n "$F" || { echo "KB_CAPTURE_GATE=FAIL no new change-history file carries this run id ($RID), delta: [$NEW]"; exit 1; }
    grep -q "status: captured" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing frontmatter"; exit 1; }
    grep -qi "Promotion candidates" "$F" || { echo "KB_CAPTURE_GATE=FAIL missing promotion candidates"; exit 1; }
    echo "KB_CAPTURE_GATE=PASS file=$F"
- id: local-candidate
  depends_on:
  - kb-capture-gate
  timeout: 1200000
  bash: |
    set -euo pipefail
    if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-local-candidate.out") 2> >(tee -a "$ARTIFACTS_DIR/node-local-candidate.out" >&2); fi
    eval "$(bash $ARCHON_LAYER/setup/params-env.sh "$ARTIFACTS_DIR/params.json")"
    if [ "${ARCHON_FEATURE_SCOPE-}" != "repositories" ]; then
      echo "LOCAL_CANDIDATE=SKIP scope=${ARCHON_FEATURE_SCOPE-fullstack}"
      exit 0
    fi
    test "${ARCHON_FEATURE_PHASE-}" = implement || { echo "LOCAL_CANDIDATE=FAIL phase is not implement"; exit 1; }
    test "$REPO" = "web-app" || { echo "LOCAL_CANDIDATE=FAIL repo is not web-app"; exit 1; }
    cd "$WT"
    HEAD=$(git rev-parse HEAD)
    test -s "$ARTIFACTS_DIR/smoke-urls.txt" || { echo "LOCAL_CANDIDATE=FAIL missing smoke urls"; exit 1; }
    awk '/^SMOKE=PASS /{line=$0} END{if (line) print line; else exit 1}' "$ARTIFACTS_DIR/node-smoke.out" > "$ARTIFACTS_DIR/smoke-result.txt" \
      || { echo "LOCAL_CANDIDATE=FAIL no successful smoke result recorded"; exit 1; }
    test -s "$ARTIFACTS_DIR/browser-verifier-receipt.json" || { echo "LOCAL_CANDIDATE=FAIL missing browser receipt"; exit 1; }
    python3 - "$ARTIFACTS_DIR/browser-verifier-receipt.json" "$HEAD" <<'PY_BROWSER_RECEIPT'
    import json, sys
    path, head = sys.argv[1:3]
    receipt = json.load(open(path, encoding="utf-8"))
    candidate = receipt.get("candidate") if isinstance(receipt, dict) else None
    if receipt.get("status") != "passed":
        raise SystemExit("LOCAL_CANDIDATE=FAIL browser receipt did not pass")
    if not isinstance(candidate, dict) or candidate.get("commit") != head:
        raise SystemExit("LOCAL_CANDIDATE=FAIL browser receipt candidate does not match current head")
    PY_BROWSER_RECEIPT
    bash $ARCHON_LAYER/setup/trusted-local-candidate.sh "$ARTIFACTS_DIR"
- id: report
  depends_on:
  - local-candidate
  trigger_rule: all_done
  always_run: true
  timeout: 120000
  bash: |
    set -uo pipefail
    echo "=== FULL-SDLC-WEB REPORT ==="
    echo "ARTIFACTS_DIR=$ARTIFACTS_DIR"
    cat "$ARTIFACTS_DIR/worktrees.json" 2>/dev/null || echo "no worktrees.json"
    cat "$ARTIFACTS_DIR/pr-url.txt" 2>/dev/null || echo "PR=NOT_CREATED"
    cat "$ARTIFACTS_DIR/browser-verifier-receipt.json" 2>/dev/null || echo "no browser verifier receipt"
    # show-me: open the evidence report for the human when it exists. Print the
    # path either way — xdg-open/open may be absent (or be openvt(1) on Linux).
    if [ -s "$ARTIFACTS_DIR/run-report.html" ]; then
      echo "REPORT=file://$ARTIFACTS_DIR/run-report.html"
      OPENER="$(command -v xdg-open 2>/dev/null || command -v open 2>/dev/null || true)"
      [ -n "$OPENER" ] && "$OPENER" "$ARTIFACTS_DIR/run-report.html" >/dev/null 2>&1 || true
    fi
    echo "REPORT_DONE"
