name: backfill
description: >-
  Backfill lane, disabled. Production admission stays off until the apply path
  is certified end to end: transactional executor, approval envelope, isolated
  database failure matrix. The controller nodes that carried snapshot, apply and
  reconcile were removed with the hardened runtime they required (see
  test_backfill_production_disabled). Nothing here acquires write credentials.
provider: claude
nodes:
  - id: preflight
    always_run: true
    timeout: 300000
    bash: |
      set -euo pipefail
      if [ -n "${ARTIFACTS_DIR-}" ]; then exec > >(tee -a "$ARTIFACTS_DIR/node-preflight.out") 2> >(tee -a "$ARTIFACTS_DIR/node-preflight.out" >&2); fi
      echo "BACKFILL_PRODUCTION_ADMISSION=DISABLED proposal-v2 controller integration and distribution certification required"
      exit 1
