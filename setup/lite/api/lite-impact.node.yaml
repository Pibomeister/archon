id: lite-impact
depends_on:
- plan-snapshot
model: sonnet
maxBudgetUsd: 2
timeout: 600000
prompt: |
  You are the code-graph impact node on the LITE lane. What you write reflects
  the plan as it stands right now. Ask no questions.

  Resolve the artifacts directory via: echo "$ARTIFACTS_DIR"
  Your output file is impact.json in that directory (overwrite it if present).
  The repository checkout is the "worktree" field of params.json in that
  same directory (you are NOT cwd'd there; cd into it for every command).

  Read plan.md in the artifacts directory and collect every existing
  symbol (function, class, method) that its ## Approach steps and ## Files
  entries propose to MODIFY. Symbols the plan creates from scratch have no
  callers yet and do not belong in the list.

  Self-gating rules, in order; no external gate skips you, so you skip
  yourself explicitly and visibly:
  1. If the plan modifies no existing symbol, write impact.json with
     "status": "SKIPPED" and an empty "symbols" array.
  2. Read profile-runtime.json. gitnexusRepo is the indexed repo name. If it
     is empty, the gitnexus MCP tools are not available, that index is
     absent/stale, OR ANY impact call errors, write impact.json with
     "status": "UNAVAILABLE" and an empty "symbols" array. Whether that
     routes FULL is a profile policy (impactUnavailable), not this prompt.
  3. Otherwise call mcp__gitnexus__impact with
     {target: "<symbol>", direction: "upstream"} for each symbol, against
     the indexed repo named by gitnexusRepo. Use "status": "GATHERED"
     ONLY when every call succeeded against that repo.

  impact.json is ALWAYS valid JSON and carries NO token prepended to it;
  the typed status line is this node's stdout only, never part of the file:
    {"status": "GATHERED|UNAVAILABLE|SKIPPED",
     "symbols": [{"name": "<symbol>",
                  "file": "<repo-relative path>",
                  "d1_callers": ["<caller symbol or path:line>", ...],
                  "risk": "LOW|MEDIUM|HIGH|CRITICAL",
                  "query_status": "GATHERED",
                  "query_repo": "<gitnexusRepo from profile-runtime.json>",
                  "query_target": "<exact target passed to the tool>"}]}
  Every d1_caller comes from successful tool output. Never invent one. A
  SUCCESSFUL query that returns no callers gets an empty list and risk "LOW";
  a failed/unknown query makes the WHOLE artifact UNAVAILABLE instead.

  Your FIRST output line is exactly one of:
    IMPACT=GATHERED symbols=<count>
    IMPACT=UNAVAILABLE <one-line reason>
    IMPACT=SKIPPED <one-line reason>
  Do not modify the repository or any file other than impact.json.
  End with the single line: IMPACT_DONE
